<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Markdown Viewer marketplace background</title>
  <desc id="desc">Subdued fine document-like rules on a tonal background, with a quiet centre for the marketplace title, details and install controls. Decorative edge motifs remain expendable under responsive cover cropping. No text, interface or product mark is embedded.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303853"/><stop offset="1" stop-color="#424A68"/></linearGradient>
    <linearGradient id="edges"><stop stop-color="white" stop-opacity=".5"/><stop offset=".17" stop-color="white" stop-opacity="0"/><stop offset=".83" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white" stop-opacity=".45"/></linearGradient>
    <mask id="quiet"><rect width="1600" height="640" fill="url(#edges)"/></mask>
  </defs>
  <rect width="1600" height="640" fill="url(#field)"/>
  <g mask="url(#quiet)" color="#BCD0C7" stroke="currentColor" stroke-width="2" opacity=".18"><path d="M-50 210h310M1420 155h240" fill="none" stroke-width="2"/><path d="M-50 247h310M1420 197h240" fill="none" stroke-width="2"/><path d="M-50 284h310M1420 239h240" fill="none" stroke-width="2"/><path d="M-50 321h310M1420 281h240" fill="none" stroke-width="2"/><path d="M-50 358h310M1420 323h240" fill="none" stroke-width="2"/><path d="M-50 395h310M1420 365h240" fill="none" stroke-width="2"/><path d="M-50 432h310M1420 407h240" fill="none" stroke-width="2"/></g>
</svg>
