{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "planning-shift",
    "name": "Planning shift",
    "description": "View and edit a Planning shift.",
    "icon": "calendar-days"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.planning.shift+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/planning/v1/shift.schema.json",
          "source": "/applications/planning/schemas/shift.schema.json",
          "title": "Planning shift",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fplanning%2Fcanvas%2Fshift.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.planning.shift+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/planning/v1/shift.schema.json",
          "source": "/applications/planning/schemas/shift.schema.json",
          "title": "Planning shift",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/shift-roles",
        "mode": "read",
        "reason": "Choose the role a shift is planned for"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Offer employees on shifts (when Employees is installed)"
      },
      {
        "path": "/applications/planning/",
        "mode": "read",
        "reason": "Read the Planning schemas and run the shift action script"
      }
    ],
    "access": [
      {
        "path": "/shift-roles",
        "reason": "Choose the role a shift is planned for"
      },
      {
        "path": "/employees",
        "reason": "Offer employees on shifts (when Employees is installed)"
      },
      {
        "path": "/applications/planning/",
        "reason": "Read the Planning schemas and run the shift action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "roles": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      },
      "roleoptions": {
        "kind": "computed",
        "expr": "(data.roles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "people": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeeoptions": {
        "kind": "computed",
        "expr": "(data.people || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.employee || 'New shift' }}",
              "note": "Shift {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\"].includes(form.values.status) ? 'success' : [\"published\"].includes(form.values.status) ? 'warning' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Publish",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "publish"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || !form.values.date || !form.values.startTime || !form.values.endTime || !String(form.values.employee || '').trim()"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Confirm",
                  "icon": "lock",
                  "size": "sm"
                },
                "on": {
                  "click": "confirm"
                },
                "rules": {
                  "visible": "form.values.status === 'published' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Copy name",
                  "variant": "ghost",
                  "icon": "copy",
                  "size": "sm"
                },
                "on": {
                  "click": "copy-employee"
                },
                "rules": {
                  "visible": "!(form.values.status === 'confirmed') && !!form.values.employeeRef",
                  "disabled": "form.saving || form.values.state === 'archived'"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.status === 'confirmed')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'confirmed')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "draft",
                  "label": "Draft"
                },
                {
                  "value": "published",
                  "label": "Published"
                },
                {
                  "value": "confirmed",
                  "label": "Confirmed"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This shift is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This shift is confirmed and can no longer be edited.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'confirmed'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Shift"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.employeeRef }}",
                          "description": "Optional. Choose an Employees record, then Copy name.",
                          "options": "{{ data.employeeoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employee }}",
                          "required": true,
                          "placeholder": "Name or email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Role",
                          "value": "{{ form.values.role }}",
                          "options": "{{ data.roleoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Published and confirmed are set by Publish and Confirm.",
                          "options": [
                            {
                              "value": "draft",
                              "label": "Draft"
                            },
                            {
                              "value": "published",
                              "label": "Published"
                            },
                            {
                              "value": "confirmed",
                              "label": "Confirmed"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed')) || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Schedule"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Start time",
                          "value": "{{ form.values.startTime }}",
                          "description": "Time of day, HH:MM.",
                          "placeholder": "08:00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "End time",
                          "value": "{{ form.values.endTime }}",
                          "description": "Time of day, HH:MM, after the start time.",
                          "placeholder": "17:00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "copy-employee": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "employee": "{{ (((data.people || []).filter(e => e.kind === 'file' && e.data && e.path === form.values.employeeRef).map(e => e.data.name || '')[0]) || form.values.employee) }}"
              }
            }
          }
        ]
      },
      "publish": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Publish shift",
              "message": "Publish this shift? The employee's schedule is checked for overlapping published or confirmed shifts."
            }
          },
          {
            "run-script": {
              "file": "/applications/planning/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "publish",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "confirm": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Confirm shift",
              "message": "Confirm this published shift? Confirmed shifts are locked and cannot be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/planning/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "confirm",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
