{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "planning-roles",
    "name": "Roles",
    "description": "Roles with their colour and the hours planned this week.",
    "icon": "palette"
  },
  "spec": {
    "access": [
      {
        "path": "/shift-roles",
        "reason": "List roles"
      },
      {
        "path": "/shifts",
        "reason": "Sum the hours planned per role"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      },
      "shifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Planning",
          "icon": "calendar-days",
          "active": "roles.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "week.page.yaml",
              "label": "Week",
              "icon": "calendar"
            },
            {
              "id": "shifts.page.yaml",
              "label": "Shifts",
              "icon": "list"
            },
            {
              "id": "day.page.yaml",
              "label": "Day timeline",
              "icon": "gantt-chart"
            },
            {
              "id": "roles.page.yaml",
              "label": "Roles",
              "icon": "palette"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/planning/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/planning.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Roles",
              "note": "Roles with their colour and the hours planned this week."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', color: e.data.color || '', shifts: (data.shifts || []).filter(s => s.data && s.data.role === e.path && s.data.date >= Date().slice(0, 10)).length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Code"
                },
                {
                  "key": "name",
                  "label": "Role"
                },
                {
                  "key": "color",
                  "label": "Colour"
                },
                {
                  "key": "shifts",
                  "label": "Upcoming shifts",
                  "align": "end"
                }
              ],
              "emptyText": "No roles yet.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
