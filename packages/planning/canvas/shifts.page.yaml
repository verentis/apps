{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "planning-shifts",
    "name": "Shifts",
    "description": "Every shift, listed by status.",
    "icon": "list"
  },
  "spec": {
    "access": [
      {
        "path": "/shift-roles",
        "reason": "List shifts by status with their role names"
      },
      {
        "path": "/shifts",
        "reason": "List shifts by status with their role names; change records from this page",
        "mode": "write"
      }
    ],
    "data": {
      "shifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      },
      "roles": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.shifts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employee || '', role: ((((data.roles || []).find(r => r.kind === 'file' && r.data && r.path === e.data.role) || {}).data || {}).name) || '', date: e.data.date || '', start: e.data.startTime || '', end: e.data.endTime || '', time: [e.data.startTime, e.data.endTime].filter(Boolean).join('–'), status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Planning",
          "icon": "calendar-days",
          "active": "shifts.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "week.page.yaml",
              "label": "Week",
              "icon": "calendar"
            },
            {
              "id": "shifts.page.yaml",
              "label": "Shifts",
              "icon": "list",
              "count": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/planning/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/planning.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Shifts by status",
              "note": "Every active shift, grouped by its status. Click a row to open the shift."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "justify": "end"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Publish week",
                  "icon": "send",
                  "disabled": {
                    "$expr": "(data.rows || []).filter(r => r.status === 'draft' && !!r.date && r.date >= Date().slice(0, 10) && r.date <= Date(Date.now() + 6 * 86400000).slice(0, 10)).length === 0"
                  },
                  "reason": "No draft shifts in the next seven days"
                },
                "on": {
                  "click": [
                    {
                      "preflight": {
                        "title": "Publish the week",
                        "assign": "publishable",
                        "partial": true,
                        "label": "{{ item.employee }} · {{ format(item.date, 'date') }} {{ item.time }}",
                        "items": "{{ (data.rows || []).filter(r => r.status === 'draft' && !!r.date && r.date >= Date().slice(0, 10) && r.date <= Date(Date.now() + 6 * 86400000).slice(0, 10)) }}",
                        "check": "!item.start || !item.end ? { fail: 'Has no start or end time' } : (data.rows || []).find(o => o.path !== item.path && o.status !== 'cancelled' && o.employee === item.employee && o.date === item.date && o.start < item.end && item.start < o.end) ? { fail: 'Overlaps ' + (data.rows || []).find(o => o.path !== item.path && o.status !== 'cancelled' && o.employee === item.employee && o.date === item.date && o.start < item.end && item.start < o.end).code + ' (' + (data.rows || []).find(o => o.path !== item.path && o.status !== 'cancelled' && o.employee === item.employee && o.date === item.date && o.start < item.end && item.start < o.end).time + ')' } : !item.role ? { warn: 'Has no role' } : true"
                      }
                    },
                    {
                      "for-each": {
                        "items": "{{ state.publishable.apply }}",
                        "as": "shift",
                        "assign": "published",
                        "steps": [
                          {
                            "run-script": {
                              "file": "/applications/planning/scripts/post",
                              "timeout": 60,
                              "parameters": {
                                "operation": "publish",
                                "path": "{{ shift.path }}"
                              }
                            }
                          }
                        ]
                      }
                    },
                    {
                      "refresh-source": {
                        "source": "shifts"
                      }
                    },
                    {
                      "toast": {
                        "message": "{{ 'Published ' + state.published.count + ' shifts' + (state.publishable.skipped && state.publishable.skipped.length ? '; ' + state.publishable.skipped.length + ' left as drafts' : '') }}",
                        "variant": "success"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Today"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "People across the hours of today. Drag a draft shift to move it, or its right edge to change when it ends.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.gantt",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date && r.status !== 'cancelled').filter(r => r.date === Date().slice(0, 10) && !!r.start).map(r => ({ path: r.path, title: [r.role, r.time].filter(part => part).join(' · '), employee: r.employee || 'Unassigned', role: r.role || 'No role', status: r.status, start: r.date + 'T' + r.start, end: r.date + 'T' + (r.end || r.start) })) }}",
                  "laneKey": "employee",
                  "colorBy": "role",
                  "scale": "hour",
                  "hours": [
                    6,
                    22
                  ],
                  "conflicts": true,
                  "lockedWhen": "row.status !== 'draft'",
                  "emptyText": "No shifts today."
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ],
                  "reschedule": [
                    {
                      "patch-record": {
                        "path": "{{ event.path }}",
                        "values": {
                          "startTime": "{{ event.start.slice(11, 16) }}",
                          "endTime": "{{ event.end.slice(11, 16) }}",
                          "updatedAt": "{{ Date() }}"
                        }
                      }
                    },
                    {
                      "refresh-source": {
                        "source": "shifts"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "shifts",
              "compact": true,
              "description": "The /shifts folder could not be read. Reinstall Planning to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "roles",
              "compact": true,
              "description": "The /shift-roles folder could not be read. Reinstall Planning to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'confirmed').length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "icon": "calendar-days"
                },
                {
                  "value": "published",
                  "label": "Published",
                  "icon": "calendar-days"
                },
                {
                  "value": "confirmed",
                  "label": "Confirmed",
                  "icon": "calendar-days"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'draft').sort((a, b) => ((a.date + (a.start || '~')) < (b.date + (b.start || '~')) ? -1 : 1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Shift"
                        },
                        {
                          "key": "employee",
                          "label": "Employee"
                        },
                        {
                          "key": "role",
                          "label": "Role"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "time",
                          "label": "Time"
                        },
                        {
                          "key": "status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No draft shifts",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "draft"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'published').sort((a, b) => ((a.date + (a.start || '~')) < (b.date + (b.start || '~')) ? -1 : 1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Shift"
                        },
                        {
                          "key": "employee",
                          "label": "Employee"
                        },
                        {
                          "key": "role",
                          "label": "Role"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "time",
                          "label": "Time"
                        },
                        {
                          "key": "status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No published shifts",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "published"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'confirmed').sort((a, b) => ((a.date + (a.start || '~')) < (b.date + (b.start || '~')) ? -1 : 1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Shift"
                        },
                        {
                          "key": "employee",
                          "label": "Employee"
                        },
                        {
                          "key": "role",
                          "label": "Role"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "time",
                          "label": "Time"
                        },
                        {
                          "key": "status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No confirmed shifts",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "confirmed"
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Shifts per person"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date && r.status !== 'cancelled').map(r => r.employee || 'Unassigned').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, draft: (data.rows || []).filter(r => !!r.date && r.status !== 'cancelled').filter(r => (r.employee || 'Unassigned') === name && r.status === 'draft').length, published: (data.rows || []).filter(r => !!r.date && r.status !== 'cancelled').filter(r => (r.employee || 'Unassigned') === name && r.status !== 'draft').length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "draft",
                    "published"
                  ],
                  "labels": {
                    "draft": "Draft",
                    "published": "Published"
                  },
                  "palette": {
                    "draft": "warning",
                    "published": "chart-1"
                  },
                  "format": "integer"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
