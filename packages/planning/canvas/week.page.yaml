{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "planning-week",
    "name": "Week schedule",
    "description": "The next seven days of shifts, grouped by date and employee.",
    "icon": "calendar-days"
  },
  "spec": {
    "access": [
      {
        "path": "/shift-roles",
        "reason": "Summarise the coming week's shifts by date and employee"
      },
      {
        "path": "/shifts",
        "reason": "Summarise the coming week's shifts by date and employee"
      }
    ],
    "data": {
      "shifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      },
      "roles": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.shifts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employee || '', role: ((((data.roles || []).find(r => r.kind === 'file' && r.data && r.path === e.data.role) || {}).data || {}).name) || '', date: e.data.date || '', start: e.data.startTime || '', end: e.data.endTime || '', time: [e.data.startTime, e.data.endTime].filter(Boolean).join('–'), status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Week schedule"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Shifts in the next seven days, grouped by date and employee. Click a shift to open it.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Planning",
                  "variant": "ghost",
                  "icon": "calendar-days",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/planning/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /shifts folder could not be read. Reinstall Planning to recreate it."
            },
            "rules": {
              "visible": "data.$shifts.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /shift-roles folder could not be read. Reinstall Planning to recreate it."
            },
            "rules": {
              "visible": "data.$roles.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Shifts this week",
                  "value": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.status === 'published').length }}",
                  "icon": "send",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.status === 'confirmed').length }}",
                  "icon": "lock",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "By date"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).map(r => r.date).filter((v, i, a) => a.indexOf(v) === i).sort().map(d => ({ date: d, shifts: (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.date === d).length, employees: (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.date === d).map(r => r.employee || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).length, confirmed: (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => r.date === d && r.status === 'confirmed').length })) }}",
                  "columns": [
                    {
                      "key": "date",
                      "label": "Date"
                    },
                    {
                      "key": "shifts",
                      "label": "Shifts",
                      "align": "end"
                    },
                    {
                      "key": "employees",
                      "label": "Employees",
                      "align": "end"
                    },
                    {
                      "key": "confirmed",
                      "label": "Confirmed",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No shifts this week"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "By employee"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).map(r => r.employee || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).sort().map(e => ({ employee: e, shifts: (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => (r.employee || 'Unassigned') === e).length, published: (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).filter(r => (r.employee || 'Unassigned') === e && r.status !== 'draft').length })) }}",
                  "columns": [
                    {
                      "key": "employee",
                      "label": "Employee"
                    },
                    {
                      "key": "shifts",
                      "label": "Shifts",
                      "align": "end"
                    },
                    {
                      "key": "published",
                      "label": "Published or confirmed",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No shifts this week"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Week list"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date && r.date >= Date().slice(0, 10) && r.date < Date(Date.now() + 7 * 86400000).slice(0, 10)).sort((a, b) => ((a.date + (a.start || '~') + a.employee) < (b.date + (b.start || '~') + b.employee) ? -1 : 1)) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Shift"
                    },
                    {
                      "key": "employee",
                      "label": "Employee"
                    },
                    {
                      "key": "role",
                      "label": "Role"
                    },
                    {
                      "key": "date",
                      "label": "Date"
                    },
                    {
                      "key": "time",
                      "label": "Time"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    }
                  ],
                  "emptyText": "No shifts this week",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
