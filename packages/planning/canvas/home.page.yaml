{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "planning-home",
    "name": "Planning",
    "description": "Planning overview.",
    "icon": "calendar-days"
  },
  "spec": {
    "access": [
      {
        "path": "/shift-roles",
        "reason": "Count shifts and show the roles and shifts"
      },
      {
        "path": "/shifts",
        "reason": "Count shifts and show the roles and shifts"
      }
    ],
    "data": {
      "shifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      },
      "roles": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.shifts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employee || '', role: ((((data.roles || []).find(r => r.kind === 'file' && r.data && r.path === e.data.role) || {}).data || {}).name) || '', date: e.data.date || '', start: e.data.startTime || '', end: e.data.endTime || '', time: [e.data.startTime, e.data.endTime].filter(Boolean).join('–'), status: e.data.status || '' }))"
      },
      "listshifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      },
      "listshiftroles": {
        "kind": "folder",
        "path": "/shift-roles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.role+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Planning",
          "icon": "calendar-days",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "week.page.yaml",
              "label": "Week",
              "icon": "calendar"
            },
            {
              "id": "shifts.page.yaml",
              "label": "Shifts",
              "icon": "list",
              "count": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/planning/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/planning.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Planning",
              "note": "Shift roles and shifts are files in your workspace. Draft shifts in /shifts, publish them overlap-checked, then confirm them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Shifts",
                  "value": "{{ (data.rows || []).filter(r => true).length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "send",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'confirmed').length }}",
                  "icon": "lock",
                  "loading": "{{ data.$shifts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "shifts",
              "compact": true,
              "description": "The /shifts folder could not be read. Reinstall Planning to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "roles",
              "compact": true,
              "description": "The /shift-roles folder could not be read. Reinstall Planning to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "shifts",
                  "label": "Shifts",
                  "icon": "calendar-days"
                },
                {
                  "value": "roles",
                  "label": "Roles",
                  "icon": "tags"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /shifts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/shifts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listshifts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listshifts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Shift"
                        },
                        {
                          "key": "data.employee",
                          "label": "Employee"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.startTime",
                          "label": "Start"
                        },
                        {
                          "key": "data.endTime",
                          "label": "End"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No shifts yet. Use New in /shifts."
                    },
                    "rules": {
                      "visible": "data.$listshifts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "shifts"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /shift-roles",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/shift-roles"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listshiftroles",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listshiftroles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Role"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.color",
                          "label": "Color"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No roles yet. Use New in /shift-roles."
                    },
                    "rules": {
                      "visible": "data.$listshiftroles.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "roles"
              }
            ]
          }
        ]
      }
    ]
  }
}
