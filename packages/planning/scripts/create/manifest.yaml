api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: planning-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Planning containers.
file-access:
  - path: "/shift-roles"
    mode: write
    reason: "Create roles with the next code"
  - path: "/shifts"
    mode: write
    reason: "Create shifts with the next code"
  - path: "/settings/planning.json"
    mode: read
    reason: "Default new shifts to the default role"
