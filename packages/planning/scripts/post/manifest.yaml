api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: planning-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Publishing checks the schedule and rejects overlapping shifts; confirming locks the shift conditionally.
file-access:
  - path: "/shifts"
    mode: write
    reason: "Publish and confirm shifts after checking the employee's schedule for overlaps"
