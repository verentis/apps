api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: expenses-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Submitting, approving, refusing and posting validate against the Accounting ledger and write journals and records conditionally.
file-access:
  - path: "/settings/expenses.json"
    mode: read
    reason: "Read the reimbursement account reports post against"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Read the ledger's base currency and precision"
  - path: "/chart-of-accounts"
    mode: read
    reason: "Check that posted accounts exist and are active"
  - path: "/periods"
    mode: read
    reason: "Find the open period a posting date falls in"
  - path: "/expense-categories"
    mode: read
    reason: "Read the expense account of each line's category"
  - path: "/expense-reports"
    mode: write
    reason: "Mark reports submitted, approved, refused or posted"
