api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: expenses-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Expenses containers.
file-access:
  - path: "/expense-categories"
    mode: write
    reason: "Create expense categories with the next number"
  - path: "/expense-reports"
    mode: write
    reason: "Create expense reports with the next number"
