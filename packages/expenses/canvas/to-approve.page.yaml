{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "expenses-to-approve",
    "name": "To approve",
    "description": "Submitted reports to approve or refuse.",
    "icon": "circle-check"
  },
  "spec": {
    "access": [
      {
        "path": "/expense-reports",
        "reason": "List to approve"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/expense-reports",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.report+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Expenses",
          "icon": "receipt",
          "active": "to-approve.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My reports",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "All reports",
              "icon": "kanban"
            },
            {
              "id": "by-category.page.yaml",
              "label": "Categories",
              "icon": "tags"
            },
            {
              "id": "mine.page.yaml",
              "label": "My reports",
              "icon": "user"
            },
            {
              "id": "to-approve.page.yaml",
              "label": "To approve",
              "icon": "circle-check"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/expenses/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/expenses.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "To approve",
              "note": "Submitted reports to approve or refuse."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.status === 'submitted').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', date: e.data.date, total: e.data.total || '', receipts: (e.data.receipts || []).length, status: e.data.status || 'draft' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Report"
                },
                {
                  "key": "employee",
                  "label": "Employee"
                },
                {
                  "key": "date",
                  "label": "Date",
                  "format": "date"
                },
                {
                  "key": "receipts",
                  "label": "Receipts",
                  "align": "end"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status",
                  "format": "badge"
                }
              ],
              "emptyText": "Nothing to approve.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
