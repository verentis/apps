{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "expenses-home",
    "name": "Expenses",
    "description": "Expenses overview.",
    "icon": "receipt"
  },
  "spec": {
    "access": [
      {
        "path": "/expense-categories",
        "reason": "List expense reports and categories"
      },
      {
        "path": "/expense-reports",
        "reason": "List expense reports and categories"
      }
    ],
    "data": {
      "reports": {
        "kind": "folder",
        "path": "/expense-reports",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.report+json"
      },
      "categories": {
        "kind": "folder",
        "path": "/expense-categories",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.category+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', date: e.data.date || '', lineCount: (e.data.lines || []).length, total: e.data.total ? Math.round(Number(e.data.total || 0) * 10000) : (e.data.lines || []).reduce((s, l) => s + Math.round(Number(l.amount || 0) * 10000), 0), status: e.data.status || 'draft', approver: e.data.approver || '' }))"
      },
      "listexpensereports": {
        "kind": "folder",
        "path": "/expense-reports",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.report+json"
      },
      "listexpensecategories": {
        "kind": "folder",
        "path": "/expense-categories",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.category+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Expenses",
          "icon": "receipt",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My reports",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "All reports",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "by-category.page.yaml",
              "label": "Categories",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/expenses/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/expenses.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Expenses",
              "note": "Expense categories and employee expense reports are files in your workspace. Draft reports in their folder, then submit, approve and post them from their forms to the Accounting ledger."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft reports",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting approval",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'submitted')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved, unposted",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "To reimburse",
                  "value": "{{ ((data.rows || []).filter(r => r.status === 'submitted' || r.status === 'approved').reduce((s, r) => s + r.total, 0) / 10000).toFixed(2) }}",
                  "icon": "banknote",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "categories",
              "compact": true,
              "description": "The /expense-categories folder could not be read. Reinstall Expenses to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "reports",
              "compact": true,
              "description": "The /expense-reports folder could not be read. Reinstall Expenses to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "reports",
                  "label": "Expense reports",
                  "icon": "receipt"
                },
                {
                  "value": "categories",
                  "label": "Categories",
                  "icon": "tags"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /expense-reports",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/expense-reports"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listexpensereports",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listexpensereports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.employeeName",
                          "label": "Employee"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.total",
                          "label": "Total"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No expense reports yet. Use New in /expense-reports."
                    },
                    "rules": {
                      "visible": "data.$listexpensereports.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "reports"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /expense-categories",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/expense-categories"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listexpensecategories",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listexpensecategories || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.expenseAccount",
                          "label": "Expense account"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No expense categories yet. Use New in /expense-categories."
                    },
                    "rules": {
                      "visible": "data.$listexpensecategories.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "categories"
              }
            ]
          }
        ]
      }
    ]
  }
}
