{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "expenses-report",
    "name": "Expenses expense report",
    "description": "View and edit an Expenses expense report.",
    "icon": "receipt"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.expenses.report+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/expenses/v1/report.schema.json",
          "source": "/applications/expenses/schemas/report.schema.json",
          "title": "Expenses expense report",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fexpenses%2Fcanvas%2Freport.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.expenses.report+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/expenses/v1/report.schema.json",
          "source": "/applications/expenses/schemas/report.schema.json",
          "title": "Expenses expense report",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [
      "user-profile"
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/expense-categories",
        "mode": "read",
        "reason": "Offer the expense categories for each line"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/expenses/",
        "mode": "read",
        "reason": "Read the Expenses schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/expense-categories",
        "reason": "Offer the expense categories for each line"
      },
      {
        "path": "/employees",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/expenses/",
        "reason": "Read the Expenses schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "categories": {
        "kind": "folder",
        "path": "/expense-categories",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.category+json"
      },
      "categoryoptions": {
        "kind": "computed",
        "expr": "(data.categories || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "appops": {
        "kind": "app-operations"
      },
      "signedinstaff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "me": {
        "kind": "computed",
        "expr": "((data.signedinstaff || []).filter(e => e.kind === 'file' && e.data && e.data.status !== 'terminated' && !!ctx.user && !!ctx.user.email && String(e.data.workEmail || '').toLowerCase() === String(ctx.user.email).toLowerCase()).map(e => ({ path: e.path, name: String(e.data.name || '') }))[0] || { path: '', name: ctx.user ? String(ctx.user.name || '') : '' })"
      },
      "employeelinks": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeelinkoptions": {
        "kind": "computed",
        "expr": "(data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status !== 'terminated').map(e => ({ value: e.path, label: (String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || '') || e.name) + (e.data.jobTitle ? ' · ' + e.data.jobTitle : '') }))"
      }
    },
    "state": {
      "approver": "",
      "refusalreason": ""
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.employeeName || 'New expense report' }}",
              "note": "Expense report {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"approved\",\"posted\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : [\"refused\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "This is me",
                  "variant": "ghost",
                  "icon": "user-check",
                  "size": "sm"
                },
                "on": {
                  "click": "link-me-employeerecord"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived') && (true) && !!data.me && !!data.me.path && form.values.employeeRecord !== data.me.path",
                  "disabled": "form.saving"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Submit",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "submit"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Approve",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "approve"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Refuse",
                  "variant": "outline",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "refuse"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Post",
                  "icon": "notebook-pen",
                  "size": "sm"
                },
                "on": {
                  "click": "post"
                },
                "rules": {
                  "visible": "form.values.status === 'approved'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This expense report is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Journal",
                  "variant": "ghost",
                  "icon": "notebook-pen",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.journal && form.values.journal.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.journal && form.values.journal.path)"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Total {{ form.values.total || ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.amount || 0) * 10000), 0) / 10000).toFixed(2) }}",
              "tone": "muted"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "Refused: {{ form.values.refusalReason }}",
              "tone": "danger"
            },
            "rules": {
              "visible": "form.values.status === 'refused'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Approved by {{ form.values.approver }} on {{ form.values.approvedAt }}",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.approver"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Approver",
                  "placeholder": "Who approves this report?",
                  "value": "{{ state.approver }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              },
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Refusal reason",
                  "placeholder": "Why is it refused?",
                  "value": "{{ state.refusalreason }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Employee"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employeeName }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.employeeRecord }}",
                          "description": "Optional. Choosing a record fills the name.",
                          "options": "{{ data.employeelinkoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        },
                        "on": {
                          "update": [
                            {
                              "patch-form": {
                                "values": {
                                  "employeeName": "{{ ((data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.path === event).map(e => String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || ''))[0] || form.values.employeeName || '') }}"
                                }
                              }
                            }
                          ]
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee reference",
                          "value": "{{ form.values.employeeRef }}",
                          "placeholder": "HR number"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Report date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Receipts",
                  "description": "A photo of each receipt. On a phone, Add photo opens the camera."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.capture",
                        "props": {
                          "label": "Receipts",
                          "value": "{{ form.values.receipts }}",
                          "max": 10,
                          "size": 1024,
                          "quality": 0.75
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Expenses",
                  "description": "Exact decimal amounts. Submitting checks every line has a category, a description and a positive amount."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.line-items",
                        "props": {
                          "label": "Lines",
                          "value": "{{ form.values.lines }}",
                          "columns": [
                            {
                              "key": "category",
                              "label": "Category",
                              "type": "select",
                              "options": "{{ data.categoryoptions }}"
                            },
                            {
                              "key": "description",
                              "label": "Description",
                              "type": "text"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "type": "text",
                              "align": "right"
                            },
                            {
                              "key": "date",
                              "label": "Date",
                              "type": "text"
                            }
                          ],
                          "defaultRow": {
                            "category": "",
                            "description": "",
                            "amount": "",
                            "date": ""
                          },
                          "storeComputed": false,
                          "minimum": 1,
                          "maximum": 200,
                          "addLabel": "Add expense"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "link-me-employeerecord": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "employeeRecord": "{{ data.me.path }}",
                "employeeName": "{{ data.me.name }}"
              }
            }
          }
        ]
      },
      "submit": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Submit report",
              "message": "Submit this expense report for approval? Submitted reports can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/expenses/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "submit-report",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "approve": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Approve report",
              "message": "Approve this expense report? It can then be posted to the ledger."
            }
          },
          {
            "run-script": {
              "file": "/applications/expenses/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "approve-report",
                "path": "{{ ctx.file.path }}",
                "approver": "{{ state.approver }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "refuse": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Refuse report",
              "message": "Refuse this expense report? Give the reason in the Refusal reason field."
            }
          },
          {
            "run-script": {
              "file": "/applications/expenses/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "refuse-report",
                "path": "{{ ctx.file.path }}",
                "reason": "{{ state.refusalreason }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "post": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "set-state": {
              "key": "lastresult",
              "value": null
            }
          },
          {
            "set-state": {
              "key": "appcall",
              "value": null
            }
          },
          {
            "set-state": {
              "key": "recorded",
              "value": null
            }
          },
          {
            "toast": {
              "if": "!((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available))",
              "variant": "error",
              "message": "Accounting is not available right now, so nothing was done. Check that Accounting is installed and approved, then try again."
            }
          },
          {
            "confirm": {
              "title": "Post report",
              "message": "Post this approved report to the Accounting ledger? Posted reports cannot be edited.",
              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
            }
          },
          {
            "run-script": {
              "file": "/applications/expenses/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "post-report",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult",
              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
            }
          },
          {
            "call-app": {
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && ((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available) && !!state.lastresult && !!state.lastresult.journalRequest)",
              "app": "accounting",
              "operation": "post-journal",
              "input": {
                "$expr": "state.lastresult.journalRequest"
              },
              "idempotency-key": "{{ ('journal-' + form.values.code) + '-' + Date.now() }}",
              "assign": "appcall"
            }
          },
          {
            "run-script": {
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && ((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available) && !!state.lastresult && !!state.lastresult.journalRequest && !!state.appcall && !!state.appcall.path)",
              "file": "/applications/expenses/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "complete-report",
                "path": "{{ ctx.file.path }}",
                "journal": "{{ state.appcall.path }}"
              },
              "assign": "recorded"
            }
          },
          {
            "refresh-source": {
              "source": "record",
              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
            }
          },
          {
            "toast": {
              "message": "{{ (state.recorded && state.recorded.message) || (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success",
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && (!(!!state.lastresult && !!state.lastresult.journalRequest) || !!state.recorded)"
            }
          },
          {
            "toast": {
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && !!state.lastresult && !!state.lastresult.journalRequest && !state.recorded",
              "variant": "error",
              "message": "Accounting did not confirm this. Nothing was marked as done; try again."
            }
          }
        ]
      }
    }
  }
}
