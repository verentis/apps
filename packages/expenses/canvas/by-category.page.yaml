{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "expenses-by-category",
    "name": "Expenses by category",
    "description": "What has been expensed against each category.",
    "icon": "tags"
  },
  "spec": {
    "access": [
      {
        "path": "/expense-categories",
        "reason": "Sum submitted, approved and posted report lines by category"
      },
      {
        "path": "/expense-reports",
        "reason": "Sum submitted, approved and posted report lines by category"
      }
    ],
    "data": {
      "reports": {
        "kind": "folder",
        "path": "/expense-reports",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.report+json"
      },
      "categories": {
        "kind": "folder",
        "path": "/expense-categories",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.category+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', date: e.data.date || '', lineCount: (e.data.lines || []).length, total: e.data.total ? Math.round(Number(e.data.total || 0) * 10000) : (e.data.lines || []).reduce((s, l) => s + Math.round(Number(l.amount || 0) * 10000), 0), status: e.data.status || 'draft', approver: e.data.approver || '' }))"
      },
      "summary": {
        "kind": "computed",
        "expr": "(data.categories || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', lineCount: (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ['submitted', 'approved', 'posted'].includes(e.data.status)).flatMap(e => (e.data.lines || []).map(l => ({ category: l.category, amount: Math.round(Number(l.amount || 0) * 10000) }))).filter(l => l.category === e.path).length, total: (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ['submitted', 'approved', 'posted'].includes(e.data.status)).flatMap(e => (e.data.lines || []).map(l => ({ category: l.category, amount: Math.round(Number(l.amount || 0) * 10000) }))).filter(l => l.category === e.path).reduce((s, l) => s + l.amount, 0) }))"
      }
    },
    "state": {
      "showempty": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Expenses",
          "icon": "receipt",
          "active": "by-category.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My reports",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "All reports",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "by-category.page.yaml",
              "label": "Categories",
              "icon": "tags"
            },
            {
              "id": "mine.page.yaml",
              "label": "My reports",
              "icon": "user"
            },
            {
              "id": "to-approve.page.yaml",
              "label": "To approve",
              "icon": "circle-check"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/expenses/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/expenses.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Expenses by category",
              "note": "Submitted, approved and posted report lines, summed by their category."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Spend per category"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.summary || []).map(s => ({ path: s.path, label: s.name || s.code, value: (s.amount || 0) / 100 })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "hbar",
                  "x": "label",
                  "y": "value",
                  "format": "number",
                  "decimals": 2,
                  "sort": "-value"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "reports",
              "compact": true
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "categories",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Categories",
                  "value": "{{ (data.categories || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "tags",
                  "loading": "{{ data.$categories.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Expensed lines",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ['submitted', 'approved', 'posted'].includes(e.data.status)).flatMap(e => (e.data.lines || []).map(l => ({ category: l.category, amount: Math.round(Number(l.amount || 0) * 10000) }))).length }}",
                  "icon": "receipt",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Expensed total",
                  "value": "{{ ((data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ['submitted', 'approved', 'posted'].includes(e.data.status)).flatMap(e => (e.data.lines || []).map(l => ({ category: l.category, amount: Math.round(Number(l.amount || 0) * 10000) }))).reduce((s, l) => s + l.amount, 0) / 10000).toFixed(2) }}",
                  "icon": "sigma",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show categories without expenses",
              "value": "{{ state.showempty }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.summary || []).filter(c => state.showempty || c.lineCount > 0).map(c => ({ path: c.path, code: c.code, name: c.name, lineCount: c.lineCount, total: (c.total / 10000).toFixed(2) })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Category"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "lineCount",
                  "label": "Lines",
                  "align": "end"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                }
              ],
              "emptyText": "Nothing expensed yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
