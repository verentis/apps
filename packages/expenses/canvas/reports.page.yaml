{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "expenses-reports",
    "name": "Expense reports",
    "description": "Expense reports by status.",
    "icon": "receipt"
  },
  "spec": {
    "access": [
      {
        "path": "/expense-categories",
        "reason": "List expense reports with their totals and statuses"
      },
      {
        "path": "/expense-reports",
        "reason": "List expense reports with their totals and statuses"
      }
    ],
    "data": {
      "reports": {
        "kind": "folder",
        "path": "/expense-reports",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.report+json"
      },
      "categories": {
        "kind": "folder",
        "path": "/expense-categories",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.expenses.category+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', date: e.data.date || '', lineCount: (e.data.lines || []).length, total: e.data.total ? Math.round(Number(e.data.total || 0) * 10000) : (e.data.lines || []).reduce((s, l) => s + Math.round(Number(l.amount || 0) * 10000), 0), status: e.data.status || 'draft', approver: e.data.approver || '' }))"
      }
    },
    "state": {
      "showall": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Expenses",
          "icon": "receipt",
          "active": "reports.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My reports",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "All reports",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "by-category.page.yaml",
              "label": "Categories",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/expenses/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/expenses.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Expense reports",
              "note": "Draft reports are estimates; submitting computes the exact total."
            },
            "children": []
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => r.status !== 'refused') }}",
              "groupBy": "status",
              "columns": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "locked": true
                },
                {
                  "value": "submitted",
                  "label": "Submitted"
                },
                {
                  "value": "approved",
                  "label": "Approved"
                },
                {
                  "value": "posted",
                  "label": "Posted"
                }
              ],
              "card": {
                "title": "employee",
                "code": "code",
                "meta": [
                  "date",
                  "approver"
                ],
                "trailing": "total"
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"posted\"].includes(row.status)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'posted'",
                    "title": "Move to Posted?",
                    "message": "{{ event.row.code }} moves to Posted. Posting writes the expense journal.",
                    "confirm-label": "Move to Posted"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'submitted'",
                    "file": "/applications/expenses/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "submit-report",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "confirm": {
                    "if": "event.to === 'approved'",
                    "title": "Move to Approved",
                    "message": "{{ event.row.code }} moves to Approved.",
                    "confirm-label": "Move to Approved",
                    "fields": [
                      {
                        "key": "approver",
                        "label": "Approved by",
                        "required": true,
                        "placeholder": "Your name"
                      }
                    ],
                    "assign": "moveanswer"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'approved'",
                    "file": "/applications/expenses/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "approve-report",
                      "path": "{{ event.path }}",
                      "approver": "{{ state.moveanswer.approver }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'posted'",
                    "file": "/applications/expenses/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "post-report",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "reports"
                  }
                },
                {
                  "refresh-source": {
                    "source": "categories"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"submitted\",\"approved\",\"posted\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"submitted\":\"Submitted\",\"approved\":\"Approved\",\"posted\":\"Posted\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "reports",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting approval",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'submitted')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved, unposted",
                  "value": "{{ (data.reports || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "To reimburse",
                  "value": "{{ ((data.rows || []).filter(r => r.status === 'submitted' || r.status === 'approved').reduce((s, r) => s + r.total, 0) / 10000).toFixed(2) }}",
                  "icon": "banknote",
                  "loading": "{{ data.$reports.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show posted and refused reports",
              "value": "{{ state.showall }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => state.showall || (r.status !== 'posted' && r.status !== 'refused')).map(r => ({ path: r.path, code: r.code, employee: r.employee, date: r.date, lineCount: r.lineCount, total: (r.total / 10000).toFixed(2), status: r.status, approver: r.approver })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Report"
                },
                {
                  "key": "employee",
                  "label": "Employee"
                },
                {
                  "key": "date",
                  "label": "Date"
                },
                {
                  "key": "lineCount",
                  "label": "Lines",
                  "align": "end"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "approver",
                  "label": "Approver"
                }
              ],
              "emptyText": "No expense reports",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
