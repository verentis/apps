{
  "api-version": "verentis.io/v1",
  "kind": "Application",
  "metadata": {
    "id": "legal-research",
    "name": "Legal Research",
    "version": "0.1.0",
    "author": "Verentis",
    "icon": "./icons/app.svg",
    "description": "Find legal authorities by citation or topic and compare the sources recorded for two dates."
  },
  "marketplace": {
    "logo": "./icons/app.svg",
    "readme": "./marketplace/README.md",
    "keywords": [
      "law",
      "jurisdiction",
      "legislation",
      "legal research"
    ],
    "hero": {
      "source": "./marketplace/hero.svg",
      "alt": "Green law library shelves"
    },
    "images": [
      {
        "source": "./marketplace/overview.png",
        "alt": "Jurisdiction and citation search",
        "caption": "Find sources by topic or citation"
      },
      {
        "source": "./marketplace/detail.png",
        "alt": "Two dated Constitution section 6 citations",
        "caption": "Compare recorded provision versions"
      }
    ]
  },
  "spec": {
    "scope": "global",
    "install-root": "/applications/legal-research",
    "entry": "https://canvas.apps.localtest.me",
    "entry-points": [
      {
        "id": "home",
        "display-name": "Find authorities",
        "route": "/render?document=.%2Fcanvas%2Fhome.page.yaml",
        "order": 10
      },
      {
        "id": "packs",
        "display-name": "Packs",
        "route": "/render?document=.%2Fcanvas%2Fpacks.page.yaml",
        "order": 20
      }
    ],
    "launch": {
      "enabled": true,
      "entry-point": "home",
      "pinnable": true
    },
    "dependencies": [
      {
        "package": "verentis/canvas",
        "version": "latest"
      }
    ],
    "permissions": [
      "file.read"
    ],
    "scopes": [
      "legal-research.default"
    ],
    "file-access": [
      {
        "path": "/legal-authority-packs",
        "mode": "read",
        "reason": "Read installed jurisdiction indexes",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/legal-authority-packs",
        "mode": "read",
        "reason": "List the installed jurisdiction packs",
        "origin": {
          "kind": "document",
          "id": "canvas/packs.page.yaml"
        }
      }
    ],
    "install": [
      {
        "from": "canvas/home.page.yaml",
        "to": "/applications/legal-research/canvas/home.page.yaml",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.page+yaml"
      },
      {
        "from": "canvas/packs.page.yaml",
        "to": "/applications/legal-research/canvas/packs.page.yaml",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.page+yaml"
      },
      {
        "from": "seed/packs",
        "to": "/legal-authority-packs",
        "mode": "seed",
        "mime": "application/vnd.verentis.legal-research.packs"
      }
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-forms": true,
      "allow-popups": true
    }
  },
  "packaging": {
    "publisher": "verentis",
    "files": [
      "canvas/**",
      "seed/**",
      "README.md"
    ],
    "encryption": "none"
  }
}
