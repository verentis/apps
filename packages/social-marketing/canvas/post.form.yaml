{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "social-marketing-post",
    "name": "Social Marketing post",
    "description": "View and edit a Social Marketing post.",
    "icon": "megaphone"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.social-marketing.post+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/social-marketing/v1/post.schema.json",
          "source": "/applications/social-marketing/schemas/post.schema.json",
          "title": "Social Marketing post",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fsocial-marketing%2Fcanvas%2Fpost.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.social-marketing.post+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/social-marketing/v1/post.schema.json",
          "source": "/applications/social-marketing/schemas/post.schema.json",
          "title": "Social Marketing post",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/social-accounts",
        "mode": "read",
        "reason": "Choose the social account a post is published through"
      },
      {
        "path": "/applications/social-marketing/",
        "mode": "read",
        "reason": "Read the Social Marketing schemas and run the post action script"
      }
    ],
    "access": [
      {
        "path": "/social-accounts",
        "reason": "Choose the social account a post is published through"
      },
      {
        "path": "/applications/social-marketing/",
        "reason": "Read the Social Marketing schemas and run the post action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "accounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      },
      "accountoptions": {
        "kind": "computed",
        "expr": "(data.accounts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.handle || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.code || 'New post' }}",
              "note": "Post {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"published\"].includes(form.values.status) ? 'success' : [\"scheduled\"].includes(form.values.status) ? 'warning' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Schedule",
                  "variant": "outline",
                  "icon": "calendar-clock",
                  "size": "sm"
                },
                "on": {
                  "click": "schedule"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || !form.values.scheduledDate"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Publish",
                  "icon": "megaphone",
                  "size": "sm"
                },
                "on": {
                  "click": "publish"
                },
                "rules": {
                  "visible": "[\"draft\",\"scheduled\"].includes(form.values.status) && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || !(form.values.content || '').trim()"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel",
                  "variant": "ghost",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel"
                },
                "rules": {
                  "visible": "[\"draft\",\"scheduled\"].includes(form.values.status) && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(false)",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (false)"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "draft",
                  "label": "Draft"
                },
                {
                  "value": "scheduled",
                  "label": "Scheduled"
                },
                {
                  "value": "published",
                  "label": "Published"
                }
              ],
              "branches": [
                {
                  "value": "cancelled",
                  "label": "Cancelled"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This post is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This post was published on {{ form.values.publishedAt }}. Its account, schedule and content are locked; record the engagement below.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'published'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This post was cancelled.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'cancelled'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Post"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Social account",
                          "value": "{{ form.values.account }}",
                          "options": "{{ data.accountoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'published' || form.values.status === 'cancelled'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Scheduled date",
                          "value": "{{ form.values.scheduledDate }}",
                          "description": "Required before Schedule."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'published' || form.values.status === 'cancelled'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Set by Schedule, Publish and Cancel.",
                          "options": [
                            {
                              "value": "draft",
                              "label": "Draft"
                            },
                            {
                              "value": "scheduled",
                              "label": "Scheduled"
                            },
                            {
                              "value": "published",
                              "label": "Published"
                            },
                            {
                              "value": "cancelled",
                              "label": "Cancelled"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'published' || form.values.status === 'cancelled')) || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Content"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Content",
                          "value": "{{ form.values.content }}",
                          "description": "Required before Publish.",
                          "rows": 8,
                          "limit": "{{ ({ x: 280, mastodon: 500, linkedin: 3000, facebook: 63206 })[((((data.accounts || []).find(a => a.path === form.values.account) || {}).data || {}).network)] || 0 }}"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'published' || form.values.status === 'cancelled'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Media note",
                          "value": "{{ form.values.mediaNote }}",
                          "placeholder": "e.g. attach the launch banner"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'published' || form.values.status === 'cancelled'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Publication"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Published at",
                          "value": "{{ form.values.publishedAt }}",
                          "description": "Stamped by Publish. Delivery to the network is a platform integration."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived') || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Engagement",
                  "description": "Recorded by hand after publishing."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Likes",
                          "value": "{{ form.values.engagement.likes }}",
                          "min": 0,
                          "step": 1
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || !(form.values.status === 'published'))"
                        }
                      },
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Shares",
                          "value": "{{ form.values.engagement.shares }}",
                          "min": 0,
                          "step": 1
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || !(form.values.status === 'published'))"
                        }
                      },
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Comments",
                          "value": "{{ form.values.engagement.comments }}",
                          "min": 0,
                          "step": 1
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || !(form.values.status === 'published'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "schedule": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Schedule post",
              "message": "Schedule this post for its scheduled date? Publishing stays a manual action."
            }
          },
          {
            "run-script": {
              "file": "/applications/social-marketing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "schedule",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "publish": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Publish post",
              "message": "Mark this post published? Its content is locked and delivery to the network is a platform integration."
            }
          },
          {
            "run-script": {
              "file": "/applications/social-marketing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "publish",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "cancel": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Cancel post",
              "message": "Cancel this post? It can no longer be scheduled or published."
            }
          },
          {
            "run-script": {
              "file": "/applications/social-marketing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "cancel",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
