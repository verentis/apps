{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "social-marketing-engagement",
    "name": "Engagement",
    "description": "Hand-recorded engagement, summed per social account.",
    "icon": "heart"
  },
  "spec": {
    "access": [
      {
        "path": "/social-accounts",
        "reason": "Sum published posts and engagement per social account"
      },
      {
        "path": "/social-posts",
        "reason": "Sum published posts and engagement per social account"
      }
    ],
    "data": {
      "posts": {
        "kind": "folder",
        "path": "/social-posts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.post+json"
      },
      "accounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.posts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, accountPath: e.data.account || '', handle: ((((data.accounts || []).find(a => a.kind === 'file' && a.data && a.path === e.data.account) || {}).data || {}).handle) || '', status: e.data.status || '', scheduledDate: e.data.scheduledDate || '', publishedAt: e.data.publishedAt || '', excerpt: String(e.data.content || '').slice(0, 80), likes: Number((e.data.engagement || {}).likes || 0), shares: Number((e.data.engagement || {}).shares || 0), comments: Number((e.data.engagement || {}).comments || 0) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Social Marketing",
          "icon": "megaphone",
          "active": "engagement.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "upcoming.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            },
            {
              "id": "engagement.page.yaml",
              "label": "Engagement",
              "icon": "chart-column"
            },
            {
              "id": "calendar.page.yaml",
              "label": "Content calendar",
              "icon": "calendar-days"
            },
            {
              "id": "channels.page.yaml",
              "label": "Channels",
              "icon": "radio-tower"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/social-marketing/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/social-marketing.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Engagement by account",
              "note": "Published posts and their hand-recorded likes, shares and comments, summed per social account."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Engagement per post"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'published').map(r => ({ label: r.code, likes: r.likes || 0, shares: r.shares || 0, comments: r.comments || 0 })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-bar",
                  "x": "label",
                  "y": [
                    "likes",
                    "shares",
                    "comments"
                  ],
                  "labels": {
                    "likes": "Likes",
                    "shares": "Shares",
                    "comments": "Comments"
                  },
                  "format": "integer",
                  "limit": 20
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "posts",
              "compact": true,
              "description": "The /social-posts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "accounts",
              "compact": true,
              "description": "The /social-accounts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published posts",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Likes",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').reduce((sum, r) => sum + r.likes, 0) }}",
                  "icon": "heart",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Shares",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').reduce((sum, r) => sum + r.shares, 0) }}",
                  "icon": "repeat",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Comments",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').reduce((sum, r) => sum + r.comments, 0) }}",
                  "icon": "message-circle",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Accounts"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.accounts || []).filter(a => a.kind === 'file' && a.data && a.data.state !== 'archived').map(a => ({ path: a.path, code: a.data.code || a.name, handle: a.data.handle || '', network: ({ 'mastodon': 'Mastodon', 'linkedin': 'LinkedIn', 'x': 'X', 'facebook': 'Facebook', 'other': 'Other' })[a.data.network] || a.data.network || '', active: a.data.active === true ? 'Yes' : 'No', published: (data.rows || []).filter(r => r.accountPath === a.path && r.status === 'published').length, likes: (data.rows || []).filter(r => r.accountPath === a.path && r.status === 'published').reduce((sum, r) => sum + r.likes, 0), shares: (data.rows || []).filter(r => r.accountPath === a.path && r.status === 'published').reduce((sum, r) => sum + r.shares, 0), comments: (data.rows || []).filter(r => r.accountPath === a.path && r.status === 'published').reduce((sum, r) => sum + r.comments, 0) })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Account"
                    },
                    {
                      "key": "handle",
                      "label": "Handle"
                    },
                    {
                      "key": "network",
                      "label": "Network"
                    },
                    {
                      "key": "active",
                      "label": "Active"
                    },
                    {
                      "key": "published",
                      "label": "Published",
                      "align": "end"
                    },
                    {
                      "key": "likes",
                      "label": "Likes",
                      "align": "end"
                    },
                    {
                      "key": "shares",
                      "label": "Shares",
                      "align": "end"
                    },
                    {
                      "key": "comments",
                      "label": "Comments",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No social accounts yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
