{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "social-marketing-upcoming",
    "name": "Upcoming posts",
    "description": "Scheduled posts in calendar order.",
    "icon": "calendar-clock"
  },
  "spec": {
    "access": [
      {
        "path": "/social-accounts",
        "reason": "List scheduled posts in calendar order with their account handles"
      },
      {
        "path": "/social-posts",
        "reason": "List scheduled posts in calendar order with their account handles"
      }
    ],
    "data": {
      "posts": {
        "kind": "folder",
        "path": "/social-posts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.post+json"
      },
      "accounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.posts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, accountPath: e.data.account || '', handle: ((((data.accounts || []).find(a => a.kind === 'file' && a.data && a.path === e.data.account) || {}).data || {}).handle) || '', status: e.data.status || '', scheduledDate: e.data.scheduledDate || '', publishedAt: e.data.publishedAt || '', excerpt: String(e.data.content || '').slice(0, 80), likes: Number((e.data.engagement || {}).likes || 0), shares: Number((e.data.engagement || {}).shares || 0), comments: Number((e.data.engagement || {}).comments || 0) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Upcoming posts"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every scheduled post, earliest first. Click a row to open the post.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Social Marketing",
                  "variant": "ghost",
                  "icon": "megaphone",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/social-marketing/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /social-posts folder could not be read. Reinstall Social Marketing to recreate it."
            },
            "rules": {
              "visible": "data.$posts.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /social-accounts folder could not be read. Reinstall Social Marketing to recreate it."
            },
            "rules": {
              "visible": "data.$accounts.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Calendar"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'scheduled').sort((a, b) => a.scheduledDate < b.scheduledDate ? -1 : a.scheduledDate > b.scheduledDate ? 1 : 0) }}",
                  "columns": [
                    {
                      "key": "scheduledDate",
                      "label": "Date"
                    },
                    {
                      "key": "code",
                      "label": "Post"
                    },
                    {
                      "key": "handle",
                      "label": "Account"
                    },
                    {
                      "key": "excerpt",
                      "label": "Content"
                    }
                  ],
                  "emptyText": "Nothing scheduled",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "icon": "megaphone"
                },
                {
                  "value": "scheduled",
                  "label": "Scheduled",
                  "icon": "megaphone"
                },
                {
                  "value": "published",
                  "label": "Published",
                  "icon": "megaphone"
                },
                {
                  "value": "cancelled",
                  "label": "Cancelled",
                  "icon": "megaphone"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'draft') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Post"
                        },
                        {
                          "key": "handle",
                          "label": "Account"
                        },
                        {
                          "key": "excerpt",
                          "label": "Content"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "publishedAt",
                          "label": "Published at"
                        }
                      ],
                      "emptyText": "No draft posts",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "draft"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'scheduled') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Post"
                        },
                        {
                          "key": "handle",
                          "label": "Account"
                        },
                        {
                          "key": "excerpt",
                          "label": "Content"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "publishedAt",
                          "label": "Published at"
                        }
                      ],
                      "emptyText": "No scheduled posts",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "scheduled"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'published') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Post"
                        },
                        {
                          "key": "handle",
                          "label": "Account"
                        },
                        {
                          "key": "excerpt",
                          "label": "Content"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "publishedAt",
                          "label": "Published at"
                        }
                      ],
                      "emptyText": "No published posts",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "published"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'cancelled') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Post"
                        },
                        {
                          "key": "handle",
                          "label": "Account"
                        },
                        {
                          "key": "excerpt",
                          "label": "Content"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "publishedAt",
                          "label": "Published at"
                        }
                      ],
                      "emptyText": "No cancelled posts",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "cancelled"
              }
            ]
          }
        ]
      }
    ]
  }
}
