{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "social-marketing-upcoming",
    "name": "Upcoming posts",
    "description": "Scheduled posts in calendar order.",
    "icon": "calendar-clock"
  },
  "spec": {
    "access": [
      {
        "path": "/social-accounts",
        "reason": "List scheduled posts in calendar order with their account handles"
      },
      {
        "path": "/social-posts",
        "reason": "List scheduled posts in calendar order with their account handles"
      }
    ],
    "data": {
      "posts": {
        "kind": "folder",
        "path": "/social-posts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.post+json"
      },
      "accounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.posts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, accountPath: e.data.account || '', handle: ((((data.accounts || []).find(a => a.kind === 'file' && a.data && a.path === e.data.account) || {}).data || {}).handle) || '', status: e.data.status || '', scheduledDate: e.data.scheduledDate || '', publishedAt: e.data.publishedAt || '', excerpt: String(e.data.content || '').slice(0, 80), likes: Number((e.data.engagement || {}).likes || 0), shares: Number((e.data.engagement || {}).shares || 0), comments: Number((e.data.engagement || {}).comments || 0) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Social Marketing",
          "icon": "megaphone",
          "active": "upcoming.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "upcoming.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            },
            {
              "id": "engagement.page.yaml",
              "label": "Engagement",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/social-marketing/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/social-marketing.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Upcoming posts",
              "note": "Every scheduled post, earliest first. Click a row to open the post."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Content calendar"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Scheduled and published posts per account.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.calendar",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!(r.scheduledDate || r.publishedAt)).map(r => ({ path: r.path, title: r.excerpt || r.code, handle: r.handle || 'No account', at: r.scheduledDate || r.publishedAt })) }}",
                  "views": [
                    "month",
                    "week",
                    "agenda"
                  ],
                  "showLegend": true,
                  "emptyText": "Nothing scheduled",
                  "start": "at",
                  "title": "title",
                  "colorBy": "handle",
                  "view": "month"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "posts",
              "compact": true,
              "description": "The /social-posts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "accounts",
              "compact": true,
              "description": "The /social-accounts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Calendar"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'scheduled').sort((a, b) => a.scheduledDate < b.scheduledDate ? -1 : a.scheduledDate > b.scheduledDate ? 1 : 0) }}",
                  "columns": [
                    {
                      "key": "scheduledDate",
                      "label": "Date"
                    },
                    {
                      "key": "code",
                      "label": "Post"
                    },
                    {
                      "key": "handle",
                      "label": "Account"
                    },
                    {
                      "key": "excerpt",
                      "label": "Content"
                    }
                  ],
                  "emptyText": "Nothing scheduled",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "status",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "draft",
                          "label": "Draft",
                          "locked": true
                        },
                        {
                          "value": "scheduled",
                          "label": "Scheduled"
                        },
                        {
                          "value": "published",
                          "label": "Published"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled"
                        }
                      ],
                      "card": {
                        "title": "handle",
                        "code": "code",
                        "meta": [
                          "excerpt",
                          "scheduledDate",
                          "publishedAt"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"published\",\"cancelled\"].includes(row.status)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'published'",
                            "title": "Move to Published?",
                            "message": "{{ event.row.code }} moves to Published. It cannot be moved back from the board.",
                            "confirm-label": "Move to Published"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'cancelled'",
                            "title": "Move to Cancelled?",
                            "message": "{{ event.row.code }} moves to Cancelled. It cannot be moved back from the board.",
                            "confirm-label": "Move to Cancelled"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'scheduled'",
                            "file": "/applications/social-marketing/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "schedule",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'published'",
                            "file": "/applications/social-marketing/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "publish",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'cancelled'",
                            "file": "/applications/social-marketing/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "cancel",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "posts"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "accounts"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"scheduled\",\"published\",\"cancelled\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"scheduled\":\"Scheduled\",\"published\":\"Published\",\"cancelled\":\"Cancelled\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Post"
                        },
                        {
                          "key": "handle",
                          "label": "Account"
                        },
                        {
                          "key": "excerpt",
                          "label": "Content"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "publishedAt",
                          "label": "Published at"
                        },
                        {
                          "key": "status",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "draft": "Draft",
                            "scheduled": "Scheduled",
                            "published": "Published",
                            "cancelled": "Cancelled"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "draft",
                          "label": "Draft",
                          "where": "row.status === 'draft'"
                        },
                        {
                          "value": "scheduled",
                          "label": "Scheduled",
                          "where": "row.status === 'scheduled'"
                        },
                        {
                          "value": "published",
                          "label": "Published",
                          "where": "row.status === 'published'"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled",
                          "where": "row.status === 'cancelled'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
