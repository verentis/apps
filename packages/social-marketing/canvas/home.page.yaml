{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "social-marketing-home",
    "name": "Social Marketing",
    "description": "Social Marketing overview.",
    "icon": "megaphone"
  },
  "spec": {
    "access": [
      {
        "path": "/social-accounts",
        "reason": "Count posts and engagement and show the social accounts and posts"
      },
      {
        "path": "/social-posts",
        "reason": "Count posts and engagement and show the social accounts and posts"
      }
    ],
    "data": {
      "posts": {
        "kind": "folder",
        "path": "/social-posts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.post+json"
      },
      "accounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.posts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, accountPath: e.data.account || '', handle: ((((data.accounts || []).find(a => a.kind === 'file' && a.data && a.path === e.data.account) || {}).data || {}).handle) || '', status: e.data.status || '', scheduledDate: e.data.scheduledDate || '', publishedAt: e.data.publishedAt || '', excerpt: String(e.data.content || '').slice(0, 80), likes: Number((e.data.engagement || {}).likes || 0), shares: Number((e.data.engagement || {}).shares || 0), comments: Number((e.data.engagement || {}).comments || 0) }))"
      },
      "listsocialposts": {
        "kind": "folder",
        "path": "/social-posts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.post+json"
      },
      "listsocialaccounts": {
        "kind": "folder",
        "path": "/social-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.social-marketing.account+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Social Marketing",
          "icon": "megaphone",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "upcoming.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            },
            {
              "id": "engagement.page.yaml",
              "label": "Engagement",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/social-marketing/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/social-marketing.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Social Marketing",
              "note": "Social accounts and posts are files in your workspace. Draft posts in /social-posts, then schedule, publish or cancel them from their forms. Delivery to the networks is a platform integration."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published posts",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "calendar-clock",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Drafts",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Total likes",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').reduce((sum, r) => sum + r.likes, 0) }}",
                  "icon": "heart",
                  "loading": "{{ data.$posts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "posts",
              "compact": true,
              "description": "The /social-posts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "accounts",
              "compact": true,
              "description": "The /social-accounts folder could not be read. Reinstall Social Marketing to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "posts",
                  "label": "Posts",
                  "icon": "megaphone"
                },
                {
                  "value": "accounts",
                  "label": "Social accounts",
                  "icon": "at-sign"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /social-posts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/social-posts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsocialposts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsocialposts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Post"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        },
                        {
                          "key": "data.scheduledDate",
                          "label": "Scheduled",
                          "format": "date"
                        },
                        {
                          "key": "data.publishedAt",
                          "label": "Published at",
                          "format": "date"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No posts yet. Use New in /social-posts."
                    },
                    "rules": {
                      "visible": "data.$listsocialposts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "posts"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /social-accounts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/social-accounts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsocialaccounts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsocialaccounts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Account"
                        },
                        {
                          "key": "data.handle",
                          "label": "Handle"
                        },
                        {
                          "key": "data.network",
                          "label": "Network"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No social accounts yet. Use New in /social-accounts."
                    },
                    "rules": {
                      "visible": "data.$listsocialaccounts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "accounts"
              }
            ]
          }
        ]
      }
    ]
  }
}
