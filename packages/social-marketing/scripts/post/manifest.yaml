api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: social-marketing-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Scheduling, publishing and cancelling enforce the status transitions, check the social account at publish and update posts conditionally.
file-access:
  - path: "/social-posts"
    mode: write
    reason: "Schedule, publish and cancel posts"
  - path: "/social-accounts"
    mode: read
    reason: "Check a post's social account is active at publish"
