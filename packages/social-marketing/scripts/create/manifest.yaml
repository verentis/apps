api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: social-marketing-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Social Marketing containers.
file-access:
  - path: "/social-accounts"
    mode: write
    reason: "Create social accounts with the next code"
  - path: "/social-posts"
    mode: write
    reason: "Create posts with the next code"
  - path: "/settings/social-marketing.json"
    mode: read
    reason: "Default new posts' social account"
