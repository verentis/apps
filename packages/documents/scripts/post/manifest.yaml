api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: documents-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The workflow actions enforce the status transitions and update document cards conditionally; referenced files are never touched.
file-access:
  - path: "/document-cards"
    mode: write
    reason: "Send document cards to review, validate, archive or return them"
