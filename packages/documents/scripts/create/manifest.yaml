api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: documents-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Documents containers; cards get their tags from their workspace.
file-access:
  - path: "/document-workspaces"
    mode: write
    reason: "Create workspaces with the next code"
  - path: "/document-cards"
    mode: write
    reason: "Create document cards with the next code"
  - path: "/document-tags"
    mode: write
    reason: "Create tags with the next code"
  - path: "/settings/documents.json"
    mode: read
    reason: "Default new document cards to the default workspace"
