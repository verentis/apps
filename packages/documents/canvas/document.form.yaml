{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "documents-document",
    "name": "Documents document",
    "description": "View and edit a Documents document.",
    "icon": "file-text"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.documents.document+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/documents/v1/document.schema.json",
          "source": "/applications/documents/schemas/document.schema.json",
          "title": "Documents document",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fdocuments%2Fcanvas%2Fdocument.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.documents.document+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/documents/v1/document.schema.json",
          "source": "/applications/documents/schemas/document.schema.json",
          "title": "Documents document",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/document-workspaces",
        "mode": "read",
        "reason": "Choose the workspace a document card belongs to"
      },
      {
        "path": "/applications/documents/",
        "mode": "read",
        "reason": "Read the Documents schemas and run the document workflow script"
      }
    ],
    "access": [
      {
        "path": "/document-workspaces",
        "reason": "Choose the workspace a document card belongs to"
      },
      {
        "path": "/applications/documents/",
        "reason": "Read the Documents schemas and run the document workflow script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "workspaceoptions": {
        "kind": "computed",
        "expr": "(data.workspaces || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.heading",
                        "props": {
                          "level": 2,
                          "text": "{{ form.values.title || 'New document' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "{{ {\"inbox\":\"Inbox\",\"in-review\":\"In review\",\"validated\":\"Validated\",\"archived-status\":\"Archived\"}[form.values.status] || '' }}",
                          "tone": "{{ [\"validated\"].includes(form.values.status) ? 'success' : [\"in-review\"].includes(form.values.status) ? 'warning' : [\"archived-status\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                        },
                        "rules": {
                          "visible": "!!form.values.status"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "Archived",
                          "tone": "warning",
                          "icon": "archive"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Document {{ form.values.code || '' }} · {{ ctx.file.path }}",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Open file",
                      "variant": "ghost",
                      "icon": "external-link",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "{{ form.values.filePath }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    },
                    "rules": {
                      "visible": "!!(form.values.filePath)"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Send to review",
                      "icon": "send",
                      "size": "sm"
                    },
                    "on": {
                      "click": "send-to-review"
                    },
                    "rules": {
                      "visible": "form.values.status === 'inbox' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Validate",
                      "icon": "check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "validate"
                    },
                    "rules": {
                      "visible": "form.values.status === 'in-review' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Return to inbox",
                      "variant": "outline",
                      "icon": "undo-2",
                      "size": "sm"
                    },
                    "on": {
                      "click": "return-to-inbox"
                    },
                    "rules": {
                      "visible": "form.values.status === 'in-review' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty || !String(form.values.reviewComment || '').trim()"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive document",
                      "variant": "outline",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive-document"
                    },
                    "rules": {
                      "visible": "form.values.status === 'validated' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Archive",
                          "variant": "ghost",
                          "icon": "archive",
                          "size": "sm"
                        },
                        "on": {
                          "click": "archive"
                        },
                        "rules": {
                          "visible": "!(form.values.state === 'archived') && !([\"validated\",\"archived-status\"].includes(form.values.status))",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Restore",
                          "variant": "outline",
                          "icon": "archive-restore",
                          "size": "sm"
                        },
                        "on": {
                          "click": "restore"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Reset",
                          "variant": "ghost",
                          "size": "sm"
                        },
                        "on": {
                          "click": "reset"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Save",
                          "icon": "save",
                          "size": "sm"
                        },
                        "on": {
                          "click": "save"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$record.error }}"
            },
            "rules": {
              "visible": "data.$record.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$record.status === 'loading'"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This document is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Returned from review: {{ form.values.reviewComment }}",
              "tone": "warning"
            },
            "rules": {
              "visible": "form.values.status === 'inbox' && !!String(form.values.reviewComment || '').trim()"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This document is validated and locked. Archive retires it.",
              "tone": "success"
            },
            "rules": {
              "visible": "form.values.status === 'validated'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This document is archived and can no longer be edited.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'archived-status'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Document"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Title",
                          "value": "{{ form.values.title }}",
                          "required": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "File path",
                          "value": "{{ form.values.filePath }}",
                          "description": "Workspace path of the file this card describes. The file itself stays where it is — the platform VFS stores and versions it.",
                          "placeholder": "/shared/contracts/example.pdf"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Workspace",
                          "value": "{{ form.values.workspace }}",
                          "options": "{{ data.workspaceoptions }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Owner",
                          "value": "{{ form.values.owner }}",
                          "placeholder": "Name or email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "In review, validated and archived are set by Send to review, Validate and Archive.",
                          "options": [
                            {
                              "value": "inbox",
                              "label": "Inbox"
                            },
                            {
                              "value": "in-review",
                              "label": "In review"
                            },
                            {
                              "value": "validated",
                              "label": "Validated"
                            },
                            {
                              "value": "archived-status",
                              "label": "Archived"
                            }
                          ]
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Validated at",
                          "value": "{{ form.values.validatedAt }}",
                          "description": "Stamped by Validate."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status))) || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Tags"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.text-list",
                        "props": {
                          "label": "Tags",
                          "value": "{{ form.values.tags }}",
                          "description": "Defaults from the workspace; curate the set in /document-tags."
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Review"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Review comment",
                          "value": "{{ form.values.reviewComment }}",
                          "description": "Required before returning a document in review to the inbox.",
                          "rows": 3
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"validated\",\"archived-status\"].includes(form.values.status)))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "send-to-review": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Send to review",
              "message": "Send this document to review? Validate or return it from there."
            }
          },
          {
            "run-script": {
              "file": "/applications/documents/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "send-to-review",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "validate": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Validate document",
              "message": "Validate this document? Validated documents are stamped and locked; they can only be archived."
            }
          },
          {
            "run-script": {
              "file": "/applications/documents/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "validate",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "return-to-inbox": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Return to inbox",
              "message": "Return this document to the inbox with its review comment?"
            }
          },
          {
            "run-script": {
              "file": "/applications/documents/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "return-to-inbox",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "archive-document": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Archive document",
              "message": "Archive this validated document? Archived documents stay locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/documents/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "archive",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
