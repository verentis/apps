{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-workspaces",
    "name": "Workspaces",
    "description": "Document cards per workspace, grouped by tags.",
    "icon": "folder-kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "Browse document cards per workspace, grouped by their tags"
      },
      {
        "path": "/document-workspaces",
        "reason": "Browse document cards per workspace, grouped by their tags"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Documents",
          "icon": "folder-kanban",
          "active": "workspaces.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "inbox.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}"
            },
            {
              "id": "workspaces.page.yaml",
              "label": "Workspaces",
              "icon": "folders"
            },
            {
              "id": "library.page.yaml",
              "label": "All documents",
              "icon": "library"
            },
            {
              "id": "all.page.yaml",
              "label": "All documents",
              "icon": "files"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/documents/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/documents.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Workspace browser",
              "note": "Every workspace with its document cards, grouped by tags. Click a workspace to open it."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "cards",
              "compact": true,
              "description": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "workspaces",
              "compact": true,
              "description": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Workspaces"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.workspaces || []).filter(w => w.kind === 'file' && w.data && w.data.state !== 'archived').map(w => ({ path: w.path, code: w.data.code || w.name, name: w.data.name || '', defaultTags: (w.data.defaultTags || []).join(', '), documents: (data.rows || []).filter(r => r.workspacePath === w.path).length, inbox: (data.rows || []).filter(r => r.workspacePath === w.path && r.status === 'inbox').length, inReview: (data.rows || []).filter(r => r.workspacePath === w.path && r.status === 'in-review').length, validated: (data.rows || []).filter(r => r.workspacePath === w.path && r.status === 'validated').length })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Workspace"
                    },
                    {
                      "key": "name",
                      "label": "Name"
                    },
                    {
                      "key": "defaultTags",
                      "label": "Default tags"
                    },
                    {
                      "key": "documents",
                      "label": "Documents",
                      "align": "end"
                    },
                    {
                      "key": "inbox",
                      "label": "Inbox",
                      "align": "end"
                    },
                    {
                      "key": "inReview",
                      "label": "In review",
                      "align": "end"
                    },
                    {
                      "key": "validated",
                      "label": "Validated",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No workspaces yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Tag groups"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => (r.tagList.length ? r.tagList : ['untagged']).map(t => ({ group: (r.workspace || 'No workspace') + ' / ' + t }))).reduce((a, b) => a.concat(b), []).map(p => p.group).filter((v, i, a) => a.indexOf(v) === i).sort().map(g => ({ group: g, documents: (data.rows || []).map(r => (r.tagList.length ? r.tagList : ['untagged']).map(t => ({ group: (r.workspace || 'No workspace') + ' / ' + t }))).reduce((a, b) => a.concat(b), []).filter(p => p.group === g).length })) }}",
                  "columns": [
                    {
                      "key": "group",
                      "label": "Workspace / tag"
                    },
                    {
                      "key": "documents",
                      "label": "Documents",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No document cards yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Documents by workspace and tags"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => ({ workspace: r.workspace || 'No workspace', tags: r.tags || 'untagged', path: r.path, code: r.code, title: r.title, status: r.status, filePath: r.filePath })).sort((a, b) => (a.workspace < b.workspace ? -1 : a.workspace > b.workspace ? 1 : a.tags < b.tags ? -1 : a.tags > b.tags ? 1 : a.code < b.code ? -1 : 1)) }}",
                  "columns": [
                    {
                      "key": "workspace",
                      "label": "Workspace"
                    },
                    {
                      "key": "tags",
                      "label": "Tags"
                    },
                    {
                      "key": "code",
                      "label": "Document"
                    },
                    {
                      "key": "title",
                      "label": "Title"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    },
                    {
                      "key": "filePath",
                      "label": "File"
                    }
                  ],
                  "emptyText": "No document cards yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
