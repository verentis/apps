{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-inbox",
    "name": "Inbox",
    "description": "Document cards waiting to be filed and sent to review.",
    "icon": "inbox"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "List inbox document cards with their workspace names"
      },
      {
        "path": "/document-workspaces",
        "reason": "List inbox document cards with their workspace names"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Documents",
          "icon": "folder-kanban",
          "active": "inbox.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "inbox.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}"
            },
            {
              "id": "workspaces.page.yaml",
              "label": "Workspaces",
              "icon": "folders"
            },
            {
              "id": "library.page.yaml",
              "label": "All documents",
              "icon": "library"
            },
            {
              "id": "all.page.yaml",
              "label": "All documents",
              "icon": "files"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/documents/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/documents.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Inbox",
              "note": "New document cards land here. File them into a workspace, tag them and send them to review from their form."
            },
            "children": []
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => r.status !== 'archived-status').map(r => ({ path: r.path, code: r.code, title: r.title, status: r.status, workspace: r.workspace, owner: r.owner, tags: r.tags, filePath: r.filePath, type: r.filePath && r.filePath.includes('.') ? r.filePath.split('.').pop().toUpperCase().slice(0, 5) : 'No file' })) }}",
              "groupBy": "status",
              "columns": [
                {
                  "value": "inbox",
                  "label": "Inbox"
                },
                {
                  "value": "in-review",
                  "label": "In review"
                },
                {
                  "value": "validated",
                  "label": "Validated"
                }
              ],
              "card": {
                "title": "title",
                "code": "code",
                "meta": [
                  "workspace",
                  "owner",
                  "tags"
                ],
                "badge": "type"
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"validated\"].includes(row.status)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'validated'",
                    "title": "Move to Validated?",
                    "message": "{{ event.row.code }} moves to Validated. Validated documents are stamped and locked; they can only be archived.",
                    "confirm-label": "Move to Validated"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'inbox'",
                    "file": "/applications/documents/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "return-to-inbox",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'in-review'",
                    "file": "/applications/documents/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "send-to-review",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'validated'",
                    "file": "/applications/documents/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "validate",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "cards"
                  }
                },
                {
                  "refresh-source": {
                    "source": "workspaces"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"inbox\",\"in-review\",\"validated\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"inbox\":\"Inbox\",\"in-review\":\"In review\",\"validated\":\"Validated\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "cards",
              "compact": true,
              "description": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "workspaces",
              "compact": true,
              "description": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In the inbox",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}",
                  "icon": "inbox",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Without a file",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox' && !r.filePath).length }}",
                  "icon": "file-x",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Untagged",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox' && r.tagList.length === 0).length }}",
                  "icon": "tag",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Unowned",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox' && !r.owner).length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => r.status === 'inbox').sort((a, b) => (a.code < b.code ? -1 : a.code > b.code ? 1 : 0)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Document"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "workspace",
                  "label": "Workspace"
                },
                {
                  "key": "tags",
                  "label": "Tags"
                },
                {
                  "key": "owner",
                  "label": "Owner"
                },
                {
                  "key": "filePath",
                  "label": "File"
                }
              ],
              "emptyText": "The inbox is empty",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
