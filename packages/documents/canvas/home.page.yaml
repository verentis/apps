{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-home",
    "name": "Documents",
    "description": "Documents overview.",
    "icon": "folder-kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "Count document cards and show the workspaces and cards"
      },
      {
        "path": "/document-workspaces",
        "reason": "Count document cards and show the workspaces and cards"
      },
      {
        "path": "/document-tags",
        "reason": "Show the curated tag set"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      },
      "tags": {
        "kind": "folder",
        "path": "/document-tags",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.tag+json"
      },
      "listdocumentcards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "listdocumentworkspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "listdocumenttags": {
        "kind": "folder",
        "path": "/document-tags",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.tag+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Documents",
          "icon": "folder-kanban",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "inbox.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}"
            },
            {
              "id": "workspaces.page.yaml",
              "label": "Workspaces",
              "icon": "folders"
            },
            {
              "id": "library.page.yaml",
              "label": "All documents",
              "icon": "library"
            },
            {
              "id": "all.page.yaml",
              "label": "All documents",
              "icon": "files"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/documents/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/documents.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Documents",
              "note": "A tagging and review workflow over files already in your workspace. Cards in /document-cards reference VFS paths; the files themselves stay where they are."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Inbox",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In review",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-review').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'validated').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Archived",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'archived-status').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "cards",
              "compact": true,
              "description": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "workspaces",
              "compact": true,
              "description": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tags",
              "compact": true,
              "description": "The /document-tags folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "cards",
                  "label": "Documents",
                  "icon": "file-text"
                },
                {
                  "value": "workspaces",
                  "label": "Workspaces",
                  "icon": "folder-kanban"
                },
                {
                  "value": "tags",
                  "label": "Tags",
                  "icon": "tag"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-cards",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-cards"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listdocumentcards",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listdocumentcards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Document"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        },
                        {
                          "key": "data.owner",
                          "label": "Owner"
                        },
                        {
                          "key": "data.filePath",
                          "label": "File"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No document cards yet. Use New in /document-cards."
                    },
                    "rules": {
                      "visible": "data.$listdocumentcards.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "cards"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-workspaces",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-workspaces"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listdocumentworkspaces",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listdocumentworkspaces || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Workspace"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.description",
                          "label": "Description"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No workspaces yet. Use New in /document-workspaces."
                    },
                    "rules": {
                      "visible": "data.$listdocumentworkspaces.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "workspaces"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-tags",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-tags"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listdocumenttags",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listdocumenttags || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Tag"
                        },
                        {
                          "key": "data.label",
                          "label": "Label"
                        },
                        {
                          "key": "data.category",
                          "label": "Category"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No tags yet. Use New in /document-tags."
                    },
                    "rules": {
                      "visible": "data.$listdocumenttags.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "tags"
              }
            ]
          }
        ]
      }
    ]
  }
}
