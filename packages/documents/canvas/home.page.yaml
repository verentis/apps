{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-home",
    "name": "Documents",
    "description": "Documents overview.",
    "icon": "folder-kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "Count document cards and show the workspaces and cards"
      },
      {
        "path": "/document-workspaces",
        "reason": "Count document cards and show the workspaces and cards"
      },
      {
        "path": "/document-tags",
        "reason": "Show the curated tag set"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      },
      "tags": {
        "kind": "folder",
        "path": "/document-tags",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.tag+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Documents"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "A tagging and review workflow over files already in your workspace. Cards in /document-cards reference VFS paths; the files themselves stay where they are.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Inbox",
                      "variant": "outline",
                      "icon": "inbox",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/documents/canvas/inbox.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Workspaces",
                      "variant": "outline",
                      "icon": "folder-kanban",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/documents/canvas/workspaces.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Library",
                      "variant": "outline",
                      "icon": "library",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/documents/canvas/library.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/documents.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Inbox",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In review",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-review').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'validated').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Archived",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'archived-status').length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            },
            "rules": {
              "visible": "data.$cards.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            },
            "rules": {
              "visible": "data.$workspaces.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /document-tags folder could not be read. Reinstall Documents to recreate it."
            },
            "rules": {
              "visible": "data.$tags.status === 'error'"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "cards",
                  "label": "Documents",
                  "icon": "file-text"
                },
                {
                  "value": "workspaces",
                  "label": "Workspaces",
                  "icon": "folder-kanban"
                },
                {
                  "value": "tags",
                  "label": "Tags",
                  "icon": "tag"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-cards",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-cards"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/document-cards/",
                      "mimeTypes": [
                        "application/vnd.verentis.documents.document+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Document"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status"
                        },
                        {
                          "key": "data.owner",
                          "label": "Owner"
                        },
                        {
                          "key": "data.filePath",
                          "label": "File"
                        }
                      ],
                      "emptyText": "No document cards yet. Use New in /document-cards."
                    }
                  }
                ],
                "slot": "cards"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-workspaces",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-workspaces"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/document-workspaces/",
                      "mimeTypes": [
                        "application/vnd.verentis.documents.workspace+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Workspace"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.description",
                          "label": "Description"
                        }
                      ],
                      "emptyText": "No workspaces yet. Use New in /document-workspaces."
                    }
                  }
                ],
                "slot": "workspaces"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /document-tags",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/document-tags"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/document-tags/",
                      "mimeTypes": [
                        "application/vnd.verentis.documents.tag+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Tag"
                        },
                        {
                          "key": "data.label",
                          "label": "Label"
                        },
                        {
                          "key": "data.category",
                          "label": "Category"
                        }
                      ],
                      "emptyText": "No tags yet. Use New in /document-tags."
                    }
                  }
                ],
                "slot": "tags"
              }
            ]
          }
        ]
      }
    ]
  }
}
