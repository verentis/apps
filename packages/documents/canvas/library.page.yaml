{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-library",
    "name": "Library",
    "description": "Validated and archived document cards.",
    "icon": "library"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "List validated and archived document cards"
      },
      {
        "path": "/document-workspaces",
        "reason": "List validated and archived document cards"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Documents",
          "icon": "folder-kanban",
          "active": "library.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "inbox.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}"
            },
            {
              "id": "workspaces.page.yaml",
              "label": "Workspaces",
              "icon": "folders"
            },
            {
              "id": "library.page.yaml",
              "label": "All documents",
              "icon": "library"
            },
            {
              "id": "all.page.yaml",
              "label": "All documents",
              "icon": "files"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/documents/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/documents.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Library",
              "note": "Validated documents are stamped and locked; archived documents are retired. Both keep referencing their files in the VFS."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "cards",
              "compact": true,
              "description": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "workspaces",
              "compact": true,
              "description": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'validated').length }}",
                  "icon": "check",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Archived",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'archived-status').length }}",
                  "icon": "archive",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In review",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-review').length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In the inbox",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}",
                  "icon": "inbox",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "validated",
                  "label": "Validated",
                  "icon": "check"
                },
                {
                  "value": "archived",
                  "label": "Archived",
                  "icon": "archive"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'validated').sort((a, b) => ((a.validatedAt || '') < (b.validatedAt || '') ? 1 : -1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Document"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "workspace",
                          "label": "Workspace"
                        },
                        {
                          "key": "tags",
                          "label": "Tags"
                        },
                        {
                          "key": "owner",
                          "label": "Owner"
                        },
                        {
                          "key": "filePath",
                          "label": "File"
                        },
                        {
                          "key": "validatedAt",
                          "label": "Validated at"
                        }
                      ],
                      "emptyText": "No validated documents yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "validated"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'archived-status').sort((a, b) => ((a.validatedAt || '') < (b.validatedAt || '') ? 1 : -1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Document"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "workspace",
                          "label": "Workspace"
                        },
                        {
                          "key": "tags",
                          "label": "Tags"
                        },
                        {
                          "key": "owner",
                          "label": "Owner"
                        },
                        {
                          "key": "filePath",
                          "label": "File"
                        },
                        {
                          "key": "validatedAt",
                          "label": "Validated at"
                        }
                      ],
                      "emptyText": "No archived documents yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "archived"
              }
            ]
          }
        ]
      }
    ]
  }
}
