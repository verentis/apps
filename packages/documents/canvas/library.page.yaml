{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "documents-library",
    "name": "Library",
    "description": "Validated and archived document cards.",
    "icon": "library"
  },
  "spec": {
    "access": [
      {
        "path": "/document-cards",
        "reason": "List validated and archived document cards"
      },
      {
        "path": "/document-workspaces",
        "reason": "List validated and archived document cards"
      }
    ],
    "data": {
      "cards": {
        "kind": "folder",
        "path": "/document-cards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.document+json"
      },
      "workspaces": {
        "kind": "folder",
        "path": "/document-workspaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.documents.workspace+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.cards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', filePath: e.data.filePath || '', workspacePath: e.data.workspace || '', workspace: ((((data.workspaces || []).find(w => w.kind === 'file' && w.data && w.path === e.data.workspace) || {}).data || {}).name) || '', tagList: e.data.tags || [], tags: (e.data.tags || []).join(', '), owner: e.data.owner || '', status: e.data.status || '', validatedAt: e.data.validatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Library"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Validated documents are stamped and locked; archived documents are retired. Both keep referencing their files in the VFS.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Documents",
                  "variant": "ghost",
                  "icon": "folder-kanban",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/documents/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /document-cards folder could not be read. Reinstall Documents to recreate it."
            },
            "rules": {
              "visible": "data.$cards.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /document-workspaces folder could not be read. Reinstall Documents to recreate it."
            },
            "rules": {
              "visible": "data.$workspaces.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'validated').length }}",
                  "icon": "check",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Archived",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'archived-status').length }}",
                  "icon": "archive",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In review",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-review').length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In the inbox",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'inbox').length }}",
                  "icon": "inbox",
                  "loading": "{{ data.$cards.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "validated",
                  "label": "Validated",
                  "icon": "check"
                },
                {
                  "value": "archived",
                  "label": "Archived",
                  "icon": "archive"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'validated').sort((a, b) => ((a.validatedAt || '') < (b.validatedAt || '') ? 1 : -1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Document"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "workspace",
                          "label": "Workspace"
                        },
                        {
                          "key": "tags",
                          "label": "Tags"
                        },
                        {
                          "key": "owner",
                          "label": "Owner"
                        },
                        {
                          "key": "filePath",
                          "label": "File"
                        },
                        {
                          "key": "validatedAt",
                          "label": "Validated at"
                        }
                      ],
                      "emptyText": "No validated documents yet",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "validated"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'archived-status').sort((a, b) => ((a.validatedAt || '') < (b.validatedAt || '') ? 1 : -1)) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Document"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "workspace",
                          "label": "Workspace"
                        },
                        {
                          "key": "tags",
                          "label": "Tags"
                        },
                        {
                          "key": "owner",
                          "label": "Owner"
                        },
                        {
                          "key": "filePath",
                          "label": "File"
                        },
                        {
                          "key": "validatedAt",
                          "label": "Validated at"
                        }
                      ],
                      "emptyText": "No archived documents yet",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "archived"
              }
            ]
          }
        ]
      }
    ]
  }
}
