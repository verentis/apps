api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: time-off-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Time Off containers; requests get weekday-counted days.
file-access:
  - path: "/leave-types"
    mode: write
    reason: "Create leave types with the next code"
  - path: "/leave-requests"
    mode: write
    reason: "Create leave requests with the next code"
  - path: "/settings/time-off.json"
    mode: read
    reason: "Default new requests to the default leave type"
