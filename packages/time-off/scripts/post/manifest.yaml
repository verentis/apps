api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: time-off-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Submitting, approving and refusing enforce the status transitions and update requests conditionally.
file-access:
  - path: "/leave-types"
    mode: read
    reason: "Check whether the request's leave type requires approval"
  - path: "/leave-requests"
    mode: write
    reason: "Mark requests submitted, approved or refused"
