{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "time-off-allocations",
    "name": "Allocations",
    "description": "Remaining allocation per employee and leave type.",
    "icon": "chart-pie"
  },
  "spec": {
    "access": [
      {
        "path": "/leave-types",
        "reason": "Compare approved leave days against each leave type's yearly allocation"
      },
      {
        "path": "/leave-requests",
        "reason": "Compare approved leave days against each leave type's yearly allocation"
      }
    ],
    "data": {
      "requests": {
        "kind": "folder",
        "path": "/leave-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.request+json"
      },
      "types": {
        "kind": "folder",
        "path": "/leave-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', typePath: e.data.type || '', type: ((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === e.data.type) || {}).data || {})).name || '', startDate: e.data.startDate || '', endDate: e.data.endDate || '', days: Math.round(Number(e.data.days || 0) * 10000), status: e.data.status || 'draft', approver: e.data.approver || '' }))"
      },
      "summary": {
        "kind": "computed",
        "expr": "(data.rows || []).filter(r => r.status === 'approved' && r.employee).map(r => r.employee + '|' + r.typePath).filter((v, i, a) => a.indexOf(v) === i).map(key => ({ employee: key.slice(0, key.indexOf('|')), typePath: key.slice(key.indexOf('|') + 1) })).map(p => ({ employee: p.employee, typePath: p.typePath, type: ((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === p.typePath) || {}).data || {})).name || p.typePath, allocated: Math.round(Number(((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === p.typePath) || {}).data || {})).daysPerYear || 0) * 10000), taken: (data.rows || []).filter(r => r.status === 'approved' && r.employee === p.employee && r.typePath === p.typePath).reduce((s, r) => s + r.days, 0) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Remaining allocations"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Approved leave days per employee and leave type against the type's yearly allocation.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Time Off",
                  "variant": "ghost",
                  "icon": "calendar-off",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/time-off/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /leave-types folder could not be read. Reinstall Time Off to recreate it."
            },
            "rules": {
              "visible": "data.$types.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /leave-requests folder could not be read. Reinstall Time Off to recreate it."
            },
            "rules": {
              "visible": "data.$requests.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Leave types",
                  "value": "{{ (data.types || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "tags",
                  "loading": "{{ data.$types.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved requests",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'approved').length }}",
                  "icon": "check",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Days approved",
                  "value": "{{ ((data.rows || []).filter(r => r.status === 'approved').reduce((s, r) => s + r.days, 0) / 10000).toFixed(2) }}",
                  "icon": "sigma",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Allocations"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.summary || []).sort((a, b) => (a.employee < b.employee ? -1 : a.employee > b.employee ? 1 : a.type < b.type ? -1 : a.type > b.type ? 1 : 0)).map(s => ({ employee: s.employee, type: s.type, allocated: (s.allocated / 10000).toFixed(2), taken: (s.taken / 10000).toFixed(2), remaining: ((s.allocated - s.taken) / 10000).toFixed(2) })) }}",
                  "columns": [
                    {
                      "key": "employee",
                      "label": "Employee"
                    },
                    {
                      "key": "type",
                      "label": "Leave type"
                    },
                    {
                      "key": "allocated",
                      "label": "Allocated",
                      "align": "end"
                    },
                    {
                      "key": "taken",
                      "label": "Taken",
                      "align": "end"
                    },
                    {
                      "key": "remaining",
                      "label": "Remaining",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No approved requests yet"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
