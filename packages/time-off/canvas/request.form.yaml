{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "time-off-request",
    "name": "Time Off leave request",
    "description": "View and edit a Time Off leave request.",
    "icon": "calendar-off"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.time-off.request+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/time-off/v1/request.schema.json",
          "source": "/applications/time-off/schemas/request.schema.json",
          "title": "Time Off leave request",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Ftime-off%2Fcanvas%2Frequest.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.time-off.request+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/time-off/v1/request.schema.json",
          "source": "/applications/time-off/schemas/request.schema.json",
          "title": "Time Off leave request",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [
      "user-profile"
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/leave-types",
        "mode": "read",
        "reason": "Choose the leave type a request draws on"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/leave-requests",
        "mode": "read",
        "reason": "Show who else is off on these dates and the days already taken"
      },
      {
        "path": "/applications/time-off/",
        "mode": "read",
        "reason": "Read the Time Off schemas and run the request action script"
      }
    ],
    "access": [
      {
        "path": "/leave-types",
        "reason": "Choose the leave type a request draws on"
      },
      {
        "path": "/employees",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/leave-requests",
        "reason": "Show who else is off on these dates and the days already taken"
      },
      {
        "path": "/applications/time-off/",
        "reason": "Read the Time Off schemas and run the request action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "types": {
        "kind": "folder",
        "path": "/leave-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.type+json"
      },
      "typeoptions": {
        "kind": "computed",
        "expr": "(data.types || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "signedinstaff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "me": {
        "kind": "computed",
        "expr": "((data.signedinstaff || []).filter(e => e.kind === 'file' && e.data && e.data.status !== 'terminated' && !!ctx.user && !!ctx.user.email && String(e.data.workEmail || '').toLowerCase() === String(ctx.user.email).toLowerCase()).map(e => ({ path: e.path, name: String(e.data.name || '') }))[0] || { path: '', name: ctx.user ? String(ctx.user.name || '') : '' })"
      },
      "employeelinks": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeelinkoptions": {
        "kind": "computed",
        "expr": "(data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status !== 'terminated').map(e => ({ value: e.path, label: (String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || '') || e.name) + (e.data.jobTitle ? ' · ' + e.data.jobTitle : '') }))"
      },
      "others": {
        "kind": "folder",
        "path": "/leave-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.request+json"
      },
      "clashes": {
        "kind": "computed",
        "expr": "(data.others || []).filter(e => e.kind === 'file' && e.data && e.path !== ctx.file.path && ['submitted', 'approved'].includes(e.data.status) && !!form.values.startDate && !!e.data.startDate && e.data.employeeName !== form.values.employeeName && e.data.startDate <= (form.values.endDate || form.values.startDate) && (e.data.endDate || e.data.startDate) >= form.values.startDate).map(e => ({ path: e.path, name: e.data.employeeName || e.name, from: e.data.startDate, to: e.data.endDate || e.data.startDate, status: e.data.status }))"
      },
      "allocated": {
        "kind": "computed",
        "expr": "Number(((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === form.values.type) || {}).data || {})).daysPerYear || 0)"
      },
      "taken": {
        "kind": "computed",
        "expr": "(data.others || []).filter(e => e.kind === 'file' && e.data && e.path !== ctx.file.path && e.data.status === 'approved' && e.data.employeeName === form.values.employeeName && e.data.type === form.values.type && String(e.data.startDate || '').slice(0, 4) === String(form.values.startDate || '').slice(0, 4)).reduce((sum, e) => sum + Number(e.data.days || 0), 0)"
      }
    },
    "state": {
      "approver": "",
      "refusalreason": ""
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.employeeName || 'New leave request' }}",
              "note": "Leave request {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"approved\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : [\"refused\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Submit",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "submit"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Approve",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "approve"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Refuse",
                  "variant": "outline",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "refuse"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "This is me",
                  "variant": "ghost",
                  "icon": "user-check",
                  "size": "sm"
                },
                "on": {
                  "click": "link-me-employeeref"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived') && (true) && !!data.me && !!data.me.path && form.values.employeeRef !== data.me.path",
                  "disabled": "form.saving"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This leave request is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "Refused: {{ form.values.refusalReason }}",
              "tone": "danger"
            },
            "rules": {
              "visible": "form.values.status === 'refused'"
            }
          },
          {
            "type": "canvas.alert",
            "rules": {
              "visible": "(data.clashes || []).length > 0 && form.values.status !== 'refused' && form.values.status !== 'cancelled'"
            },
            "props": {
              "tone": "warning",
              "title": "Others are off on these dates",
              "text": "{{ (data.clashes || []).map(c => c.name + ' (' + c.from + (c.to !== c.from ? ' to ' + c.to : '') + (c.status === 'submitted' ? ', waiting' : '') + ')').join(', ') }}"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.taken }} of {{ data.allocated }} days of this leave type taken this year; {{ data.allocated - data.taken }} left before this request.",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.type && !!form.values.employeeName && data.allocated > 0"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Approved by {{ form.values.approver }} on {{ form.values.approvedAt }}",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.approver"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Approver",
                  "placeholder": "Who approves this request?",
                  "value": "{{ state.approver }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              },
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Refusal reason",
                  "placeholder": "Why is it refused?",
                  "value": "{{ state.refusalreason }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Employee"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employeeName }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.employeeRef }}",
                          "description": "Optional. Choosing a record fills the name.",
                          "options": "{{ data.employeelinkoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        },
                        "on": {
                          "update": [
                            {
                              "patch-form": {
                                "values": {
                                  "employeeName": "{{ ((data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.path === event).map(e => String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || ''))[0] || form.values.employeeName || '') }}"
                                }
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Leave"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Leave type",
                          "value": "{{ form.values.type }}",
                          "required": true,
                          "options": "{{ data.typeoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Days",
                          "value": "{{ form.values.days }}",
                          "description": "The weekday count of the date range, computed at submission."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))) || (true)"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "First day",
                          "value": "{{ form.values.startDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Last day",
                          "value": "{{ form.values.endDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Reason",
                          "value": "{{ form.values.reason }}",
                          "rows": 3
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "link-me-employeeref": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "employeeRef": "{{ data.me.path }}",
                "employeeName": "{{ data.me.name }}"
              }
            }
          }
        ]
      },
      "submit": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Submit request",
              "message": "Submit this leave request? Its days are computed as the weekday count of the date range, and it can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/time-off/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "submit",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "approve": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Approve request",
              "message": "Approve this leave request? Approved requests count against the leave type's allocation."
            }
          },
          {
            "run-script": {
              "file": "/applications/time-off/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "approve",
                "path": "{{ ctx.file.path }}",
                "approver": "{{ state.approver }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "refuse": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Refuse request",
              "message": "Refuse this leave request? Give the reason in the Refusal reason field."
            }
          },
          {
            "run-script": {
              "file": "/applications/time-off/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "refuse",
                "path": "{{ ctx.file.path }}",
                "reason": "{{ state.refusalreason }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
