{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "time-off-home",
    "name": "Time Off",
    "description": "Time Off overview.",
    "icon": "calendar-off"
  },
  "spec": {
    "access": [
      {
        "path": "/leave-types",
        "reason": "Count leave requests and show the leave types and requests"
      },
      {
        "path": "/leave-requests",
        "reason": "Count leave requests and show the leave types and requests"
      }
    ],
    "data": {
      "requests": {
        "kind": "folder",
        "path": "/leave-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.request+json"
      },
      "types": {
        "kind": "folder",
        "path": "/leave-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', typePath: e.data.type || '', type: ((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === e.data.type) || {}).data || {})).name || '', startDate: e.data.startDate || '', endDate: e.data.endDate || '', days: Math.round(Number(e.data.days || 0) * 10000), status: e.data.status || 'draft', approver: e.data.approver || '' }))"
      },
      "listleaverequests": {
        "kind": "folder",
        "path": "/leave-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.request+json"
      },
      "listleavetypes": {
        "kind": "folder",
        "path": "/leave-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.type+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Time Off",
          "icon": "calendar-off",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "Requests",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "allocations.page.yaml",
              "label": "Balances",
              "icon": "scale"
            },
            {
              "id": "calendar.page.yaml",
              "label": "Team calendar",
              "icon": "calendar-days"
            },
            {
              "id": "mine.page.yaml",
              "label": "My requests",
              "icon": "user"
            },
            {
              "id": "to-approve.page.yaml",
              "label": "To approve",
              "icon": "circle-check"
            },
            {
              "id": "types.page.yaml",
              "label": "Leave types",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/time-off/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/time-off.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Time Off",
              "note": "Leave types and leave requests are files in your workspace. Draft requests in /leave-requests, then submit, approve or refuse them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Team calendar"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Who is off when, one row per person. Requests still waiting for a decision are coloured apart.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.calendar",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.startDate && !['refused', 'cancelled'].includes(r.status)).map(r => ({ path: r.path, title: [r.employee, r.type].filter(part => part).join(' · '), employee: r.employee || 'Unassigned', status: r.status, at: r.startDate, until: r.endDate || r.startDate })) }}",
                  "views": [
                    "resource",
                    "month",
                    "agenda"
                  ],
                  "showLegend": true,
                  "emptyText": "Nothing scheduled",
                  "start": "at",
                  "end": "until",
                  "title": "title",
                  "colorBy": "status",
                  "view": "resource",
                  "resourceKey": "employee"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting approval",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'approved').length }}",
                  "icon": "check",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Days approved",
                  "value": "{{ ((data.rows || []).filter(r => r.status === 'approved').reduce((s, r) => s + r.days, 0) / 10000).toFixed(2) }}",
                  "icon": "sigma",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "types",
              "compact": true,
              "description": "The /leave-types folder could not be read. Reinstall Time Off to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true,
              "description": "The /leave-requests folder could not be read. Reinstall Time Off to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "requests",
                  "label": "Leave requests",
                  "icon": "calendar-off"
                },
                {
                  "value": "types",
                  "label": "Leave types",
                  "icon": "tags"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /leave-requests",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/leave-requests"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listleaverequests",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listleaverequests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Request"
                        },
                        {
                          "key": "data.employeeName",
                          "label": "Employee"
                        },
                        {
                          "key": "data.startDate",
                          "label": "First day",
                          "format": "date"
                        },
                        {
                          "key": "data.endDate",
                          "label": "Last day",
                          "format": "date"
                        },
                        {
                          "key": "data.days",
                          "label": "Days"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No leave requests yet. Use New in /leave-requests."
                    },
                    "rules": {
                      "visible": "data.$listleaverequests.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "requests"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /leave-types",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/leave-types"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listleavetypes",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listleavetypes || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Type"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.daysPerYear",
                          "label": "Days per year"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No leave types yet. Use New in /leave-types."
                    },
                    "rules": {
                      "visible": "data.$listleavetypes.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "types"
              }
            ]
          }
        ]
      }
    ]
  }
}
