api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: products-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Adopts product files Sales or Inventory kept before Products into the shared format, conditionally (If-Match).
file-access:
  - path: "/products"
    mode: write
    reason: "Adopt earlier Sales and Inventory products into the shared format"
