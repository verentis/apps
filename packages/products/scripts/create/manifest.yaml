api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: products-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New products are written create-only into /products.
file-access:
  - path: "/products"
    mode: write
    reason: "Create products with the next code"
