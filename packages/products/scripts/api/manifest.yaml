api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: products-api
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The operations other apps and agents call through the platform (api.yaml); products are created create-only and updated conditionally.
file-access:
  - path: "/products"
    mode: write
    reason: "Create and update the products other apps ask for"
