{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "products-home",
    "name": "Products",
    "description": "The shared product catalogue.",
    "icon": "package"
  },
  "spec": {
    "access": [
      {
        "path": "/products",
        "reason": "List the products"
      },
      {
        "path": "/applications/products/",
        "reason": "Read the Products schemas and run its scripts"
      }
    ],
    "permissions": [
      "execution.run"
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true
      },
      "listproducts": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      }
    },
    "state": {
      "showarchived": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Products",
          "icon": "package",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/products/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Products",
              "note": "One catalogue for every app. Sales quotes these products, Inventory stocks them and Manufacturing builds them. Add a product with New in /products."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /products",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/products"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Products",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema === 'https://schemas.verentis.io/products/v1/product.schema.json' && e.data.state !== 'archived').length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Goods",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema === 'https://schemas.verentis.io/products/v1/product.schema.json' && e.data.state !== 'archived' && e.data.type !== 'service').length }}",
                  "icon": "box",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Services",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema === 'https://schemas.verentis.io/products/v1/product.schema.json' && e.data.state !== 'archived' && e.data.type === 'service').length }}",
                  "icon": "hand-helping",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "products",
              "compact": true,
              "description": "The /products folder could not be read. Reinstall Products to recreate it."
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema !== 'https://schemas.verentis.io/products/v1/product.schema.json').length }} product(s) from before Products",
              "text": "Sales or Inventory kept these in their own format. Adopt them so every app sees them; their codes and paths stay the same."
            },
            "rules": {
              "visible": "(data.products || []).some(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema !== 'https://schemas.verentis.io/products/v1/product.schema.json')"
            }
          },
          {
            "type": "canvas.button",
            "props": {
              "label": "Adopt earlier products",
              "variant": "outline",
              "icon": "replace",
              "size": "sm"
            },
            "on": {
              "click": [
                {
                  "confirm": {
                    "title": "Adopt earlier products",
                    "message": "Rewrite the earlier Sales and Inventory product files in the shared format? Codes, paths and references stay the same."
                  }
                },
                {
                  "run-script": {
                    "file": "/applications/products/scripts/post",
                    "timeout": 300,
                    "parameters": {
                      "operation": "adopt-products"
                    },
                    "assign": "adopted"
                  }
                },
                {
                  "refresh-source": {
                    "source": "products"
                  }
                },
                {
                  "toast": {
                    "message": "{{ (state.adopted && state.adopted.message) || 'Done' }}",
                    "variant": "success"
                  }
                }
              ]
            },
            "rules": {
              "visible": "(data.products || []).some(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema !== 'https://schemas.verentis.io/products/v1/product.schema.json')"
            }
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show archived products",
              "value": "{{ state.showarchived }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product' && e.data.$schema === 'https://schemas.verentis.io/products/v1/product.schema.json' && (state.showarchived || e.data.state !== 'archived')).map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', type: e.data.type || 'goods', sku: e.data.sku || '', unit: e.data.unit || '', category: e.data.category || '', listPrice: e.data.listPrice || '', reorderPoint: e.data.reorderPoint || '' })).sort((a, b) => a.code < b.code ? -1 : 1) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Code"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "type",
                  "label": "Type"
                },
                {
                  "key": "sku",
                  "label": "SKU"
                },
                {
                  "key": "unit",
                  "label": "Unit"
                },
                {
                  "key": "category",
                  "label": "Category"
                },
                {
                  "key": "listPrice",
                  "label": "List price",
                  "align": "end"
                },
                {
                  "key": "reorderPoint",
                  "label": "Reorder point",
                  "align": "end"
                }
              ],
              "emptyText": "No products yet. Use New in /products.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "listproducts",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.listproducts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "columns": [
                {
                  "key": "data.code",
                  "label": "Code"
                },
                {
                  "key": "data.name",
                  "label": "Name"
                },
                {
                  "key": "data.sku",
                  "label": "SKU"
                },
                {
                  "key": "data.category",
                  "label": "Category"
                }
              ],
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true,
              "rowKey": "path",
              "emptyText": "No products yet. Use New in /products."
            },
            "rules": {
              "visible": "data.$listproducts.status === 'ready'"
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
