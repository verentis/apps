{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "products-product",
    "name": "Product",
    "description": "View and edit a product of the shared catalogue.",
    "icon": "package"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.products.product+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/products/v1/product.schema.json",
          "source": "/applications/products/schemas/product.schema.json",
          "title": "Product",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fproducts%2Fcanvas%2Fproduct.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.products.product+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/products/v1/product.schema.json",
          "source": "/applications/products/schemas/product.schema.json",
          "title": "Product",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/stock-moves",
        "mode": "read",
        "reason": "Show the stock moves of this product (when Inventory is installed)"
      },
      {
        "path": "/applications/products/",
        "mode": "read",
        "reason": "Read the Products schemas and run its scripts"
      }
    ],
    "access": [
      {
        "path": "/stock-moves",
        "reason": "Show the stock moves of this product (when Inventory is installed)"
      },
      {
        "path": "/applications/products/",
        "reason": "Read the Products schemas and run its scripts"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "moves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New product' }}",
              "note": "Product {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ form.values.type === 'service' ? 'Service' : 'Goods' }}",
                      "tone": "neutral"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(false)",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (false)"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This product is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "overview",
                  "label": "Overview",
                  "icon": "package"
                },
                {
                  "value": "stock",
                  "label": "Stock",
                  "icon": "boxes"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Product"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Name",
                                  "value": "{{ form.values.name }}",
                                  "required": true
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Type",
                                  "value": "{{ form.values.type }}",
                                  "required": true,
                                  "description": "Goods are stocked; services are only sold.",
                                  "options": [
                                    {
                                      "label": "Goods",
                                      "value": "goods"
                                    },
                                    {
                                      "label": "Service",
                                      "value": "service"
                                    }
                                  ],
                                  "display": "segmented"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "SKU",
                                  "value": "{{ form.values.sku }}",
                                  "placeholder": "DESK-001"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Unit",
                                  "value": "{{ form.values.unit }}",
                                  "placeholder": "ea"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Category",
                                  "value": "{{ form.values.category }}",
                                  "placeholder": "Furniture"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              },
                              {
                                "type": "canvas.form.textarea",
                                "props": {
                                  "label": "Description",
                                  "value": "{{ form.values.description }}",
                                  "rows": 4
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Selling",
                          "description": "What Sales quotes by default."
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "List price",
                                  "value": "{{ form.values.listPrice }}",
                                  "placeholder": "0.00"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Stock",
                          "description": "Inventory flags the product when on hand falls to this quantity."
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Reorder point",
                                  "value": "{{ form.values.reorderPoint }}",
                                  "placeholder": "0"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived')",
                                  "visible": "form.values.type !== 'service'"
                                }
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ],
                "slot": "overview"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Install Inventory to track stock of this product.",
                      "tone": "muted"
                    },
                    "rules": {
                      "visible": "data.$moves.status === 'error'"
                    }
                  },
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 3
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "On hand (done moves)",
                          "value": "{{ ((data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.status === 'done' && m.data.product === ctx.file.path).reduce((s, m) => s + (m.data.toWarehouse ? Math.round(Number(m.data.quantity || 0) * 10000) : 0) - (m.data.fromWarehouse ? Math.round(Number(m.data.quantity || 0) * 10000) : 0), 0) / 10000) }}",
                          "icon": "package",
                          "loading": "{{ data.$moves.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Reorder point",
                          "value": "{{ form.values.reorderPoint || '—' }}",
                          "icon": "triangle-alert"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.product === ctx.file.path).map(m => ({ path: m.path, date: m.data.date || '', move: m.data.code || m.name, reference: m.data.reference || '', quantity: m.data.quantity || '', status: m.data.status || '' })).sort((a, b) => a.date < b.date ? 1 : -1) }}",
                      "columns": [
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "move",
                          "label": "Move"
                        },
                        {
                          "key": "reference",
                          "label": "Reference"
                        },
                        {
                          "key": "quantity",
                          "label": "Quantity",
                          "align": "end"
                        },
                        {
                          "key": "status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No stock moves use this product yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "stock"
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
