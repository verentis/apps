api-version: verentis.io/v1
kind: Theme

metadata:
  id: verentis-amethyst-theme
  name: Verentis Amethyst
  description: Rich violet palette with a deep plum sidebar and matching dashboard
    stripes. Light and dark mode; it keeps your existing logos, favicon and
    backgrounds.
  icon: ./marketplace/logo.svg
  version: 1.0.6
  author: Verentis
  tags: [ theme, verentis, purple ]

marketplace:
  logo: ./marketplace/logo.svg
  hero:
    source: ./marketplace/hero.svg
    alt: "Layered violet bands from deep plum to pale lilac."
  readme: ./README.md

# Installs colours and dashboard heroes (record at themes/verentis-amethyst-theme). Assets not listed here keep the
# workspace's current files.
spec:
  assets:
    theme.css: theme/theme.css
    hero: theme/hero.svg
    hero.dark: theme/hero-dark.svg

packaging:
  publisher: verentis
  files:
    - "theme/*"
  encryption: none
