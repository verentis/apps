api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: invoicing-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Invoicing containers.
file-access:
  - path: "/invoices"
    mode: write
    reason: "Create invoices with the next number"
  - path: "/credit-notes"
    mode: write
    reason: "Create credit notes with the next number"
  - path: "/payments"
    mode: write
    reason: "Create payments with the next number"
  - path: "/settings/invoicing.json"
    mode: read
    reason: "Default new invoices' due date and notes, and payments' bank account"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Default new records to the ledger's base currency"
