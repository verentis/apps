api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: invoicing-api
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The operations other apps call through the platform (api.yaml); drafts are written create-only.
file-access:
  - path: "/invoices"
    mode: write
    reason: "Draft invoices other apps ask for, with the next number"
