api-version: canvas.verentis.io/v1
kind: Form
metadata:
  id: invoicing-invoice
  name: Invoicing invoice
  description: View and edit an Invoicing invoice.
  icon: file-text
spec:
  binds:
  - pattern: application/vnd.verentis.invoicing.invoice+json
    mode: edit
    priority: 200
    scope: global
    json-schema:
      id: https://schemas.verentis.io/invoicing/v1/invoice.schema.json
      source: /applications/invoicing/schemas/invoice.schema.json
      title: Invoicing invoice
      version: '1'
  entry: ${var:canvas-origin}/render?document=%2Fapplications%2Finvoicing%2Fcanvas%2Finvoice.form.yaml
  scope: global
  mime-types:
  - pattern: application/vnd.verentis.invoicing.invoice+json
    mode: edit
    priority: 200
    json-schema:
      id: https://schemas.verentis.io/invoicing/v1/invoice.schema.json
      source: /applications/invoicing/schemas/invoice.schema.json
      title: Invoicing invoice
      version: '1'
  permissions:
  - file.read
  - file.write
  - execution.run
  - execution.read
  capabilities: []
  sandbox:
    allow-scripts: true
    allow-same-origin: true
    allow-popups: false
    allow-forms: true
  file-access:
  - path: /customers
    mode: read
    reason: Offer CRM customers to bill (when CRM is installed)
  - path: /credit-notes
    mode: read
    reason: Show the credit notes against this invoice
  - path: /payments
    mode: read
    reason: Show the payments allocated to this invoice
  - path: /settings/invoicing.json
    mode: read
    reason: Estimate tax with the default rate
  - path: /applications/invoicing/
    mode: read
    reason: Read the Invoicing schemas and run the posting script
  access:
  - path: /customers
    reason: Offer CRM customers to bill (when CRM is installed)
  - path: /credit-notes
    reason: Show the credit notes against this invoice
  - path: /payments
    reason: Show the payments allocated to this invoice
  - path: /settings/invoicing.json
    reason: Estimate tax with the default rate
  - path: /applications/invoicing/
    reason: Read the Invoicing schemas and run the posting script
  data:
    record:
      kind: document
      consistency: conditional
    companies:
      kind: folder
      path: /customers
      contents: true
      mime-pattern: application/vnd.verentis.crm.company+json
    contacts:
      kind: folder
      path: /customers
      contents: true
      mime-pattern: application/vnd.verentis.crm.contact+json
    customeroptions:
      kind: computed
      expr: '(data.companies || []).filter(e => e.kind === ''file'' && e.data && e.data.state !== ''archived''
        && (true)).map(e => ({ label: (e.data.code || e.name) + '' · '' + (e.data.name || ''''), value:
        e.path })).concat((data.contacts || []).filter(e => e.kind === ''file'' && e.data && e.data.state
        !== ''archived'' && (true)).map(e => ({ label: (e.data.code || e.name) + '' · '' + ([e.data.givenName,
        e.data.familyName].filter(Boolean).join('' '')), value: e.path })))'
    settings:
      kind: file
      path: /settings/invoicing.json
      parse: json
    credits:
      kind: folder
      path: /credit-notes
      contents: true
      mime-pattern: application/vnd.verentis.invoicing.credit+json
    payments:
      kind: folder
      path: /payments
      contents: true
      mime-pattern: application/vnd.verentis.invoicing.payment+json
  tree:
  - type: canvas.stack
    layout:
      base:
        padding: 6
        gap: 4
        maxWidth: 72rem
        margin:
          x: auto
    children:
    - type: canvas.stack
      layout:
        base:
          direction: row
          wrap: true
          gap: 2
          align: center
          justify: between
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 1
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.heading
            props:
              level: 2
              text: '{{ form.values.customer.name || ''New invoice'' }}'
          - type: canvas.dashboard.badge
            props:
              text: '{{ String(form.values.status || '''').split(''-'').join('' '') }}'
              tone: '{{ ["issued","posted"].includes(form.values.status) ? ''success'' : ["draft"].includes(form.values.status)
                ? ''warning'' : ["reversed"].includes(form.values.status) ? ''danger'' : ''neutral'' }}'
            rules:
              visible: '!!form.values.status'
          - type: canvas.dashboard.badge
            props:
              text: Archived
              tone: warning
              icon: archive
            rules:
              visible: form.values.state === 'archived'
        - type: canvas.text
          props:
            text: Invoice {{ form.values.code || '' }} · {{ ctx.file.path }}
            tone: muted
      - type: canvas.stack
        layout:
          base:
            direction: row
            wrap: true
            gap: 2
            align: center
        children:
        - type: canvas.button
          props:
            label: Copy details
            variant: outline
            icon: copy
            size: sm
          'on':
            click: copy-customer
          rules:
            visible: (!form.values.status || form.values.status === 'draft') && !!form.values.customerRef
            disabled: form.saving || form.values.state === 'archived'
        - type: canvas.button
          props:
            label: Issue
            icon: send
            size: sm
          'on':
            click: issue
          rules:
            visible: (!form.values.status || form.values.status === 'draft') && !(form.values.state ===
              'archived')
            disabled: form.saving || form.dirty || form.invalid
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Archive
              variant: ghost
              icon: archive
              size: sm
            'on':
              click: archive
            rules:
              visible: '!(form.values.state === ''archived'') && !(!(!form.values.status || form.values.status
                === ''draft''))'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Restore
              variant: outline
              icon: archive-restore
              size: sm
            'on':
              click: restore
            rules:
              visible: form.values.state === 'archived'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Reset
              variant: ghost
              size: sm
            'on':
              click: reset
            rules:
              disabled: form.saving || !form.dirty
          - type: canvas.button
            props:
              label: Save
              icon: save
              size: sm
            'on':
              click: save
            rules:
              disabled: form.saving || !form.dirty || form.invalid || form.values.state === 'archived'
                || (!(!form.values.status || form.values.status === 'draft'))
    - type: canvas.text
      props:
        text: '{{ data.$record.error }}'
      rules:
        visible: data.$record.status === 'error'
    - type: canvas.text
      props:
        text: Loading…
        tone: muted
      rules:
        visible: data.$record.status === 'loading'
    - type: canvas.dashboard.badge
      props:
        text: This invoice is archived. Restore it to edit.
        tone: warning
        icon: archive
      rules:
        visible: form.values.state === 'archived'
    - type: canvas.tabs
      props:
        items:
        - value: overview
          label: Overview
          icon: file-text
        - value: settlement
          label: Credits and payments
          icon: banknote
        - value: documents
          label: Documents
          icon: paperclip
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Document
              variant: ghost
              icon: file-text
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.document && form.values.document.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.document && form.values.document.path)'
          - type: canvas.button
            props:
              label: Journal
              variant: ghost
              icon: notebook-pen
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.journal && form.values.journal.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.journal && form.values.journal.path)'
          - type: canvas.button
            props:
              label: CRM customer
              variant: ghost
              icon: building-2
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.customerRef }}'
                  mode: edit
            rules:
              visible: '!!(form.values.customerRef)'
        - type: canvas.grid
          layout:
            base:
              columns: 2
              gap: 4
            desktop:
              columns: 3
          children:
          - type: canvas.dashboard.stat
            props:
              label: Net
              value: '{{ form.values.totals ? form.values.totals.net : ((form.values.lines || []).reduce((s,
                l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)),
                0) / 100).toFixed(2) }}'
              icon: sigma
          - type: canvas.dashboard.stat
            props:
              label: Tax
              value: '{{ form.values.totals ? form.values.totals.tax : ((form.values.lines || []).reduce((s,
                l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice
                || 0) * 100)) * Number(l.taxRate === '''' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate)
                || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }}'
              icon: percent
          - type: canvas.dashboard.stat
            props:
              label: Total {{ form.values.currency }}
              value: '{{ form.values.totals ? form.values.totals.gross : (((form.values.lines || []).reduce((s,
                l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)),
                0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity
                || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '''' || l.taxRate
                == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100),
                0)) / 100).toFixed(2) }}'
              icon: receipt
        - type: canvas.text
          props:
            text: Estimated while drafting; issuing computes the exact totals.
            tone: muted
          rules:
            visible: '!form.values.totals'
        - type: canvas.grid
          layout:
            base:
              columns: 2
              gap: 4
            desktop:
              columns: 3
          children:
          - type: canvas.dashboard.stat
            props:
              label: Credited
              value: '{{ ((data.credits || []).filter(c => c.kind === ''file'' && c.data && c.data.status
                === ''issued'' && c.data.invoice === ctx.file.path).reduce((s, c) => s + Math.round(Number(c.data.totals.gross
                || 0) * 10000), 0) / 10000).toFixed(2) }}'
              icon: file-minus
          - type: canvas.dashboard.stat
            props:
              label: Paid
              value: '{{ ((data.payments || []).filter(p => p.kind === ''file'' && p.data && p.data.status
                === ''posted'').reduce((s, p) => s + (p.data.allocations || []).filter(a => a.invoice
                === ctx.file.path).reduce((t, a) => t + Math.round(Number(a.amount || 0) * 10000), 0),
                0) / 10000).toFixed(2) }}'
              icon: banknote
          - type: canvas.dashboard.stat
            props:
              label: Outstanding
              value: '{{ form.values.totals ? (Math.round(Number(form.values.totals.gross || 0) * 10000)
                - (data.credits || []).filter(c => c.kind === ''file'' && c.data && c.data.status ===
                ''issued'' && c.data.invoice === ctx.file.path).reduce((s, c) => s + Math.round(Number(c.data.totals.gross
                || 0) * 10000), 0) - (data.payments || []).filter(p => p.kind === ''file'' && p.data &&
                p.data.status === ''posted'').reduce((s, p) => s + (p.data.allocations || []).filter(a
                => a.invoice === ctx.file.path).reduce((t, a) => t + Math.round(Number(a.amount || 0)
                * 10000), 0), 0) / 10000).toFixed(2) : '''' }}'
              icon: hourglass
          rules:
            visible: form.values.status === 'issued'
        - type: canvas.grid
          layout:
            base:
              columns: 1
              gap: 4
            tablet:
              columns: 2
          children:
          - type: canvas.card
            props:
              title: Customer
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.select
                props:
                  label: CRM customer
                  value: '{{ form.values.customerRef }}'
                  description: Optional. Choose a CRM customer, then Copy details.
                  options: '{{ data.customeroptions }}'
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Name
                  value: '{{ form.values.customer.name }}'
                  required: true
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Legal name
                  value: '{{ form.values.customer.legalName }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Email
                  value: '{{ form.values.customer.email }}'
                  inputType: email
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Phone
                  value: '{{ form.values.customer.phone }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Tax number
                  value: '{{ form.values.customer.taxIdentifier }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.text-list
                props:
                  label: Street
                  value: '{{ form.values.customer.address.lines }}'
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: City
                  value: '{{ form.values.customer.address.city }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Region
                  value: '{{ form.values.customer.address.region }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Postal code
                  value: '{{ form.values.customer.address.postalCode }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Country code
                  value: '{{ form.values.customer.address.country }}'
                  placeholder: ZA
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
          - type: canvas.card
            props:
              title: Invoice
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.date
                props:
                  label: Issue date
                  value: '{{ form.values.issueDate }}'
                  required: true
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.date
                props:
                  label: Due date
                  value: '{{ form.values.dueDate }}'
                  required: true
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Currency
                  value: '{{ form.values.currency }}'
                  required: true
                  placeholder: ZAR
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Customer reference
                  value: '{{ form.values.reference }}'
                  placeholder: PO number
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.textarea
                props:
                  label: Notes
                  value: '{{ form.values.notes }}'
                  rows: 4
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
          - type: canvas.card
            props:
              title: Lines
              description: Exact decimals. Each line is rounded to the cent; an empty tax rate takes the
                default from Invoicing settings.
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.array
                props:
                  label: Lines
                  value: '{{ form.values.lines }}'
                  fields:
                  - key: description
                    label: Description
                    required: true
                  - key: quantity
                    label: Quantity
                    required: true
                  - key: unitPrice
                    label: Unit price
                    required: true
                  - key: taxRate
                    label: Tax %
                  defaultRow:
                    description: ''
                    quantity: '1'
                    unitPrice: ''
                    taxRate: ''
                  rowIds: false
                  minimum: 1
                  maximum: 500
                  addLabel: Add line
                  removeLabel: Remove row
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
        slot: overview
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.card
          props:
            title: Credit notes
          children:
          - type: canvas.table
            props:
              rows: '{{ (data.credits || []).filter(c => c.kind === ''file'' && c.data && c.data.invoice
                === ctx.file.path).map(c => ({ path: c.path, code: c.data.code || c.name, date: c.data.date,
                reason: c.data.reason, status: c.data.status, gross: (c.data.totals && c.data.totals.gross)
                || '''' })) }}'
              columns:
              - key: code
                label: Number
              - key: date
                label: Date
              - key: reason
                label: Reason
              - key: status
                label: Status
              - key: gross
                label: Total
                align: end
              emptyText: No credit notes against this invoice
              clickable: true
            'on':
              row-click:
              - open-file:
                  path: '{{ event.path }}'
                  mode: edit
        - type: canvas.card
          props:
            title: Payments
          children:
          - type: canvas.table
            props:
              rows: '{{ (data.payments || []).filter(p => p.kind === ''file'' && p.data && (p.data.allocations
                || []).some(a => a.invoice === ctx.file.path)).map(p => ({ path: p.path, code: p.data.code
                || p.name, date: p.data.date, status: p.data.status, amount: p.data.allocations.filter(a
                => a.invoice === ctx.file.path).map(a => a.amount).join('' + '') })) }}'
              columns:
              - key: code
                label: Payment
              - key: date
                label: Date
              - key: status
                label: Status
              - key: amount
                label: Allocated
                align: end
              emptyText: No payments allocated to this invoice
              clickable: true
            'on':
              row-click:
              - open-file:
                  path: '{{ event.path }}'
                  mode: edit
        slot: settlement
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.text
          props:
            text: The issued invoice copy and any supporting documents. Files live in {{ ctx.file.path
              }}/documents.
            tone: muted
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Open in Files
              variant: outline
              icon: folder-open
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ ctx.file.path }}/documents'
        - type: canvas.files
          props:
            path: ./documents/
            columns:
            - name
            - type
            - size
            - modified
            emptyText: No documents yet
        slot: documents
  actions:
    save:
      steps:
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
    reset:
      steps:
      - reset-form: {}
    archive:
      steps:
      - confirm:
          title: Archive
          message: Archive this record? It stays in the workspace and can be restored.
      - patch-form:
          values:
            state: archived
            archivedAt: '{{ Date() }}'
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Archived
          variant: success
    restore:
      steps:
      - patch-form:
          values:
            state: active
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Restored
          variant: success
    copy-customer:
      steps:
      - patch-form:
          values:
            customer: '{{ (data.companies || []).concat(data.contacts || []).filter(e => e.kind === ''file''
              && e.data && e.path === form.values.customerRef).map(e => ({ name: e.data.name || [e.data.givenName,
              e.data.familyName].filter(Boolean).join('' ''), legalName: (e.data.legalName || ''''), email:
              (e.data.email || ''''), phone: (e.data.phone || ''''), taxIdentifier: (e.data.taxIdentifier
              || ''''), address: { lines: (e.data.address || {}).lines || [], city: ((e.data.address ||
              {}).city || ''''), region: ((e.data.address || {}).region || ''''), postalCode: ((e.data.address
              || {}).postalCode || ''''), country: ((e.data.address || {}).country || '''') } }))[0] ||
              form.values.customer }}'
    issue:
      permissions:
      - execution.run
      - execution.read
      steps:
      - confirm:
          title: Issue invoice
          message: Issue this invoice and post it to the ledger? Issued invoices cannot be edited; correct
            them with a credit note.
      - run-script:
          file: /applications/invoicing/scripts/post
          timeout: 120
          parameters:
            operation: issue-invoice
            path: '{{ ctx.file.path }}'
          assign: lastresult
      - refresh-source:
          source: record
      - toast:
          message: '{{ (state.lastresult && state.lastresult.message) || ''Done'' }}'
          variant: success
