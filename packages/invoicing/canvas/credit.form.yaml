          },
          {
            "call-app": {
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && ((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available) && !!state.lastresult && !!state.lastresult.journalRequest)",
              "app": "accounting",
              "operation": "post-journal",
              "input": {
                "$expr": "state.lastresult.journalRequest"
              },
              "idempotency-key": "{{ ('journal-' + form.values.code) + '-' + Date.now() }}",
              "assign": "appcall"
