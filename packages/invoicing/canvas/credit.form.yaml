            }
          },
          {
            "confirm": {
              "title": "Issue credit note",
              "message": "Issue this credit note against its invoice and post it to the ledger? Issued credit notes cannot be edited.",
              "details": "{{ [{ label: 'Credit ' + ((((data.accounts || []).find(a => a.path === (data.settings && data.settings.receivableAccount)) || {}).data || {}).name || 'the receivable account (choose it in settings)'), value: (((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0)) / 100).toFixed(2) }, { label: 'Debit ' + ((((data.accounts || []).find(a => a.path === (data.settings && data.settings.incomeAccount)) || {}).data || {}).name || 'the income account (choose it in settings)'), value: ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }].concat((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0) ? [{ label: 'Debit ' + ((((data.accounts || []).find(a => a.path === (data.settings && data.settings.taxAccount)) || {}).data || {}).name || 'the tax account (choose it in settings)'), value: ((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }] : []) }}",
              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
            }
          },
          {
            "run-script": {
              "file": "/applications/invoicing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "issue-credit",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult",
              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
