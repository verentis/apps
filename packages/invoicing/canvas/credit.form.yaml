              "if": "(data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)"
            }
          },
          {
            "toast": {
              "message": "{{ (state.recorded && state.recorded.message) || (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success",
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && (!(!!state.lastresult && !!state.lastresult.journalRequest) || !!state.recorded)"
            }
          },
          {
            "toast": {
              "if": "((data.appops || []).some(o => o.app === 'accounting' && o.operation === 'post-journal' && o.available)) && !!state.lastresult && !!state.lastresult.journalRequest && !state.recorded",
              "variant": "error",
              "message": "Accounting did not confirm this. Nothing was marked as done; try again."
            }
          },
          {
            "render-pdf": {
              "template": {
                "title": "{{ 'Credit note ' + (form.values.code || '') }}",
                "subtitle": "{{ form.values.reference }}",
                "parties": {
                  "$expr": "[{ label: 'Bill to', lines: ([form.values.customer && form.values.customer.name, form.values.customer && form.values.customer.legalName !== form.values.customer.name ? form.values.customer.legalName : ''].concat((form.values.customer && form.values.customer.address && form.values.customer.address.lines) || []).concat([form.values.customer && form.values.customer.address ? [form.values.customer.address.city, form.values.customer.address.postalCode].filter(part => part).join(' ') : '', form.values.customer && form.values.customer.address && form.values.customer.address.country, form.values.customer && form.values.customer.taxIdentifier ? 'Tax number ' + form.values.customer.taxIdentifier : '']).filter(line => line)).filter(line => line) }]"
                },
                "meta": {
                  "$expr": "[{ label: 'Issued', value: format(form.values.issueDate || form.values.date, 'date') }, { label: 'Currency', value: form.values.currency }]"
                },
                "lines": {
                  "$expr": "(form.values.lines || []).map(l => ({ item: l.description || '', quantity: l.quantity, price: Number(l.unitPrice || 0).toFixed(2), tax: (Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate)) + '%', amount: (Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) / 100).toFixed(2) }))"
                },
                "columns": [
                  {
                    "key": "item",
                    "label": "Item"
                  },
                  {
                    "key": "quantity",
                    "label": "Qty",
                    "align": "right"
                  },
                  {
                    "key": "price",
                    "label": "Price",
                    "align": "right"
                  },
                  {
                    "key": "tax",
                    "label": "Tax",
                    "align": "right"
                  },
                  {
                    "key": "amount",
                    "label": "Amount",
                    "align": "right"
                  }
                ],
                "totals": {
                  "$expr": "[{ label: 'Net', value: form.values.totals ? form.values.totals.net : ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }, { label: 'Tax', value: form.values.totals ? form.values.totals.tax : ((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }, { label: 'Total ' + (form.values.currency || ''), value: form.values.totals ? form.values.totals.gross : (((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0)) / 100).toFixed(2), strong: true }]"
                },
