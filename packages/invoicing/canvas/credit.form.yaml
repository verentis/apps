{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "invoicing-credit",
    "name": "Invoicing credit note",
    "description": "View and edit an Invoicing credit note.",
    "icon": "file-minus"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.invoicing.credit+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/invoicing/v1/credit.schema.json",
          "source": "/applications/invoicing/schemas/credit.schema.json",
          "title": "Invoicing credit note",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Finvoicing%2Fcanvas%2Fcredit.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.invoicing.credit+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/invoicing/v1/credit.schema.json",
          "source": "/applications/invoicing/schemas/credit.schema.json",
          "title": "Invoicing credit note",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/invoices",
        "mode": "read",
        "reason": "Choose the issued invoice to credit"
      },
      {
        "path": "/settings/invoicing.json",
        "mode": "read",
        "reason": "Estimate tax with the default rate"
      },
      {
        "path": "/chart-of-accounts",
        "mode": "read",
        "reason": "Name the accounts the credit note posts to"
      },
      {
        "path": "/applications/invoicing/",
        "mode": "read",
        "reason": "Read the Invoicing schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/invoices",
        "reason": "Choose the issued invoice to credit"
      },
      {
        "path": "/settings/invoicing.json",
        "reason": "Estimate tax with the default rate"
      },
      {
        "path": "/chart-of-accounts",
        "reason": "Name the accounts the credit note posts to"
      },
      {
        "path": "/applications/invoicing/",
        "reason": "Read the Invoicing schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "invoices": {
        "kind": "folder",
        "path": "/invoices",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.invoicing.invoice+json"
      },
      "invoiceoptions": {
        "kind": "computed",
        "expr": "(data.invoices || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'issued')).map(e => ({ label: (e.data.code || e.name) + ' · ' + (((e.data.customer && e.data.customer.name) || '') + ' · ' + e.data.currency + ' ' + ((e.data.totals && e.data.totals.gross) || '')), value: e.path }))"
      },
      "accounts": {
        "kind": "folder",
        "path": "/chart-of-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.account+json"
      },
      "accountoptions": {
        "kind": "computed",
        "expr": "(data.accounts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ((e.data.number ? e.data.number + ' ' : '') + (e.data.name || '')), value: e.path }))"
      },
      "appops": {
        "kind": "app-operations"
      },
      "settings": {
        "kind": "file",
        "path": "/settings/invoicing.json",
        "parse": "json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.reason || 'New credit note' }}",
              "note": "Credit note {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"issued\",\"posted\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : [\"reversed\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Save PDF",
                  "variant": "outline",
                  "icon": "file-down",
                  "size": "sm"
                },
                "on": {
                  "click": "savepdf"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Issue",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "issue"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This credit note is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "overview",
                  "label": "Overview",
                  "icon": "file-minus"
                },
                {
                  "value": "documents",
                  "label": "Documents",
                  "icon": "paperclip"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Invoice",
                          "variant": "ghost",
                          "icon": "file-text",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ form.values.invoice }}",
                                "mode": "edit"
                              }
                            }
                          ]
                        },
                        "rules": {
                          "visible": "!!(form.values.invoice)"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Document",
                          "variant": "ghost",
                          "icon": "file-minus",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ form.values.document && form.values.document.path }}",
                                "mode": "edit"
                              }
                            }
                          ]
                        },
                        "rules": {
                          "visible": "!!(form.values.document && form.values.document.path)"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Journal",
                          "variant": "ghost",
                          "icon": "notebook-pen",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ form.values.journal && form.values.journal.path }}",
                                "mode": "edit"
                              }
                            }
                          ]
                        },
                        "rules": {
                          "visible": "!!(form.values.journal && form.values.journal.path)"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 3
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Net",
                          "value": "{{ form.values.totals ? form.values.totals.net : ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }}",
                          "icon": "sigma"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Tax",
                          "value": "{{ form.values.totals ? form.values.totals.tax : ((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }}",
                          "icon": "percent"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Total {{ form.values.currency }}",
                          "value": "{{ form.values.totals ? form.values.totals.gross : (((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0)) / 100).toFixed(2) }}",
                          "icon": "receipt"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Estimated while drafting; issuing computes the exact totals.",
                      "tone": "muted"
                    },
                    "rules": {
                      "visible": "!form.values.totals"
                    }
                  },
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Credit note"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Invoice",
                                  "value": "{{ form.values.invoice }}",
                                  "required": true,
                                  "options": "{{ data.invoiceoptions }}",
                                  "searchable": true
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                                }
                              },
                              {
                                "type": "canvas.form.date",
                                "props": {
                                  "label": "Date",
                                  "value": "{{ form.values.date }}",
                                  "required": true
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Currency",
                                  "value": "{{ form.values.currency }}",
                                  "required": true,
                                  "placeholder": "ZAR"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Reason",
                                  "value": "{{ form.values.reason }}",
                                  "required": true
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Lines",
                          "description": "Exact decimals. Each line is rounded to the cent; an empty tax rate takes the default from Invoicing settings."
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.line-items",
                                "props": {
                                  "label": "Lines",
                                  "value": "{{ form.values.lines }}",
                                  "columns": [
                                    {
                                      "key": "description",
                                      "label": "Description",
                                      "type": "text"
                                    },
                                    {
                                      "key": "quantity",
                                      "label": "Quantity",
                                      "type": "text",
                                      "align": "right",
                                      "sum": true
                                    },
                                    {
                                      "key": "unitPrice",
                                      "label": "Unit price",
                                      "type": "text",
                                      "align": "right"
                                    },
                                    {
                                      "key": "taxRate",
                                      "label": "Tax %",
                                      "type": "text",
                                      "align": "right"
                                    },
                                    {
                                      "key": "lineTotal",
                                      "label": "Line total",
                                      "type": "computed",
                                      "expr": "Number(row.quantity || 0) * Number(row.unitPrice || 0)",
                                      "decimals": 2,
                                      "sum": true,
                                      "align": "right"
                                    }
                                  ],
                                  "defaultRow": {
                                    "description": "",
                                    "quantity": "1",
                                    "unitPrice": "",
                                    "taxRate": ""
                                  },
                                  "storeComputed": false,
                                  "minimum": 1,
                                  "maximum": 500,
                                  "addLabel": "Add line"
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                                }
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Preview",
                      "description": "How this looks printed or saved as PDF.",
                      "collapsible": true,
                      "defaultOpen": false
                    },
                    "children": [
                      {
                        "type": "canvas.document",
                        "props": {
                          "title": "{{ 'Credit note ' + (form.values.code || '') }}",
                          "subtitle": "{{ form.values.reference }}",
                          "parties": {
                            "$expr": "[{ label: 'Bill to', lines: ([form.values.customer && form.values.customer.name, form.values.customer && form.values.customer.legalName !== form.values.customer.name ? form.values.customer.legalName : ''].concat((form.values.customer && form.values.customer.address && form.values.customer.address.lines) || []).concat([form.values.customer && form.values.customer.address ? [form.values.customer.address.city, form.values.customer.address.postalCode].filter(part => part).join(' ') : '', form.values.customer && form.values.customer.address && form.values.customer.address.country, form.values.customer && form.values.customer.taxIdentifier ? 'Tax number ' + form.values.customer.taxIdentifier : '']).filter(line => line)).filter(line => line) }]"
                          },
                          "meta": {
                            "$expr": "[{ label: 'Issued', value: format(form.values.issueDate || form.values.date, 'date') }, { label: 'Currency', value: form.values.currency }]"
                          },
                          "lines": {
                            "$expr": "(form.values.lines || []).map(l => ({ item: l.description || '', quantity: l.quantity, price: Number(l.unitPrice || 0).toFixed(2), tax: (Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate)) + '%', amount: (Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) / 100).toFixed(2) }))"
                          },
                          "columns": [
                            {
                              "key": "item",
                              "label": "Item"
                            },
                            {
                              "key": "quantity",
                              "label": "Qty",
                              "align": "right"
                            },
                            {
                              "key": "price",
                              "label": "Price",
                              "align": "right"
                            },
                            {
                              "key": "tax",
                              "label": "Tax",
                              "align": "right"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "right"
                            }
                          ],
                          "totals": {
                            "$expr": "[{ label: 'Net', value: form.values.totals ? form.values.totals.net : ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }, { label: 'Tax', value: form.values.totals ? form.values.totals.tax : ((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }, { label: 'Total ' + (form.values.currency || ''), value: form.values.totals ? form.values.totals.gross : (((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100), 0)) / 100).toFixed(2), strong: true }]"
                          },
                          "footer": "{{ form.values.notes }}",
                          "stamp": "{{ ['draft', 'cancelled'].includes(form.values.status) ? (form.values.status === 'draft' ? 'Draft' : 'Cancelled') : '' }}"
                        }
                      }
                    ]
                  }
                ],
                "slot": "overview"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "The issued credit note copy and any supporting documents.",
                      "tone": "muted"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open in Files",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ ctx.file.path }}/documents"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "./documents/",
                      "columns": [
                        "name",
                        "type",
                        "size",
                        "modified"
                      ],
                      "emptyText": "No documents yet"
                    }
                  }
                ],
                "slot": "documents"
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
