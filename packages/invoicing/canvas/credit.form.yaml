                }
              },
              "path": "./documents/{{ form.values.code || 'document' }}.pdf",
              "immutable": true,
              "if": "!!state.lastresult && (!state.lastresult.journalRequest || !!state.recorded)"
            }
          },
          {
            "toast": {
              "message": "Saved the issued copy in Documents",
              "variant": "success",
              "if": "!!state.lastresult && (!state.lastresult.journalRequest || !!state.recorded)"
            }
          }
        ]
      }
    }
  }
