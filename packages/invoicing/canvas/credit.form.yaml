api-version: canvas.verentis.io/v1
kind: Form
metadata:
  id: invoicing-credit
  name: Invoicing credit note
  description: View and edit an Invoicing credit note.
  icon: file-minus
spec:
  binds:
  - pattern: application/vnd.verentis.invoicing.credit+json
    mode: edit
    priority: 200
    scope: global
    json-schema:
      id: https://schemas.verentis.io/invoicing/v1/credit.schema.json
      source: /applications/invoicing/schemas/credit.schema.json
      title: Invoicing credit note
      version: '1'
  entry: ${var:canvas-origin}/render?document=%2Fapplications%2Finvoicing%2Fcanvas%2Fcredit.form.yaml
  scope: global
  mime-types:
  - pattern: application/vnd.verentis.invoicing.credit+json
    mode: edit
    priority: 200
    json-schema:
      id: https://schemas.verentis.io/invoicing/v1/credit.schema.json
      source: /applications/invoicing/schemas/credit.schema.json
      title: Invoicing credit note
      version: '1'
  permissions:
  - file.read
  - file.write
  - execution.run
  - execution.read
  capabilities: []
  sandbox:
    allow-scripts: true
    allow-same-origin: true
    allow-popups: false
    allow-forms: true
  file-access:
  - path: /invoices
    mode: read
    reason: Choose the issued invoice to credit
  - path: /settings/invoicing.json
    mode: read
    reason: Estimate tax with the default rate
  - path: /applications/invoicing/
    mode: read
    reason: Read the Invoicing schemas and run the posting script
  access:
  - path: /invoices
    reason: Choose the issued invoice to credit
  - path: /settings/invoicing.json
    reason: Estimate tax with the default rate
  - path: /applications/invoicing/
    reason: Read the Invoicing schemas and run the posting script
  data:
    record:
      kind: document
      consistency: conditional
    invoices:
      kind: folder
      path: /invoices
      contents: true
      mime-pattern: application/vnd.verentis.invoicing.invoice+json
    invoiceoptions:
      kind: computed
      expr: '(data.invoices || []).filter(e => e.kind === ''file'' && e.data && e.data.state !== ''archived''
        && (e.data.status === ''issued'')).map(e => ({ label: (e.data.code || e.name) + '' · '' + (((e.data.customer
        && e.data.customer.name) || '''') + '' · '' + e.data.currency + '' '' + ((e.data.totals && e.data.totals.gross)
        || '''')), value: e.path }))'
    settings:
      kind: file
      path: /settings/invoicing.json
      parse: json
  tree:
  - type: canvas.stack
    layout:
      base:
        padding: 6
        gap: 4
        maxWidth: 72rem
        margin:
          x: auto
    children:
    - type: canvas.stack
      layout:
        base:
          direction: row
          wrap: true
          gap: 2
          align: center
          justify: between
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 1
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.heading
            props:
              level: 2
              text: '{{ form.values.reason || ''New credit note'' }}'
          - type: canvas.dashboard.badge
            props:
              text: '{{ String(form.values.status || '''').split(''-'').join('' '') }}'
              tone: '{{ ["issued","posted"].includes(form.values.status) ? ''success'' : ["draft"].includes(form.values.status)
                ? ''warning'' : ["reversed"].includes(form.values.status) ? ''danger'' : ''neutral'' }}'
            rules:
              visible: '!!form.values.status'
          - type: canvas.dashboard.badge
            props:
              text: Archived
              tone: warning
              icon: archive
            rules:
              visible: form.values.state === 'archived'
        - type: canvas.text
          props:
            text: Credit note {{ form.values.code || '' }} · {{ ctx.file.path }}
            tone: muted
      - type: canvas.stack
        layout:
          base:
            direction: row
            wrap: true
            gap: 2
            align: center
        children:
        - type: canvas.button
          props:
            label: Issue
            icon: send
            size: sm
          'on':
            click: issue
          rules:
            visible: (!form.values.status || form.values.status === 'draft') && !(form.values.state ===
              'archived')
            disabled: form.saving || form.dirty || form.invalid
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Archive
              variant: ghost
              icon: archive
              size: sm
            'on':
              click: archive
            rules:
              visible: '!(form.values.state === ''archived'') && !(!(!form.values.status || form.values.status
                === ''draft''))'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Restore
              variant: outline
              icon: archive-restore
              size: sm
            'on':
              click: restore
            rules:
              visible: form.values.state === 'archived'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Reset
              variant: ghost
              size: sm
            'on':
              click: reset
            rules:
              disabled: form.saving || !form.dirty
          - type: canvas.button
            props:
              label: Save
              icon: save
              size: sm
            'on':
              click: save
            rules:
              disabled: form.saving || !form.dirty || form.invalid || form.values.state === 'archived'
                || (!(!form.values.status || form.values.status === 'draft'))
    - type: canvas.text
      props:
        text: '{{ data.$record.error }}'
      rules:
        visible: data.$record.status === 'error'
    - type: canvas.text
      props:
        text: Loading…
        tone: muted
      rules:
        visible: data.$record.status === 'loading'
    - type: canvas.dashboard.badge
      props:
        text: This credit note is archived. Restore it to edit.
        tone: warning
        icon: archive
      rules:
        visible: form.values.state === 'archived'
    - type: canvas.tabs
      props:
        items:
        - value: overview
          label: Overview
          icon: file-minus
        - value: documents
          label: Documents
          icon: paperclip
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Invoice
              variant: ghost
              icon: file-text
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.invoice }}'
                  mode: edit
            rules:
              visible: '!!(form.values.invoice)'
          - type: canvas.button
            props:
              label: Document
              variant: ghost
              icon: file-minus
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.document && form.values.document.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.document && form.values.document.path)'
          - type: canvas.button
            props:
              label: Journal
              variant: ghost
              icon: notebook-pen
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.journal && form.values.journal.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.journal && form.values.journal.path)'
        - type: canvas.grid
          layout:
            base:
              columns: 2
              gap: 4
            desktop:
              columns: 3
          children:
          - type: canvas.dashboard.stat
            props:
              label: Net
              value: '{{ form.values.totals ? form.values.totals.net : ((form.values.lines || []).reduce((s,
                l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)),
                0) / 100).toFixed(2) }}'
              icon: sigma
          - type: canvas.dashboard.stat
            props:
              label: Tax
              value: '{{ form.values.totals ? form.values.totals.tax : ((form.values.lines || []).reduce((s,
                l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice
                || 0) * 100)) * Number(l.taxRate === '''' || l.taxRate == null ? ((data.settings && data.settings.defaultTaxRate)
                || 0) : l.taxRate) / 100), 0) / 100).toFixed(2) }}'
              icon: percent
          - type: canvas.dashboard.stat
            props:
              label: Total {{ form.values.currency }}
              value: '{{ form.values.totals ? form.values.totals.gross : (((form.values.lines || []).reduce((s,
                l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)),
                0) + (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity
                || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.taxRate === '''' || l.taxRate
                == null ? ((data.settings && data.settings.defaultTaxRate) || 0) : l.taxRate) / 100),
                0)) / 100).toFixed(2) }}'
              icon: receipt
        - type: canvas.text
          props:
            text: Estimated while drafting; issuing computes the exact totals.
            tone: muted
          rules:
            visible: '!form.values.totals'
        - type: canvas.grid
          layout:
            base:
              columns: 1
              gap: 4
            tablet:
              columns: 2
          children:
          - type: canvas.card
            props:
              title: Credit note
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.select
                props:
                  label: Invoice
                  value: '{{ form.values.invoice }}'
                  required: true
                  options: '{{ data.invoiceoptions }}'
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.date
                props:
                  label: Date
                  value: '{{ form.values.date }}'
                  required: true
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Currency
                  value: '{{ form.values.currency }}'
                  required: true
                  placeholder: ZAR
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
              - type: canvas.form.input
                props:
                  label: Reason
                  value: '{{ form.values.reason }}'
                  required: true
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
          - type: canvas.card
            props:
              title: Lines
              description: Exact decimals. Each line is rounded to the cent; an empty tax rate takes the
                default from Invoicing settings.
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.array
                props:
                  label: Lines
                  value: '{{ form.values.lines }}'
                  fields:
                  - key: description
                    label: Description
                    required: true
                  - key: quantity
                    label: Quantity
                    required: true
                  - key: unitPrice
                    label: Unit price
                    required: true
                  - key: taxRate
                    label: Tax %
                  defaultRow:
                    description: ''
                    quantity: '1'
                    unitPrice: ''
                    taxRate: ''
                  rowIds: false
                  minimum: 1
                  maximum: 500
                  addLabel: Add line
                  removeLabel: Remove row
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!(!form.values.status || form.values.status
                    === 'draft')))
        slot: overview
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.text
          props:
            text: The issued credit note copy and any supporting documents. Files live in {{ ctx.file.path
              }}/documents.
            tone: muted
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Open in Files
              variant: outline
              icon: folder-open
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ ctx.file.path }}/documents'
        - type: canvas.files
          props:
            path: ./documents/
            columns:
            - name
            - type
            - size
            - modified
            emptyText: No documents yet
        slot: documents
  actions:
    save:
      steps:
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
    reset:
      steps:
      - reset-form: {}
    archive:
      steps:
      - confirm:
          title: Archive
          message: Archive this record? It stays in the workspace and can be restored.
      - patch-form:
          values:
            state: archived
            archivedAt: '{{ Date() }}'
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Archived
          variant: success
    restore:
      steps:
      - patch-form:
          values:
            state: active
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Restored
          variant: success
    issue:
      permissions:
      - execution.run
      - execution.read
      steps:
      - confirm:
          title: Issue credit note
          message: Issue this credit note against its invoice and post it to the ledger? Issued credit
            notes cannot be edited.
      - run-script:
          file: /applications/invoicing/scripts/post
          timeout: 120
          parameters:
            operation: issue-credit
            path: '{{ ctx.file.path }}'
          assign: lastresult
      - refresh-source:
          source: record
      - toast:
          message: '{{ (state.lastresult && state.lastresult.message) || ''Done'' }}'
          variant: success
