{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "plm-changes",
    "name": "Change orders",
    "description": "Every change order with its type, product, approver and dates.",
    "icon": "table-2"
  },
  "spec": {
    "access": [
      {
        "path": "/engineering-change-orders",
        "reason": "List change orders"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/engineering-change-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.plm.eco+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "PLM",
          "icon": "file-cog",
          "active": "changes.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "changes.page.yaml",
              "label": "Change orders",
              "icon": "table-2"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/plm/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Change orders",
              "note": "Every change order with its type, product, approver and dates."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', type: e.data.type || '', product: String(e.data.product || '').split('/').pop(), priority: e.data.priority || '', approver: e.data.approver || '', effective: e.data.effectiveDate || '', stage: e.data.stage || 'draft' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "ECO"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "type",
                  "label": "Type",
                  "format": "badge"
                },
                {
                  "key": "product",
                  "label": "Product / BoM"
                },
                {
                  "key": "priority",
                  "label": "Priority",
                  "format": "badge"
                },
                {
                  "key": "approver",
                  "label": "Approver"
                },
                {
                  "key": "effective",
                  "label": "Effective",
                  "format": "date"
                },
                {
                  "key": "stage",
                  "label": "Stage",
                  "format": "badge"
                }
              ],
              "emptyText": "No change orders yet.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
