{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "plm-home",
    "name": "PLM",
    "description": "Engineering change orders by stage.",
    "icon": "file-cog"
  },
  "spec": {
    "access": [
      {
        "path": "/engineering-change-orders",
        "reason": "List engineering change orders"
      }
    ],
    "data": {
      "ecos": {
        "kind": "folder",
        "path": "/engineering-change-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.plm.eco+json"
      },
      "ecorows": {
        "kind": "computed",
        "expr": "(data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', type: e.data.type || '', priority: e.data.priority || '', effectiveDate: e.data.effectiveDate || '', stage: e.data.stage || 'draft' }))"
      },
      "listengineeringchangeorders": {
        "kind": "folder",
        "path": "/engineering-change-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.plm.eco+json"
      }
    },
    "state": {
      "showclosed": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "PLM",
          "icon": "file-cog",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Board",
              "icon": "kanban"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/plm/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "PLM",
              "note": "Engineering change orders are files in your workspace. Draft one in its folder, submit it for review, then approve and apply it (or reject it with a reason) from its form."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /engineering-change-orders",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/engineering-change-orders"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ data.ecorows || [] }}",
              "groupBy": "stage",
              "columns": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "locked": true
                },
                {
                  "value": "in-review",
                  "label": "In review"
                },
                {
                  "value": "approved",
                  "label": "Approved"
                },
                {
                  "value": "applied",
                  "label": "Applied"
                },
                {
                  "value": "rejected",
                  "label": "Rejected"
                }
              ],
              "card": {
                "title": "title",
                "code": "code",
                "meta": [
                  "type",
                  "effectiveDate"
                ],
                "badge": "priority"
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"applied\"].includes(row.stage)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'applied'",
                    "title": "Move to Applied?",
                    "message": "{{ event.row.code }} moves to Applied. The change is applied to the bill of materials.",
                    "confirm-label": "Move to Applied"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'in-review'",
                    "file": "/applications/plm/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "submit-review",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'approved'",
                    "file": "/applications/plm/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "approve",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'rejected'",
                    "file": "/applications/plm/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "reject",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'applied'",
                    "file": "/applications/plm/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "apply",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "ecos"
                  }
                },
                {
                  "refresh-source": {
                    "source": "listengineeringchangeorders"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"in-review\",\"approved\",\"rejected\",\"applied\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"in-review\":\"In review\",\"approved\":\"Approved\",\"applied\":\"Applied\",\"rejected\":\"Rejected\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.stage || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$ecos.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In review",
                  "value": "{{ (data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.stage || 'draft') === 'in-review')).length }}",
                  "icon": "eye",
                  "loading": "{{ data.$ecos.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved",
                  "value": "{{ (data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.stage || 'draft') === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$ecos.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Applied",
                  "value": "{{ (data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.stage || 'draft') === 'applied')).length }}",
                  "icon": "check-check",
                  "loading": "{{ data.$ecos.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Rejected",
                  "value": "{{ (data.ecos || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.stage || 'draft') === 'rejected')).length }}",
                  "icon": "x",
                  "loading": "{{ data.$ecos.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "ecos",
              "compact": true,
              "description": "The /engineering-change-orders folder could not be read. Reinstall PLM to recreate it."
            }
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show applied and rejected changes",
              "value": "{{ state.showclosed }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.ecorows || []).filter(r => state.showclosed || (r.stage !== 'applied' && r.stage !== 'rejected')) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "ECO"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "type",
                  "label": "Type"
                },
                {
                  "key": "priority",
                  "label": "Priority"
                },
                {
                  "key": "effectiveDate",
                  "label": "Effective"
                },
                {
                  "key": "stage",
                  "label": "Stage"
                }
              ],
              "emptyText": "No open engineering change orders. Use New in /engineering-change-orders.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Browse"
            },
            "children": [
              {
                "type": "canvas.empty-state",
                "props": {
                  "for": "listengineeringchangeorders",
                  "compact": true
                }
              },
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.listengineeringchangeorders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                  "columns": [
                    {
                      "key": "data.code",
                      "label": "Code"
                    },
                    {
                      "key": "data.title",
                      "label": "Title"
                    },
                    {
                      "key": "data.stage",
                      "label": "Stage",
                      "format": "badge"
                    }
                  ],
                  "facets": [
                    "data.stage"
                  ],
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true,
                  "rowKey": "path",
                  "emptyText": "No engineering change orders yet. Use New in /engineering-change-orders."
                },
                "rules": {
                  "visible": "data.$listengineeringchangeorders.status === 'ready'"
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
