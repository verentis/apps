api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: plm-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Review moves engineering change orders through their stages conditionally (If-Match), enforcing the transitions.
file-access:
  - path: "/engineering-change-orders"
    mode: write
    reason: "Submit, approve, reject and apply engineering change orders"
