api-version: verentis.io/v1
kind: Theme

metadata:
  id: verentis-rose-theme
  name: Verentis Rose
  description: Warm rose palette with a dark wine sidebar and matching dashboard
    stripes. Light and dark mode; it keeps your existing logos, favicon and
    backgrounds.
  icon: ./marketplace/logo.svg
  version: 1.0.5
  author: Verentis
  tags: [ theme, verentis, pink ]

marketplace:
  logo: ./marketplace/logo.svg
  hero:
    source: ./marketplace/hero.svg
    alt: "Layered rose bands from dark wine to pale blush."
  readme: ./README.md

# Installs colours and dashboard heroes (record at themes/verentis-rose-theme). Assets not listed here keep the
# workspace's current files.
spec:
  assets:
    theme.css: theme/theme.css
    hero: theme/hero.svg
    hero.dark: theme/hero-dark.svg

packaging:
  publisher: verentis
  files:
    - "theme/*"
  encryption: none
