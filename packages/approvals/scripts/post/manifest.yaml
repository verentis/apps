api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: approvals-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Submitting, approving, refusing and cancelling check each request's type and write records conditionally.
file-access:
  - path: "/approval-types"
    mode: read
    reason: "Read each request's type: its required fields and approver count"
  - path: "/approval-requests"
    mode: write
    reason: "Mark requests submitted, approved, refused or cancelled"
