api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: approvals-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Approvals containers.
file-access:
  - path: "/approval-types"
    mode: write
    reason: "Create approval types with the next number"
  - path: "/approval-requests"
    mode: write
    reason: "Create approval requests with the next number"
  - path: "/settings/approvals.json"
    mode: read
    reason: "Default new requests' requester"
