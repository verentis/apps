{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "approvals-requests",
    "name": "Approval requests",
    "description": "Approval requests by status.",
    "icon": "file-check"
  },
  "spec": {
    "access": [
      {
        "path": "/approval-types",
        "reason": "List approval requests with their types, thresholds and statuses"
      },
      {
        "path": "/approval-requests",
        "reason": "List approval requests with their types, thresholds and statuses"
      }
    ],
    "data": {
      "requests": {
        "kind": "folder",
        "path": "/approval-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.request+json"
      },
      "types": {
        "kind": "folder",
        "path": "/approval-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', requester: e.data.requester || '', type: e.data.type || '', typeName: (((data.types || []).find(t => t.path === e.data.type) || {}).data || {}).name || '', required: (((data.types || []).find(t => t.path === e.data.type) || {}).data || {}).requiredApprovers || 0, approvers: (e.data.approvals || []).filter(a => a.decision === 'approve').map(a => a.approver), deciders: (e.data.approvals || []).map(a => a.approver), amount: e.data.amount || '', date: e.data.date || '', status: e.data.status || 'draft' }))"
      }
    },
    "state": {
      "showall": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Approvals",
          "icon": "file-check",
          "active": "requests.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "All requests",
              "icon": "list"
            },
            {
              "id": "pending.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "by-type.page.yaml",
              "label": "Types",
              "icon": "shapes"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/approvals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/approvals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Approval requests",
              "note": "Open requests by status; decided and cancelled ones sit behind the switch."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting decision",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'submitted')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show approved, refused and cancelled requests",
              "value": "{{ state.showall }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => state.showall || (r.status !== 'approved' && r.status !== 'refused' && r.status !== 'cancelled')).map(r => ({ path: r.path, code: r.code, title: r.title, requester: r.requester, typeName: r.typeName, amount: r.amount, approvals: r.approvers.length + \" / \" + (r.required || \"?\"), status: r.status })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Request"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "requester",
                  "label": "Requester"
                },
                {
                  "key": "typeName",
                  "label": "Type"
                },
                {
                  "key": "amount",
                  "label": "Amount",
                  "align": "end"
                },
                {
                  "key": "approvals",
                  "label": "Approvals",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                }
              ],
              "emptyText": "No approval requests",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
