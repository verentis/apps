{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "approvals-request",
    "name": "Approvals approval request",
    "description": "View and edit an Approvals approval request.",
    "icon": "file-check"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.approvals.request+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/approvals/v1/request.schema.json",
          "source": "/applications/approvals/schemas/request.schema.json",
          "title": "Approvals approval request",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fapprovals%2Fcanvas%2Frequest.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.approvals.request+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/approvals/v1/request.schema.json",
          "source": "/applications/approvals/schemas/request.schema.json",
          "title": "Approvals approval request",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [
      "user-profile"
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/approval-types",
        "mode": "read",
        "reason": "Offer the approval types and show each request's threshold"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/approvals/",
        "mode": "read",
        "reason": "Read the Approvals schemas and run the decision script"
      }
    ],
    "access": [
      {
        "path": "/approval-types",
        "reason": "Offer the approval types and show each request's threshold"
      },
      {
        "path": "/employees",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/approvals/",
        "reason": "Read the Approvals schemas and run the decision script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "types": {
        "kind": "folder",
        "path": "/approval-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.type+json"
      },
      "typeoptions": {
        "kind": "computed",
        "expr": "(data.types || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "signedinstaff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "me": {
        "kind": "computed",
        "expr": "((data.signedinstaff || []).filter(e => e.kind === 'file' && e.data && e.data.status !== 'terminated' && !!ctx.user && !!ctx.user.email && String(e.data.workEmail || '').toLowerCase() === String(ctx.user.email).toLowerCase()).map(e => ({ path: e.path, name: String(e.data.name || '') }))[0] || { path: '', name: ctx.user ? String(ctx.user.name || '') : '' })"
      },
      "employeelinks": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeelinkoptions": {
        "kind": "computed",
        "expr": "(data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status !== 'terminated').map(e => ({ value: e.path, label: (String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || '') || e.name) + (e.data.jobTitle ? ' · ' + e.data.jobTitle : '') }))"
      }
    },
    "state": {
      "approver": "",
      "comment": ""
    },
    "roles": {
      "approve": [
        "system:owner",
        "system:admin",
        "Owner",
        "Admin",
        "Approver",
        "Approvers"
      ]
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.title || 'New approval request' }}",
              "note": "Approval request {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"approved\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : [\"refused\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "This is me",
                  "variant": "ghost",
                  "icon": "user-check",
                  "size": "sm"
                },
                "on": {
                  "click": "link-me-requesterref"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived') && (true) && !!data.me && !!data.me.path && form.values.requesterRef !== data.me.path",
                  "disabled": "form.saving"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Submit",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "submit"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Approve",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "approve"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty || (!!ctx.user && Array.isArray(ctx.user.roles) && !ctx.can('approve'))"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Refuse",
                  "variant": "outline",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "refuse"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'",
                  "disabled": "form.saving || form.dirty || (!!ctx.user && Array.isArray(ctx.user.roles) && !ctx.can('approve'))"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel request",
                  "variant": "ghost",
                  "icon": "ban",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel"
                },
                "rules": {
                  "visible": "((!form.values.status || form.values.status === 'draft') || form.values.status === 'submitted') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This approval request is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Approvals {{ (form.values.approvals || []).filter(a => a.decision === 'approve').map(a => a.approver).filter((name, index, all) => all.indexOf(name) === index).length }} of {{ (((data.types || []).find(e => e.path === form.values.type) || {}).data || {}).requiredApprovers || '?' }} required",
              "tone": "muted"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Decided {{ form.values.decidedAt }}",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.decidedAt"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Decision trail"
            },
            "children": [
              {
                "type": "canvas.timeline",
                "props": {
                  "emptyText": "Not submitted yet",
                  "sources": [
                    {
                      "type": "submitted",
                      "label": "Submitted",
                      "icon": "send",
                      "date": "at",
                      "title": "title",
                      "subtitle": "by",
                      "rows": {
                        "$expr": "form.values.submittedAt ? [{ at: form.values.submittedAt, title: 'Submitted for approval', by: form.values.requester || '' }] : []"
                      }
                    },
                    {
                      "type": "decision",
                      "label": "Decisions",
                      "icon": "user-check",
                      "date": "date",
                      "title": "title",
                      "subtitle": "comment",
                      "badge": {
                        "key": "decision",
                        "labels": {
                          "approve": "Approved",
                          "refuse": "Refused"
                        },
                        "tones": {
                          "approve": "success",
                          "refuse": "danger"
                        }
                      },
                      "rows": {
                        "$expr": "(form.values.approvals || []).map(a => ({ date: a.date, title: a.approver || 'Unknown approver', comment: a.comment || '', decision: a.decision }))"
                      }
                    },
                    {
                      "type": "outcome",
                      "label": "Outcome",
                      "icon": "flag",
                      "date": "at",
                      "title": "title",
                      "rows": {
                        "$expr": "form.values.decidedAt ? [{ at: form.values.decidedAt, title: form.values.status === 'approved' ? 'Approved' : form.values.status === 'refused' ? 'Refused' : 'Decided' }] : form.values.cancelledAt ? [{ at: form.values.cancelledAt, title: 'Cancelled' }] : []"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Approver",
                  "placeholder": "{{ (ctx.user && ctx.user.name) || 'Who decides?' }}",
                  "value": "{{ state.approver }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              },
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Comment",
                  "placeholder": "Required when refusing",
                  "value": "{{ state.comment }}"
                },
                "rules": {
                  "visible": "form.values.status === 'submitted'"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (form.values.approvals || []).map(a => ({ approver: a.approver, decision: a.decision, date: a.date, comment: a.comment })) }}",
              "columns": [
                {
                  "key": "approver",
                  "label": "Approver"
                },
                {
                  "key": "decision",
                  "label": "Decision"
                },
                {
                  "key": "date",
                  "label": "Date"
                },
                {
                  "key": "comment",
                  "label": "Comment"
                }
              ],
              "emptyText": "No decisions yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Request"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Approval type",
                          "value": "{{ form.values.type }}",
                          "required": true,
                          "options": "{{ data.typeoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Requester",
                          "value": "{{ form.values.requester }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.requesterRef }}",
                          "description": "Optional. Choosing a record fills the name.",
                          "options": "{{ data.employeelinkoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        },
                        "on": {
                          "update": [
                            {
                              "patch-form": {
                                "values": {
                                  "requester": "{{ ((data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.path === event).map(e => String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || ''))[0] || form.values.requester || '') }}"
                                }
                              }
                            }
                          ]
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Title",
                          "value": "{{ form.values.title }}",
                          "required": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Reason",
                          "value": "{{ form.values.reason }}",
                          "required": true,
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Details",
                  "description": "The approval type decides which of these submitting checks. Amounts are exact decimal strings."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Amount",
                          "value": "{{ form.values.amount }}",
                          "placeholder": "1250.00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Reference",
                          "value": "{{ form.values.reference }}",
                          "placeholder": "Order, contract or document reference"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "link-me-requesterref": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "requesterRef": "{{ data.me.path }}",
                "requester": "{{ data.me.name }}"
              }
            }
          }
        ]
      },
      "submit": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Submit request",
              "message": "Submit this request for approval? The type's required fields are checked and submitted requests can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/approvals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "submit",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "approve": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Approve request",
              "message": "Record your approval? When enough distinct approvers have approved, the request is approved and locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/approvals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "approve",
                "path": "{{ ctx.file.path }}",
                "approver": "{{ state.approver || (ctx.user && ctx.user.name) || '' }}",
                "comment": "{{ state.comment }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "refuse": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Refuse request",
              "message": "Refuse this request? One refusal decides it. Give the reason in the Comment field."
            }
          },
          {
            "run-script": {
              "file": "/applications/approvals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "refuse",
                "path": "{{ ctx.file.path }}",
                "approver": "{{ state.approver || (ctx.user && ctx.user.name) || '' }}",
                "comment": "{{ state.comment }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "cancel": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Cancel request",
              "message": "Cancel this request? Only the requester should cancel; cancelled requests stay in the workspace."
            }
          },
          {
            "run-script": {
              "file": "/applications/approvals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "cancel",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
