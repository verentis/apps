{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "approvals-home",
    "name": "Approvals",
    "description": "Approvals overview.",
    "icon": "file-check"
  },
  "spec": {
    "access": [
      {
        "path": "/approval-types",
        "reason": "List approval requests and types"
      },
      {
        "path": "/approval-requests",
        "reason": "List approval requests and types"
      }
    ],
    "data": {
      "requests": {
        "kind": "folder",
        "path": "/approval-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.request+json"
      },
      "types": {
        "kind": "folder",
        "path": "/approval-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', requester: e.data.requester || '', type: e.data.type || '', typeName: (((data.types || []).find(t => t.path === e.data.type) || {}).data || {}).name || '', required: (((data.types || []).find(t => t.path === e.data.type) || {}).data || {}).requiredApprovers || 0, approvers: (e.data.approvals || []).filter(a => a.decision === 'approve').map(a => a.approver), deciders: (e.data.approvals || []).map(a => a.approver), amount: e.data.amount || '', date: e.data.date || '', status: e.data.status || 'draft' }))"
      },
      "listapprovalrequests": {
        "kind": "folder",
        "path": "/approval-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.request+json"
      },
      "listapprovaltypes": {
        "kind": "folder",
        "path": "/approval-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.approvals.type+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Approvals",
          "icon": "file-check",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "All requests",
              "icon": "list"
            },
            {
              "id": "pending.page.yaml",
              "label": "Inbox",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}"
            },
            {
              "id": "by-type.page.yaml",
              "label": "Types",
              "icon": "shapes"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/approvals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/approvals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Approvals",
              "note": "Approval types and requests are files in your workspace. Draft a request in its folder, then submit it; approvers decide from its form until the type's threshold approves it, one refusal refuses it."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft requests",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting decision",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'submitted')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Refused",
                  "value": "{{ (data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'refused')).length }}",
                  "icon": "x",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "types",
              "compact": true,
              "description": "The /approval-types folder could not be read. Reinstall Approvals to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true,
              "description": "The /approval-requests folder could not be read. Reinstall Approvals to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "requests",
                  "label": "Approval requests",
                  "icon": "file-check"
                },
                {
                  "value": "types",
                  "label": "Approval types",
                  "icon": "list-checks"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /approval-requests",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/approval-requests"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listapprovalrequests",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listapprovalrequests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.requester",
                          "label": "Requester"
                        },
                        {
                          "key": "data.amount",
                          "label": "Amount"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No approval requests yet. Use New in /approval-requests."
                    },
                    "rules": {
                      "visible": "data.$listapprovalrequests.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "requests"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /approval-types",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/approval-types"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listapprovaltypes",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listapprovaltypes || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.requiredApprovers",
                          "label": "Required approvals"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No approval types yet. Use New in /approval-types."
                    },
                    "rules": {
                      "visible": "data.$listapprovaltypes.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "types"
              }
            ]
          }
        ]
      }
    ]
  }
}
