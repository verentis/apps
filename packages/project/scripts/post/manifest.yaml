api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: project-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Completing validates the stage transition and marks tasks done conditionally.
file-access:
  - path: "/tasks"
    mode: write
    reason: "Mark tasks done with their completion time"
