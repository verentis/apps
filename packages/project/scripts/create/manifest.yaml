api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: project-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Project containers.
file-access:
  - path: "/projects"
    mode: write
    reason: "Create projects with the next code"
  - path: "/tasks"
    mode: write
    reason: "Create tasks with the next code"
  - path: "/settings/project.json"
    mode: read
    reason: "Default new tasks' assignee"
