{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "project-home",
    "name": "Project",
    "description": "Projects and tasks overview.",
    "icon": "folder-kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/projects",
        "reason": "List projects"
      },
      {
        "path": "/tasks",
        "reason": "List tasks"
      }
    ],
    "data": {
      "projects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      },
      "projectoptions": {
        "kind": "computed",
        "expr": "(data.projects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "tasks": {
        "kind": "folder",
        "path": "/tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.task+json"
      },
      "listprojects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      },
      "listtasks": {
        "kind": "folder",
        "path": "/tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.task+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Project",
          "icon": "folder-kanban",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Projects",
              "icon": "layout-dashboard"
            },
            {
              "id": "board.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/project/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/project.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Project",
              "note": "Projects and tasks are files in your workspace. Draft them in their folders, then complete tasks from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Due dates"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Open tasks by due date. Late tasks are left of today.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.time-strip",
                "props": {
                  "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.stage !== 'done' && !!e.data.dueDate).map(e => ({ path: e.path, title: e.data.title || e.data.code, at: e.data.dueDate })) }}",
                  "emptyText": "Nothing due",
                  "at": "at",
                  "title": "title",
                  "window": {
                    "from": "-7d",
                    "to": "28d"
                  },
                  "soon": "2d"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active projects",
                  "value": "{{ (data.projects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'active')).length }}",
                  "icon": "folder-kanban",
                  "loading": "{{ data.$projects.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On hold",
                  "value": "{{ (data.projects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'on-hold')).length }}",
                  "icon": "pause",
                  "loading": "{{ data.$projects.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open tasks",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.stage !== 'done')).length }}",
                  "icon": "square-check-big",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done tasks",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.stage === 'done')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "projects",
              "compact": true,
              "description": "The /projects folder could not be read. Reinstall Project to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tasks",
              "compact": true,
              "description": "The /tasks folder could not be read. Reinstall Project to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "projects",
                  "label": "Projects",
                  "icon": "folder-kanban"
                },
                {
                  "value": "tasks",
                  "label": "Tasks",
                  "icon": "square-check-big"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /projects",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/projects"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listprojects",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listprojects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No projects yet. Use New in /projects."
                    },
                    "rules": {
                      "visible": "data.$listprojects.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "projects"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /tasks",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/tasks"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listtasks",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listtasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage",
                          "format": "badge"
                        },
                        {
                          "key": "data.priority",
                          "label": "Priority",
                          "format": "badge"
                        },
                        {
                          "key": "data.assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "data.dueDate",
                          "label": "Due",
                          "format": "date"
                        }
                      ],
                      "facets": [
                        "data.stage"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No tasks yet. Use New in /tasks."
                    },
                    "rules": {
                      "visible": "data.$listtasks.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "tasks"
              }
            ]
          }
        ]
      }
    ]
  }
}
