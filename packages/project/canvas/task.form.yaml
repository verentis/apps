{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "project-task",
    "name": "Project task",
    "description": "View and edit a Project task.",
    "icon": "square-check-big"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.project.task+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/project/v1/task.schema.json",
          "source": "/applications/project/schemas/task.schema.json",
          "title": "Project task",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fproject%2Fcanvas%2Ftask.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.project.task+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/project/v1/task.schema.json",
          "source": "/applications/project/schemas/task.schema.json",
          "title": "Project task",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/projects",
        "mode": "read",
        "reason": "Choose the project a task belongs to"
      },
      {
        "path": "/applications/project/",
        "mode": "read",
        "reason": "Read the Project schemas and run the task script"
      }
    ],
    "access": [
      {
        "path": "/projects",
        "reason": "Choose the project a task belongs to"
      },
      {
        "path": "/applications/project/",
        "reason": "Read the Project schemas and run the task script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "projects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      },
      "projectoptions": {
        "kind": "computed",
        "expr": "(data.projects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.title || 'New task' }}",
              "note": "Task {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.stage || '').split('-').join(' ') }}",
                      "tone": "{{ [\"active\",\"done\"].includes(form.values.stage) ? 'success' : [\"on-hold\",\"review\"].includes(form.values.stage) ? 'warning' : [].includes(form.values.stage) ? 'neutral' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.stage"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Complete",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "complete"
                },
                "rules": {
                  "visible": "!(form.values.stage === 'done') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.stage === 'done')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.stage === 'done')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.stage }}",
              "steps": [
                {
                  "value": "backlog",
                  "label": "Backlog"
                },
                {
                  "value": "in-progress",
                  "label": "In progress"
                },
                {
                  "value": "review",
                  "label": "Review"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.stage"
            }
          },
          {
            "type": "canvas.meter",
            "props": {
              "kind": "deadline",
              "to": "{{ form.values.dueDate }}",
              "label": "Due date",
              "thresholds": {
                "warning": 0.75,
                "danger": 1
              }
            },
            "rules": {
              "visible": "!!form.values.dueDate && [\"backlog\",\"in-progress\",\"review\"].includes(form.values.stage)"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This task is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Task"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Title",
                          "value": "{{ form.values.title }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Project",
                          "value": "{{ form.values.project }}",
                          "required": true,
                          "options": "{{ data.projectoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Stage",
                          "value": "{{ form.values.stage }}",
                          "options": [
                            {
                              "value": "backlog",
                              "label": "Backlog"
                            },
                            {
                              "value": "in-progress",
                              "label": "In progress"
                            },
                            {
                              "value": "review",
                              "label": "Review"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Priority",
                          "value": "{{ form.values.priority }}",
                          "options": [
                            {
                              "value": "low",
                              "label": "Low"
                            },
                            {
                              "value": "medium",
                              "label": "Medium"
                            },
                            {
                              "value": "high",
                              "label": "High"
                            },
                            {
                              "value": "urgent",
                              "label": "Urgent"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Assignee",
                          "value": "{{ form.values.assignee }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Due date",
                          "value": "{{ form.values.dueDate }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Description",
                          "value": "{{ form.values.description }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.stage === 'done'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "complete": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Complete task",
              "message": "Mark this task done? Done tasks can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/project/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "complete-task",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
