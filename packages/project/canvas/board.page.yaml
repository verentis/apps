{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "project-board",
    "name": "Task board",
    "description": "Tasks grouped by stage.",
    "icon": "kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/tasks",
        "reason": "Group tasks by stage"
      },
      {
        "path": "/projects",
        "reason": "Show each task's project name"
      }
    ],
    "data": {
      "tasks": {
        "kind": "folder",
        "path": "/tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.task+json"
      },
      "projects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Task board"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active task, grouped by stage. Click a task to open its form; complete it from there.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Project",
                  "variant": "ghost",
                  "icon": "folder-kanban",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/project/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /tasks folder could not be read. Reinstall Project to recreate it."
            },
            "rules": {
              "visible": "data.$tasks.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$tasks.status === 'loading'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Backlog",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'backlog' && (true)).length }}",
                  "icon": "square-check-big",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In progress",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'in-progress' && (true)).length }}",
                  "icon": "square-check-big",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Review",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'review' && (true)).length }}",
                  "icon": "square-check-big",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'done' && (true)).length }}",
                  "icon": "square-check-big",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Backlog"
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'backlog' && (true)).map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title, project: (((data.projects || []).find(p => p.path === e.data.project) || {}).data || {}).name || '', priority: e.data.priority, assignee: e.data.assignee, dueDate: e.data.dueDate })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "project",
                          "label": "Project"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "dueDate",
                          "label": "Due"
                        }
                      ],
                      "emptyText": "No backlog tasks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "In progress"
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'in-progress' && (true)).map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title, project: (((data.projects || []).find(p => p.path === e.data.project) || {}).data || {}).name || '', priority: e.data.priority, assignee: e.data.assignee, dueDate: e.data.dueDate })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "project",
                          "label": "Project"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "dueDate",
                          "label": "Due"
                        }
                      ],
                      "emptyText": "No in progress tasks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Review"
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'review' && (true)).map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title, project: (((data.projects || []).find(p => p.path === e.data.project) || {}).data || {}).name || '', priority: e.data.priority, assignee: e.data.assignee, dueDate: e.data.dueDate })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "project",
                          "label": "Project"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "dueDate",
                          "label": "Due"
                        }
                      ],
                      "emptyText": "No review tasks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Done"
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'done' && (true)).map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title, project: (((data.projects || []).find(p => p.path === e.data.project) || {}).data || {}).name || '', priority: e.data.priority, assignee: e.data.assignee, dueDate: e.data.dueDate })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "project",
                          "label": "Project"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "dueDate",
                          "label": "Due"
                        }
                      ],
                      "emptyText": "No done tasks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
    ]
  }
}
