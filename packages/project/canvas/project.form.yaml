{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "project-project",
    "name": "Project project",
    "description": "View and edit a Project project.",
    "icon": "folder-kanban"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.project.project+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/project/v1/project.schema.json",
          "source": "/applications/project/schemas/project.schema.json",
          "title": "Project project",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fproject%2Fcanvas%2Fproject.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.project.project+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/project/v1/project.schema.json",
          "source": "/applications/project/schemas/project.schema.json",
          "title": "Project project",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/customers",
        "mode": "read",
        "reason": "Offer CRM customers to link (when CRM is installed)"
      },
      {
        "path": "/tasks",
        "mode": "read",
        "reason": "Summarise this project's tasks by stage"
      },
      {
        "path": "/applications/project/",
        "mode": "read",
        "reason": "Read the Project schemas and run the task script"
      }
    ],
    "access": [
      {
        "path": "/customers",
        "reason": "Offer CRM customers to link (when CRM is installed)"
      },
      {
        "path": "/tasks",
        "reason": "Summarise this project's tasks by stage"
      },
      {
        "path": "/applications/project/",
        "reason": "Read the Project schemas and run the task script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "companies": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.company+json"
      },
      "contacts": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.contact+json"
      },
      "customeroptions": {
        "kind": "computed",
        "expr": "(data.companies || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path })).concat((data.contacts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ([e.data.givenName, e.data.familyName].filter(Boolean).join(' ')), value: e.path })))"
      },
      "tasks": {
        "kind": "folder",
        "path": "/tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.task+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New project' }}",
              "note": "Project {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"active\",\"done\"].includes(form.values.status) ? 'success' : [\"on-hold\",\"review\"].includes(form.values.status) ? 'warning' : [].includes(form.values.status) ? 'neutral' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(false)",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (false)"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "active",
                  "label": "Active"
                },
                {
                  "value": "on-hold",
                  "label": "On hold"
                },
                {
                  "value": "done",
                  "label": "Done"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This project is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "overview",
                  "label": "Overview",
                  "icon": "folder-kanban"
                },
                {
                  "value": "tasks",
                  "label": "Tasks",
                  "icon": "square-check-big"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Project"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Name",
                                  "value": "{{ form.values.name }}",
                                  "required": true
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (false))"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Status",
                                  "value": "{{ form.values.status }}",
                                  "options": [
                                    {
                                      "value": "active",
                                      "label": "Active"
                                    },
                                    {
                                      "value": "on-hold",
                                      "label": "On hold"
                                    },
                                    {
                                      "value": "done",
                                      "label": "Done"
                                    }
                                  ],
                                  "display": "segmented"
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (false))"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "CRM customer",
                                  "value": "{{ form.values.customerRef }}",
                                  "description": "Optional. A customer from the CRM, when it is installed.",
                                  "options": "{{ data.customeroptions }}",
                                  "searchable": true
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (false))"
                                }
                              },
                              {
                                "type": "canvas.form.textarea",
                                "props": {
                                  "label": "Description",
                                  "value": "{{ form.values.description }}",
                                  "rows": 4
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "(form.values.state === 'archived' || (false))"
                                }
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ],
                "slot": "overview"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 4
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Backlog",
                          "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'backlog' && (e.data.project === ctx.file.path)).length }}",
                          "icon": "square-check-big"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "In progress",
                          "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'in-progress' && (e.data.project === ctx.file.path)).length }}",
                          "icon": "square-check-big"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Review",
                          "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'review' && (e.data.project === ctx.file.path)).length }}",
                          "icon": "square-check-big"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Done",
                          "value": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.stage === 'done' && (e.data.project === ctx.file.path)).length }}",
                          "icon": "square-check-big"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Tasks"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.project === ctx.file.path)).map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title, stage: e.data.stage, priority: e.data.priority, assignee: e.data.assignee, dueDate: e.data.dueDate })) }}",
                          "columns": [
                            {
                              "key": "code",
                              "label": "Code"
                            },
                            {
                              "key": "title",
                              "label": "Title"
                            },
                            {
                              "key": "stage",
                              "label": "Stage"
                            },
                            {
                              "key": "priority",
                              "label": "Priority"
                            },
                            {
                              "key": "assignee",
                              "label": "Assignee"
                            },
                            {
                              "key": "dueDate",
                              "label": "Due"
                            }
                          ],
                          "emptyText": "No tasks for this project yet. Use New in /tasks.",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ],
                "slot": "tasks"
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
