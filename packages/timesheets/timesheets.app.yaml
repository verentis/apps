{
  "api-version": "verentis.io/v1",
  "kind": "Application",
  "metadata": {
    "id": "timesheets",
    "name": "Timesheets",
    "description": "Record working time and review how the week was spent.",
    "icon": "./icons/app.svg",
    "version": "0.1.0",
    "author": "Verentis"
  },
  "marketplace": {
    "logo": "./icons/app.svg",
      "hero": {"source": "./marketplace/hero.svg", "alt": "Timesheets cover"},
      "images": [{"source": "./marketplace/overview.png", "alt": "Timesheets overview in Canvas", "caption": "Timesheets overview"}, {"source": "./marketplace/detail.png", "alt": "This week in Canvas", "caption": "This week"}],
      "readme": "./marketplace/README.md",
    "keywords": [
      "timesheets",
      "time tracking",
      "hours",
      "projects",
      "tasks"
    ]
  },
  "spec": {
    "install-root": "/applications/timesheets",
    "entry": "https://canvas.apps.localtest.me",
    "scope": "global",
    "entry-points": [
      {
        "id": "home",
        "display-name": "Timesheets",
        "route": "/render?document=.%2Fcanvas%2Fhome.page.yaml",
        "order": 10
      },
      {
        "id": "week",
        "display-name": "This week",
        "route": "/render?document=.%2Fcanvas%2Fweek.page.yaml",
        "order": 20
      }
    ],
    "launch": {
      "enabled": true,
      "entry-point": "home",
      "pinnable": true
    },
    "permissions": [
      "file.read",
      "file.write",
      "execution.run"
    ],
    "scopes": [
      "timesheets.default"
    ],
    "settings": [
      {
        "key": "entry-code-prefix",
        "display-name": "Entry code prefix",
        "type": "string",
        "default": "TS-",
        "description": "Prefix of generated timesheet entry codes, e.g. TS-0001."
      },
      {
        "key": "code-digits",
        "display-name": "Code digits",
        "type": "number",
        "default": 4,
        "description": "Minimum number of digits in generated codes (zero-padded)."
      }
    ],
    "dependencies": [
      {
        "package": "verentis/canvas",
        "version": "latest"
      },
      {
        "package": "verentis/nodejs",
        "version": "latest"
      },
      {
        "package": "verentis/project",
        "version": "latest",
        "optional": true
      }
    ],
    "engine": "verentis/nodejs",
    "scripts": [
      "scripts/create",
      "scripts/post"
    ],
    "install": [
      {
        "from": "canvas/*.form.yaml",
        "to": "/applications/timesheets/canvas/",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.form+yaml"
      },
      {
        "from": "canvas/*.page.yaml",
        "to": "/applications/timesheets/canvas/",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.page+yaml"
      },
      {
        "from": "schemas/*.schema.json",
        "to": "/applications/timesheets/schemas/",
        "mode": "managed",
        "mime": "application/schema+json"
      },
      {
        "from": "templates/*.json",
        "to": "/applications/timesheets/templates/",
        "mode": "managed",
        "mime": "application/json"
      },
      {
        "from": "seed/entries",
        "to": "/timesheets",
        "mode": "seed",
        "mime": "application/vnd.verentis.timesheets.entries"
      },
      {
        "from": "seed/settings.json",
        "to": "/settings/timesheets.json",
        "mode": "seed",
        "mime": "application/vnd.verentis.timesheets.settings+json"
      }
    ],
    "creatables": [
      {
        "id": "entry",
        "display-name": "Timesheet entry",
        "description": "A new timesheet entry",
        "icon": "lucide:clock",
        "mime": "application/vnd.verentis.timesheets.entry+json",
        "parents": [
          "application/vnd.verentis.timesheets.entries"
        ],
        "folder-names": [
          "timesheets",
          "timesheet"
        ],
        "script": "./scripts/create",
        "template": "./templates/entry.json"
      }
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-forms": true,
      "allow-popups": false
    },
    "file-access": [
      {
        "path": "/timesheets",
        "mode": "read",
        "reason": "List timesheet entries",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/projects",
        "mode": "read",
        "reason": "Show project names (when Project is installed)",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/timesheets",
        "mode": "read",
        "reason": "Sum this week's hours by project",
        "origin": {
          "kind": "document",
          "id": "canvas/week.page.yaml"
        }
      },
      {
        "path": "/projects",
        "mode": "read",
        "reason": "Show project names (when Project is installed)",
        "origin": {
          "kind": "document",
          "id": "canvas/week.page.yaml"
        }
      },
      {
        "path": "/projects",
        "mode": "read",
        "reason": "Offer projects to log time against (when Project is installed)",
        "origin": {
          "kind": "document",
          "id": "timesheets-entry"
        }
      },
      {
        "path": "/tasks",
        "mode": "read",
        "reason": "Offer tasks to log time against (when Project is installed)",
        "origin": {
          "kind": "document",
          "id": "timesheets-entry"
        }
      },
      {
        "path": "/applications/timesheets/",
        "mode": "read",
        "reason": "Read the Timesheets schemas and run the validation script",
        "origin": {
          "kind": "document",
          "id": "timesheets-entry"
        }
      },
      {
        "path": "/applications/timesheets/",
        "mode": "read",
        "reason": "Read the Timesheets schemas and run the validation script",
        "origin": {
          "kind": "document",
          "id": "timesheets-settings"
        }
      },
      {
        "path": "/timesheets",
        "mode": "write",
        "reason": "Create timesheet entries with the next code",
        "origin": {
          "kind": "script",
          "id": "timesheets-create"
        }
      },
      {
        "path": "/settings/timesheets.json",
        "mode": "read",
        "reason": "Default new entries' employee name",
        "origin": {
          "kind": "script",
          "id": "timesheets-create"
        }
      },
      {
        "path": "/timesheets",
        "mode": "write",
        "reason": "Mark timesheet entries validated with their validation time",
        "origin": {
          "kind": "script",
          "id": "timesheets-post"
        }
      }
    ]
  },
  "packaging": {
    "publisher": "verentis",
    "files": [
      "canvas/**",
      "schemas/**",
      "templates/**",
      "seed/**",
      "scripts/**",
      "README.md"
    ],
    "templates": [
      "canvas/*.yaml"
    ],
    "variables": {
      "canvas-origin": "https://canvas.apps.localtest.me"
    },
    "encryption": "none"
  }
}
