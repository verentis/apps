{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "timesheets-settings",
    "name": "Timesheets settings",
    "description": "Edit the Timesheets settings file.",
    "icon": "settings"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.timesheets.settings+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/timesheets/v1/settings.schema.json",
          "source": "/applications/timesheets/schemas/settings.schema.json",
          "title": "Timesheets settings",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Ftimesheets%2Fcanvas%2Fsettings.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.timesheets.settings+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/timesheets/v1/settings.schema.json",
          "source": "/applications/timesheets/schemas/settings.schema.json",
          "title": "Timesheets settings",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/applications/timesheets/",
        "mode": "read",
        "reason": "Read the Timesheets schemas and run the validation script"
      }
    ],
    "access": [
      {
        "path": "/applications/timesheets/",
        "reason": "Read the Timesheets schemas and run the validation script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Timesheets settings",
              "note": "Defaults new entries start with. Code prefixes are app settings, managed with the installed app."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Reset",
                  "variant": "ghost",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "reset-form": {}
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Save",
                  "icon": "save",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "save": {}
                    },
                    {
                      "toast": {
                        "message": "Saved",
                        "variant": "success"
                      }
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty || form.invalid"
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 1
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Defaults"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employee }}",
                          "description": "Used for new entries only when the person creating them is not known."
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {}
  }
}
