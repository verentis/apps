{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "timesheets-entry",
    "name": "Timesheets timesheet entry",
    "description": "View and edit a Timesheets timesheet entry.",
    "icon": "clock"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.timesheets.entry+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/timesheets/v1/entry.schema.json",
          "source": "/applications/timesheets/schemas/entry.schema.json",
          "title": "Timesheets timesheet entry",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Ftimesheets%2Fcanvas%2Fentry.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.timesheets.entry+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/timesheets/v1/entry.schema.json",
          "source": "/applications/timesheets/schemas/entry.schema.json",
          "title": "Timesheets timesheet entry",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [
      "user-profile"
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/projects",
        "mode": "read",
        "reason": "Offer projects to log time against (when Project is installed)"
      },
      {
        "path": "/tasks",
        "mode": "read",
        "reason": "Offer tasks to log time against (when Project is installed)"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/timesheets/",
        "mode": "read",
        "reason": "Read the Timesheets schemas and run the validation script"
      }
    ],
    "access": [
      {
        "path": "/projects",
        "reason": "Offer projects to log time against (when Project is installed)"
      },
      {
        "path": "/tasks",
        "reason": "Offer tasks to log time against (when Project is installed)"
      },
      {
        "path": "/employees",
        "reason": "Find your Employees record by your work email (when Employees is installed)"
      },
      {
        "path": "/applications/timesheets/",
        "reason": "Read the Timesheets schemas and run the validation script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "projects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      },
      "projectoptions": {
        "kind": "computed",
        "expr": "(data.projects || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "tasks": {
        "kind": "folder",
        "path": "/tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.task+json"
      },
      "taskoptions": {
        "kind": "computed",
        "expr": "(data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.title || ''), value: e.path }))"
      },
      "signedinstaff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "me": {
        "kind": "computed",
        "expr": "((data.signedinstaff || []).filter(e => e.kind === 'file' && e.data && e.data.status !== 'terminated' && !!ctx.user && !!ctx.user.email && String(e.data.workEmail || '').toLowerCase() === String(ctx.user.email).toLowerCase()).map(e => ({ path: e.path, name: String(e.data.name || '') }))[0] || { path: '', name: ctx.user ? String(ctx.user.name || '') : '' })"
      },
      "employeelinks": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeelinkoptions": {
        "kind": "computed",
        "expr": "(data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status !== 'terminated').map(e => ({ value: e.path, label: (String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || '') || e.name) + (e.data.jobTitle ? ' · ' + e.data.jobTitle : '') }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.heading",
                        "props": {
                          "level": 2,
                          "text": "{{ form.values.employee || 'New timesheet entry' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                          "tone": "{{ [\"validated\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : 'neutral' }}"
                        },
                        "rules": {
                          "visible": "!!form.values.status"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "Archived",
                          "tone": "warning",
                          "icon": "archive"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Timesheet entry {{ form.values.code || '' }}",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "This is me",
                      "variant": "ghost",
                      "icon": "user-check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "link-me-employeeref"
                    },
                    "rules": {
                      "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived') && (true) && !!data.me && !!data.me.path && form.values.employeeRef !== data.me.path",
                      "disabled": "form.saving"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Validate",
                      "icon": "check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "validate"
                    },
                    "rules": {
                      "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty || form.invalid"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Archive",
                          "variant": "ghost",
                          "icon": "archive",
                          "size": "sm"
                        },
                        "on": {
                          "click": "archive"
                        },
                        "rules": {
                          "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Restore",
                          "variant": "outline",
                          "icon": "archive-restore",
                          "size": "sm"
                        },
                        "on": {
                          "click": "restore"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Reset",
                          "variant": "ghost",
                          "size": "sm"
                        },
                        "on": {
                          "click": "reset"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Save",
                          "icon": "save",
                          "size": "sm"
                        },
                        "on": {
                          "click": "save"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This timesheet entry is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "Validated entries are locked. Hours were checked when it was validated.",
              "tone": "success",
              "icon": "check"
            },
            "rules": {
              "visible": "!(!form.values.status || form.values.status === 'draft')"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Entry"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employee }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.employeeRef }}",
                          "description": "Optional. Choosing a record fills the name.",
                          "options": "{{ data.employeelinkoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        },
                        "on": {
                          "update": [
                            {
                              "patch-form": {
                                "values": {
                                  "employee": "{{ ((data.employeelinks || []).filter(e => e.kind === 'file' && e.data && e.path === event).map(e => String(e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ') || ''))[0] || form.values.employee || '') }}"
                                }
                              }
                            }
                          ]
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Hours",
                          "value": "{{ form.values.hours }}",
                          "required": true,
                          "description": "A decimal number of hours, e.g. 7.5.",
                          "placeholder": "7.5"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Description",
                          "value": "{{ form.values.description }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Work",
                  "description": "Optional. Projects and tasks come from the Project app, when it is installed."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Project",
                          "value": "{{ form.values.project }}",
                          "options": "{{ data.projectoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Task",
                          "value": "{{ form.values.task }}",
                          "options": "{{ data.taskoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "link-me-employeeref": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "employeeRef": "{{ data.me.path }}",
                "employee": "{{ data.me.name }}"
              }
            }
          }
        ]
      },
      "validate": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Validate entry",
              "message": "Validate this timesheet entry? Validated entries can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/timesheets/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "validate-entry",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
