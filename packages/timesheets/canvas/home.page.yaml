{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "timesheets-home",
    "name": "Timesheets",
    "description": "Timesheet entries overview.",
    "icon": "clock"
  },
  "spec": {
    "access": [
      {
        "path": "/timesheets",
        "reason": "List timesheet entries"
      },
      {
        "path": "/projects",
        "reason": "Show project names (when Project is installed)"
      }
    ],
    "data": {
      "entries": {
        "kind": "folder",
        "path": "/timesheets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.timesheets.entry+json"
      },
      "projects": {
        "kind": "folder",
        "path": "/projects",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.project.project+json"
      },
      "listtimesheets": {
        "kind": "folder",
        "path": "/timesheets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.timesheets.entry+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Timesheets",
          "icon": "clock",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Entries",
              "icon": "layout-dashboard"
            },
            {
              "id": "week.page.yaml",
              "label": "Week",
              "icon": "calendar-days"
            },
            {
              "id": "to-validate.page.yaml",
              "label": "To validate",
              "icon": "check-check"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/timesheets/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/timesheets.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Timesheets",
              "note": "Timesheet entries are files in your workspace. Draft them in /timesheets, then validate them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft entries",
                  "value": "{{ (data.entries || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$entries.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated entries",
                  "value": "{{ (data.entries || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'validated')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$entries.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft hours",
                  "value": "{{ ((data.entries || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).reduce((s, e) => s + Math.round(Number(e.data.hours || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$entries.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Validated hours",
                  "value": "{{ ((data.entries || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'validated')).reduce((s, e) => s + Math.round(Number(e.data.hours || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "clock",
                  "loading": "{{ data.$entries.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "entries",
              "compact": true,
              "description": "The /timesheets folder could not be read. Reinstall Timesheets to recreate it."
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /timesheets",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/timesheets"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "listtimesheets",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.listtimesheets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "columns": [
                {
                  "key": "data.code",
                  "label": "Code"
                },
                {
                  "key": "data.employee",
                  "label": "Employee"
                },
                {
                  "key": "data.date",
                  "label": "Date",
                  "format": "date"
                },
                {
                  "key": "data.hours",
                  "label": "Hours"
                },
                {
                  "key": "data.status",
                  "label": "Status",
                  "format": "badge"
                }
              ],
              "facets": [
                "data.status"
              ],
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true,
              "rowKey": "path",
              "emptyText": "No entries yet. Use New in /timesheets."
            },
            "rules": {
              "visible": "data.$listtimesheets.status === 'ready'"
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
