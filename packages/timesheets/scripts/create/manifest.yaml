api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: timesheets-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Timesheets container.
file-access:
  - path: "/timesheets"
    mode: write
    reason: "Create timesheet entries with the next code"
  - path: "/settings/timesheets.json"
    mode: read
    reason: "Default new entries' employee name"
