api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: timesheets-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Validating checks the hours and marks entries validated conditionally.
file-access:
  - path: "/timesheets"
    mode: write
    reason: "Mark timesheet entries validated with their validation time"
  - path: "/employees"
    mode: read
    reason: "Check the linked employee still exists and is not terminated (when Employees is installed)"
