api-version: verentis.io/v1
kind: Theme

metadata:
  id: verentis-graphite-theme
  name: Verentis Graphite
  description: Neutral grayscale palette for a quiet, content-first workspace with
    matching dashboard stripes. Light and dark mode; it keeps your existing
    logos, favicon and backgrounds.
  icon: ./marketplace/logo.svg
  version: 1.0.4
  author: Verentis
  tags: [ theme, verentis, neutral ]

marketplace:
  logo: ./marketplace/logo.svg
  hero:
    source: ./marketplace/hero.svg
    alt: "Layered neutral gray bands from graphite to pale silver."
  readme: ./README.md

# Installs colours and dashboard heroes (record at themes/verentis-graphite-theme). Assets not listed here keep the
# workspace's current files.
spec:
  assets:
    theme.css: theme/theme.css
    hero: theme/hero.svg
    hero.dark: theme/hero-dark.svg

packaging:
  publisher: verentis
  files:
    - "theme/*"
  encryption: none
