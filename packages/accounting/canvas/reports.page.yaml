{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "accounting-reports",
    "name": "Financial reports",
    "description": "Trial balance, profit and loss, balance sheet and general ledger.",
    "icon": "chart-column"
  },
  "spec": {
    "access": [
      {
        "path": "/chart-of-accounts",
        "reason": "Report on the chart of accounts"
      },
      {
        "path": "/journals",
        "reason": "Sum the posted journals"
      }
    ],
    "data": {
      "accounts": {
        "kind": "folder",
        "path": "/chart-of-accounts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.account+json"
      },
      "journals": {
        "kind": "folder",
        "path": "/journals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.journal+json"
      },
      "period": {
        "kind": "computed",
        "expr": "(data.accounts || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'account').map(e => ({ path: e.path, code: e.data.code || e.name, number: e.data.number || '', name: e.data.name || '', type: e.data.accountType, units: (data.journals || []).filter(j => j.kind === 'file' && j.data && j.data.status === 'posted' && Array.isArray(j.data.lines) && (!state.fromdate || j.data.date >= state.fromdate) && (!state.todate || j.data.date <= state.todate)).reduce((sum, j) => sum + j.data.lines.filter(l => l.account === e.path).reduce((s, l) => s + (l.direction === 'debit' ? 1 : -1) * Math.round(Number(l.amount || 0) * 10000), 0), 0) })).sort((a, b) => (String(a.number) + a.code < String(b.number) + b.code ? -1 : 1))"
      },
      "position": {
        "kind": "computed",
        "expr": "(data.accounts || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'account').map(e => ({ path: e.path, code: e.data.code || e.name, number: e.data.number || '', name: e.data.name || '', type: e.data.accountType, units: (data.journals || []).filter(j => j.kind === 'file' && j.data && j.data.status === 'posted' && Array.isArray(j.data.lines) && (!state.todate || j.data.date <= state.todate)).reduce((sum, j) => sum + j.data.lines.filter(l => l.account === e.path).reduce((s, l) => s + (l.direction === 'debit' ? 1 : -1) * Math.round(Number(l.amount || 0) * 10000), 0), 0) })).sort((a, b) => (String(a.number) + a.code < String(b.number) + b.code ? -1 : 1))"
      }
    },
    "state": {
      "fromdate": "",
      "todate": ""
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Accounting",
          "icon": "book-open",
          "active": "reports.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "Reports",
              "icon": "chart-column"
            },
            {
              "id": "journals.page.yaml",
              "label": "Journals",
              "icon": "notebook-pen"
            },
            {
              "id": "expenses.page.yaml",
              "label": "Expenses",
              "icon": "receipt"
            },
            {
              "id": "periods.page.yaml",
              "label": "Periods",
              "icon": "calendar-range"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/accounting/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/accounting.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Financial reports",
              "note": "Computed from posted journals. Choose dates to limit the period; the balance sheet shows positions at the end date."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.form.date",
                "props": {
                  "label": "From",
                  "value": "{{ state.fromdate }}"
                }
              },
              {
                "type": "canvas.form.date",
                "props": {
                  "label": "To",
                  "value": "{{ state.todate }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "accounts",
              "compact": true
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "journals",
              "compact": true
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "trial",
                  "label": "Trial balance",
                  "icon": "scale"
                },
                {
                  "value": "profit",
                  "label": "Profit and loss",
                  "icon": "trending-up"
                },
                {
                  "value": "balance",
                  "label": "Balance sheet",
                  "icon": "landmark"
                },
                {
                  "value": "ledger",
                  "label": "General ledger",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Total debits",
                          "value": "{{ ((data.period || []).filter(b => b.units > 0).reduce((s, b) => s + b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "arrow-down-left",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Total credits",
                          "value": "{{ ((data.period || []).filter(b => b.units < 0).reduce((s, b) => s - b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "arrow-up-right",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.period || []).filter(b => b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, type: b.type, debit: b.units > 0 ? (b.units / 10000).toFixed(2) : '', credit: b.units < 0 ? (-b.units / 10000).toFixed(2) : '' })) }}",
                      "columns": [
                        {
                          "key": "number",
                          "label": "Number"
                        },
                        {
                          "key": "name",
                          "label": "Account"
                        },
                        {
                          "key": "type",
                          "label": "Type"
                        },
                        {
                          "key": "debit",
                          "label": "Debit",
                          "align": "end"
                        },
                        {
                          "key": "credit",
                          "label": "Credit",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No postings in this period",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "trial"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 3
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Income",
                          "value": "{{ ((data.period || []).filter(b => [\"income\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "trending-up",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Expenses",
                          "value": "{{ ((data.period || []).filter(b => [\"expense\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + 1 * b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "trending-down",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Net profit",
                          "value": "{{ (((data.period || []).filter(b => [\"income\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) - (data.period || []).filter(b => [\"expense\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + 1 * b.units, 0)) / 10000).toFixed(2) }}",
                          "icon": "scale",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Income"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.period || []).filter(b => [\"income\"].includes(b.type) && b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, amount: (-1 * b.units / 10000).toFixed(2) })) }}",
                          "columns": [
                            {
                              "key": "number",
                              "label": "Number"
                            },
                            {
                              "key": "name",
                              "label": "Account"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "end"
                            }
                          ],
                          "emptyText": "No income in this period",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Expenses"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.period || []).filter(b => [\"expense\"].includes(b.type) && b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, amount: (1 * b.units / 10000).toFixed(2) })) }}",
                          "columns": [
                            {
                              "key": "number",
                              "label": "Number"
                            },
                            {
                              "key": "name",
                              "label": "Account"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "end"
                            }
                          ],
                          "emptyText": "No expenses in this period",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ],
                "slot": "profit"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 2,
                        "gap": 4
                      },
                      "desktop": {
                        "columns": 3
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Assets",
                          "value": "{{ ((data.position || []).filter(b => [\"asset\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + 1 * b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "wallet",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Liabilities",
                          "value": "{{ ((data.position || []).filter(b => [\"liability\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) / 10000).toFixed(2) }}",
                          "icon": "credit-card",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.stat",
                        "props": {
                          "label": "Equity incl. earnings",
                          "value": "{{ (((data.position || []).filter(b => [\"equity\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) + ((data.position || []).filter(b => [\"income\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) - (data.position || []).filter(b => [\"expense\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + 1 * b.units, 0))) / 10000).toFixed(2) }}",
                          "icon": "landmark",
                          "loading": "{{ data.$journals.status === 'loading' }}"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Assets"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.position || []).filter(b => [\"asset\"].includes(b.type) && b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, amount: (1 * b.units / 10000).toFixed(2) })) }}",
                          "columns": [
                            {
                              "key": "number",
                              "label": "Number"
                            },
                            {
                              "key": "name",
                              "label": "Account"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "end"
                            }
                          ],
                          "emptyText": "No assets",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Liabilities"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.position || []).filter(b => [\"liability\"].includes(b.type) && b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, amount: (-1 * b.units / 10000).toFixed(2) })) }}",
                          "columns": [
                            {
                              "key": "number",
                              "label": "Number"
                            },
                            {
                              "key": "name",
                              "label": "Account"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "end"
                            }
                          ],
                          "emptyText": "No liabilities",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Equity"
                    },
                    "children": [
                      {
                        "type": "canvas.table",
                        "props": {
                          "rows": "{{ (data.position || []).filter(b => [\"equity\"].includes(b.type) && b.units !== 0).map(b => ({ path: b.path, number: b.number, name: b.name, amount: (-1 * b.units / 10000).toFixed(2) })) }}",
                          "columns": [
                            {
                              "key": "number",
                              "label": "Number"
                            },
                            {
                              "key": "name",
                              "label": "Account"
                            },
                            {
                              "key": "amount",
                              "label": "Amount",
                              "align": "end"
                            }
                          ],
                          "emptyText": "No equity postings",
                          "search": true,
                          "sortable": true,
                          "pageSize": 25,
                          "narrow": "list",
                          "clickable": true
                        },
                        "on": {
                          "row-click": [
                            {
                              "open-file": {
                                "path": "{{ event.path }}",
                                "mode": "edit",
                                "open": "side"
                              }
                            }
                          ]
                        }
                      },
                      {
                        "type": "canvas.text",
                        "props": {
                          "text": "Retained earnings (income less expenses to date): {{ (((data.position || []).filter(b => [\"income\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + -1 * b.units, 0) - (data.position || []).filter(b => [\"expense\"].includes(b.type) && b.units !== 0).reduce((s, b) => s + 1 * b.units, 0)) / 10000).toFixed(2) }}",
                          "tone": "muted"
                        }
                      }
                    ]
                  }
                ],
                "slot": "balance"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.journals || []).filter(j => j.kind === 'file' && j.data && j.data.status === 'posted' && Array.isArray(j.data.lines) && (!state.fromdate || j.data.date >= state.fromdate) && (!state.todate || j.data.date <= state.todate)).reduce((rows, j) => rows.concat(j.data.lines.map(l => ({ path: j.path, date: j.data.date, journal: j.data.code || j.name, account: l.account.split('/').pop(), description: l.description || j.data.description, debit: l.direction === 'debit' ? l.amount : '', credit: l.direction === 'credit' ? l.amount : '' }))), []).sort((a, b) => (a.date + a.journal < b.date + b.journal ? -1 : 1)) }}",
                      "columns": [
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "journal",
                          "label": "Journal"
                        },
                        {
                          "key": "account",
                          "label": "Account"
                        },
                        {
                          "key": "description",
                          "label": "Description"
                        },
                        {
                          "key": "debit",
                          "label": "Debit",
                          "align": "end"
                        },
                        {
                          "key": "credit",
                          "label": "Credit",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No postings in this period",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "ledger"
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Income and expenses"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "The largest income and expense accounts of the period.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.period || []).filter(b => ['income', 'expense'].includes(b.type) && b.units !== 0).map(b => ({ label: b.number + ' ' + b.name, value: Math.abs(b.units || 0) / 100, type: b.type })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing posted in this period",
                  "kind": "hbar",
                  "x": "label",
                  "y": "value",
                  "format": "number",
                  "decimals": 2,
                  "sort": "-value",
                  "limit": 12
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Position"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ ['asset', 'liability', 'equity'].map(type => ({ label: type, value: (data.position || []).filter(b => b.type === type).reduce((sum, b) => sum + Math.abs(b.units || 0) / 100, 0) })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing posted yet",
                  "kind": "strip",
                  "x": "label",
                  "y": "value",
                  "format": "number",
                  "decimals": 2,
                  "labels": {
                    "asset": "Assets",
                    "liability": "Liabilities",
                    "equity": "Equity"
                  }
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
