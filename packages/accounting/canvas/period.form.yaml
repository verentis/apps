api-version: canvas.verentis.io/v1
kind: Form
metadata:
  id: accounting-period
  name: Accounting period
  description: View and edit an Accounting period.
  icon: calendar-range
spec:
  binds:
  - pattern: application/vnd.verentis.accounting.period+json
    mode: edit
    priority: 200
    scope: global
    json-schema:
      id: https://schemas.verentis.io/accounting/v1/period.schema.json
      source: /applications/accounting/schemas/period.schema.json
      title: Accounting period
      version: '1'
  entry: ${var:canvas-origin}/render?document=%2Fapplications%2Faccounting%2Fcanvas%2Fperiod.form.yaml
  scope: global
  mime-types:
  - pattern: application/vnd.verentis.accounting.period+json
    mode: edit
    priority: 200
    json-schema:
      id: https://schemas.verentis.io/accounting/v1/period.schema.json
      source: /applications/accounting/schemas/period.schema.json
      title: Accounting period
      version: '1'
  permissions:
  - file.read
  - file.write
  capabilities: []
  sandbox:
    allow-scripts: true
    allow-same-origin: true
    allow-popups: false
    allow-forms: true
  file-access:
  - path: /applications/accounting/
    mode: read
    reason: Read the Accounting schemas and run the posting script
  access:
  - path: /applications/accounting/
    reason: Read the Accounting schemas and run the posting script
  data:
    record:
      kind: document
      consistency: conditional
  tree:
  - type: canvas.stack
    layout:
      base:
        padding: 6
        gap: 4
        maxWidth: 72rem
        margin:
          x: auto
    children:
    - type: canvas.stack
      layout:
        base:
          direction: row
          wrap: true
          gap: 2
          align: center
          justify: between
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 1
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.heading
            props:
              level: 2
              text: '{{ form.values.name || ''New period'' }}'
          - type: canvas.dashboard.badge
            props:
              text: '{{ String(form.values.status || '''').split(''-'').join('' '') }}'
              tone: '{{ ["posted","closed"].includes(form.values.status) ? ''success'' : ["draft"].includes(form.values.status)
                ? ''warning'' : ["reversed"].includes(form.values.status) ? ''danger'' : ["open","asset","liability","equity","income","expense"].includes(form.values.status)
                ? ''info'' : ''neutral'' }}'
            rules:
              visible: '!!form.values.status'
          - type: canvas.dashboard.badge
            props:
              text: Archived
              tone: warning
              icon: archive
            rules:
              visible: form.values.state === 'archived'
        - type: canvas.text
          props:
            text: Period {{ form.values.code || '' }} · {{ ctx.file.path }}
            tone: muted
      - type: canvas.stack
        layout:
          base:
            direction: row
            wrap: true
            gap: 2
            align: center
        children:
        - type: canvas.button
          props:
            label: Close period
            variant: outline
            icon: lock
            size: sm
          'on':
            click: close-period
          rules:
            visible: form.values.status === 'open' && !(form.values.state === 'archived')
            disabled: form.saving || form.dirty
        - type: canvas.button
          props:
            label: Reopen
            variant: ghost
            icon: lock-open
            size: sm
          'on':
            click: reopen-period
          rules:
            visible: form.values.status === 'closed'
            disabled: form.saving || form.dirty
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Archive
              variant: ghost
              icon: archive
              size: sm
            'on':
              click: archive
            rules:
              visible: '!(form.values.state === ''archived'') && !(form.values.status === ''closed'')'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Restore
              variant: outline
              icon: archive-restore
              size: sm
            'on':
              click: restore
            rules:
              visible: form.values.state === 'archived'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Reset
              variant: ghost
              size: sm
            'on':
              click: reset
            rules:
              disabled: form.saving || !form.dirty
          - type: canvas.button
            props:
              label: Save
              icon: save
              size: sm
            'on':
              click: save
            rules:
              disabled: form.saving || !form.dirty || form.invalid || form.values.state === 'archived'
                || (form.values.status === 'closed')
    - type: canvas.text
      props:
        text: '{{ data.$record.error }}'
      rules:
        visible: data.$record.status === 'error'
    - type: canvas.text
      props:
        text: Loading…
        tone: muted
      rules:
        visible: data.$record.status === 'loading'
    - type: canvas.dashboard.badge
      props:
        text: This period is archived. Restore it to edit.
        tone: warning
        icon: archive
      rules:
        visible: form.values.state === 'archived'
    - type: canvas.grid
      layout:
        base:
          columns: 1
          gap: 4
        tablet:
          columns: 2
      children:
      - type: canvas.card
        props:
          title: Period
        children:
        - type: canvas.grid
          layout:
            base:
              columns: 1
              gap: 4
            tablet:
              columns: 2
          children:
          - type: canvas.form.input
            props:
              label: Name
              value: '{{ form.values.name }}'
              required: true
              placeholder: FY2026 March
            layout:
              tablet:
                colSpan: 2
            rules:
              disabled: (form.values.state === 'archived' || (form.values.status === 'closed'))
          - type: canvas.form.date
            props:
              label: Start
              value: '{{ form.values.startDate }}'
              required: true
            rules:
              disabled: (form.values.state === 'archived' || (form.values.status === 'closed'))
          - type: canvas.form.date
            props:
              label: End
              value: '{{ form.values.endDate }}'
              required: true
            rules:
              disabled: (form.values.state === 'archived' || (form.values.status === 'closed'))
  actions:
    save:
      steps:
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
    reset:
      steps:
      - reset-form: {}
    archive:
      steps:
      - confirm:
          title: Archive
          message: Archive this record? It stays in the workspace and can be restored.
      - patch-form:
          values:
            state: archived
            archivedAt: '{{ Date() }}'
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Archived
          variant: success
    restore:
      steps:
      - patch-form:
          values:
            state: active
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Restored
          variant: success
    close-period:
      steps:
      - confirm:
          title: Close period
          message: Close this period? Nothing can be posted into its dates until it is reopened.
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
            status: closed
            closedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
    reopen-period:
      steps:
      - confirm:
          title: Reopen period
          message: Reopen this closed period so postings can be dated in it again?
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
            status: open
            closedAt: '{{ undefined }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
