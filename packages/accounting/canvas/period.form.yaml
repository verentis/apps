{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "accounting-period",
    "name": "Accounting period",
    "description": "View and edit an Accounting period.",
    "icon": "calendar-range"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.accounting.period+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/accounting/v1/period.schema.json",
          "source": "/applications/accounting/schemas/period.schema.json",
          "title": "Accounting period",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Faccounting%2Fcanvas%2Fperiod.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.accounting.period+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/accounting/v1/period.schema.json",
          "source": "/applications/accounting/schemas/period.schema.json",
          "title": "Accounting period",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/journals",
        "mode": "read",
        "reason": "Check for draft journals in this period"
      },
      {
        "path": "/expenses",
        "mode": "read",
        "reason": "Check for draft expenses in this period"
      },
      {
        "path": "/periods",
        "mode": "read",
        "reason": "Check that earlier periods are closed"
      },
      {
        "path": "/applications/accounting/",
        "mode": "read",
        "reason": "Read the Accounting schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/journals",
        "reason": "Check for draft journals in this period"
      },
      {
        "path": "/expenses",
        "reason": "Check for draft expenses in this period"
      },
      {
        "path": "/periods",
        "reason": "Check that earlier periods are closed"
      },
      {
        "path": "/applications/accounting/",
        "reason": "Read the Accounting schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "journals": {
        "kind": "folder",
        "path": "/journals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.journal+json"
      },
      "expenses": {
        "kind": "folder",
        "path": "/expenses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.expense+json"
      },
      "periods": {
        "kind": "folder",
        "path": "/periods",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.period+json"
      },
      "draftjournals": {
        "kind": "computed",
        "expr": "(data.journals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (!e.data.status || e.data.status === 'draft') && e.data.date >= form.values.startDate && e.data.date <= form.values.endDate)"
      },
      "draftexpenses": {
        "kind": "computed",
        "expr": "(data.expenses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (!e.data.status || e.data.status === 'draft') && e.data.date >= form.values.startDate && e.data.date <= form.values.endDate)"
      },
      "openearlier": {
        "kind": "computed",
        "expr": "(data.periods || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.path !== ctx.file.path && e.data.status !== 'closed' && e.data.endDate < form.values.startDate)"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New period' }}",
              "note": "Period {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"posted\",\"closed\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : [\"reversed\"].includes(form.values.status) ? 'danger' : [\"open\",\"asset\",\"liability\",\"equity\",\"income\",\"expense\"].includes(form.values.status) ? 'info' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Close period",
                  "variant": "outline",
                  "icon": "lock",
                  "size": "sm"
                },
                "on": {
                  "click": "close-period"
                },
                "rules": {
                  "visible": "form.values.status === 'open' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Reopen",
                  "variant": "ghost",
                  "icon": "lock-open",
                  "size": "sm"
                },
                "on": {
                  "click": "reopen-period"
                },
                "rules": {
                  "visible": "form.values.status === 'closed'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.status === 'closed')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'closed')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This period is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Before closing",
              "description": "Post or archive what is listed, then close the period."
            },
            "children": [
              {
                "type": "canvas.checklist",
                "props": {
                  "readOnly": true,
                  "checks": {
                    "$expr": "[{ label: 'No draft journals dated in this period', ok: (data.draftjournals || []).length === 0, detail: (data.draftjournals || []).map(e => e.data.code).join(', ') }, { label: 'No draft expenses dated in this period', ok: (data.draftexpenses || []).length === 0, detail: (data.draftexpenses || []).map(e => e.data.code).join(', ') }, { label: 'Every earlier period is closed', ok: (data.openearlier || []).length === 0, detail: (data.openearlier || []).map(e => e.data.name || e.data.code).join(', ') }]"
                  }
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Period"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Name",
                          "value": "{{ form.values.name }}",
                          "required": true,
                          "placeholder": "FY2026 March"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'closed'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Start",
                          "value": "{{ form.values.startDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'closed'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "End",
                          "value": "{{ form.values.endDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'closed'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "close-period": {
        "steps": [
          {
            "confirm": {
              "title": "Close period",
              "message": "Close this period? Nothing can be posted into its dates until it is reopened."
            }
          },
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}",
                "status": "closed",
                "closedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reopen-period": {
        "steps": [
          {
            "confirm": {
              "title": "Reopen period",
              "message": "Reopen this closed period so postings can be dated in it again?"
            }
          },
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}",
                "status": "open",
                "closedAt": "{{ undefined }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
