api-version: canvas.verentis.io/v1
kind: Form
metadata:
  id: accounting-expense
  name: Accounting expense
  description: View and edit an Accounting expense.
  icon: receipt
spec:
  binds:
  - pattern: application/vnd.verentis.accounting.expense+json
    mode: edit
    priority: 200
    scope: global
    json-schema:
      id: https://schemas.verentis.io/accounting/v1/expense.schema.json
      source: /applications/accounting/schemas/expense.schema.json
      title: Accounting expense
      version: '1'
  entry: ${var:canvas-origin}/render?document=%2Fapplications%2Faccounting%2Fcanvas%2Fexpense.form.yaml
  scope: global
  mime-types:
  - pattern: application/vnd.verentis.accounting.expense+json
    mode: edit
    priority: 200
    json-schema:
      id: https://schemas.verentis.io/accounting/v1/expense.schema.json
      source: /applications/accounting/schemas/expense.schema.json
      title: Accounting expense
      version: '1'
  permissions:
  - file.read
  - file.write
  - execution.run
  - execution.read
  capabilities: []
  sandbox:
    allow-scripts: true
    allow-same-origin: true
    allow-popups: false
    allow-forms: true
  file-access:
  - path: /chart-of-accounts
    mode: read
    reason: Choose the expense and payment accounts
  - path: /settings/accounting.json
    mode: read
    reason: Offer the tax codes
  - path: /applications/accounting/
    mode: read
    reason: Read the Accounting schemas and run the posting script
  access:
  - path: /chart-of-accounts
    reason: Choose the expense and payment accounts
  - path: /settings/accounting.json
    reason: Offer the tax codes
  - path: /applications/accounting/
    reason: Read the Accounting schemas and run the posting script
  data:
    record:
      kind: document
      consistency: conditional
    accounts:
      kind: folder
      path: /chart-of-accounts
      contents: true
      mime-pattern: application/vnd.verentis.accounting.account+json
    accountoptions:
      kind: computed
      expr: '(data.accounts || []).filter(e => e.kind === ''file'' && e.data && e.data.state !== ''archived''
        && (true)).map(e => ({ label: (e.data.code || e.name) + '' · '' + ((e.data.number ? e.data.number
        + '' '' : '''') + (e.data.name || '''')), value: e.path }))'
    settings:
      kind: file
      path: /settings/accounting.json
      parse: json
    expenseaccountoptions:
      kind: computed
      expr: '(data.accounts || []).filter(e => e.kind === ''file'' && e.data && e.data.state !== ''archived''
        && (["expense","asset"].includes(e.data.accountType))).map(e => ({ label: (e.data.code || e.name)
        + '' · '' + ((e.data.number ? e.data.number + '' '' : '''') + (e.data.name || '''')), value: e.path
        }))'
    paymentaccountoptions:
      kind: computed
      expr: '(data.accounts || []).filter(e => e.kind === ''file'' && e.data && e.data.state !== ''archived''
        && (["asset","liability","equity"].includes(e.data.accountType))).map(e => ({ label: (e.data.code
        || e.name) + '' · '' + ((e.data.number ? e.data.number + '' '' : '''') + (e.data.name || '''')),
        value: e.path }))'
    taxcodeoptions:
      kind: computed
      expr: '((data.settings && data.settings.taxCodes) || []).map(t => ({ label: t.code + '' · '' + t.name
        + '' ('' + t.ratePercent + ''%)'', value: t.code }))'
  state:
    reversaldate: ''
    reversalreason: ''
  tree:
  - type: canvas.stack
    layout:
      base:
        padding: 6
        gap: 4
        maxWidth: 72rem
        margin:
          x: auto
    children:
    - type: canvas.stack
      layout:
        base:
          direction: row
          wrap: true
          gap: 2
          align: center
          justify: between
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 1
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.heading
            props:
              level: 2
              text: '{{ form.values.description || ''New expense'' }}'
          - type: canvas.dashboard.badge
            props:
              text: '{{ String(form.values.status || '''').split(''-'').join('' '') }}'
              tone: '{{ ["posted","closed"].includes(form.values.status) ? ''success'' : ["draft"].includes(form.values.status)
                ? ''warning'' : ["reversed"].includes(form.values.status) ? ''danger'' : ["open","asset","liability","equity","income","expense"].includes(form.values.status)
                ? ''info'' : ''neutral'' }}'
            rules:
              visible: '!!form.values.status'
          - type: canvas.dashboard.badge
            props:
              text: Archived
              tone: warning
              icon: archive
            rules:
              visible: form.values.state === 'archived'
        - type: canvas.text
          props:
            text: Expense {{ form.values.code || '' }} · {{ ctx.file.path }}
            tone: muted
      - type: canvas.stack
        layout:
          base:
            direction: row
            wrap: true
            gap: 2
            align: center
        children:
        - type: canvas.button
          props:
            label: Post
            icon: check
            size: sm
          'on':
            click: post
          rules:
            visible: (!form.values.status || form.values.status === 'draft') && !(form.values.state ===
              'archived')
            disabled: form.saving || form.dirty || form.invalid
        - type: canvas.button
          props:
            label: Reverse
            variant: outline
            icon: undo-2
            size: sm
          'on':
            click: reverse
          rules:
            visible: form.values.status === 'posted'
            disabled: form.saving || form.dirty
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Archive
              variant: ghost
              icon: archive
              size: sm
            'on':
              click: archive
            rules:
              visible: '!(form.values.state === ''archived'') && !(!!form.values.status && form.values.status
                !== ''draft'')'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Restore
              variant: outline
              icon: archive-restore
              size: sm
            'on':
              click: restore
            rules:
              visible: form.values.state === 'archived'
              disabled: form.saving || form.dirty
          - type: canvas.button
            props:
              label: Reset
              variant: ghost
              size: sm
            'on':
              click: reset
            rules:
              disabled: form.saving || !form.dirty
          - type: canvas.button
            props:
              label: Save
              icon: save
              size: sm
            'on':
              click: save
            rules:
              disabled: form.saving || !form.dirty || form.invalid || form.values.state === 'archived'
                || (!!form.values.status && form.values.status !== 'draft')
    - type: canvas.text
      props:
        text: '{{ data.$record.error }}'
      rules:
        visible: data.$record.status === 'error'
    - type: canvas.text
      props:
        text: Loading…
        tone: muted
      rules:
        visible: data.$record.status === 'loading'
    - type: canvas.dashboard.badge
      props:
        text: This expense is archived. Restore it to edit.
        tone: warning
        icon: archive
      rules:
        visible: form.values.state === 'archived'
    - type: canvas.tabs
      props:
        items:
        - value: overview
          label: Overview
          icon: receipt
        - value: documents
          label: Receipts
          icon: paperclip
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Journal
              variant: ghost
              icon: notebook-pen
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.journal && form.values.journal.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.journal && form.values.journal.path)'
          - type: canvas.button
            props:
              label: Reversal
              variant: ghost
              icon: undo-2
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ form.values.reversalJournal && form.values.reversalJournal.path }}'
                  mode: edit
            rules:
              visible: '!!(form.values.reversalJournal && form.values.reversalJournal.path)'
        - type: canvas.text
          props:
            text: Accounting settings could not be read from /settings/accounting.json. Tax codes are
              unavailable.
          rules:
            visible: data.$settings.status === 'error'
        - type: canvas.text
          props:
            text: Loading…
            tone: muted
          rules:
            visible: data.$settings.status === 'loading'
        - type: canvas.text
          props:
            text: Gross amount {{ form.values.currency }} {{ form.values.grossAmount }}
            tone: muted
          rules:
            visible: '!!form.values.grossAmount'
        - type: canvas.grid
          layout:
            base:
              columns: 1
              gap: 4
            tablet:
              columns: 2
          children:
          - type: canvas.form.date
            props:
              label: Reversal date
              description: Defaults to today.
              value: '{{ state.reversaldate }}'
            rules:
              visible: form.values.status === 'posted'
          - type: canvas.form.input
            props:
              label: Reason
              placeholder: Why is this being reversed?
              value: '{{ state.reversalreason }}'
            rules:
              visible: form.values.status === 'posted'
        - type: canvas.grid
          layout:
            base:
              columns: 1
              gap: 4
            tablet:
              columns: 2
          children:
          - type: canvas.card
            props:
              title: Expense
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.input
                props:
                  label: Description
                  value: '{{ form.values.description }}'
                  required: true
                layout:
                  tablet:
                    colSpan: 2
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.input
                props:
                  label: Payee
                  value: '{{ form.values.payee }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.date
                props:
                  label: Date
                  value: '{{ form.values.date }}'
                  required: true
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
          - type: canvas.card
            props:
              title: Amounts
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.input
                props:
                  label: Currency
                  value: '{{ form.values.currency }}'
                  required: true
                  placeholder: ZAR
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.input
                props:
                  label: Net amount
                  value: '{{ form.values.netAmount }}'
                  required: true
                  placeholder: '0.00'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.input
                props:
                  label: Tax amount
                  value: '{{ form.values.taxAmount }}'
                  placeholder: '0.00'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.select
                props:
                  label: Tax code
                  value: '{{ form.values.taxCode }}'
                  options: '{{ data.taxcodeoptions }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
          - type: canvas.card
            props:
              title: Accounts
            children:
            - type: canvas.grid
              layout:
                base:
                  columns: 1
                  gap: 4
                tablet:
                  columns: 2
              children:
              - type: canvas.form.select
                props:
                  label: Expense account
                  value: '{{ form.values.expenseAccount }}'
                  required: true
                  options: '{{ data.expenseaccountoptions }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
              - type: canvas.form.select
                props:
                  label: Paid from
                  value: '{{ form.values.paymentAccount }}'
                  required: true
                  options: '{{ data.paymentaccountoptions }}'
                rules:
                  disabled: (form.values.state === 'archived' || (!!form.values.status && form.values.status
                    !== 'draft'))
        slot: overview
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.text
          props:
            text: Receipts and supporting documents for this expense. Files live in {{ ctx.file.path }}/documents.
            tone: muted
        - type: canvas.stack
          layout:
            base:
              direction: row
              wrap: true
              gap: 2
              align: center
          children:
          - type: canvas.button
            props:
              label: Open in Files
              variant: outline
              icon: folder-open
              size: sm
            'on':
              click:
              - open-file:
                  path: '{{ ctx.file.path }}/documents'
        - type: canvas.files
          props:
            path: ./documents/
            columns:
            - name
            - type
            - size
            - modified
            emptyText: No documents yet
        slot: documents
  actions:
    save:
      steps:
      - patch-form:
          values:
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Saved
          variant: success
    reset:
      steps:
      - reset-form: {}
    archive:
      steps:
      - confirm:
          title: Archive
          message: Archive this record? It stays in the workspace and can be restored.
      - patch-form:
          values:
            state: archived
            archivedAt: '{{ Date() }}'
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Archived
          variant: success
    restore:
      steps:
      - patch-form:
          values:
            state: active
            updatedAt: '{{ Date() }}'
      - save: {}
      - toast:
          message: Restored
          variant: success
    post:
      permissions:
      - execution.run
      - execution.read
      steps:
      - confirm:
          title: Post expense
          message: Post this expense to the ledger? Posted expenses cannot be edited, only reversed.
      - run-script:
          file: /applications/accounting/scripts/post
          timeout: 120
          parameters:
            operation: post-expense
            path: '{{ ctx.file.path }}'
          assign: lastresult
      - refresh-source:
          source: record
      - toast:
          message: '{{ (state.lastresult && state.lastresult.message) || ''Done'' }}'
          variant: success
    reverse:
      permissions:
      - execution.run
      - execution.read
      steps:
      - confirm:
          title: Reverse expense
          message: Reverse this expense's journal?
      - run-script:
          file: /applications/accounting/scripts/post
          timeout: 120
          parameters:
            operation: reverse-expense
            path: '{{ ctx.file.path }}'
            date: '{{ state.reversaldate }}'
            reason: '{{ state.reversalreason }}'
          assign: lastresult
      - refresh-source:
          source: record
      - toast:
          message: '{{ (state.lastresult && state.lastresult.message) || ''Done'' }}'
          variant: success
