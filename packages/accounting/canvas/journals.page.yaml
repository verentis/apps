{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "accounting-journals",
    "name": "Journals",
    "description": "Every journal, drafts to post first.",
    "icon": "notebook-pen"
  },
  "spec": {
    "access": [
      {
        "path": "/journals",
        "reason": "List journals"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/journals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.accounting.journal+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Accounting",
          "icon": "book-open",
          "active": "journals.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "reports.page.yaml",
              "label": "Reports",
              "icon": "chart-column"
            },
            {
              "id": "journals.page.yaml",
              "label": "Journals",
              "icon": "notebook-pen"
            },
            {
              "id": "expenses.page.yaml",
              "label": "Expenses",
              "icon": "receipt"
            },
            {
              "id": "periods.page.yaml",
              "label": "Periods",
              "icon": "calendar-range"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/accounting/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/accounting.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Journals",
              "note": "Every journal, drafts to post first."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, date: e.data.date, description: e.data.description || '', status: e.data.status || 'draft', lines: (e.data.lines || []).length, from: e.data.postedBy && e.data.postedBy.app ? e.data.postedBy.app : '' })).sort((a, b) => (a.status === 'draft' ? 0 : 1) - (b.status === 'draft' ? 0 : 1) || (a.date < b.date ? 1 : -1)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Journal"
                },
                {
                  "key": "date",
                  "label": "Date",
                  "format": "date"
                },
                {
                  "key": "description",
                  "label": "Description"
                },
                {
                  "key": "lines",
                  "label": "Lines",
                  "align": "end"
                },
                {
                  "key": "from",
                  "label": "Posted by"
                },
                {
                  "key": "status",
                  "label": "Status",
                  "format": "badge"
                }
              ],
              "emptyText": "No journals yet.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
