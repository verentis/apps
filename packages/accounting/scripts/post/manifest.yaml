api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: accounting-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Posting validates against accounts and periods and writes journals and expenses conditionally.
file-access:
  - path: "/settings/accounting.json"
    mode: read
    reason: "Read the base currency, precision and tax codes"
  - path: "/chart-of-accounts"
    mode: read
    reason: "Check that posted accounts exist and are active"
  - path: "/periods"
    mode: read
    reason: "Find the open period a posting date falls in"
  - path: "/journals"
    mode: write
    reason: "Post journals, write expense journals and reversals"
  - path: "/expenses"
    mode: write
    reason: "Mark expenses posted or reversed"
