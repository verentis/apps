api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: accounting-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Accounting containers.
file-access:
  - path: "/chart-of-accounts"
    mode: write
    reason: "Create accounts with the next code"
  - path: "/periods"
    mode: write
    reason: "Create periods with the next code"
  - path: "/journals"
    mode: write
    reason: "Create journals with the next code"
  - path: "/expenses"
    mode: write
    reason: "Create expenses with the next code"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Default new journals and expenses to the base currency"
