api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: accounting-api
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The ledger operations other apps call through the platform (api.yaml); journals are written create-only.
file-access:
  - path: "/settings/accounting.json"
    mode: read
    reason: "Check the base currency and precision of journals other apps post"
  - path: "/chart-of-accounts"
    mode: read
    reason: "Check that posted accounts exist and are active"
  - path: "/periods"
    mode: read
    reason: "Find the open period a posting date falls in"
  - path: "/journals"
    mode: write
    reason: "Post and reverse journals other apps ask for"
