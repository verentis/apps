{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "surveys-home",
    "name": "Surveys",
    "description": "Surveys overview.",
    "icon": "clipboard-list"
  },
  "spec": {
    "access": [
      {
        "path": "/surveys",
        "reason": "Count surveys and responses and show them"
      },
      {
        "path": "/survey-responses",
        "reason": "Count surveys and responses and show them"
      }
    ],
    "data": {
      "surveys": {
        "kind": "folder",
        "path": "/surveys",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.survey+json"
      },
      "responses": {
        "kind": "folder",
        "path": "/survey-responses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.response+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.surveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', status: e.data.status || '', questions: (e.data.questions || []).length, submitted: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).length, drafts: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'draft' && r.data.survey === e.path).length }))"
      },
      "listsurveys": {
        "kind": "folder",
        "path": "/surveys",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.survey+json"
      },
      "listsurveyresponses": {
        "kind": "folder",
        "path": "/survey-responses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.response+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Surveys",
          "icon": "clipboard-list",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "surveys.page.yaml",
              "label": "Surveys",
              "icon": "kanban"
            },
            {
              "id": "results.page.yaml",
              "label": "Results",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/surveys/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/surveys.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Surveys",
              "note": "Surveys and responses are files in your workspace. Draft a questionnaire in /surveys, open it, then submit responses from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open surveys",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'open').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft surveys",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed surveys",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'closed').length }}",
                  "icon": "lock",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Submitted responses",
                  "value": "{{ (data.rows || []).reduce((total, r) => total + r.submitted, 0) }}",
                  "icon": "send",
                  "loading": "{{ data.$responses.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "surveys",
              "compact": true,
              "description": "The /surveys folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "responses",
              "compact": true,
              "description": "The /survey-responses folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "surveys",
                  "label": "Surveys",
                  "icon": "clipboard-list"
                },
                {
                  "value": "responses",
                  "label": "Responses",
                  "icon": "message-square-text"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /surveys",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/surveys"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsurveys",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsurveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Survey"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No surveys yet. Use New in /surveys."
                    },
                    "rules": {
                      "visible": "data.$listsurveys.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "surveys"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /survey-responses",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/survey-responses"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsurveyresponses",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsurveyresponses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Response"
                        },
                        {
                          "key": "data.respondentName",
                          "label": "Respondent"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No responses yet. Use New in /survey-responses."
                    },
                    "rules": {
                      "visible": "data.$listsurveyresponses.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "responses"
              }
            ]
          }
        ]
      }
    ]
  }
}
