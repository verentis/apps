{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "surveys-results",
    "name": "Results",
    "description": "Per-question results over the submitted responses.",
    "icon": "bar-chart"
  },
  "spec": {
    "access": [
      {
        "path": "/surveys",
        "reason": "Tally choices and average ratings over the submitted responses"
      },
      {
        "path": "/survey-responses",
        "reason": "Tally choices and average ratings over the submitted responses"
      }
    ],
    "data": {
      "surveys": {
        "kind": "folder",
        "path": "/surveys",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.survey+json"
      },
      "responses": {
        "kind": "folder",
        "path": "/survey-responses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.response+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.surveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', status: e.data.status || '', questions: (e.data.questions || []).length, submitted: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).length, drafts: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'draft' && r.data.survey === e.path).length }))"
      },
      "results": {
        "kind": "computed",
        "expr": "(data.surveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => (e.data.questions || []).map(q => q.kind === 'rating' ? [({ path: e.path, survey: e.data.code || e.name, question: q.text || '', metric: 'Average rating', value: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).map(a => Number(a.value)).filter(v => v >= 1 && v <= 5).length ? ((data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).map(a => Number(a.value)).filter(v => v >= 1 && v <= 5).reduce((t, v) => t + v, 0) / (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).map(a => Number(a.value)).filter(v => v >= 1 && v <= 5).length).toFixed(1) : '' })] : q.kind === 'single-choice' ? (q.choices || []).map(c => ({ path: e.path, survey: e.data.code || e.name, question: q.text || '', metric: c, value: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).filter(a => a.value === c).length })) : q.kind === 'multi-choice' ? (q.choices || []).map(c => ({ path: e.path, survey: e.data.code || e.name, question: q.text || '', metric: c, value: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).filter(a => (a.values || []).indexOf(c) >= 0).length })) : [({ path: e.path, survey: e.data.code || e.name, question: q.text || '', metric: 'Answered', value: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).map(r => (r.data.answers || []).filter(a => a.sequence === q.sequence)[0]).filter(a => !!a).filter(a => String(a.value || '').trim()).length })]).reduce((all, rows) => all.concat(rows), [])).reduce((all, rows) => all.concat(rows), [])"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Surveys",
          "icon": "clipboard-list",
          "active": "results.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "surveys.page.yaml",
              "label": "Surveys",
              "icon": "kanban"
            },
            {
              "id": "results.page.yaml",
              "label": "Results",
              "icon": "chart-column"
            },
            {
              "id": "responses.page.yaml",
              "label": "Responses",
              "icon": "message-square-text"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/surveys/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/surveys.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Results",
              "note": "Per-choice tallies, average ratings (1-5) and answered counts, computed from the submitted responses. Click a row to open the survey."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Responses per survey"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => ({ path: r.path, label: r.title || r.code, submitted: r.submitted || 0, drafts: r.drafts || 0 })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "submitted",
                    "drafts"
                  ],
                  "labels": {
                    "submitted": "Submitted",
                    "drafts": "Still drafts"
                  },
                  "palette": {
                    "submitted": "chart-1",
                    "drafts": "muted"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "surveys",
              "compact": true,
              "description": "The /surveys folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "responses",
              "compact": true,
              "description": "The /survey-responses folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Surveys",
                  "value": "{{ (data.rows || []).length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Submitted responses",
                  "value": "{{ (data.rows || []).reduce((total, r) => total + r.submitted, 0) }}",
                  "icon": "send",
                  "loading": "{{ data.$responses.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft responses",
                  "value": "{{ (data.rows || []).reduce((total, r) => total + r.drafts, 0) }}",
                  "icon": "pencil",
                  "loading": "{{ data.$responses.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Responses per survey"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ data.rows || [] }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Survey"
                    },
                    {
                      "key": "title",
                      "label": "Title"
                    },
                    {
                      "key": "questions",
                      "label": "Questions",
                      "align": "end"
                    },
                    {
                      "key": "submitted",
                      "label": "Submitted",
                      "align": "end"
                    },
                    {
                      "key": "drafts",
                      "label": "Drafts",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No surveys yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Results per question"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ data.results || [] }}",
                  "columns": [
                    {
                      "key": "survey",
                      "label": "Survey"
                    },
                    {
                      "key": "question",
                      "label": "Question"
                    },
                    {
                      "key": "metric",
                      "label": "Choice / metric"
                    },
                    {
                      "key": "value",
                      "label": "Result",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No submitted responses yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
