{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "surveys-surveys",
    "name": "All surveys",
    "description": "Every survey, listed by status.",
    "icon": "clipboard-list"
  },
  "spec": {
    "access": [
      {
        "path": "/surveys",
        "reason": "List surveys by status with their response counts"
      },
      {
        "path": "/survey-responses",
        "reason": "List surveys by status with their response counts"
      }
    ],
    "data": {
      "surveys": {
        "kind": "folder",
        "path": "/surveys",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.survey+json"
      },
      "responses": {
        "kind": "folder",
        "path": "/survey-responses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.response+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.surveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', status: e.data.status || '', questions: (e.data.questions || []).length, submitted: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).length, drafts: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'draft' && r.data.survey === e.path).length }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Surveys by status"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active survey, grouped by its status. Click a row to open the survey.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Surveys",
                  "variant": "ghost",
                  "icon": "clipboard-list",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/surveys/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /surveys folder could not be read. Reinstall Surveys to recreate it."
            },
            "rules": {
              "visible": "data.$surveys.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /survey-responses folder could not be read. Reinstall Surveys to recreate it."
            },
            "rules": {
              "visible": "data.$responses.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'open').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'closed').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "icon": "clipboard-list"
                },
                {
                  "value": "open",
                  "label": "Open",
                  "icon": "clipboard-list"
                },
                {
                  "value": "closed",
                  "label": "Closed",
                  "icon": "clipboard-list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'draft') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Survey"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "questions",
                          "label": "Questions",
                          "align": "end"
                        },
                        {
                          "key": "submitted",
                          "label": "Submitted",
                          "align": "end"
                        },
                        {
                          "key": "drafts",
                          "label": "Drafts",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No draft surveys",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "draft"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'open') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Survey"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "questions",
                          "label": "Questions",
                          "align": "end"
                        },
                        {
                          "key": "submitted",
                          "label": "Submitted",
                          "align": "end"
                        },
                        {
                          "key": "drafts",
                          "label": "Drafts",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No open surveys",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "open"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'closed') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Survey"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "questions",
                          "label": "Questions",
                          "align": "end"
                        },
                        {
                          "key": "submitted",
                          "label": "Submitted",
                          "align": "end"
                        },
                        {
                          "key": "drafts",
                          "label": "Drafts",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No closed surveys",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "closed"
              }
            ]
          }
        ]
      }
    ]
  }
}
