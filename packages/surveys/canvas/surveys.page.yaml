{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "surveys-surveys",
    "name": "All surveys",
    "description": "Every survey, listed by status.",
    "icon": "clipboard-list"
  },
  "spec": {
    "access": [
      {
        "path": "/surveys",
        "reason": "List surveys by status with their response counts; move records between columns",
        "mode": "write"
      },
      {
        "path": "/survey-responses",
        "reason": "List surveys by status with their response counts"
      }
    ],
    "data": {
      "surveys": {
        "kind": "folder",
        "path": "/surveys",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.survey+json"
      },
      "responses": {
        "kind": "folder",
        "path": "/survey-responses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.surveys.response+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.surveys || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', status: e.data.status || '', questions: (e.data.questions || []).length, submitted: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'submitted' && r.data.survey === e.path).length, drafts: (data.responses || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && r.data.status === 'draft' && r.data.survey === e.path).length }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Surveys",
          "icon": "clipboard-list",
          "active": "surveys.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "surveys.page.yaml",
              "label": "Surveys",
              "icon": "kanban"
            },
            {
              "id": "results.page.yaml",
              "label": "Results",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/surveys/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/surveys.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Surveys by status",
              "note": "Every active survey, grouped by its status. Click a row to open the survey."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "surveys",
              "compact": true,
              "description": "The /surveys folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "responses",
              "compact": true,
              "description": "The /survey-responses folder could not be read. Reinstall Surveys to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'open').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'closed').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$surveys.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "status",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "draft",
                          "label": "Draft"
                        },
                        {
                          "value": "open",
                          "label": "Open"
                        },
                        {
                          "value": "closed",
                          "label": "Closed"
                        }
                      ],
                      "card": {
                        "title": "title",
                        "code": "code",
                        "meta": [
                          "questions",
                          "submitted",
                          "drafts"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"closed\"].includes(row.status)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'closed'",
                            "title": "Move to Closed?",
                            "message": "{{ event.row.code }} moves to Closed. It cannot be moved back from the board.",
                            "confirm-label": "Move to Closed"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'open'",
                            "file": "/applications/surveys/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "open",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'closed'",
                            "file": "/applications/surveys/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "close",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"open\",\"closed\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "status": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "surveys"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "responses"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"open\",\"closed\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"open\":\"Open\",\"closed\":\"Closed\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Survey"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "questions",
                          "label": "Questions",
                          "align": "end"
                        },
                        {
                          "key": "submitted",
                          "label": "Submitted",
                          "align": "end"
                        },
                        {
                          "key": "drafts",
                          "label": "Drafts",
                          "align": "end"
                        },
                        {
                          "key": "status",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "draft": "Draft",
                            "open": "Open",
                            "closed": "Closed"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "draft",
                          "label": "Draft",
                          "where": "row.status === 'draft'"
                        },
                        {
                          "value": "open",
                          "label": "Open",
                          "where": "row.status === 'open'"
                        },
                        {
                          "value": "closed",
                          "label": "Closed",
                          "where": "row.status === 'closed'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
