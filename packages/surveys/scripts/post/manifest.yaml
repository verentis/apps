api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: surveys-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Opening, closing and submitting validate the questionnaire and answers and update records conditionally.
file-access:
  - path: "/surveys"
    mode: write
    reason: "Open and close surveys, and read their questions when submitting"
  - path: "/survey-responses"
    mode: write
    reason: "Submit responses after validating their answers"
