api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: surveys-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Surveys containers.
file-access:
  - path: "/surveys"
    mode: write
    reason: "Create surveys with the next code"
  - path: "/survey-responses"
    mode: write
    reason: "Create responses with the next code"
  - path: "/settings/surveys.json"
    mode: read
    reason: "Default new responses to the default survey"
