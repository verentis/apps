{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "recruitment-positions",
    "name": "Positions",
    "description": "Job positions with their candidate counts.",
    "icon": "briefcase"
  },
  "spec": {
    "access": [
      {
        "path": "/job-positions",
        "reason": "List job positions with candidate and hire counts"
      },
      {
        "path": "/candidates",
        "reason": "List job positions with candidate and hire counts"
      }
    ],
    "data": {
      "candidates": {
        "kind": "folder",
        "path": "/candidates",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.candidate+json"
      },
      "jobs": {
        "kind": "folder",
        "path": "/job-positions",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.job+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.candidates || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobPath: e.data.job || '', job: ((((data.jobs || []).find(j => j.kind === 'file' && j.data && j.path === e.data.job) || {}).data || {}).title) || '', source: e.data.source || '', stage: e.data.stage || '', expectedSalary: e.data.expectedSalary || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Recruitment",
          "icon": "briefcase",
          "active": "positions.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "pipeline.page.yaml",
              "label": "Pipeline",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['new', 'screening', 'interview', 'offer'].includes(r.stage)).length }}"
            },
            {
              "id": "positions.page.yaml",
              "label": "Jobs",
              "icon": "briefcase"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/recruitment/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/recruitment.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Job positions",
              "note": "Every active position with its pipeline and hire counts. Click a row to open the position."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "jobs",
              "compact": true,
              "description": "The /job-positions folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "candidates",
              "compact": true,
              "description": "The /candidates folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open positions",
                  "value": "{{ (data.jobs || []).filter(j => j.kind === 'file' && j.data && j.data.state !== 'archived' && j.data.status === 'open').length }}",
                  "icon": "briefcase",
                  "loading": "{{ data.$jobs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On hold",
                  "value": "{{ (data.jobs || []).filter(j => j.kind === 'file' && j.data && j.data.state !== 'archived' && j.data.status === 'on-hold').length }}",
                  "icon": "pause",
                  "loading": "{{ data.$jobs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed",
                  "value": "{{ (data.jobs || []).filter(j => j.kind === 'file' && j.data && j.data.state !== 'archived' && j.data.status === 'closed').length }}",
                  "icon": "lock",
                  "loading": "{{ data.$jobs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired overall",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'hired').length }}",
                  "icon": "check",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.jobs || []).filter(j => j.kind === 'file' && j.data && j.data.state !== 'archived').map(j => ({ path: j.path, code: j.data.code || j.name, title: j.data.title || '', department: j.data.department || '', status: j.data.status || '', openings: j.data.openings || 0, pipeline: (data.rows || []).filter(r => r.jobPath === j.path && [\"new\",\"screening\",\"interview\",\"offer\"].includes(r.stage)).length, hired: (data.rows || []).filter(r => r.jobPath === j.path && r.stage === 'hired').length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Position"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "department",
                  "label": "Department"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "openings",
                  "label": "Openings",
                  "align": "end"
                },
                {
                  "key": "pipeline",
                  "label": "In pipeline",
                  "align": "end"
                },
                {
                  "key": "hired",
                  "label": "Hired",
                  "align": "end"
                }
              ],
              "emptyText": "No job positions yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
