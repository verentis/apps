{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "recruitment-pipeline",
    "name": "Pipeline",
    "description": "Every candidate, listed by stage.",
    "icon": "kanban"
  },
  "spec": {
    "access": [
      {
        "path": "/job-positions",
        "reason": "List candidates by stage with their job position titles"
      },
      {
        "path": "/candidates",
        "reason": "List candidates by stage with their job position titles; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "candidates": {
        "kind": "folder",
        "path": "/candidates",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.candidate+json"
      },
      "jobs": {
        "kind": "folder",
        "path": "/job-positions",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.job+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.candidates || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobPath: e.data.job || '', job: ((((data.jobs || []).find(j => j.kind === 'file' && j.data && j.path === e.data.job) || {}).data || {}).title) || '', source: e.data.source || '', stage: e.data.stage || '', expectedSalary: e.data.expectedSalary || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Recruitment",
          "icon": "briefcase",
          "active": "pipeline.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "pipeline.page.yaml",
              "label": "Pipeline",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['new', 'screening', 'interview', 'offer'].includes(r.stage)).length }}"
            },
            {
              "id": "positions.page.yaml",
              "label": "Jobs",
              "icon": "briefcase"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/recruitment/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/recruitment.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Hiring pipeline",
              "note": "Every active candidate, grouped by stage. Click a row to open the application."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "jobs",
              "compact": true,
              "description": "The /job-positions folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "candidates",
              "compact": true,
              "description": "The /candidates folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 6
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Screening",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'screening').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Interview",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'interview').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Offer",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'offer').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'hired').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Refused",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'refused').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "stage",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "new",
                          "label": "New"
                        },
                        {
                          "value": "screening",
                          "label": "Screening"
                        },
                        {
                          "value": "interview",
                          "label": "Interview"
                        },
                        {
                          "value": "offer",
                          "label": "Offer"
                        },
                        {
                          "value": "hired",
                          "label": "Hired"
                        },
                        {
                          "value": "refused",
                          "label": "Refused"
                        }
                      ],
                      "card": {
                        "title": "name",
                        "code": "code",
                        "meta": [
                          "job",
                          "source",
                          "expectedSalary"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"hired\",\"refused\"].includes(row.stage)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'hired'",
                            "title": "Move to Hired?",
                            "message": "{{ event.row.code }} moves to Hired. It cannot be moved back from the board.",
                            "confirm-label": "Move to Hired"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'refused'",
                            "title": "Move to Refused?",
                            "message": "{{ event.row.code }} moves to Refused. It cannot be moved back from the board.",
                            "confirm-label": "Move to Refused"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'hired'",
                            "file": "/applications/recruitment/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "hire",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'refused'",
                            "file": "/applications/recruitment/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "refuse",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"hired\",\"refused\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "stage": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "candidates"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "jobs"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"hired\",\"refused\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"new\":\"New\",\"screening\":\"Screening\",\"interview\":\"Interview\",\"offer\":\"Offer\",\"hired\":\"Hired\",\"refused\":\"Refused\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Application"
                        },
                        {
                          "key": "name",
                          "label": "Candidate"
                        },
                        {
                          "key": "job",
                          "label": "Job position"
                        },
                        {
                          "key": "source",
                          "label": "Source"
                        },
                        {
                          "key": "expectedSalary",
                          "label": "Expected salary",
                          "align": "end"
                        },
                        {
                          "key": "stage",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "new": "New",
                            "screening": "Screening",
                            "interview": "Interview",
                            "offer": "Offer",
                            "hired": "Hired",
                            "refused": "Refused"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "new",
                          "label": "New",
                          "where": "row.stage === 'new'"
                        },
                        {
                          "value": "screening",
                          "label": "Screening",
                          "where": "row.stage === 'screening'"
                        },
                        {
                          "value": "interview",
                          "label": "Interview",
                          "where": "row.stage === 'interview'"
                        },
                        {
                          "value": "offer",
                          "label": "Offer",
                          "where": "row.stage === 'offer'"
                        },
                        {
                          "value": "hired",
                          "label": "Hired",
                          "where": "row.stage === 'hired'"
                        },
                        {
                          "value": "refused",
                          "label": "Refused",
                          "where": "row.stage === 'refused'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
