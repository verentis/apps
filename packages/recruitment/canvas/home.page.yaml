{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "recruitment-home",
    "name": "Recruitment",
    "description": "Recruitment overview.",
    "icon": "briefcase"
  },
  "spec": {
    "access": [
      {
        "path": "/job-positions",
        "reason": "Count candidates and show the job positions and candidates"
      },
      {
        "path": "/candidates",
        "reason": "Count candidates and show the job positions and candidates"
      }
    ],
    "data": {
      "candidates": {
        "kind": "folder",
        "path": "/candidates",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.candidate+json"
      },
      "jobs": {
        "kind": "folder",
        "path": "/job-positions",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.job+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.candidates || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobPath: e.data.job || '', job: ((((data.jobs || []).find(j => j.kind === 'file' && j.data && j.path === e.data.job) || {}).data || {}).title) || '', source: e.data.source || '', stage: e.data.stage || '', expectedSalary: e.data.expectedSalary || '' }))"
      },
      "listcandidates": {
        "kind": "folder",
        "path": "/candidates",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.candidate+json"
      },
      "listjobpositions": {
        "kind": "folder",
        "path": "/job-positions",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.recruitment.job+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Recruitment",
          "icon": "briefcase",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "pipeline.page.yaml",
              "label": "Pipeline",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['new', 'screening', 'interview', 'offer'].includes(r.stage)).length }}"
            },
            {
              "id": "positions.page.yaml",
              "label": "Jobs",
              "icon": "briefcase"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/recruitment/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/recruitment.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Recruitment",
              "note": "Job positions and candidates are files in your workspace. Draft applications in /candidates, move them through the pipeline, then hire or refuse them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Hiring funnel"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ ['new', 'screening', 'interview', 'offer', 'hired'].map(stage => ({ label: stage, value: (data.rows || []).filter(r => r.stage === stage).length })) }}",
                  "showLegend": true,
                  "emptyText": "No candidates yet",
                  "kind": "funnel",
                  "x": "label",
                  "y": "value",
                  "labels": {
                    "new": "New",
                    "screening": "Screening",
                    "interview": "Interview",
                    "offer": "Offer",
                    "hired": "Hired"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In pipeline",
                  "value": "{{ (data.rows || []).filter(r => [\"new\",\"screening\",\"interview\",\"offer\"].includes(r.stage)).length }}",
                  "icon": "users",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In interview",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'interview').length }}",
                  "icon": "messages-square",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'hired').length }}",
                  "icon": "check",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Refused",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'refused').length }}",
                  "icon": "x",
                  "loading": "{{ data.$candidates.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "jobs",
              "compact": true,
              "description": "The /job-positions folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "candidates",
              "compact": true,
              "description": "The /candidates folder could not be read. Reinstall Recruitment to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "candidates",
                  "label": "Candidates",
                  "icon": "user-round"
                },
                {
                  "value": "jobs",
                  "label": "Job positions",
                  "icon": "briefcase"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /candidates",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/candidates"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listcandidates",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listcandidates || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Application"
                        },
                        {
                          "key": "data.name",
                          "label": "Candidate"
                        },
                        {
                          "key": "data.source",
                          "label": "Source"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage",
                          "format": "badge"
                        },
                        {
                          "key": "data.expectedSalary",
                          "label": "Expected salary"
                        }
                      ],
                      "facets": [
                        "data.stage"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No candidates yet. Use New in /candidates."
                    },
                    "rules": {
                      "visible": "data.$listcandidates.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "candidates"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /job-positions",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/job-positions"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listjobpositions",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listjobpositions || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.department",
                          "label": "Department"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        },
                        {
                          "key": "data.openings",
                          "label": "Openings"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No job positions yet. Use New in /job-positions."
                    },
                    "rules": {
                      "visible": "data.$listjobpositions.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "jobs"
              }
            ]
          }
        ]
      }
    ]
  }
}
