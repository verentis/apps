api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: recruitment-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Recruitment containers.
file-access:
  - path: "/job-positions"
    mode: write
    reason: "Create job positions with the next code"
  - path: "/candidates"
    mode: write
    reason: "Create candidates with the next code"
  - path: "/settings/recruitment.json"
    mode: read
    reason: "Default new candidates to the default job position"
