api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: recruitment-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Advancing, refusing and hiring enforce the stage transitions and update candidates conditionally.
file-access:
  - path: "/candidates"
    mode: write
    reason: "Advance, refuse and hire candidates"
