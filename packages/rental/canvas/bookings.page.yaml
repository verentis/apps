{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "rental-bookings",
    "name": "Bookings",
    "description": "Bookings by status, ordered by start date.",
    "icon": "calendar-check"
  },
  "spec": {
    "access": [
      {
        "path": "/rental-bookings",
        "reason": "List bookings by status"
      }
    ],
    "data": {
      "bookings": {
        "kind": "folder",
        "path": "/rental-bookings",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.booking+json"
      }
    },
    "state": {
      "showclosed": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Rental",
          "icon": "key",
          "active": "bookings.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "bookings.page.yaml",
              "label": "Bookings",
              "icon": "list"
            },
            {
              "id": "availability.page.yaml",
              "label": "Availability",
              "icon": "calendar-range"
            },
            {
              "id": "revenue.page.yaml",
              "label": "Revenue",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/rental/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/rental.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Bookings",
              "note": "The rental calendar as a list: bookings ordered by start date, badged by status. Confirming reserves the units; picking up and returning move them through the lifecycle."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "bookings",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Picked up",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'picked-up')).length }}",
                  "icon": "package-open",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Returned",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'returned')).length }}",
                  "icon": "package-check",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show returned and cancelled bookings",
              "value": "{{ state.showclosed }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (state.showclosed || (e.data.status !== 'returned' && e.data.status !== 'cancelled'))).map(e => ({ path: e.path, code: e.data.code || e.name, customer: e.data.customerName || '', product: (e.data.product || '').split('/').pop() || '', start: e.data.startDate, end: e.data.endDate, quantity: e.data.quantity, status: e.data.status, total: e.data.total || '' })).sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Booking"
                },
                {
                  "key": "customer",
                  "label": "Customer"
                },
                {
                  "key": "product",
                  "label": "Product"
                },
                {
                  "key": "start",
                  "label": "Start"
                },
                {
                  "key": "end",
                  "label": "End"
                },
                {
                  "key": "quantity",
                  "label": "Qty",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                }
              ],
              "emptyText": "No bookings yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
