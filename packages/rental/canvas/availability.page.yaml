{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "rental-availability",
    "name": "Availability",
    "description": "What is owned, out and available per rental product today.",
    "icon": "boxes"
  },
  "spec": {
    "access": [
      {
        "path": "/rental-products",
        "reason": "List rental products and the quantity owned"
      },
      {
        "path": "/rental-bookings",
        "reason": "Subtract overlapping confirmed and picked-up bookings; change records from this page",
        "mode": "write"
      }
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/rental-products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.product+json"
      },
      "bookings": {
        "kind": "folder",
        "path": "/rental-bookings",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.booking+json"
      },
      "availability": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', status: e.data.status, dailyRate: e.data.dailyRate || '', owned: Number(e.data.quantityOwned || 0), out: (data.bookings || []).filter(b => b.kind === 'file' && b.data && b.data.state !== 'archived' && (b.data.status === 'confirmed' || b.data.status === 'picked-up') && b.data.product === e.path && (b.data.startDate || '') <= Date().slice(0, 10) && Date().slice(0, 10) <= (b.data.endDate || '')).reduce((s, b) => s + Number(b.data.quantity || 0), 0) })).map(r => ({ path: r.path, code: r.code, name: r.name, status: r.status, dailyRate: r.dailyRate, owned: r.owned, out: r.out, available: r.status === 'available' ? r.owned - r.out : 0 }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Rental",
          "icon": "key",
          "active": "availability.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "bookings.page.yaml",
              "label": "Bookings",
              "icon": "list"
            },
            {
              "id": "availability.page.yaml",
              "label": "Availability",
              "icon": "calendar-range"
            },
            {
              "id": "revenue.page.yaml",
              "label": "Revenue",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/rental/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/rental.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Availability",
              "note": "Per product: units owned, out on confirmed and picked-up bookings covering today, and what is left to rent."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Bookings"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Bookings per product, from pick-up to return. Drag a draft booking to change its dates.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.gantt",
                "props": {
                  "rows": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && !!e.data.startDate && e.data.status !== 'cancelled').map(e => ({ path: e.path, title: [e.data.code, e.data.customerName].filter(part => part).join(' · '), status: e.data.status, start: e.data.startDate, end: e.data.endDate || e.data.startDate, product: ((((data.products || []).find(p => p.path === e.data.product) || {}).data || {}).name) || 'No product' })) }}",
                  "laneKey": "product",
                  "lanes": "{{ (data.products || []).filter(p => p.kind === 'file' && p.data && p.data.state !== 'archived').map(p => p.data.name || p.data.code) }}",
                  "colorBy": "status",
                  "days": 21,
                  "conflicts": false,
                  "lockedWhen": "row.status !== 'draft'"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ],
                  "reschedule": [
                    {
                      "patch-record": {
                        "path": "{{ event.path }}",
                        "values": {
                          "startDate": "{{ event.start }}",
                          "endDate": "{{ event.end }}",
                          "updatedAt": "{{ Date() }}"
                        }
                      }
                    },
                    {
                      "refresh-source": {
                        "source": "bookings"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Units out and available"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.availability || []).map(p => ({ label: p.name || p.code, out: p.out || 0, available: Math.max(0, p.available || 0) })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "out",
                    "available"
                  ],
                  "labels": {
                    "out": "Out",
                    "available": "Available"
                  },
                  "palette": {
                    "out": "warning",
                    "available": "success"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "products",
              "compact": true
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "bookings",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Products",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Units owned",
                  "value": "{{ (data.availability || []).reduce((s, r) => s + r.owned, 0) }}",
                  "icon": "boxes",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Units out",
                  "value": "{{ (data.availability || []).reduce((s, r) => s + r.out, 0) }}",
                  "icon": "package-open",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Units available",
                  "value": "{{ (data.availability || []).reduce((s, r) => s + r.available, 0) }}",
                  "icon": "package-check",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.availability || []).map(r => ({ path: r.path, code: r.code, name: r.name, status: r.status, dailyRate: r.dailyRate, owned: r.owned, out: r.out, available: r.available })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Product"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "dailyRate",
                  "label": "Daily rate",
                  "align": "end"
                },
                {
                  "key": "owned",
                  "label": "Owned",
                  "align": "end"
                },
                {
                  "key": "out",
                  "label": "Out",
                  "align": "end"
                },
                {
                  "key": "available",
                  "label": "Available",
                  "align": "end"
                }
              ],
              "emptyText": "No rental products yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
