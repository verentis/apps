{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "rental-home",
    "name": "Rental",
    "description": "Rental overview.",
    "icon": "key"
  },
  "spec": {
    "access": [
      {
        "path": "/rental-products",
        "reason": "List rental products"
      },
      {
        "path": "/rental-bookings",
        "reason": "List rental bookings"
      }
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/rental-products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.product+json"
      },
      "productoptions": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ((e.data.name || '') + ' · ' + (e.data.dailyRate || '') + '/day'), value: e.path }))"
      },
      "bookings": {
        "kind": "folder",
        "path": "/rental-bookings",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.booking+json"
      },
      "listrentalproducts": {
        "kind": "folder",
        "path": "/rental-products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.product+json"
      },
      "listrentalbookings": {
        "kind": "folder",
        "path": "/rental-bookings",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.rental.booking+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Rental",
          "icon": "key",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "bookings.page.yaml",
              "label": "Bookings",
              "icon": "list"
            },
            {
              "id": "availability.page.yaml",
              "label": "Availability",
              "icon": "calendar-range"
            },
            {
              "id": "revenue.page.yaml",
              "label": "Revenue",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/rental/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/rental.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Rental",
              "note": "Rental products and bookings are files in your workspace. Draft bookings in their folder, then confirm, pick up and return them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Rental products",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft bookings",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Out with customers",
                  "value": "{{ (data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'picked-up')).length }}",
                  "icon": "package-open",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Booked revenue",
                  "value": "{{ ((data.bookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status === 'confirmed' || e.data.status === 'picked-up') || e.data.status === 'returned') && e.data.total).reduce((s, e) => s + Math.round(Number(e.data.total || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$bookings.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "products",
              "compact": true,
              "description": "The /rental-products folder could not be read. Reinstall Rental to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "bookings",
              "compact": true,
              "description": "The /rental-bookings folder could not be read. Reinstall Rental to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "products",
                  "label": "Rental products",
                  "icon": "package"
                },
                {
                  "value": "bookings",
                  "label": "Bookings",
                  "icon": "calendar-check"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /rental-products",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/rental-products"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listrentalproducts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listrentalproducts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.dailyRate",
                          "label": "Daily rate"
                        },
                        {
                          "key": "data.quantityOwned",
                          "label": "Owned"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No rental products yet. Use New in /rental-products."
                    },
                    "rules": {
                      "visible": "data.$listrentalproducts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "products"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /rental-bookings",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/rental-bookings"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listrentalbookings",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listrentalbookings || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.customerName",
                          "label": "Customer"
                        },
                        {
                          "key": "data.startDate",
                          "label": "Start",
                          "format": "date"
                        },
                        {
                          "key": "data.endDate",
                          "label": "End",
                          "format": "date"
                        },
                        {
                          "key": "data.total",
                          "label": "Total"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No bookings yet. Use New in /rental-bookings."
                    },
                    "rules": {
                      "visible": "data.$listrentalbookings.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "bookings"
              }
            ]
          }
        ]
      }
    ]
  }
}
