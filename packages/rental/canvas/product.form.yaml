{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "rental-product",
    "name": "Rental product",
    "description": "View and edit a rental product.",
    "icon": "package"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.rental.product+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/rental/v1/product.schema.json",
          "source": "/applications/rental/schemas/product.schema.json",
          "title": "Rental product",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Frental%2Fcanvas%2Fproduct.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.rental.product+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/rental/v1/product.schema.json",
          "source": "/applications/rental/schemas/product.schema.json",
          "title": "Rental product",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/applications/rental/",
        "mode": "read",
        "reason": "Read the Rental schemas and run the booking script"
      }
    ],
    "access": [
      {
        "path": "/applications/rental/",
        "reason": "Read the Rental schemas and run the booking script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New rental product' }}",
              "note": "Rental product {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\",\"returned\",\"available\"].includes(form.values.status) ? 'success' : [\"draft\",\"picked-up\"].includes(form.values.status) ? 'warning' : [\"cancelled\",\"unavailable\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(false)",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (false)"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "available",
                  "label": "Available"
                },
                {
                  "value": "unavailable",
                  "label": "Unavailable"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This rental product is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Rental product"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Name",
                          "value": "{{ form.values.name }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "options": [
                            {
                              "value": "available",
                              "label": "Available"
                            },
                            {
                              "value": "unavailable",
                              "label": "Unavailable"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Daily rate",
                          "value": "{{ form.values.dailyRate }}",
                          "required": true,
                          "placeholder": "0.00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Deposit",
                          "value": "{{ form.values.deposit }}",
                          "placeholder": "0.00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Quantity owned",
                          "value": "{{ form.values.quantityOwned }}",
                          "required": true,
                          "min": 0,
                          "max": 100000,
                          "step": 1
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Description",
                          "value": "{{ form.values.description }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
