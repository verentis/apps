api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: rental-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Rental containers.
file-access:
  - path: "/rental-products"
    mode: write
    reason: "Create rental products with the next number"
  - path: "/rental-bookings"
    mode: write
    reason: "Create bookings with the next number"
  - path: "/settings/rental.json"
    mode: read
    reason: "Default new bookings' notes"
