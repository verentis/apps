api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: rental-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Confirming checks availability and computes totals; returning charges late fees and drafts the optional invoice; records are updated conditionally.
file-access:
  - path: "/settings/rental.json"
    mode: read
    reason: "Read the currency and the daily late rate"
  - path: "/rental-products"
    mode: read
    reason: "Check booked products, their rates and the quantity owned"
  - path: "/rental-bookings"
    mode: write
    reason: "Confirm, pick up, return and cancel bookings, checking overlapping bookings"
