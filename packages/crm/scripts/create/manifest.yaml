api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: crm-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The script creates records (and their communications and notes) itself,
# create-only, inside the CRM containers.
file-access:
  - path: "/customers"
    mode: write
    reason: "Create customers and contacts with the next code, and their activities and notes"
  - path: "/deals"
    mode: write
    reason: "Create deals with the next code, and their activities and notes"
  - path: "/cases"
    mode: write
    reason: "Create cases with the next code, and their activities and notes"
