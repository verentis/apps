                "updatedAt": "{{ Date() }}",
                "closedAt": "{{ form.values.outcome !== 'open' ? (form.values.closedAt || Date()) : undefined }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
