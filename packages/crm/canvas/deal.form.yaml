      "new-email": {
        "permissions": [
          "file.write"
        ],
        "steps": [
          {
            "set-state": {
              "key": "newid",
              "value": {
                "$expr": "Array.from('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx', c => c === 'x' ? Math.floor(Math.random() * 16).toString(16) : (c === 'y' ? (8 + Math.floor(Math.random() * 4)).toString(16) : c)).join('')"
              }
            }
          },
          {
            "set-state": {
              "key": "newat",
              "value": {
                "$expr": "Date()"
              }
            }
          },
          {
            "set-state": {
              "key": "newstamp",
              "value": {
                "$expr": "Date().slice(0, 19).split('-').join('').split(':').join('').split('T').join('-')"
              }
            }
          },
          {
            "write-file": {
              "path": "{{ ctx.file.path }}/activities/{{ state.newstamp }}-email.json",
