{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "crm-deal",
    "name": "CRM deal",
    "description": "View and edit a CRM deal.",
    "icon": "handshake"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.crm.deal+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/crm/v1/deal.schema.json",
          "source": "/applications/crm/schemas/deal.schema.json",
          "title": "CRM deal",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fcrm%2Fcanvas%2Fdeal.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.crm.deal+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/crm/v1/deal.schema.json",
          "source": "/applications/crm/schemas/deal.schema.json",
          "title": "CRM deal",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/customers",
        "mode": "read",
        "reason": "Pick the customer and contact"
      },
      {
        "path": "/settings/crm.json",
        "mode": "read",
        "reason": "Read the pipeline stages"
      },
      {
        "path": "/applications/crm/",
        "mode": "read",
        "reason": "Read the CRM schemas"
      }
    ],
    "access": [
      {
        "path": "/customers",
        "reason": "Pick the customer and contact"
      },
      {
        "path": "/settings/crm.json",
        "reason": "Read the pipeline stages"
      },
      {
        "path": "/applications/crm/",
        "reason": "Read the CRM schemas"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "companies": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.company+json"
      },
      "contacts": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.contact+json"
      },
      "customeroptions": {
        "kind": "computed",
        "expr": "(data.companies || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code ? e.data.code + ' · ' : '') + (e.data.name || [e.data.salutation, e.data.givenName, e.data.familyName].filter(Boolean).join(' ').trim() || e.data.code || e.name), value: e.path })).concat((data.contacts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code ? e.data.code + ' · ' : '') + (e.data.name || [e.data.salutation, e.data.givenName, e.data.familyName].filter(Boolean).join(' ').trim() || e.data.code || e.name), value: e.path })))"
      },
      "contactoptions": {
        "kind": "computed",
        "expr": "(data.contacts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (!form.values.customer || !form.values.customer.path || (e.data.company && e.data.company.path === form.values.customer.path) || e.path === form.values.customer.path)).map(e => ({ label: (e.data.code ? e.data.code + ' · ' : '') + (e.data.name || [e.data.salutation, e.data.givenName, e.data.familyName].filter(Boolean).join(' ').trim() || e.data.code || e.name), value: e.path }))"
      },
      "settings": {
        "kind": "file",
        "path": "/settings/crm.json",
        "parse": "json"
      },
      "stageoptions": {
        "kind": "computed",
        "expr": "((data.settings && data.settings.stages) || []).slice().sort((a, b) => a.order - b.order).map(stage => ({ label: stage.label, value: stage.id }))"
      },
      "activityfiles": {
        "kind": "folder",
        "path": "{{ ctx.file.path }}/activities",
        "contents": true
      },
      "notefiles": {
        "kind": "folder",
        "path": "{{ ctx.file.path }}/notes",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.note+json"
      }
    },
    "state": {
      "showarchived": false
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.title || 'New deal' }}",
              "note": "Deal {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.outcome || '').split('-').join(' ') }}",
                      "tone": "{{ [\"customer\",\"won\",\"sent\",\"received\",\"held\",\"completed\",\"resolved\",\"closed\"].includes(form.values.outcome) ? 'success' : [\"prospect\",\"pending\",\"in-progress\",\"planned\",\"draft\",\"deferred\",\"new\"].includes(form.values.outcome) ? 'warning' : [\"lost\",\"not-held\",\"cancelled\",\"urgent\"].includes(form.values.outcome) ? 'danger' : [\"open\",\"partner\",\"supplier\",\"not-started\"].includes(form.values.outcome) ? 'info' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.outcome"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived'"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.outcome }}",
              "steps": [
                {
                  "value": "open",
                  "label": "Open"
                },
                {
                  "value": "won",
                  "label": "Won"
                }
              ],
              "branches": [
                {
                  "value": "lost",
                  "label": "Lost"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.outcome"
            }
          },
          {
            "type": "canvas.meter",
            "props": {
              "kind": "deadline",
              "to": "{{ form.values.expectedCloseDate }}",
              "label": "Expected close",
              "thresholds": {
                "warning": 0.75,
                "danger": 1
              }
            },
            "rules": {
              "visible": "!!form.values.expectedCloseDate && [\"open\",\"won\"].includes(form.values.outcome)"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This deal is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "overview",
                  "label": "Overview",
                  "icon": "handshake"
                },
                {
                  "value": "timeline",
                  "label": "Timeline",
                  "icon": "history"
                },
                {
                  "value": "activities",
                  "label": "Activities",
                  "icon": "calendar-check"
                },
                {
                  "value": "notes",
                  "label": "Notes",
                  "icon": "sticky-note"
                },
                {
                  "value": "documents",
                  "label": "Documents",
                  "icon": "paperclip"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Customer",
                          "variant": "ghost",
                          "icon": "building-2",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ form.values.customer.path }}",
                                "mode": "edit"
                              }
                            }
                          ]
                        },
                        "rules": {
                          "visible": "!!(form.values.customer && form.values.customer.path)"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Contact",
                          "variant": "ghost",
                          "icon": "user",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "{{ form.values.contact.path }}",
                                "mode": "edit"
                              }
                            }
                          ]
                        },
                        "rules": {
                          "visible": "!!(form.values.contact && form.values.contact.path)"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "settings",
                      "compact": true,
                      "description": "CRM settings could not be read from /settings/crm.json. Pipeline stages are unavailable."
                    }
                  },
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Deal"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Title",
                                  "value": "{{ form.values.title }}",
                                  "required": true
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Customer",
                                  "value": "{{ form.values.customer.path }}",
                                  "required": true,
                                  "options": "{{ data.customeroptions }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Contact",
                                  "value": "{{ form.values.contact.path }}",
                                  "options": "{{ data.contactoptions }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Stage",
                                  "value": "{{ form.values.stageId }}",
                                  "required": true,
                                  "options": "{{ data.stageoptions }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Outcome",
                                  "value": "{{ form.values.outcome }}",
                                  "options": [
                                    {
                                      "value": "open",
                                      "label": "Open"
                                    },
                                    {
                                      "value": "won",
                                      "label": "Won"
                                    },
                                    {
                                      "value": "lost",
                                      "label": "Lost"
                                    }
                                  ]
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Value"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.number",
                                "props": {
                                  "label": "Amount",
                                  "value": "{{ form.values.amount }}",
                                  "required": true,
                                  "min": 0,
                                  "step": 0.01
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Currency",
                                  "value": "{{ form.values.currency }}",
                                  "placeholder": "ZAR"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.number",
                                "props": {
                                  "label": "Probability (%)",
                                  "value": "{{ form.values.probability }}",
                                  "min": 0,
                                  "max": 100,
                                  "step": 5
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.date",
                                "props": {
                                  "label": "Expected close",
                                  "value": "{{ form.values.expectedCloseDate }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "More"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Source",
                                  "value": "{{ form.values.source }}",
                                  "placeholder": "Referral, website, …"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Owner",
                                  "value": "{{ form.values.owner }}",
                                  "placeholder": "Name or email"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Lost reason",
                                  "value": "{{ form.values.lostReason }}"
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'",
                                  "visible": "form.values.outcome === 'lost'"
                                }
                              },
                              {
                                "type": "canvas.form.textarea",
                                "props": {
                                  "label": "Description",
                                  "value": "{{ form.values.description }}",
                                  "rows": 4
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ],
                "slot": "overview"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.timeline",
                    "props": {
                      "sources": [
                        {
                          "type": "email",
                          "label": "Emails",
                          "icon": "mail",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.email+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.sentAt || e.data.createdAt || e.modified, subtitle: e.data.direction === 'inbound' ? 'From ' + (e.data.from || '') : 'Sent', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "call",
                          "label": "Calls",
                          "icon": "phone",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.call+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.startsAt || e.data.createdAt || e.modified, subtitle: e.data.result || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "meeting",
                          "label": "Meetings",
                          "icon": "calendar-days",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.meeting+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.startsAt || e.data.createdAt || e.modified, subtitle: e.data.location || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "task",
                          "label": "Tasks",
                          "icon": "square-check",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.task+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.dueDate || e.data.createdAt || e.modified, subtitle: e.data.priority || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "note",
                          "label": "Notes",
                          "icon": "sticky-note",
                          "rows": "{{ (data.notefiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.note+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.title, at: e.data.updatedAt || e.data.createdAt || e.modified })) }}",
                          "date": "at",
                          "title": "title"
                        }
                      ],
                      "facets": true,
                      "limit": 50,
                      "emptyText": "No activity yet",
                      "emptyDescription": "Emails, calls, meetings, tasks and notes on this record appear here by date."
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "timeline"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.text",
                        "props": {
                          "text": "New",
                          "tone": "muted"
                        }
                      },
                      {
                        "type": "canvas.stack",
                        "layout": {
                          "base": {
                            "direction": "row",
                            "wrap": true,
                            "gap": 2,
                            "align": "center"
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Email",
                              "variant": "outline",
                              "icon": "mail",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-email"
                            },
                            "rules": {
                              "disabled": "form.values.state === 'archived'"
                            }
                          },
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Call",
                              "variant": "outline",
                              "icon": "phone",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-call"
                            },
                            "rules": {
