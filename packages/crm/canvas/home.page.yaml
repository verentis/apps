api-version: canvas.verentis.io/v1
kind: Page
metadata:
  id: crm-home
  name: CRM
  description: CRM overview.
  icon: contact
spec:
  access:
  - path: /customers
    reason: List customers and contacts
  - path: /deals
    reason: List deals and the pipeline
  - path: /cases
    reason: List cases
  data:
    companies:
      kind: folder
      path: /customers
      contents: true
      mime-pattern: application/vnd.verentis.crm.company+json
    contacts:
      kind: folder
      path: /customers
      contents: true
      mime-pattern: application/vnd.verentis.crm.contact+json
    deals:
      kind: folder
      path: /deals
      contents: true
      mime-pattern: application/vnd.verentis.crm.deal+json
    cases:
      kind: folder
      path: /cases
      contents: true
      mime-pattern: application/vnd.verentis.crm.case+json
  tree:
  - type: canvas.stack
    layout:
      base:
        padding: 6
        gap: 4
        maxWidth: 72rem
        margin:
          x: auto
    children:
    - type: canvas.stack
      layout:
        base:
          direction: row
          wrap: true
          gap: 2
          align: center
          justify: between
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 1
        children:
        - type: canvas.heading
          props:
            level: 2
            text: CRM
        - type: canvas.text
          props:
            text: Customers, contacts, deals and cases are files in your workspace. Emails, calls, meetings,
              tasks, notes and documents live beneath the record they belong to.
            tone: muted
      - type: canvas.stack
        layout:
          base:
            direction: row
            wrap: true
            gap: 2
            align: center
        children:
        - type: canvas.button
          props:
            label: Customers
            variant: outline
            icon: building-2
            size: sm
          'on':
            click:
            - open-file:
                path: /customers
        - type: canvas.button
          props:
            label: Deals
            variant: outline
            icon: handshake
            size: sm
          'on':
            click:
            - open-file:
                path: /deals
        - type: canvas.button
          props:
            label: Cases
            variant: outline
            icon: life-buoy
            size: sm
          'on':
            click:
            - open-file:
                path: /cases
        - type: canvas.button
          props:
            label: Settings
            variant: ghost
            icon: settings
            size: sm
          'on':
            click:
            - open-file:
                path: /settings/crm.json
                mode: edit
    - type: canvas.grid
      layout:
        base:
          columns: 2
          gap: 4
        desktop:
          columns: 5
      children:
      - type: canvas.dashboard.stat
        props:
          label: Customers
          value: '{{ (data.companies || []).filter(e => e.kind === ''file'' && e.data && e.data.state
            !== ''archived'' && (true)).length }}'
          icon: building-2
          loading: '{{ data.$companies.status === ''loading'' }}'
      - type: canvas.dashboard.stat
        props:
          label: Contacts
          value: '{{ (data.contacts || []).filter(e => e.kind === ''file'' && e.data && e.data.state !==
            ''archived'' && (true)).length }}'
          icon: user
          loading: '{{ data.$contacts.status === ''loading'' }}'
      - type: canvas.dashboard.stat
        props:
          label: Open deals
          value: '{{ (data.deals || []).filter(e => e.kind === ''file'' && e.data && e.data.state !==
            ''archived'' && (e.data.outcome === ''open'')).length }}'
          icon: handshake
          loading: '{{ data.$deals.status === ''loading'' }}'
      - type: canvas.dashboard.stat
        props:
          label: Weighted pipeline
          value: '{{ (data.deals || []).filter(e => e.kind === ''file'' && e.data && e.data.state !==
            ''archived'' && e.data.outcome === ''open'').reduce((sum, e) => sum + Number(e.data.amount
            || 0) * (e.data.probability == null ? 1 : e.data.probability / 100), 0).toFixed(2) }}'
          icon: trending-up
          loading: '{{ data.$deals.status === ''loading'' }}'
      - type: canvas.dashboard.stat
        props:
          label: Open cases
          value: '{{ (data.cases || []).filter(e => e.kind === ''file'' && e.data && e.data.state !==
            ''archived'' && (![''resolved'', ''closed''].includes(e.data.status))).length }}'
          icon: life-buoy
          loading: '{{ data.$cases.status === ''loading'' }}'
    - type: canvas.text
      props:
        text: The /customers folder could not be read. Reinstall CRM to recreate it.
      rules:
        visible: data.$companies.status === 'error'
    - type: canvas.text
      props:
        text: The /deals folder could not be read. Reinstall CRM to recreate it.
      rules:
        visible: data.$deals.status === 'error'
    - type: canvas.text
      props:
        text: The /cases folder could not be read. Reinstall CRM to recreate it.
      rules:
        visible: data.$cases.status === 'error'
    - type: canvas.tabs
      props:
        items:
        - value: customers
          label: Customers
          icon: building-2
        - value: contacts
          label: Contacts
          icon: user
        - value: deals
          label: Deals
          icon: handshake
        - value: cases
          label: Cases
          icon: life-buoy
      children:
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.files
          props:
            path: /customers/
            mimeTypes:
            - application/vnd.verentis.crm.company+json
            showFolders: false
            navigable: false
            columns:
            - key: name
              label: Code
            - key: data.name
              label: Name
            - key: data.type
              label: Relationship
            - key: data.email
              label: Email
            emptyText: No customers yet. Use New in /customers.
        slot: customers
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.files
          props:
            path: /customers/
            mimeTypes:
            - application/vnd.verentis.crm.contact+json
            showFolders: false
            navigable: false
            columns:
            - key: name
              label: Code
            - key: data.givenName
              label: Given name
            - key: data.familyName
              label: Family name
            - key: data.email
              label: Email
            emptyText: No contacts yet. Use New in /customers.
        slot: contacts
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.files
          props:
            path: /deals/
            mimeTypes:
            - application/vnd.verentis.crm.deal+json
            showFolders: false
            navigable: false
            columns:
            - key: name
              label: Code
            - key: data.title
              label: Title
            - key: data.stageId
              label: Stage
            - key: data.amount
              label: Amount
              align: end
            - key: data.outcome
              label: Outcome
            emptyText: No deals yet. Use New in /deals.
        slot: deals
      - type: canvas.stack
        layout:
          base:
            gap: 4
        children:
        - type: canvas.files
          props:
            path: /cases/
            mimeTypes:
            - application/vnd.verentis.crm.case+json
            showFolders: false
            navigable: false
            columns:
            - key: name
              label: Code
            - key: data.subject
              label: Subject
            - key: data.status
              label: Status
            - key: data.priority
              label: Priority
            emptyText: No cases yet. Use New in /cases.
        slot: cases
