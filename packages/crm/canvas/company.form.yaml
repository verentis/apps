          },
          {
            "set-state": {
              "key": "newat",
              "value": {
                "$expr": "Date()"
              }
            }
          },
          {
            "set-state": {
              "key": "newstamp",
              "value": {
                "$expr": "Date().slice(0, 19).split('-').join('').split(':').join('').split('T').join('-')"
              }
            }
          },
          {
            "write-file": {
              "path": "{{ ctx.file.path }}/activities/{{ state.newstamp }}-task.json",
              "mime": "application/vnd.verentis.crm.task+json",
              "content": "{{ JSON.stringify({ \"$schema\": \"https://schemas.verentis.io/crm/v1/task.schema.json\", \"schemaVersion\": 1, \"kind\": \"task\", \"id\": state.newid, \"state\": \"active\", \"createdAt\": state.newat, \"updatedAt\": state.newat, \"subject\": '', \"status\": \"not-started\", \"priority\": \"normal\", \"regarding\": { \"path\": ctx.file.path } }, null, 2) }}"
            }
          },
          {
            "open-file": {
              "path": "{{ ctx.file.path }}/activities/{{ state.newstamp }}-task.json",
              "mode": "edit"
            }
          }
        ]
      },
      "new-note": {
        "permissions": [
          "file.write"
        ],
        "steps": [
          {
            "set-state": {
              "key": "newid",
              "value": {
                "$expr": "Array.from('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx', c => c === 'x' ? Math.floor(Math.random() * 16).toString(16) : (c === 'y' ? (8 + Math.floor(Math.random() * 4)).toString(16) : c)).join('')"
              }
            }
          },
          {
            "set-state": {
              "key": "newat",
              "value": {
                "$expr": "Date()"
              }
            }
          },
          {
            "set-state": {
              "key": "newstamp",
              "value": {
                "$expr": "Date().slice(0, 19).split('-').join('').split(':').join('').split('T').join('-')"
              }
            }
          },
          {
            "write-file": {
              "path": "{{ ctx.file.path }}/notes/{{ state.newstamp }}-note.json",
              "mime": "application/vnd.verentis.crm.note+json",
              "content": "{{ JSON.stringify({ \"$schema\": \"https://schemas.verentis.io/crm/v1/note.schema.json\", \"schemaVersion\": 1, \"kind\": \"note\", \"id\": state.newid, \"state\": \"active\", \"createdAt\": state.newat, \"updatedAt\": state.newat, \"title\": '', \"content\": \"\", \"regarding\": { \"path\": ctx.file.path } }, null, 2) }}"
            }
          },
          {
            "open-file": {
              "path": "{{ ctx.file.path }}/notes/{{ state.newstamp }}-note.json",
              "mode": "edit"
            }
          }
        ]
      }
    }
  }
}
