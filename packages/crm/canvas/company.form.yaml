{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "crm-company",
    "name": "CRM customer",
    "description": "View and edit a CRM customer.",
    "icon": "building-2"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.crm.company+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/crm/v1/company.schema.json",
          "source": "/applications/crm/schemas/company.schema.json",
          "title": "CRM customer",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fcrm%2Fcanvas%2Fcompany.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.crm.company+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/crm/v1/company.schema.json",
          "source": "/applications/crm/schemas/company.schema.json",
          "title": "CRM customer",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/customers",
        "mode": "read",
        "reason": "List the contacts and companies of this customer"
      },
      {
        "path": "/deals",
        "mode": "read",
        "reason": "Show this customer's deals"
      },
      {
        "path": "/cases",
        "mode": "read",
        "reason": "Show this customer's cases"
      },
      {
        "path": "/applications/crm/",
        "mode": "read",
        "reason": "Read the CRM schemas"
      }
    ],
    "access": [
      {
        "path": "/customers",
        "reason": "List the contacts and companies of this customer"
      },
      {
        "path": "/deals",
        "reason": "Show this customer's deals"
      },
      {
        "path": "/cases",
        "reason": "Show this customer's cases"
      },
      {
        "path": "/applications/crm/",
        "reason": "Read the CRM schemas"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "contacts": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.contact+json"
      },
      "deals": {
        "kind": "folder",
        "path": "/deals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.deal+json"
      },
      "cases": {
        "kind": "folder",
        "path": "/cases",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.case+json"
      },
      "activityfiles": {
        "kind": "folder",
        "path": "{{ ctx.file.path }}/activities",
        "contents": true
      },
      "notefiles": {
        "kind": "folder",
        "path": "{{ ctx.file.path }}/notes",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.note+json"
      }
    },
    "state": {
      "showarchived": false
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New customer' }}",
              "note": "Customer {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.type || '').split('-').join(' ') }}",
                      "tone": "{{ [\"customer\",\"won\",\"sent\",\"received\",\"held\",\"completed\",\"resolved\",\"closed\"].includes(form.values.type) ? 'success' : [\"prospect\",\"pending\",\"in-progress\",\"planned\",\"draft\",\"deferred\",\"new\"].includes(form.values.type) ? 'warning' : [\"lost\",\"not-held\",\"cancelled\",\"urgent\"].includes(form.values.type) ? 'danger' : [\"open\",\"partner\",\"supplier\",\"not-started\"].includes(form.values.type) ? 'info' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.type"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived'"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.type }}",
              "steps": [
                {
                  "value": "prospect",
                  "label": "Prospect"
                },
                {
                  "value": "customer",
                  "label": "Customer"
                },
                {
                  "value": "partner",
                  "label": "Partner"
                },
                {
                  "value": "supplier",
                  "label": "Supplier"
                },
                {
                  "value": "other",
                  "label": "Other"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.type"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This customer is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "overview",
                  "label": "Overview",
                  "icon": "building-2"
                },
                {
                  "value": "timeline",
                  "label": "Timeline",
                  "icon": "history"
                },
                {
                  "value": "contacts",
                  "label": "Contacts",
                  "icon": "users"
                },
                {
                  "value": "deals",
                  "label": "Deals",
                  "icon": "handshake"
                },
                {
                  "value": "cases",
                  "label": "Cases",
                  "icon": "life-buoy"
                },
                {
                  "value": "activities",
                  "label": "Activities",
                  "icon": "calendar-check"
                },
                {
                  "value": "notes",
                  "label": "Notes",
                  "icon": "sticky-note"
                },
                {
                  "value": "documents",
                  "label": "Documents",
                  "icon": "paperclip"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Company"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Name",
                                  "value": "{{ form.values.name }}",
                                  "required": true
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Legal name",
                                  "value": "{{ form.values.legalName }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.select",
                                "props": {
                                  "label": "Relationship",
                                  "value": "{{ form.values.type }}",
                                  "options": [
                                    {
                                      "value": "prospect",
                                      "label": "Prospect"
                                    },
                                    {
                                      "value": "customer",
                                      "label": "Customer"
                                    },
                                    {
                                      "value": "partner",
                                      "label": "Partner"
                                    },
                                    {
                                      "value": "supplier",
                                      "label": "Supplier"
                                    },
                                    {
                                      "value": "other",
                                      "label": "Other"
                                    }
                                  ]
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Industry",
                                  "value": "{{ form.values.industry }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Owner",
                                  "value": "{{ form.values.owner }}",
                                  "placeholder": "Name or email"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Contact details"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Email",
                                  "value": "{{ form.values.email }}",
                                  "inputType": "email"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Phone",
                                  "value": "{{ form.values.phone }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Website",
                                  "value": "{{ form.values.website }}"
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "Address"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.text-list",
                                "props": {
                                  "label": "Street",
                                  "value": "{{ form.values.address.lines }}"
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "City",
                                  "value": "{{ form.values.address.city }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Region",
                                  "value": "{{ form.values.address.region }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Postal code",
                                  "value": "{{ form.values.address.postalCode }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Country code",
                                  "value": "{{ form.values.address.country }}",
                                  "placeholder": "ZA"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "canvas.card",
                        "props": {
                          "title": "More"
                        },
                        "children": [
                          {
                            "type": "canvas.grid",
                            "layout": {
                              "base": {
                                "columns": 1,
                                "gap": 4
                              },
                              "tablet": {
                                "columns": 2
                              }
                            },
                            "children": [
                              {
                                "type": "canvas.form.input",
                                "props": {
                                  "label": "Tax identifier",
                                  "value": "{{ form.values.taxIdentifier }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.text-list",
                                "props": {
                                  "label": "Tags",
                                  "value": "{{ form.values.tags }}"
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              },
                              {
                                "type": "canvas.form.textarea",
                                "props": {
                                  "label": "Description",
                                  "value": "{{ form.values.description }}",
                                  "rows": 4
                                },
                                "layout": {
                                  "tablet": {
                                    "colSpan": 2
                                  }
                                },
                                "rules": {
                                  "disabled": "form.values.state === 'archived'"
                                }
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ],
                "slot": "overview"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.timeline",
                    "props": {
                      "sources": [
                        {
                          "type": "email",
                          "label": "Emails",
                          "icon": "mail",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.email+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.sentAt || e.data.createdAt || e.modified, subtitle: e.data.direction === 'inbound' ? 'From ' + (e.data.from || '') : 'Sent', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "call",
                          "label": "Calls",
                          "icon": "phone",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.call+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.startsAt || e.data.createdAt || e.modified, subtitle: e.data.result || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "meeting",
                          "label": "Meetings",
                          "icon": "calendar-days",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.meeting+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.startsAt || e.data.createdAt || e.modified, subtitle: e.data.location || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "task",
                          "label": "Tasks",
                          "icon": "square-check",
                          "rows": "{{ (data.activityfiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.task+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.subject, at: e.data.dueDate || e.data.createdAt || e.modified, subtitle: e.data.priority || '', status: e.data.status })) }}",
                          "date": "at",
                          "title": "title",
                          "subtitle": "subtitle",
                          "badge": "status"
                        },
                        {
                          "type": "note",
                          "label": "Notes",
                          "icon": "sticky-note",
                          "rows": "{{ (data.notefiles || []).filter(e => e.kind === 'file' && e.data && e.mimeType === 'application/vnd.verentis.crm.note+json' && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.title, at: e.data.updatedAt || e.data.createdAt || e.modified })) }}",
                          "date": "at",
                          "title": "title"
                        }
                      ],
                      "facets": true,
                      "limit": 50,
                      "emptyText": "No activity yet",
                      "emptyDescription": "Emails, calls, meetings, tasks and notes on this record appear here by date."
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "timeline"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.text",
                        "props": {
                          "text": "New",
                          "tone": "muted"
                        }
                      },
                      {
                        "type": "canvas.stack",
                        "layout": {
                          "base": {
                            "direction": "row",
                            "wrap": true,
                            "gap": 2,
                            "align": "center"
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Email",
                              "variant": "outline",
                              "icon": "mail",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-email"
                            },
                            "rules": {
                              "disabled": "form.values.state === 'archived'"
                            }
                          },
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Call",
                              "variant": "outline",
                              "icon": "phone",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-call"
                            },
                            "rules": {
                              "disabled": "form.values.state === 'archived'"
                            }
                          },
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Meeting",
                              "variant": "outline",
                              "icon": "calendar-days",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-meeting"
                            },
                            "rules": {
                              "disabled": "form.values.state === 'archived'"
                            }
                          },
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Task",
                              "variant": "outline",
                              "icon": "square-check",
                              "size": "sm"
                            },
                            "on": {
                              "click": "new-task"
                            },
                            "rules": {
                              "disabled": "form.values.state === 'archived'"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "type": "canvas.tabs",
                    "props": {
                      "items": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "email",
                          "label": "Emails"
                        },
                        {
                          "value": "call",
                          "label": "Calls"
                        },
                        {
                          "value": "meeting",
                          "label": "Meetings"
                        },
                        {
                          "value": "task",
                          "label": "Tasks"
                        }
                      ]
                    },
                    "children": [
                      {
                        "type": "canvas.stack",
                        "layout": {
                          "base": {
                            "gap": 4
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.files",
                            "props": {
                              "path": "./activities/",
                              "mimeTypes": [
                                "application/vnd.verentis.crm.email+json",
