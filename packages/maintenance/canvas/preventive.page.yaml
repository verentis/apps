{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "maintenance-preventive",
    "name": "Preventive plan",
    "description": "Open preventive requests against their scheduled dates.",
    "icon": "calendar-clock"
  },
  "spec": {
    "access": [
      {
        "path": "/equipment",
        "reason": "Compare open preventive requests against their scheduled dates"
      },
      {
        "path": "/maintenance-requests",
        "reason": "Compare open preventive requests against their scheduled dates"
      }
    ],
    "data": {
      "equipment": {
        "kind": "folder",
        "path": "/equipment",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.equipment+json"
      },
      "requests": {
        "kind": "folder",
        "path": "/maintenance-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.request+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, equipmentPath: e.data.equipment || '', equipment: ((((data.equipment || []).find(q => q.kind === 'file' && q.data && q.path === e.data.equipment) || {}).data || {}).name) || '', type: e.data.type || '', priority: e.data.priority || '', stage: e.data.stage || 'new', scheduledDate: e.data.scheduledDate || '', durationHours: e.data.durationHours || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Maintenance",
          "icon": "wrench",
          "active": "preventive.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "Requests",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => !['done', 'cancelled'].includes(r.stage)).length }}"
            },
            {
              "id": "equipment.page.yaml",
              "label": "Equipment",
              "icon": "wrench"
            },
            {
              "id": "preventive.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/maintenance/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Preventive plan",
              "note": "Open preventive maintenance by scheduled date: overdue, upcoming within 30 days, or planned."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Maintenance calendar"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Preventive and corrective requests by scheduled date.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.calendar",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.scheduledDate).map(r => ({ path: r.path, title: r.equipment || r.code, type: r.type, at: r.scheduledDate })) }}",
                  "views": [
                    "month",
                    "week",
                    "agenda"
                  ],
                  "showLegend": true,
                  "emptyText": "Nothing scheduled",
                  "start": "at",
                  "title": "title",
                  "colorBy": "type",
                  "view": "month"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "equipment",
              "compact": true,
              "description": "The /equipment folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true,
              "description": "The /maintenance-requests folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open preventive",
                  "value": "{{ (data.rows || []).filter(r => r.type === 'preventive' && (r.stage === 'new' || r.stage === 'in-progress')).length }}",
                  "icon": "calendar-clock",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Overdue",
                  "value": "{{ (data.rows || []).filter(r => r.type === 'preventive' && (r.stage === 'new' || r.stage === 'in-progress')).filter(r => !!r.scheduledDate && r.scheduledDate < Date().slice(0, 10)).length }}",
                  "icon": "alarm-clock",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Due in 30 days",
                  "value": "{{ (data.rows || []).filter(r => r.type === 'preventive' && (r.stage === 'new' || r.stage === 'in-progress')).filter(r => !(!!r.scheduledDate && r.scheduledDate < Date().slice(0, 10)) && !!r.scheduledDate && r.scheduledDate <= Date(Date.now() + 30 * 86400000).slice(0, 10)).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Unscheduled",
                  "value": "{{ (data.rows || []).filter(r => r.type === 'preventive' && (r.stage === 'new' || r.stage === 'in-progress')).filter(r => !r.scheduledDate).length }}",
                  "icon": "calendar-x",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => r.type === 'preventive' && (r.stage === 'new' || r.stage === 'in-progress')).sort((a, b) => ((a.scheduledDate || '9999') < (b.scheduledDate || '9999') ? -1 : (a.scheduledDate || '9999') > (b.scheduledDate || '9999') ? 1 : 0)).map(r => ({ path: r.path, code: r.code, equipment: r.equipment, priority: r.priority, stage: r.stage, scheduledDate: r.scheduledDate, state: (!!r.scheduledDate && r.scheduledDate < Date().slice(0, 10)) ? 'Overdue' : (!(!!r.scheduledDate && r.scheduledDate < Date().slice(0, 10)) && !!r.scheduledDate && r.scheduledDate <= Date(Date.now() + 30 * 86400000).slice(0, 10)) ? 'Upcoming' : 'Planned' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Request"
                },
                {
                  "key": "equipment",
                  "label": "Equipment"
                },
                {
                  "key": "priority",
                  "label": "Priority"
                },
                {
                  "key": "stage",
                  "label": "Stage"
                },
                {
                  "key": "scheduledDate",
                  "label": "Scheduled"
                },
                {
                  "key": "state",
                  "label": "State"
                }
              ],
              "emptyText": "No open preventive requests",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
