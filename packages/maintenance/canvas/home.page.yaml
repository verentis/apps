{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "maintenance-home",
    "name": "Maintenance",
    "description": "Maintenance overview.",
    "icon": "wrench"
  },
  "spec": {
    "access": [
      {
        "path": "/equipment",
        "reason": "Count equipment and requests and show the maintenance containers"
      },
      {
        "path": "/maintenance-requests",
        "reason": "Count equipment and requests and show the maintenance containers"
      }
    ],
    "data": {
      "equipment": {
        "kind": "folder",
        "path": "/equipment",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.equipment+json"
      },
      "requests": {
        "kind": "folder",
        "path": "/maintenance-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.request+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, equipmentPath: e.data.equipment || '', equipment: ((((data.equipment || []).find(q => q.kind === 'file' && q.data && q.path === e.data.equipment) || {}).data || {}).name) || '', type: e.data.type || '', priority: e.data.priority || '', stage: e.data.stage || 'new', scheduledDate: e.data.scheduledDate || '', durationHours: e.data.durationHours || '' }))"
      },
      "listmaintenancerequests": {
        "kind": "folder",
        "path": "/maintenance-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.request+json"
      },
      "listequipment": {
        "kind": "folder",
        "path": "/equipment",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.equipment+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Maintenance",
          "icon": "wrench",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "Requests",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => !['done', 'cancelled'].includes(r.stage)).length }}"
            },
            {
              "id": "equipment.page.yaml",
              "label": "Equipment",
              "icon": "wrench"
            },
            {
              "id": "preventive.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/maintenance/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Maintenance",
              "note": "Equipment and maintenance requests are files in your workspace. Draft a request in /maintenance-requests, then start, complete or scrap it from its form."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open requests",
                  "value": "{{ (data.rows || []).filter(r => (r.stage === 'new' || r.stage === 'in-progress')).length }}",
                  "icon": "hammer",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In progress",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'in-progress').length }}",
                  "icon": "play",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Operational equipment",
                  "value": "{{ (data.equipment || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'operational') === 'operational')).length }}",
                  "icon": "wrench",
                  "loading": "{{ data.$equipment.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Under maintenance",
                  "value": "{{ (data.equipment || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'under-maintenance')).length }}",
                  "icon": "alert-triangle",
                  "loading": "{{ data.$equipment.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "equipment",
              "compact": true,
              "description": "The /equipment folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true,
              "description": "The /maintenance-requests folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "requests",
                  "label": "Requests",
                  "icon": "hammer"
                },
                {
                  "value": "equipment",
                  "label": "Equipment",
                  "icon": "wrench"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /maintenance-requests",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/maintenance-requests"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listmaintenancerequests",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listmaintenancerequests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Request"
                        },
                        {
                          "key": "data.type",
                          "label": "Type"
                        },
                        {
                          "key": "data.priority",
                          "label": "Priority",
                          "format": "badge"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage",
                          "format": "badge"
                        },
                        {
                          "key": "data.scheduledDate",
                          "label": "Scheduled",
                          "format": "date"
                        }
                      ],
                      "facets": [
                        "data.stage"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No requests yet. Use New in /maintenance-requests."
                    },
                    "rules": {
                      "visible": "data.$listmaintenancerequests.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "requests"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /equipment",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/equipment"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listequipment",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listequipment || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.category",
                          "label": "Category"
                        },
                        {
                          "key": "data.location",
                          "label": "Location"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No equipment yet. Use New in /equipment."
                    },
                    "rules": {
                      "visible": "data.$listequipment.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "equipment"
              }
            ]
          }
        ]
      }
    ]
  }
}
