{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "maintenance-requests",
    "name": "Maintenance requests",
    "description": "Every maintenance request, boarded by stage.",
    "icon": "hammer"
  },
  "spec": {
    "access": [
      {
        "path": "/equipment",
        "reason": "Board requests by stage with their equipment names"
      },
      {
        "path": "/maintenance-requests",
        "reason": "Board requests by stage with their equipment names"
      }
    ],
    "data": {
      "equipment": {
        "kind": "folder",
        "path": "/equipment",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.equipment+json"
      },
      "requests": {
        "kind": "folder",
        "path": "/maintenance-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.maintenance.request+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.requests || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, equipmentPath: e.data.equipment || '', equipment: ((((data.equipment || []).find(q => q.kind === 'file' && q.data && q.path === e.data.equipment) || {}).data || {}).name) || '', type: e.data.type || '', priority: e.data.priority || '', stage: e.data.stage || 'new', scheduledDate: e.data.scheduledDate || '', durationHours: e.data.durationHours || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Maintenance",
          "icon": "wrench",
          "active": "requests.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "requests.page.yaml",
              "label": "Requests",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => !['done', 'cancelled'].includes(r.stage)).length }}"
            },
            {
              "id": "equipment.page.yaml",
              "label": "Equipment",
              "icon": "wrench"
            },
            {
              "id": "preventive.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/maintenance/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Requests by stage",
              "note": "Every active maintenance request, grouped by its stage. Click a row to open the request."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "equipment",
              "compact": true,
              "description": "The /equipment folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "requests",
              "compact": true,
              "description": "The /maintenance-requests folder could not be read. Reinstall Maintenance to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "hammer",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In Progress",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'in-progress').length }}",
                  "icon": "hammer",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Repaired",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'repaired').length }}",
                  "icon": "hammer",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scrap",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'scrap').length }}",
                  "icon": "hammer",
                  "loading": "{{ data.$requests.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "stage",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "new",
                          "label": "New",
                          "locked": true
                        },
                        {
                          "value": "in-progress",
                          "label": "In Progress"
                        },
                        {
                          "value": "repaired",
                          "label": "Repaired"
                        },
                        {
                          "value": "scrap",
                          "label": "Scrap"
                        }
                      ],
                      "card": {
                        "title": "equipment",
                        "code": "code",
                        "meta": [
                          "type",
                          "priority",
                          "scheduledDate"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"repaired\",\"scrap\"].includes(row.stage)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'repaired'",
                            "title": "Move to Repaired?",
                            "message": "{{ event.row.code }} moves to Repaired. It cannot be moved back from the board.",
                            "confirm-label": "Move to Repaired"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'scrap'",
                            "title": "Move to Scrap?",
                            "message": "{{ event.row.code }} moves to Scrap. The equipment is marked as scrapped.",
                            "confirm-label": "Move to Scrap"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'in-progress'",
                            "file": "/applications/maintenance/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "start-request",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'repaired'",
                            "file": "/applications/maintenance/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "complete-request",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'scrap'",
                            "file": "/applications/maintenance/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "scrap",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "equipment"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "requests"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"in-progress\",\"repaired\",\"scrap\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"new\":\"New\",\"in-progress\":\"In Progress\",\"repaired\":\"Repaired\",\"scrap\":\"Scrap\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Request"
                        },
                        {
                          "key": "equipment",
                          "label": "Equipment"
                        },
                        {
                          "key": "type",
                          "label": "Type"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "scheduledDate",
                          "label": "Scheduled"
                        },
                        {
                          "key": "durationHours",
                          "label": "Hours",
                          "align": "end"
                        },
                        {
                          "key": "stage",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "new": "New",
                            "in-progress": "In Progress",
                            "repaired": "Repaired",
                            "scrap": "Scrap"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "new",
                          "label": "New",
                          "where": "row.stage === 'new'"
                        },
                        {
                          "value": "in-progress",
                          "label": "In Progress",
                          "where": "row.stage === 'in-progress'"
                        },
                        {
                          "value": "repaired",
                          "label": "Repaired",
                          "where": "row.stage === 'repaired'"
                        },
                        {
                          "value": "scrap",
                          "label": "Scrap",
                          "where": "row.stage === 'scrap'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
