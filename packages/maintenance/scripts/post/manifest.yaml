api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: maintenance-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Stage transitions update requests and their equipment conditionally, keeping the equipment status in sync.
file-access:
  - path: "/maintenance-requests"
    mode: write
    reason: "Start, complete and scrap maintenance requests"
  - path: "/equipment"
    mode: write
    reason: "Keep the equipment status in sync with its maintenance requests"
