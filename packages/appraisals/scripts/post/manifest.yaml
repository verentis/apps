api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: appraisals-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Scheduling and completing enforce the status transitions, compute the overall score and update appraisals conditionally.
file-access:
  - path: "/appraisals"
    mode: write
    reason: "Schedule and complete appraisals"
