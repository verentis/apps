api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: appraisals-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Appraisals container.
file-access:
  - path: "/appraisals"
    mode: write
    reason: "Create appraisals with the next code"
  - path: "/settings/appraisals.json"
    mode: read
    reason: "Default new appraisals to the default manager"
