{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "appraisals-appraisal",
    "name": "Appraisals appraisal",
    "description": "View and edit an appraisal.",
    "icon": "clipboard-check"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.appraisals.appraisal+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/appraisals/v1/appraisal.schema.json",
          "source": "/applications/appraisals/schemas/appraisal.schema.json",
          "title": "Appraisals appraisal",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fappraisals%2Fcanvas%2Fappraisal.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.appraisals.appraisal+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/appraisals/v1/appraisal.schema.json",
          "source": "/applications/appraisals/schemas/appraisal.schema.json",
          "title": "Appraisals appraisal",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Offer Employees records on appraisals (when Employees is installed)"
      },
      {
        "path": "/applications/appraisals/",
        "mode": "read",
        "reason": "Read the Appraisals schemas and run the appraisal action script"
      }
    ],
    "access": [
      {
        "path": "/employees",
        "reason": "Offer Employees records on appraisals (when Employees is installed)"
      },
      {
        "path": "/applications/appraisals/",
        "reason": "Read the Appraisals schemas and run the appraisal action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "employeerecords": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeeoptions": {
        "kind": "computed",
        "expr": "(data.employeerecords || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' ')), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.employeeName || 'New appraisal' }}",
              "note": "Appraisal {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"done\"].includes(form.values.status) ? 'success' : [\"scheduled\"].includes(form.values.status) ? 'warning' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Schedule",
                  "variant": "outline",
                  "icon": "calendar",
                  "size": "sm"
                },
                "on": {
                  "click": "schedule"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Complete",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "complete"
                },
                "rules": {
                  "visible": "form.values.status === 'scheduled' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || !(form.values.ratings || []).length"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Copy name",
                  "variant": "ghost",
                  "icon": "copy",
                  "size": "sm"
                },
                "on": {
                  "click": "copy-employee"
                },
                "rules": {
                  "visible": "!(form.values.status === 'done') && !!form.values.employeeRef",
                  "disabled": "form.saving || form.values.state === 'archived'"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.status === 'done')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'done')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "draft",
                  "label": "Draft"
                },
                {
                  "value": "scheduled",
                  "label": "Scheduled"
                },
                {
                  "value": "done",
                  "label": "Done"
                }
              ],
              "branches": [
                {
                  "value": "cancelled",
                  "label": "Cancelled"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This appraisal is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Completed on {{ form.values.completedAt }} with an overall score of {{ form.values.overallScore }}. This appraisal is locked.",
              "tone": "success"
            },
            "rules": {
              "visible": "form.values.status === 'done'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This appraisal is cancelled.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'cancelled'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Appraisal"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Employee",
                          "value": "{{ form.values.employeeName }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Employee record",
                          "value": "{{ form.values.employeeRef }}",
                          "description": "Optional. Choose an Employees record, then Copy name.",
                          "options": "{{ data.employeeoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Period",
                          "value": "{{ form.values.period }}",
                          "placeholder": "e.g. 2026-H1"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Manager",
                          "value": "{{ form.values.manager }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Scheduled and Done are set by Schedule and Complete.",
                          "options": [
                            {
                              "value": "draft",
                              "label": "Draft"
                            },
                            {
                              "value": "scheduled",
                              "label": "Scheduled"
                            },
                            {
                              "value": "done",
                              "label": "Done"
                            },
                            {
                              "value": "cancelled",
                              "label": "Cancelled"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Scheduled date",
                          "value": "{{ form.values.scheduledAt }}",
                          "description": "Schedule stamps today when left empty."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Ratings"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.line-items",
                        "props": {
                          "label": "Ratings",
                          "value": "{{ form.values.ratings }}",
                          "columns": [
                            {
                              "key": "criteria",
                              "label": "Criteria",
                              "type": "text"
                            },
                            {
                              "key": "score",
                              "label": "Score (1–5)",
                              "type": "select",
                              "options": [
                                {
                                  "value": "1",
                                  "label": "1"
                                },
                                {
                                  "value": "2",
                                  "label": "2"
                                },
                                {
                                  "value": "3",
                                  "label": "3"
                                },
                                {
                                  "value": "4",
                                  "label": "4"
                                },
                                {
                                  "value": "5",
                                  "label": "5"
                                }
                              ]
                            }
                          ],
                          "defaultRow": {
                            "criteria": "",
                            "score": "3"
                          },
                          "storeComputed": false,
                          "minimum": 0,
                          "maximum": 50,
                          "addLabel": "Add criteria"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Overall score",
                          "value": "{{ form.values.overallScore }}",
                          "description": "The average rating, computed by Complete."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done')) || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Summary"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Summary",
                          "value": "{{ form.values.summary }}",
                          "rows": 6
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'done'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "copy-employee": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "employeeName": "{{ ((data.employeerecords || []).filter(e => e.kind === 'file' && e.data && e.path === form.values.employeeRef).map(e => e.data.name || [e.data.givenName, e.data.familyName].filter(Boolean).join(' '))[0]) || form.values.employeeName }}"
              }
            }
          }
        ]
      },
      "schedule": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Schedule appraisal",
              "message": "Schedule this appraisal on its scheduled date (today when empty)?"
            }
          },
          {
            "run-script": {
              "file": "/applications/appraisals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "schedule",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "complete": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Complete appraisal",
              "message": "Complete this appraisal and compute its overall score from the ratings? Done appraisals are locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/appraisals/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "complete",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
