{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appraisals-list",
    "name": "Appraisals by status",
    "description": "Every appraisal, listed by status.",
    "icon": "list"
  },
  "spec": {
    "access": [
      {
        "path": "/appraisals",
        "reason": "List appraisals by status; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "appraisals": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appraisals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', period: e.data.period || '', manager: e.data.manager || '', status: e.data.status || '', scheduledAt: e.data.scheduledAt || '', ratings: (e.data.ratings || []).length, overallScore: e.data.overallScore || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Appraisals",
          "icon": "clipboard-check",
          "active": "appraisals.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Current cycle",
              "icon": "layout-dashboard"
            },
            {
              "id": "appraisals.page.yaml",
              "label": "Cycle board",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}"
            },
            {
              "id": "scores.page.yaml",
              "label": "Scores",
              "icon": "star"
            },
            {
              "id": "cycles.page.yaml",
              "label": "Past cycles",
              "icon": "history"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/appraisals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/appraisals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Appraisals by status",
              "note": "Every active appraisal, grouped by its status. Click a row to open the appraisal."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "appraisals",
              "compact": true,
              "description": "The /appraisals folder could not be read. Reinstall Appraisals to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "status",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "draft",
                          "label": "Draft"
                        },
                        {
                          "value": "scheduled",
                          "label": "Scheduled"
                        },
                        {
                          "value": "done",
                          "label": "Done"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled"
                        }
                      ],
                      "card": {
                        "title": "employee",
                        "code": "code",
                        "meta": [
                          "period",
                          "manager",
                          "scheduledAt"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"done\"].includes(row.status)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'done'",
                            "title": "Move to Done?",
                            "message": "{{ event.row.code }} moves to Done. The overall score is computed and the appraisal is locked.",
                            "confirm-label": "Move to Done"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'scheduled'",
                            "file": "/applications/appraisals/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "schedule",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'done'",
                            "file": "/applications/appraisals/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "complete",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"scheduled\",\"done\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "status": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "appraisals"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"scheduled\",\"done\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"scheduled\":\"Scheduled\",\"done\":\"Done\",\"cancelled\":\"Cancelled\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Appraisal"
                        },
                        {
                          "key": "employee",
                          "label": "Employee"
                        },
                        {
                          "key": "period",
                          "label": "Period"
                        },
                        {
                          "key": "manager",
                          "label": "Manager"
                        },
                        {
                          "key": "scheduledAt",
                          "label": "Scheduled"
                        },
                        {
                          "key": "overallScore",
                          "label": "Overall score",
                          "align": "end"
                        },
                        {
                          "key": "status",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "draft": "Draft",
                            "scheduled": "Scheduled",
                            "done": "Done",
                            "cancelled": "Cancelled"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "draft",
                          "label": "Draft",
                          "where": "row.status === 'draft'"
                        },
                        {
                          "value": "scheduled",
                          "label": "Scheduled",
                          "where": "row.status === 'scheduled'"
                        },
                        {
                          "value": "done",
                          "label": "Done",
                          "where": "row.status === 'done'"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled",
                          "where": "row.status === 'cancelled'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
