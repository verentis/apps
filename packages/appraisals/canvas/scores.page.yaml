{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appraisals-scores",
    "name": "Scores",
    "description": "Completed appraisals and their overall scores.",
    "icon": "star"
  },
  "spec": {
    "access": [
      {
        "path": "/appraisals",
        "reason": "Summarise completed appraisals' overall scores"
      }
    ],
    "data": {
      "appraisals": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appraisals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', period: e.data.period || '', manager: e.data.manager || '', status: e.data.status || '', scheduledAt: e.data.scheduledAt || '', ratings: (e.data.ratings || []).length, overallScore: e.data.overallScore || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Appraisals",
          "icon": "clipboard-check",
          "active": "scores.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Current cycle",
              "icon": "layout-dashboard"
            },
            {
              "id": "appraisals.page.yaml",
              "label": "Cycle board",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}"
            },
            {
              "id": "scores.page.yaml",
              "label": "Scores",
              "icon": "star"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/appraisals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/appraisals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Scores summary",
              "note": "Completed appraisals by overall score, and the average per manager. Click a row to open the appraisal."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Overall score"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Completed appraisals, highest first.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore != null && r.overallScore !== '').map(r => ({ path: r.path, label: r.employee || r.code, value: Number(r.overallScore) })) }}",
                  "showLegend": true,
                  "emptyText": "No completed appraisals yet",
                  "kind": "hbar",
                  "x": "label",
                  "y": "value",
                  "format": "number",
                  "decimals": 1,
                  "sort": "-value"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "appraisals",
              "compact": true,
              "description": "The /appraisals folder could not be read. Reinstall Appraisals to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Completed",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length }}",
                  "icon": "check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Average score",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length ? ((data.rows || []).filter(r => r.status === 'done' && r.overallScore).map(r => Math.round(Number(r.overallScore) * 100)).reduce((sum, v) => sum + v, 0) / (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length / 100).toFixed(2) : '—' }}",
                  "icon": "star",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Top score",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length ? (data.rows || []).filter(r => r.status === 'done' && r.overallScore).map(r => r.overallScore).sort((a, b) => Number(b) - Number(a))[0] : '—' }}",
                  "icon": "trophy",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Completed appraisals"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).sort((a, b) => Number(b.overallScore) - Number(a.overallScore)) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Appraisal"
                    },
                    {
                      "key": "employee",
                      "label": "Employee"
                    },
                    {
                      "key": "period",
                      "label": "Period"
                    },
                    {
                      "key": "manager",
                      "label": "Manager"
                    },
                    {
                      "key": "ratings",
                      "label": "Ratings",
                      "align": "end"
                    },
                    {
                      "key": "overallScore",
                      "label": "Overall score",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No completed appraisals yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "By manager"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).map(r => r.manager || 'No manager').filter((v, i, a) => a.indexOf(v) === i).sort().map(m => ({ manager: m, done: (data.rows || []).filter(r => r.status === 'done' && r.overallScore).filter(r => (r.manager || 'No manager') === m).length, average: ((data.rows || []).filter(r => r.status === 'done' && r.overallScore).filter(r => (r.manager || 'No manager') === m).map(r => Math.round(Number(r.overallScore) * 100)).reduce((sum, v) => sum + v, 0) / (data.rows || []).filter(r => r.status === 'done' && r.overallScore).filter(r => (r.manager || 'No manager') === m).length / 100).toFixed(2) })) }}",
                  "columns": [
                    {
                      "key": "manager",
                      "label": "Manager"
                    },
                    {
                      "key": "done",
                      "label": "Completed",
                      "align": "end"
                    },
                    {
                      "key": "average",
                      "label": "Average score",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No completed appraisals yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
