{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appraisals-home",
    "name": "Appraisals",
    "description": "Appraisals overview.",
    "icon": "clipboard-check"
  },
  "spec": {
    "access": [
      {
        "path": "/appraisals",
        "reason": "Count appraisals and show them"
      }
    ],
    "data": {
      "appraisals": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appraisals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', period: e.data.period || '', manager: e.data.manager || '', status: e.data.status || '', scheduledAt: e.data.scheduledAt || '', ratings: (e.data.ratings || []).length, overallScore: e.data.overallScore || '' }))"
      },
      "listappraisals": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Appraisals",
          "icon": "clipboard-check",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Current cycle",
              "icon": "layout-dashboard"
            },
            {
              "id": "appraisals.page.yaml",
              "label": "Cycle board",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}"
            },
            {
              "id": "scores.page.yaml",
              "label": "Scores",
              "icon": "star"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/appraisals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/appraisals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Appraisals",
              "note": "Employee appraisals are files in your workspace. Draft them in /appraisals, schedule them, rate the criteria, then complete them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Average score",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length ? ((data.rows || []).filter(r => r.status === 'done' && r.overallScore).map(r => Math.round(Number(r.overallScore) * 100)).reduce((sum, v) => sum + v, 0) / (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length / 100).toFixed(2) : '—' }}",
                  "icon": "star",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "appraisals",
              "compact": true,
              "description": "The /appraisals folder could not be read. Reinstall Appraisals to recreate it."
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /appraisals",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/appraisals"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "listappraisals",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.listappraisals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "columns": [
                {
                  "key": "data.code",
                  "label": "Appraisal"
                },
                {
                  "key": "data.employeeName",
                  "label": "Employee"
                },
                {
                  "key": "data.period",
                  "label": "Period"
                },
                {
                  "key": "data.status",
                  "label": "Status",
                  "format": "badge"
                },
                {
                  "key": "data.scheduledAt",
                  "label": "Scheduled",
                  "format": "date"
                },
                {
                  "key": "data.overallScore",
                  "label": "Overall score"
                }
              ],
              "facets": [
                "data.status"
              ],
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true,
              "rowKey": "path",
              "emptyText": "No appraisals yet. Use New in /appraisals."
            },
            "rules": {
              "visible": "data.$listappraisals.status === 'ready'"
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
