{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appraisals-home",
    "name": "Appraisals",
    "description": "Appraisals overview.",
    "icon": "clipboard-check"
  },
  "spec": {
    "access": [
      {
        "path": "/appraisals",
        "reason": "Count appraisals and show them"
      }
    ],
    "data": {
      "appraisals": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appraisals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, employee: e.data.employeeName || '', period: e.data.period || '', manager: e.data.manager || '', status: e.data.status || '', scheduledAt: e.data.scheduledAt || '', ratings: (e.data.ratings || []).length, overallScore: e.data.overallScore || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Appraisals"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Employee appraisals are files in your workspace. Draft them in /appraisals, schedule them, rate the criteria, then complete them from their forms.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "By status",
                      "variant": "outline",
                      "icon": "list",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/appraisals/canvas/appraisals.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Scores",
                      "variant": "outline",
                      "icon": "star",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/appraisals/canvas/scores.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/appraisals.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'scheduled').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "check",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Average score",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length ? ((data.rows || []).filter(r => r.status === 'done' && r.overallScore).map(r => Math.round(Number(r.overallScore) * 100)).reduce((sum, v) => sum + v, 0) / (data.rows || []).filter(r => r.status === 'done' && r.overallScore).length / 100).toFixed(2) : '—' }}",
                  "icon": "star",
                  "loading": "{{ data.$appraisals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /appraisals folder could not be read. Reinstall Appraisals to recreate it."
            },
            "rules": {
              "visible": "data.$appraisals.status === 'error'"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /appraisals",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/appraisals"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.files",
            "props": {
              "path": "/appraisals/",
              "mimeTypes": [
                "application/vnd.verentis.appraisals.appraisal+json"
              ],
              "showFolders": false,
              "navigable": false,
              "columns": [
                {
                  "key": "name",
                  "label": "Appraisal"
                },
                {
                  "key": "data.employeeName",
                  "label": "Employee"
                },
                {
                  "key": "data.period",
                  "label": "Period"
                },
                {
                  "key": "data.status",
                  "label": "Status"
                },
                {
                  "key": "data.scheduledAt",
                  "label": "Scheduled"
                },
                {
                  "key": "data.overallScore",
                  "label": "Overall score"
                }
              ],
              "emptyText": "No appraisals yet. Use New in /appraisals."
            }
          }
        ]
      }
    ]
  }
}
