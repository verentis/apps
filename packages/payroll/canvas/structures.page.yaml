{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "payroll-structures",
    "name": "Salary structures",
    "description": "Salary structures and pay profiles.",
    "icon": "layers"
  },
  "spec": {
    "access": [
      {
        "path": "/salary-structures",
        "reason": "List salary structures"
      },
      {
        "path": "/pay-profiles",
        "reason": "List pay profiles"
      }
    ],
    "data": {
      "structures": {
        "kind": "folder",
        "path": "/salary-structures",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.structure+json"
      },
      "profiles": {
        "kind": "folder",
        "path": "/pay-profiles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.profile+json"
      },
      "listsalarystructures": {
        "kind": "folder",
        "path": "/salary-structures",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.structure+json"
      },
      "listpayprofiles": {
        "kind": "folder",
        "path": "/pay-profiles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.profile+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Payroll",
          "icon": "calendar-check",
          "active": "structures.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Pay runs",
              "icon": "layout-dashboard"
            },
            {
              "id": "structures.page.yaml",
              "label": "Structures",
              "icon": "layers"
            },
            {
              "id": "payslips.page.yaml",
              "label": "Payslips",
              "icon": "file-text"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/payroll/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/payroll.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Salary structures",
              "note": "Structures hold the pay rules — earnings, deductions and employer contributions as fixed amounts or percentages of the base wage. No tax tables are built in; rules are your data."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Structures",
                  "value": "{{ (data.structures || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "layers",
                  "loading": "{{ data.$structures.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pay profiles",
                  "value": "{{ (data.profiles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "id-card",
                  "loading": "{{ data.$profiles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active profiles",
                  "value": "{{ (data.profiles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.active === true)).length }}",
                  "icon": "user-check",
                  "loading": "{{ data.$profiles.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "structures",
              "compact": true,
              "description": "The /salary-structures folder could not be read. Reinstall Payroll to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "profiles",
              "compact": true,
              "description": "The /pay-profiles folder could not be read. Reinstall Payroll to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "structures",
                  "label": "Structures",
                  "icon": "layers"
                },
                {
                  "value": "profiles",
                  "label": "Pay profiles",
                  "icon": "id-card"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /salary-structures",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/salary-structures"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsalarystructures",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsalarystructures || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No salary structures yet. Use New in /salary-structures."
                    },
                    "rules": {
                      "visible": "data.$listsalarystructures.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "structures"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /pay-profiles",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/pay-profiles"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listpayprofiles",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listpayprofiles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.employeeName",
                          "label": "Employee"
                        },
                        {
                          "key": "data.baseWage",
                          "label": "Base wage"
                        },
                        {
                          "key": "data.currency",
                          "label": "Currency"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No pay profiles yet. Use New in /pay-profiles."
                    },
                    "rules": {
                      "visible": "data.$listpayprofiles.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "profiles"
              }
            ]
          }
        ]
      }
    ]
  }
}
