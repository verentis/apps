{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "payroll-payrun",
    "name": "Payroll pay run",
    "description": "View and edit a Payroll pay run.",
    "icon": "calendar-check"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.payroll.payrun+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/payroll/v1/payrun.schema.json",
          "source": "/applications/payroll/schemas/payrun.schema.json",
          "title": "Payroll pay run",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fpayroll%2Fcanvas%2Fpayrun.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.payroll.payrun+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/payroll/v1/payrun.schema.json",
          "source": "/applications/payroll/schemas/payrun.schema.json",
          "title": "Payroll pay run",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/applications/payroll/",
        "mode": "read",
        "reason": "Read the Payroll schemas and run the pay run script"
      }
    ],
    "access": [
      {
        "path": "/applications/payroll/",
        "reason": "Read the Payroll schemas and run the pay run script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.heading",
                        "props": {
                          "level": 2,
                          "text": "{{ form.values.period || 'New pay run' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                          "tone": "{{ [\"approved\",\"posted\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : 'neutral' }}"
                        },
                        "rules": {
                          "visible": "!!form.values.status"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "Archived",
                          "tone": "warning",
                          "icon": "archive"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Pay run {{ form.values.code || '' }} · {{ ctx.file.path }}",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Compute",
                      "icon": "calculator",
                      "size": "sm"
                    },
                    "on": {
                      "click": "compute"
                    },
                    "rules": {
                      "visible": "((!form.values.status || form.values.status === 'draft') || form.values.status === 'computed') && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty || form.invalid"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Approve",
                      "icon": "check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "approve"
                    },
                    "rules": {
                      "visible": "form.values.status === 'computed'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Post",
                      "icon": "send",
                      "size": "sm"
                    },
                    "on": {
                      "click": "post"
                    },
                    "rules": {
                      "visible": "form.values.status === 'approved'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Archive",
                          "variant": "ghost",
                          "icon": "archive",
                          "size": "sm"
                        },
                        "on": {
                          "click": "archive"
                        },
                        "rules": {
                          "visible": "!(form.values.state === 'archived') && !(form.values.status === 'posted')",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Restore",
                          "variant": "outline",
                          "icon": "archive-restore",
                          "size": "sm"
                        },
                        "on": {
                          "click": "restore"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Reset",
                          "variant": "ghost",
                          "size": "sm"
                        },
                        "on": {
                          "click": "reset"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Save",
                          "icon": "save",
                          "size": "sm"
                        },
                        "on": {
                          "click": "save"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'posted')"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$record.error }}"
            },
            "rules": {
              "visible": "data.$record.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$record.status === 'loading'"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This pay run is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Journal",
                  "variant": "ghost",
                  "icon": "notebook-pen",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.journal && form.values.journal.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.journal && form.values.journal.path)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Gross",
                  "value": "{{ (form.values.totals && form.values.totals.gross) || '' }}",
                  "icon": "sigma"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Deductions",
                  "value": "{{ (form.values.totals && form.values.totals.deductions) || '' }}",
                  "icon": "minus"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Employer contributions",
                  "value": "{{ (form.values.totals && form.values.totals.contributions) || '' }}",
                  "icon": "plus"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Net {{ form.values.currency }}",
                  "value": "{{ (form.values.totals && form.values.totals.net) || '' }}",
                  "icon": "banknote"
                }
              }
            ],
            "rules": {
              "visible": "!!form.values.totals"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Payslips",
              "description": "One payslip per active pay profile, computed from its salary structure."
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (form.values.payslips || []).map(p => ({ employee: p.employee, base: p.base, gross: p.gross, deductions: p.deductions, contributions: p.contributions, net: p.net })) }}",
                  "columns": [
                    {
                      "key": "employee",
                      "label": "Employee"
                    },
                    {
                      "key": "base",
                      "label": "Base",
                      "align": "end"
                    },
                    {
                      "key": "gross",
                      "label": "Gross",
                      "align": "end"
                    },
                    {
                      "key": "deductions",
                      "label": "Deductions",
                      "align": "end"
                    },
                    {
                      "key": "contributions",
                      "label": "Contributions",
                      "align": "end"
                    },
                    {
                      "key": "net",
                      "label": "Net",
                      "align": "end"
                    }
                  ],
                  "emptyText": "Not computed yet. Save the run, then Compute."
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Pay run"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Period (YYYY-MM)",
                          "value": "{{ form.values.period }}",
                          "required": true,
                          "placeholder": "2026-11"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'posted'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Currency",
                          "value": "{{ form.values.currency }}",
                          "placeholder": "ZAR"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'posted'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "compute": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Compute pay run",
              "message": "Compute a payslip for every active pay profile from its salary structure? Computing again replaces the payslips."
            }
          },
          {
            "run-script": {
              "file": "/applications/payroll/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "compute-run",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "approve": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Approve pay run",
              "message": "Approve the computed payslips? An approved run is ready to post."
            }
          },
          {
            "run-script": {
              "file": "/applications/payroll/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "approve-run",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "post": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Post pay run",
              "message": "Post this pay run to the Accounting ledger? Posted runs are locked and cannot be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/payroll/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "post-run",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
