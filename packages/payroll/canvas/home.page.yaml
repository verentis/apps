{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "payroll-home",
    "name": "Payroll",
    "description": "Payroll overview and pay runs.",
    "icon": "calendar-check"
  },
  "spec": {
    "access": [
      {
        "path": "/pay-runs",
        "reason": "List pay runs"
      }
    ],
    "data": {
      "runs": {
        "kind": "folder",
        "path": "/pay-runs",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.payrun+json"
      },
      "listpayruns": {
        "kind": "folder",
        "path": "/pay-runs",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.payroll.payrun+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Payroll",
          "icon": "calendar-check",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Pay runs",
              "icon": "layout-dashboard"
            },
            {
              "id": "structures.page.yaml",
              "label": "Structures",
              "icon": "layers"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/payroll/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/payroll.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Payroll",
              "note": "A region-agnostic payroll engine: salary structures and their rules are your data. Draft a pay run for a period, Compute payslips for every active pay profile, Approve, then Post one journal to the Accounting ledger."
            },
            "children": []
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.runs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "groupBy": "data.status",
              "columns": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "locked": true
                },
                {
                  "value": "computed",
                  "label": "Computed"
                },
                {
                  "value": "approved",
                  "label": "Approved"
                },
                {
                  "value": "posted",
                  "label": "Posted"
                }
              ],
              "card": {
                "title": "data.period",
                "code": "data.code",
                "meta": [
                  "data.currency"
                ]
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"posted\"].includes(row.data.status)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'posted'",
                    "title": "Move to Posted?",
                    "message": "{{ event.row.data.code }} moves to Posted. Posting writes the payroll journal.",
                    "confirm-label": "Move to Posted"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'computed'",
                    "file": "/applications/payroll/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "compute-run",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'approved'",
                    "file": "/applications/payroll/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "approve-run",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'posted'",
                    "file": "/applications/payroll/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "post-run",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "runs"
                  }
                },
                {
                  "refresh-source": {
                    "source": "listpayruns"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"computed\",\"approved\",\"posted\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"computed\":\"Computed\",\"approved\":\"Approved\",\"posted\":\"Posted\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft runs",
                  "value": "{{ (data.runs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$runs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting approval",
                  "value": "{{ (data.runs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'computed')).length }}",
                  "icon": "calculator",
                  "loading": "{{ data.$runs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Approved",
                  "value": "{{ (data.runs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'approved')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$runs.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Net paid (posted)",
                  "value": "{{ ((data.runs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status === 'posted' && e.data.totals).reduce((s, e) => s + Math.round(Number(e.data.totals.net || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "banknote",
                  "loading": "{{ data.$runs.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "runs",
              "compact": true,
              "description": "The /pay-runs folder could not be read. Reinstall Payroll to recreate it."
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /pay-runs",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/pay-runs"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "listpayruns",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.listpayruns || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "columns": [
                {
                  "key": "data.code",
                  "label": "Code"
                },
                {
                  "key": "data.period",
                  "label": "Period"
                },
                {
                  "key": "data.status",
                  "label": "Status",
                  "format": "badge"
                },
                {
                  "key": "data.totals.gross",
                  "label": "Gross"
                },
                {
                  "key": "data.totals.net",
                  "label": "Net"
                }
              ],
              "facets": [
                "data.status"
              ],
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true,
              "rowKey": "path",
              "emptyText": "No pay runs yet. Use New in /pay-runs."
            },
            "rules": {
              "visible": "data.$listpayruns.status === 'ready'"
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
