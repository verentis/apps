api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: payroll-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Payroll containers.
file-access:
  - path: "/salary-structures"
    mode: write
    reason: "Create salary structures with the next number"
  - path: "/pay-profiles"
    mode: write
    reason: "Create pay profiles with the next number"
  - path: "/pay-runs"
    mode: write
    reason: "Create pay runs with the next number"
  - path: "/settings/payroll.json"
    mode: read
    reason: "Read the Payroll defaults for new records"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Default new records to the ledger's base currency"
