api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: payroll-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Computing, approving and posting validate against the Accounting ledger and write payslips and one journal per run conditionally.
file-access:
  - path: "/settings/payroll.json"
    mode: read
    reason: "Read the accounts pay runs post to"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Read the ledger's base currency and precision"
  - path: "/chart-of-accounts"
    mode: read
    reason: "Check that posted accounts exist and are active"
  - path: "/periods"
    mode: read
    reason: "Find the open period a pay run posts in"
  - path: "/journals"
    mode: write
    reason: "Post one journal per pay run"
  - path: "/salary-structures"
    mode: read
    reason: "Read the salary structures payslips are computed from"
  - path: "/pay-profiles"
    mode: read
    reason: "Read the active pay profiles a run pays"
  - path: "/pay-runs"
    mode: write
    reason: "Store computed payslips and mark runs computed, approved or posted"
