{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "helpdesk-settings",
    "name": "Helpdesk settings",
    "description": "Edit the Helpdesk settings file.",
    "icon": "settings"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.helpdesk.settings+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/helpdesk/v1/settings.schema.json",
          "source": "/applications/helpdesk/schemas/settings.schema.json",
          "title": "Helpdesk settings",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fhelpdesk%2Fcanvas%2Fsettings.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.helpdesk.settings+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/helpdesk/v1/settings.schema.json",
          "source": "/applications/helpdesk/schemas/settings.schema.json",
          "title": "Helpdesk settings",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/helpdesk-teams",
        "mode": "read",
        "reason": "Choose the default team for new tickets"
      },
      {
        "path": "/applications/helpdesk/",
        "mode": "read",
        "reason": "Read the Helpdesk schemas and run the ticket action script"
      }
    ],
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "Choose the default team for new tickets"
      },
      {
        "path": "/applications/helpdesk/",
        "reason": "Read the Helpdesk schemas and run the ticket action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "teamoptions": {
        "kind": "computed",
        "expr": "(data.teams || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Helpdesk settings"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "The default team for new tickets. Code prefixes are app settings, managed with the installed app.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "reset-form": {}
                        }
                      ]
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "save": {}
                        },
                        {
                          "toast": {
                            "message": "Saved",
                            "variant": "success"
                          }
                        }
                      ]
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid"
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$record.error }}"
            },
            "rules": {
              "visible": "data.$record.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$record.status === 'loading'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            },
            "rules": {
              "visible": "data.$teams.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$teams.status === 'loading'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 1
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Defaults"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Default team",
                          "value": "{{ form.values.defaultTeam }}",
                          "description": "New tickets start with this team; its SLA hours set their deadline.",
                          "options": "{{ data.teamoptions }}"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {}
  }
}
