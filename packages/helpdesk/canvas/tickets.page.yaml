{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-tickets",
    "name": "Tickets",
    "description": "Every ticket, listed by stage.",
    "icon": "ticket"
  },
  "spec": {
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "List tickets by stage with their team names"
      },
      {
        "path": "/tickets",
        "reason": "List tickets by stage with their team names; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', teamPath: e.data.team || '', team: ((((data.teams || []).find(t => t.kind === 'file' && t.data && t.path === e.data.team) || {}).data || {}).name) || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', deadline: e.data.slaDeadline || '', overdue: ['new', 'in-progress', 'waiting'].includes(e.data.stage) && !!e.data.slaDeadline && e.data.slaDeadline < Date() }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Helpdesk",
          "icon": "ticket",
          "active": "tickets.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Queue",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).length }}"
            },
            {
              "id": "tickets.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "sla.page.yaml",
              "label": "SLA",
              "icon": "alarm-clock",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).filter(r => r.overdue).length }}",
              "tone": "danger"
            },
            {
              "id": "workload.page.yaml",
              "label": "Workload",
              "icon": "users"
            },
            {
              "id": "mine.page.yaml",
              "label": "Mine",
              "icon": "user"
            },
            {
              "id": "unassigned.page.yaml",
              "label": "Unassigned",
              "icon": "inbox"
            },
            {
              "id": "overdue.page.yaml",
              "label": "Overdue",
              "icon": "alarm-clock-off"
            },
            {
              "id": "waiting.page.yaml",
              "label": "Waiting",
              "icon": "hourglass"
            },
            {
              "id": "solved.page.yaml",
              "label": "Solved",
              "icon": "circle-check"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/helpdesk/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/helpdesk.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Tickets by stage",
              "note": "Every active ticket, grouped by its stage. Click a row to open the ticket."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "teams",
              "compact": true,
              "description": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tickets",
              "compact": true,
              "description": "The /tickets folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 5
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In Progress",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'in-progress').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Waiting",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'waiting').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Solved",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'solved').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'closed').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "stage",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "new",
                          "label": "New"
                        },
                        {
                          "value": "in-progress",
                          "label": "In Progress"
                        },
                        {
                          "value": "waiting",
                          "label": "Waiting"
                        },
                        {
                          "value": "solved",
                          "label": "Solved"
                        },
                        {
                          "value": "closed",
                          "label": "Closed"
                        }
                      ],
                      "card": {
                        "title": "subject",
                        "code": "code",
                        "meta": [
                          "team",
                          "priority",
                          "assignee"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"closed\"].includes(row.stage)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'closed'",
                            "title": "Move to Closed?",
                            "message": "{{ event.row.code }} moves to Closed. A closed ticket can no longer be edited.",
                            "confirm-label": "Move to Closed"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'solved'",
                            "title": "Move to Solved",
                            "message": "{{ event.row.code }} moves to Solved.",
                            "confirm-label": "Move to Solved",
                            "fields": [
                              {
                                "key": "resolution",
                                "label": "Resolution",
                                "type": "textarea",
                                "required": true,
                                "description": "What was done. The customer sees this."
                              }
                            ],
                            "assign": "moveanswer"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'solved'",
                            "file": "/applications/helpdesk/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "resolve",
                              "path": "{{ event.path }}",
                              "resolution": "{{ state.moveanswer.resolution }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'closed'",
                            "file": "/applications/helpdesk/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "close",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"solved\",\"closed\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "stage": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "tickets"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "teams"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"solved\",\"closed\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"new\":\"New\",\"in-progress\":\"In Progress\",\"waiting\":\"Waiting\",\"solved\":\"Solved\",\"closed\":\"Closed\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        },
                        {
                          "key": "stage",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "new": "New",
                            "in-progress": "In Progress",
                            "waiting": "Waiting",
                            "solved": "Solved",
                            "closed": "Closed"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "new",
                          "label": "New",
                          "where": "row.stage === 'new'"
                        },
                        {
                          "value": "in-progress",
                          "label": "In Progress",
                          "where": "row.stage === 'in-progress'"
                        },
                        {
                          "value": "waiting",
                          "label": "Waiting",
                          "where": "row.stage === 'waiting'"
                        },
                        {
                          "value": "solved",
                          "label": "Solved",
                          "where": "row.stage === 'solved'"
                        },
                        {
                          "value": "closed",
                          "label": "Closed",
                          "where": "row.stage === 'closed'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
