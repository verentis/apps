{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-tickets",
    "name": "Tickets",
    "description": "Every ticket, listed by stage.",
    "icon": "ticket"
  },
  "spec": {
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "List tickets by stage with their team names"
      },
      {
        "path": "/tickets",
        "reason": "List tickets by stage with their team names"
      }
    ],
    "data": {
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', teamPath: e.data.team || '', team: ((((data.teams || []).find(t => t.kind === 'file' && t.data && t.path === e.data.team) || {}).data || {}).name) || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', deadline: e.data.slaDeadline || '', overdue: ['new', 'in-progress', 'waiting'].includes(e.data.stage) && !!e.data.slaDeadline && e.data.slaDeadline < Date() }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Tickets by stage"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active ticket, grouped by its stage. Click a row to open the ticket.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Helpdesk",
                  "variant": "ghost",
                  "icon": "ticket",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/helpdesk/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            },
            "rules": {
              "visible": "data.$teams.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /tickets folder could not be read. Reinstall Helpdesk to recreate it."
            },
            "rules": {
              "visible": "data.$tickets.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 5
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In Progress",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'in-progress').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Waiting",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'waiting').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Solved",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'solved').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Closed",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'closed').length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "new",
                  "label": "New",
                  "icon": "ticket"
                },
                {
                  "value": "in-progress",
                  "label": "In Progress",
                  "icon": "ticket"
                },
                {
                  "value": "waiting",
                  "label": "Waiting",
                  "icon": "ticket"
                },
                {
                  "value": "solved",
                  "label": "Solved",
                  "icon": "ticket"
                },
                {
                  "value": "closed",
                  "label": "Closed",
                  "icon": "ticket"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.stage === 'new') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        }
                      ],
                      "emptyText": "No new tickets",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "new"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.stage === 'in-progress') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        }
                      ],
                      "emptyText": "No in progress tickets",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "in-progress"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.stage === 'waiting') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        }
                      ],
                      "emptyText": "No waiting tickets",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "waiting"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.stage === 'solved') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        }
                      ],
                      "emptyText": "No solved tickets",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "solved"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.stage === 'closed') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Ticket"
                        },
                        {
                          "key": "subject",
                          "label": "Subject"
                        },
                        {
                          "key": "team",
                          "label": "Team"
                        },
                        {
                          "key": "priority",
                          "label": "Priority"
                        },
                        {
                          "key": "assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "deadline",
                          "label": "SLA deadline"
                        }
                      ],
                      "emptyText": "No closed tickets",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "closed"
              }
            ]
          }
        ]
      }
    ]
  }
}
