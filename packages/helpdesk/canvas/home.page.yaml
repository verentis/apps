{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-home",
    "name": "Helpdesk",
    "description": "Helpdesk overview.",
    "icon": "ticket"
  },
  "spec": {
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "Count tickets and show the teams and tickets"
      },
      {
        "path": "/tickets",
        "reason": "Count tickets and show the teams and tickets"
      }
    ],
    "data": {
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', teamPath: e.data.team || '', team: ((((data.teams || []).find(t => t.kind === 'file' && t.data && t.path === e.data.team) || {}).data || {}).name) || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', deadline: e.data.slaDeadline || '', overdue: ['new', 'in-progress', 'waiting'].includes(e.data.stage) && !!e.data.slaDeadline && e.data.slaDeadline < Date() }))"
      },
      "listtickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "listhelpdeskteams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Helpdesk",
          "icon": "ticket",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Queue",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).length }}"
            },
            {
              "id": "tickets.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "sla.page.yaml",
              "label": "SLA",
              "icon": "alarm-clock",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).filter(r => r.overdue).length }}",
              "tone": "danger"
            },
            {
              "id": "workload.page.yaml",
              "label": "Workload",
              "icon": "users"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/helpdesk/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/helpdesk.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Helpdesk",
              "note": "Teams and tickets are files in your workspace. Draft tickets in /tickets, work them by stage, then resolve and close them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open tickets",
                  "value": "{{ (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).length }}",
                  "icon": "ticket",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Overdue",
                  "value": "{{ (data.rows || []).filter(r => r.overdue).length }}",
                  "icon": "alarm-clock",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "inbox",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Solved",
                  "value": "{{ (data.rows || []).filter(r => r.stage === 'solved').length }}",
                  "icon": "check",
                  "loading": "{{ data.$tickets.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "teams",
              "compact": true,
              "description": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tickets",
              "compact": true,
              "description": "The /tickets folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "tickets",
                  "label": "Tickets",
                  "icon": "ticket"
                },
                {
                  "value": "teams",
                  "label": "Teams",
                  "icon": "users"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /tickets",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/tickets"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listtickets",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listtickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Ticket"
                        },
                        {
                          "key": "data.subject",
                          "label": "Subject"
                        },
                        {
                          "key": "data.priority",
                          "label": "Priority",
                          "format": "badge"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage",
                          "format": "badge"
                        },
                        {
                          "key": "data.assignee",
                          "label": "Assignee"
                        },
                        {
                          "key": "data.slaDeadline",
                          "label": "SLA deadline",
                          "format": "countdown",
                          "soon": "4h",
                          "doneWhen": "[\"done\",\"closed\",\"solved\",\"resolved\",\"received\",\"delivered\",\"posted\",\"paid\",\"applied\",\"hired\",\"validated\",\"cancelled\",\"canceled\",\"rejected\",\"refused\",\"lost\",\"declined\",\"void\",\"voided\",\"failed\",\"no-show\",\"not-held\",\"terminated\",\"retired\",\"scrapped\"].includes(row.data.stage)",
                          "doneText": "Done"
                        }
                      ],
                      "facets": [
                        "data.stage"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No tickets yet. Use New in /tickets."
                    },
                    "rules": {
                      "visible": "data.$listtickets.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "tickets"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /helpdesk-teams",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/helpdesk-teams"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listhelpdeskteams",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listhelpdeskteams || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Team"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.slaHours",
                          "label": "SLA hours"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No teams yet. Use New in /helpdesk-teams."
                    },
                    "rules": {
                      "visible": "data.$listhelpdeskteams.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "teams"
              }
            ]
          }
        ]
      }
    ]
  }
}
