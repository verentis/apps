{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-workload",
    "name": "Workload",
    "description": "Open tickets per team and assignee.",
    "icon": "users"
  },
  "spec": {
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "Sum open tickets per team and assignee"
      },
      {
        "path": "/tickets",
        "reason": "Sum open tickets per team and assignee"
      }
    ],
    "data": {
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', teamPath: e.data.team || '', team: ((((data.teams || []).find(t => t.kind === 'file' && t.data && t.path === e.data.team) || {}).data || {}).name) || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', deadline: e.data.slaDeadline || '', overdue: ['new', 'in-progress', 'waiting'].includes(e.data.stage) && !!e.data.slaDeadline && e.data.slaDeadline < Date() }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Team workload"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Open tickets per team and per assignee. Click a team to open it.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Helpdesk",
                  "variant": "ghost",
                  "icon": "ticket",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/helpdesk/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            },
            "rules": {
              "visible": "data.$teams.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /tickets folder could not be read. Reinstall Helpdesk to recreate it."
            },
            "rules": {
              "visible": "data.$tickets.status === 'error'"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Teams"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.teams || []).filter(t => t.kind === 'file' && t.data && t.data.state !== 'archived').map(t => ({ path: t.path, team: t.data.name || t.name, members: (t.data.members || []).length, slaHours: t.data.slaHours || '', open: (data.rows || []).filter(r => r.teamPath === t.path && ['new', 'in-progress', 'waiting'].includes(r.stage)).length, overdue: (data.rows || []).filter(r => r.teamPath === t.path && r.overdue).length, solved: (data.rows || []).filter(r => r.teamPath === t.path && r.stage === 'solved').length })) }}",
                  "columns": [
                    {
                      "key": "team",
                      "label": "Team"
                    },
                    {
                      "key": "members",
                      "label": "Members",
                      "align": "end"
                    },
                    {
                      "key": "slaHours",
                      "label": "SLA hours",
                      "align": "end"
                    },
                    {
                      "key": "open",
                      "label": "Open",
                      "align": "end"
                    },
                    {
                      "key": "overdue",
                      "label": "Overdue",
                      "align": "end"
                    },
                    {
                      "key": "solved",
                      "label": "Solved",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No teams yet",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Assignees"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).map(r => r.assignee || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).sort().map(a => ({ assignee: a, open: (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === a).length, overdue: (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === a && r.overdue).length })) }}",
                  "columns": [
                    {
                      "key": "assignee",
                      "label": "Assignee"
                    },
                    {
                      "key": "open",
                      "label": "Open",
                      "align": "end"
                    },
                    {
                      "key": "overdue",
                      "label": "Overdue",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No open tickets"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
