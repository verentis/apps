{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-workload",
    "name": "Workload",
    "description": "Open tickets per team and assignee.",
    "icon": "users"
  },
  "spec": {
    "access": [
      {
        "path": "/helpdesk-teams",
        "reason": "Sum open tickets per team and assignee"
      },
      {
        "path": "/tickets",
        "reason": "Sum open tickets per team and assignee"
      }
    ],
    "data": {
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "teams": {
        "kind": "folder",
        "path": "/helpdesk-teams",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.team+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', teamPath: e.data.team || '', team: ((((data.teams || []).find(t => t.kind === 'file' && t.data && t.path === e.data.team) || {}).data || {}).name) || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', deadline: e.data.slaDeadline || '', overdue: ['new', 'in-progress', 'waiting'].includes(e.data.stage) && !!e.data.slaDeadline && e.data.slaDeadline < Date() }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Helpdesk",
          "icon": "ticket",
          "active": "workload.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Queue",
              "icon": "inbox",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).length }}"
            },
            {
              "id": "tickets.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "sla.page.yaml",
              "label": "SLA",
              "icon": "alarm-clock",
              "count": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).filter(r => r.overdue).length }}",
              "tone": "danger"
            },
            {
              "id": "workload.page.yaml",
              "label": "Workload",
              "icon": "users"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/helpdesk/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/helpdesk.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Team workload",
              "note": "Open tickets per team and per assignee. Click a team to open it."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Open tickets per assignee"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).map(r => r.assignee || 'Unassigned').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, overdue: (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === name && r.overdue).length, ontrack: (data.rows || []).filter(r => !['solved', 'closed'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === name && !r.overdue).length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "overdue",
                    "ontrack"
                  ],
                  "labels": {
                    "overdue": "Overdue",
                    "ontrack": "On track"
                  },
                  "palette": {
                    "overdue": "danger",
                    "ontrack": "chart-1"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "teams",
              "compact": true,
              "description": "The /helpdesk-teams folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tickets",
              "compact": true,
              "description": "The /tickets folder could not be read. Reinstall Helpdesk to recreate it."
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Teams"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.teams || []).filter(t => t.kind === 'file' && t.data && t.data.state !== 'archived').map(t => ({ path: t.path, team: t.data.name || t.name, members: (t.data.members || []).length, slaHours: t.data.slaHours || '', open: (data.rows || []).filter(r => r.teamPath === t.path && ['new', 'in-progress', 'waiting'].includes(r.stage)).length, overdue: (data.rows || []).filter(r => r.teamPath === t.path && r.overdue).length, solved: (data.rows || []).filter(r => r.teamPath === t.path && r.stage === 'solved').length })) }}",
                  "columns": [
                    {
                      "key": "team",
                      "label": "Team"
                    },
                    {
                      "key": "members",
                      "label": "Members",
                      "align": "end"
                    },
                    {
                      "key": "slaHours",
                      "label": "SLA hours",
                      "align": "end"
                    },
                    {
                      "key": "open",
                      "label": "Open",
                      "align": "end"
                    },
                    {
                      "key": "overdue",
                      "label": "Overdue",
                      "align": "end"
                    },
                    {
                      "key": "solved",
                      "label": "Solved",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No teams yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Assignees"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).map(r => r.assignee || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).sort().map(a => ({ assignee: a, open: (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === a).length, overdue: (data.rows || []).filter(r => ['new', 'in-progress', 'waiting'].includes(r.stage)).filter(r => (r.assignee || 'Unassigned') === a && r.overdue).length })) }}",
                  "columns": [
                    {
                      "key": "assignee",
                      "label": "Assignee"
                    },
                    {
                      "key": "open",
                      "label": "Open",
                      "align": "end"
                    },
                    {
                      "key": "overdue",
                      "label": "Overdue",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No open tickets",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
