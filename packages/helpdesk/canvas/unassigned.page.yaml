{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "helpdesk-unassigned",
    "name": "Unassigned",
    "description": "Open tickets nobody has picked up yet.",
    "icon": "inbox"
  },
  "spec": {
    "access": [
      {
        "path": "/tickets",
        "reason": "List unassigned"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Helpdesk",
          "icon": "ticket",
          "active": "unassigned.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Queue",
              "icon": "inbox"
            },
            {
              "id": "tickets.page.yaml",
              "label": "Board",
              "icon": "kanban"
            },
            {
              "id": "sla.page.yaml",
              "label": "SLA",
              "icon": "alarm-clock"
            },
            {
              "id": "workload.page.yaml",
              "label": "Workload",
              "icon": "users"
            },
            {
              "id": "mine.page.yaml",
              "label": "Mine",
              "icon": "user"
            },
            {
              "id": "unassigned.page.yaml",
              "label": "Unassigned",
              "icon": "inbox"
            },
            {
              "id": "overdue.page.yaml",
              "label": "Overdue",
              "icon": "alarm-clock-off"
            },
            {
              "id": "waiting.page.yaml",
              "label": "Waiting",
              "icon": "hourglass"
            },
            {
              "id": "solved.page.yaml",
              "label": "Solved",
              "icon": "circle-check"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/helpdesk/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/helpdesk.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Unassigned",
              "note": "Open tickets nobody has picked up yet."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => ['new', 'in-progress', 'waiting'].includes(e.data.stage || 'new') && !e.data.assignee && !e.data.assigneeRef).map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', customer: e.data.customerName || '', priority: e.data.priority || '', stage: e.data.stage || '', assignee: e.data.assignee || '', sla: e.data.slaDeadline || '' })).sort((a, b) => (a.sla || '9') < (b.sla || '9') ? -1 : 1) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Ticket"
                },
                {
                  "key": "subject",
                  "label": "Subject"
                },
                {
                  "key": "customer",
                  "label": "Customer"
                },
                {
                  "key": "priority",
                  "label": "Priority",
                  "format": "badge"
                },
                {
                  "key": "stage",
                  "label": "Stage",
                  "format": "badge"
                },
                {
                  "key": "assignee",
                  "label": "Assignee"
                },
                {
                  "key": "sla",
                  "label": "SLA",
                  "format": "datetime"
                }
              ],
              "emptyText": "Every open ticket has an assignee.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
