api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: helpdesk-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Helpdesk containers; tickets get their SLA deadline from their team.
file-access:
  - path: "/helpdesk-teams"
    mode: write
    reason: "Create teams with the next code"
  - path: "/tickets"
    mode: write
    reason: "Create tickets with the next code"
  - path: "/settings/helpdesk.json"
    mode: read
    reason: "Default new tickets to the default team"
