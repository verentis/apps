api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: helpdesk-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Resolving and closing enforce the stage transitions and update tickets conditionally.
file-access:
  - path: "/tickets"
    mode: write
    reason: "Mark tickets solved or closed"
