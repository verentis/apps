api-version: verentis.io/v1
kind: Theme

metadata:
  id: verentis-forest-theme
  name: Verentis Forest
  description: Calm green palette with a dark pine sidebar and matching dashboard
    stripes. Light and dark mode; it keeps your existing logos, favicon and
    backgrounds.
  icon: ./marketplace/logo.svg
  version: 1.0.4
  author: Verentis
  tags: [ theme, verentis, green ]

marketplace:
  logo: ./marketplace/logo.svg
  hero:
    source: ./marketplace/hero.svg
    alt: "Layered green hills from dark pine to pale sage."
  readme: ./README.md

# Installs colours and dashboard heroes (record at themes/verentis-forest-theme). Assets not listed here keep the
# workspace's current files.
spec:
  assets:
    theme.css: theme/theme.css
    hero: theme/hero.svg
    hero.dark: theme/hero-dark.svg

packaging:
  publisher: verentis
  files:
    - "theme/*"
  encryption: none
