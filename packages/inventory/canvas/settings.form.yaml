{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "inventory-settings",
    "name": "Inventory settings",
    "description": "Edit the Inventory settings file.",
    "icon": "settings"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.inventory.settings+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/inventory/v1/settings.schema.json",
          "source": "/applications/inventory/schemas/settings.schema.json",
          "title": "Inventory settings",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Finventory%2Fcanvas%2Fsettings.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.inventory.settings+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/inventory/v1/settings.schema.json",
          "source": "/applications/inventory/schemas/settings.schema.json",
          "title": "Inventory settings",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/warehouses",
        "mode": "read",
        "reason": "Choose the default warehouse"
      },
      {
        "path": "/applications/inventory/",
        "mode": "read",
        "reason": "Read the Inventory schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/warehouses",
        "reason": "Choose the default warehouse"
      },
      {
        "path": "/applications/inventory/",
        "reason": "Read the Inventory schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "warehouses": {
        "kind": "folder",
        "path": "/warehouses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.warehouse+json"
      },
      "warehouseoptions": {
        "kind": "computed",
        "expr": "(data.warehouses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ((e.data.name || '')), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Inventory settings",
              "note": "The warehouse new adjustments count by default. Code prefixes are app settings, managed with the installed app."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Reset",
                  "variant": "ghost",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "reset-form": {}
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Save",
                  "icon": "save",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "save": {}
                    },
                    {
                      "toast": {
                        "message": "Saved",
                        "variant": "success"
                      }
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty || form.invalid"
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Settings"
            },
            "children": [
              {
                "type": "canvas.grid",
                "layout": {
                  "base": {
                    "columns": 1,
                    "gap": 4
                  },
                  "tablet": {
                    "columns": 2
                  }
                },
                "children": [
                  {
                    "type": "canvas.form.select",
                    "props": {
                      "label": "Default warehouse",
                      "value": "{{ form.values.defaultWarehouse }}",
                      "description": "New inventory adjustments count this warehouse by default.",
                      "options": "{{ data.warehouseoptions }}",
                      "searchable": true
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {}
  }
}
