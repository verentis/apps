{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "inventory-home",
    "name": "Inventory",
    "description": "Inventory overview.",
    "icon": "package"
  },
  "spec": {
    "access": [
      {
        "path": "/products",
        "reason": "List the products"
      },
      {
        "path": "/warehouses",
        "reason": "List the warehouses"
      },
      {
        "path": "/stock-moves",
        "reason": "List stock moves"
      },
      {
        "path": "/inventory-adjustments",
        "reason": "List inventory adjustments"
      }
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "warehouses": {
        "kind": "folder",
        "path": "/warehouses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.warehouse+json"
      },
      "moves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      },
      "adjustments": {
        "kind": "folder",
        "path": "/inventory-adjustments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.adjustment+json"
      },
      "liststockmoves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      },
      "listinventoryadjustments": {
        "kind": "folder",
        "path": "/inventory-adjustments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.adjustment+json"
      },
      "listproducts": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "listwarehouses": {
        "kind": "folder",
        "path": "/warehouses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.warehouse+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Inventory",
          "icon": "package",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "stock.page.yaml",
              "label": "Stock",
              "icon": "boxes"
            },
            {
              "id": "counts.page.yaml",
              "label": "Counts",
              "icon": "clipboard-check"
            },
            {
              "id": "warehouses.page.yaml",
              "label": "Warehouses",
              "icon": "warehouse"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/inventory/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/inventory.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Inventory",
              "note": "Warehouses, stock moves and inventory adjustments as files in your workspace, for the products in Products. Draft moves and counts in their folders, then post or apply them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Products",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Warehouses",
                  "value": "{{ (data.warehouses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "warehouse",
                  "loading": "{{ data.$warehouses.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft moves",
                  "value": "{{ (data.moves || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "arrow-left-right",
                  "loading": "{{ data.$moves.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft adjustments",
                  "value": "{{ (data.adjustments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$adjustments.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "warehouses",
              "compact": true,
              "description": "The /warehouses folder could not be read. Reinstall Inventory to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "moves",
              "compact": true,
              "description": "The /stock-moves folder could not be read. Reinstall Inventory to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "adjustments",
              "compact": true,
              "description": "The /inventory-adjustments folder could not be read. Reinstall Inventory to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "moves",
                  "label": "Stock moves",
                  "icon": "arrow-left-right"
                },
                {
                  "value": "adjustments",
                  "label": "Adjustments",
                  "icon": "clipboard-check"
                },
                {
                  "value": "products",
                  "label": "Products",
                  "icon": "package"
                },
                {
                  "value": "warehouses",
                  "label": "Warehouses",
                  "icon": "warehouse"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /stock-moves",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/stock-moves"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "liststockmoves",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.liststockmoves || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.reference",
                          "label": "Reference"
                        },
                        {
                          "key": "data.quantity",
                          "label": "Quantity"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No stock moves yet. Use New in /stock-moves."
                    },
                    "rules": {
                      "visible": "data.$liststockmoves.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "moves"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /inventory-adjustments",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/inventory-adjustments"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listinventoryadjustments",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listinventoryadjustments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.countedQty",
                          "label": "Counted"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No inventory adjustments yet. Use New in /inventory-adjustments."
                    },
                    "rules": {
                      "visible": "data.$listinventoryadjustments.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "adjustments"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Products keeps the catalogue; open a product there to see its stock moves.",
                      "tone": "muted"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /products",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/products"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listproducts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listproducts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.sku",
                          "label": "SKU"
                        },
                        {
                          "key": "data.unit",
                          "label": "Unit"
                        },
                        {
                          "key": "data.category",
                          "label": "Category"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No products yet. Add them in Products."
                    },
                    "rules": {
                      "visible": "data.$listproducts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "products"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /warehouses",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/warehouses"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listwarehouses",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listwarehouses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No warehouses yet. Use New in /warehouses."
                    },
                    "rules": {
                      "visible": "data.$listwarehouses.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "warehouses"
              }
            ]
          }
        ]
      }
    ]
  }
}
