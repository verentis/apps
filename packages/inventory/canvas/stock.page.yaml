{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "inventory-stock",
    "name": "Stock levels",
    "description": "On-hand stock per product and warehouse, computed from done stock moves.",
    "icon": "chart-column"
  },
  "spec": {
    "access": [
      {
        "path": "/products",
        "reason": "Report on the products"
      },
      {
        "path": "/warehouses",
        "reason": "Break stock down per warehouse"
      },
      {
        "path": "/stock-moves",
        "reason": "Sum the done stock moves"
      }
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "warehouses": {
        "kind": "folder",
        "path": "/warehouses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.warehouse+json"
      },
      "moves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      },
      "totals": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.kind === 'product').map(e => ({ path: e.path, code: e.data.code || e.name, product: e.data.name || '', sku: e.data.sku || '', unit: e.data.unit || '', reorderPoint: e.data.reorderPoint || '', hasReorder: !!e.data.reorderPoint, reorder: Math.round(Number(e.data.reorderPoint || 0) * 10000), units: (data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.status === 'done').reduce((s, m) => s + (m.data.product === e.path ? ((m.data.toWarehouse ? Math.round(Number(m.data.quantity || 0) * 10000) : 0) - (m.data.fromWarehouse ? Math.round(Number(m.data.quantity || 0) * 10000) : 0)) : 0), 0) })).sort((a, b) => (a.code < b.code ? -1 : 1))"
      },
      "levels": {
        "kind": "computed",
        "expr": "(data.products || []).filter(p => p.kind === 'file' && p.data && p.data.kind === 'product').reduce((rows, p) => rows.concat((data.warehouses || []).filter(w => w.kind === 'file' && w.data && w.data.kind === 'warehouse').map(w => ({ path: p.path, code: p.data.code || p.name, product: p.data.name || '', warehouse: w.data.name || w.name, units: (data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.status === 'done').reduce((s, m) => s + (m.data.product === p.path ? ((m.data.toWarehouse === w.path ? Math.round(Number(m.data.quantity || 0) * 10000) : 0) - (m.data.fromWarehouse === w.path ? Math.round(Number(m.data.quantity || 0) * 10000) : 0)) : 0), 0) }))), []).filter(l => l.units !== 0)"
      },
      "appops": {
        "kind": "app-operations"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Inventory",
          "icon": "package",
          "active": "stock.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "stock.page.yaml",
              "label": "Stock",
              "icon": "boxes",
              "count": "{{ (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length }}",
              "tone": "warning"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/inventory/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/inventory.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Stock levels",
              "note": "Computed from done stock moves; applied inventory adjustments count through their corrective moves. Draft moves are ignored."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "end"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Draft purchase order ({{ (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length }})",
                  "icon": "shopping-cart",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "confirm": {
                        "title": "Draft a purchase order",
                        "message": "Ask Purchase to draft an order for the {{ (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length }} products at or below their reorder point? Each is ordered up to twice its reorder point; choose the vendor and prices on the draft."
                      }
                    },
                    {
                      "call-app": {
                        "app": "purchase",
                        "operation": "create-draft-order",
                        "idempotency-key": "{{ ('reorder-' + Date().slice(0, 10)) + '-' + Date.now() }}",
                        "assign": "order",
                        "input": {
                          "$expr": "({ source: { path: '/products#reorder-' + Date().slice(0, 10), code: 'Reorder ' + Date().slice(0, 10) }, lines: (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).map(t => ({ description: [t.product || t.code, t.sku ? '(' + t.sku + ')' : ''].filter(part => part).join(' '), quantity: String(Math.max(1, Math.ceil((2 * t.reorder - t.units) / 10000))) })), notes: 'Drafted from Inventory products at or below their reorder point.' })"
                        }
                      }
                    },
                    {
                      "open-file": {
                        "path": "{{ state.order.path }}"
                      }
                    },
                    {
                      "toast": {
                        "message": "{{ state.order.created ? 'Drafted purchase order ' + state.order.code : 'Opened today\\'s reorder ' + state.order.code }}",
                        "variant": "success"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "(data.appops || []).some(o => o.app === 'purchase' && o.operation === 'create-draft-order' && o.available) && (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length > 0"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Install Purchase to draft purchase orders for products below their reorder point.",
                  "tone": "muted"
                },
                "rules": {
                  "visible": "!((data.appops || []).some(o => o.app === 'purchase' && o.operation === 'create-draft-order' && o.available)) && (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length > 0"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "products",
              "compact": true
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "warehouses",
              "compact": true
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "moves",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Products tracked",
                  "value": "{{ (data.totals || []).length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "At or below reorder point",
                  "value": "{{ (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).length }}",
                  "icon": "triangle-alert",
                  "loading": "{{ data.$moves.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done moves",
                  "value": "{{ (data.moves || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'done')).length }}",
                  "icon": "arrow-left-right",
                  "loading": "{{ data.$moves.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "onhand",
                  "label": "On hand",
                  "icon": "package"
                },
                {
                  "value": "warehouse",
                  "label": "By warehouse",
                  "icon": "warehouse"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.totals || []).map(t => ({ path: t.path, code: t.code, product: t.product, sku: t.sku, unit: t.unit, onHand: (t.units / 10000), reorderPoint: t.reorderPoint, state: t.hasReorder && t.units <= t.reorder ? 'Reorder' : '' })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "product",
                          "label": "Product"
                        },
                        {
                          "key": "sku",
                          "label": "SKU"
                        },
                        {
                          "key": "unit",
                          "label": "Unit"
                        },
                        {
                          "key": "onHand",
                          "label": "On hand",
                          "align": "end"
                        },
                        {
                          "key": "reorderPoint",
                          "label": "Reorder point",
                          "align": "end"
                        },
                        {
                          "key": "state",
                          "label": "State"
                        }
                      ],
                      "emptyText": "No products yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "onhand"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.levels || []).map(l => ({ path: l.path, code: l.code, product: l.product, warehouse: l.warehouse, onHand: (l.units / 10000) })) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Code"
                        },
                        {
                          "key": "product",
                          "label": "Product"
                        },
                        {
                          "key": "warehouse",
                          "label": "Warehouse"
                        },
                        {
                          "key": "onHand",
                          "label": "On hand",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No stock in any warehouse yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "warehouse"
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Reorder point"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Products keeps each product's reorder point; Inventory changes it through Products.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center",
                    "justify": "end"
                  }
                },
                "children": [
                  {
                    "type": "canvas.form.select",
                    "props": {
                      "label": "Product",
                      "value": "{{ state.reorderproduct }}",
                      "options": "{{ (data.totals || []).map(t => ({ label: t.code + ' · ' + t.product, value: t.path })) }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Reorder point",
                      "placeholder": "0",
                      "value": "{{ state.reorderpoint }}"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Set reorder point",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "call-app": {
                            "app": "products",
                            "operation": "update-product",
                            "assign": "updated",
                            "idempotency-key": "{{ ('reorder-point-' + state.reorderproduct) + '-' + Date.now() }}",
                            "input": {
                              "$expr": "({ path: state.reorderproduct, values: { reorderPoint: state.reorderpoint.trim() } })"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "products"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ state.updated.changed.length ? 'Set the reorder point of ' + state.updated.code : state.updated.code + ' already has that reorder point' }}",
                            "variant": "success"
                          }
                        }
                      ]
                    },
                    "rules": {
                      "disabled": "!state.reorderproduct || !/^((0|[1-9][0-9]{0,14})(\\.[0-9]{1,4})?)?$/.test(state.reorderpoint.trim()) || !((data.appops || []).some(o => o.app === 'products' && o.operation === 'update-product' && o.available))"
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Below reorder point"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.totals || []).filter(t => t.hasReorder && t.units <= t.reorder).map(t => ({ path: t.path, label: t.product || t.code, onhand: (t.units || 0) / 10000, short: Math.max(0, (t.reorder - (t.units || 0)) / 10000) })) }}",
                  "showLegend": true,
                  "emptyText": "Every product is above its reorder point",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "onhand",
                    "short"
                  ],
                  "labels": {
                    "onhand": "On hand",
                    "short": "Short of reorder point"
                  },
                  "palette": {
                    "onhand": "chart-1",
                    "short": "danger"
                  },
                  "format": "number"
                }
              }
            ]
          }
        ]
      }
    ],
    "state": {
      "reorderproduct": "",
      "reorderpoint": ""
    }
  }
}
