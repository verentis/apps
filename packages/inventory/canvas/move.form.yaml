{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "inventory-move",
    "name": "Inventory stock move",
    "description": "View and edit an Inventory stock move.",
    "icon": "arrow-left-right"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.inventory.move+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/inventory/v1/move.schema.json",
          "source": "/applications/inventory/schemas/move.schema.json",
          "title": "Inventory stock move",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Finventory%2Fcanvas%2Fmove.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.inventory.move+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/inventory/v1/move.schema.json",
          "source": "/applications/inventory/schemas/move.schema.json",
          "title": "Inventory stock move",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/products",
        "mode": "read",
        "reason": "Choose the product being moved"
      },
      {
        "path": "/warehouses",
        "mode": "read",
        "reason": "Choose the from and to warehouses"
      },
      {
        "path": "/stock-moves",
        "mode": "read",
        "reason": "Show the stock on hand at both ends of the move"
      },
      {
        "path": "/applications/inventory/",
        "mode": "read",
        "reason": "Read the Inventory schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/products",
        "reason": "Choose the product being moved"
      },
      {
        "path": "/warehouses",
        "reason": "Choose the from and to warehouses"
      },
      {
        "path": "/stock-moves",
        "reason": "Show the stock on hand at both ends of the move"
      },
      {
        "path": "/applications/inventory/",
        "reason": "Read the Inventory schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "warehouses": {
        "kind": "folder",
        "path": "/warehouses",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.warehouse+json"
      },
      "productoptions": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ((e.data.name || '') + (e.data.sku ? ' (' + e.data.sku + ')' : '')), value: e.path }))"
      },
      "warehouseoptions": {
        "kind": "computed",
        "expr": "(data.warehouses || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ((e.data.name || '')), value: e.path }))"
      },
      "moves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      },
      "fromunits": {
        "kind": "computed",
        "expr": "(data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.status === 'done').reduce((s, m) => s + (m.data.product === form.values.product ? (((m.data.toWarehouse === form.values.fromWarehouse && (!form.values.fromLocation || (m.data.toLocation || '') === form.values.fromLocation)) ? Math.round(Number(m.data.quantity || 0) * 10000) : 0) - ((m.data.fromWarehouse === form.values.fromWarehouse && (!form.values.fromLocation || (m.data.fromLocation || '') === form.values.fromLocation)) ? Math.round(Number(m.data.quantity || 0) * 10000) : 0)) : 0), 0)"
      },
      "tounits": {
        "kind": "computed",
        "expr": "(data.moves || []).filter(m => m.kind === 'file' && m.data && m.data.kind === 'move' && m.data.status === 'done').reduce((s, m) => s + (m.data.product === form.values.product ? (((m.data.toWarehouse === form.values.toWarehouse && (!form.values.toLocation || (m.data.toLocation || '') === form.values.toLocation)) ? Math.round(Number(m.data.quantity || 0) * 10000) : 0) - ((m.data.fromWarehouse === form.values.toWarehouse && (!form.values.toLocation || (m.data.fromLocation || '') === form.values.toLocation)) ? Math.round(Number(m.data.quantity || 0) * 10000) : 0)) : 0), 0)"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.reference || 'New stock move' }}",
              "note": "Stock move {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"done\",\"applied\"].includes(form.values.status) ? 'success' : [\"draft\"].includes(form.values.status) ? 'warning' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Post",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "post"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This stock move is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ 'From ' + (((((data.warehouses || []).find(w => w.path === form.values.fromWarehouse) || {}).data || {}).name || 'the warehouse') + (form.values.fromLocation ? ' · ' + form.values.fromLocation : '')) + ': ' + (data.fromunits / 10000) + ' on hand → to ' + (((((data.warehouses || []).find(w => w.path === form.values.toWarehouse) || {}).data || {}).name || 'the warehouse') + (form.values.toLocation ? ' · ' + form.values.toLocation : '')) + ': ' + (data.tounits / 10000) + ' on hand' }}",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.product && !!form.values.fromWarehouse && !!form.values.toWarehouse && (!form.values.status || form.values.status === 'draft')"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "More than is on hand",
              "text": "{{ 'Only ' + (data.fromunits / 10000) + ' on hand at the source; posting takes it below zero.' }}"
            },
            "rules": {
              "visible": "!!form.values.product && !!form.values.fromWarehouse && (!form.values.status || form.values.status === 'draft') && Math.round(Number(form.values.quantity || 0) * 10000) > data.fromunits"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Source",
                  "variant": "ghost",
                  "icon": "corner-left-up",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.source && form.values.source.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.source && form.values.source.path)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Move"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Product",
                          "value": "{{ form.values.product }}",
                          "required": true,
                          "options": "{{ data.productoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Quantity",
                          "value": "{{ form.values.quantity }}",
                          "required": true,
                          "placeholder": "0"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Reference",
                          "value": "{{ form.values.reference }}",
                          "placeholder": "PO-1234"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "From",
                  "description": "Leave empty for receipts from outside the workspace."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Warehouse",
                          "value": "{{ form.values.fromWarehouse }}",
                          "options": "{{ data.warehouseoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Location",
                          "value": "{{ form.values.fromLocation }}",
                          "placeholder": "Stock"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "To",
                  "description": "Leave empty for deliveries out of the workspace."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Warehouse",
                          "value": "{{ form.values.toWarehouse }}",
                          "options": "{{ data.warehouseoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Location",
                          "value": "{{ form.values.toLocation }}",
                          "placeholder": "Stock"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "post": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Post stock move",
              "message": "Mark this move done? Done moves count towards stock on hand and cannot be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/inventory/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "post-move",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
