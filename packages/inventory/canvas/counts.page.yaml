{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "inventory-counts",
    "name": "Counts",
    "description": "Stock counts; open a draft one to continue counting.",
    "icon": "clipboard-check"
  },
  "spec": {
    "access": [
      {
        "path": "/inventory-adjustments",
        "reason": "List counts"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/inventory-adjustments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.adjustment+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Inventory",
          "icon": "package",
          "active": "counts.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "stock.page.yaml",
              "label": "Stock",
              "icon": "boxes"
            },
            {
              "id": "counts.page.yaml",
              "label": "Counts",
              "icon": "clipboard-check"
            },
            {
              "id": "warehouses.page.yaml",
              "label": "Warehouses",
              "icon": "warehouse"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/inventory/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/inventory.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Counts",
              "note": "Stock counts; open a draft one to continue counting."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, date: e.data.date, product: String(e.data.product || '').split('/').pop(), warehouse: String(e.data.warehouse || '').split('/').pop(), location: e.data.location || '', counted: e.data.countedQty, status: e.data.status || 'draft' })).sort((a, b) => a.date < b.date ? 1 : -1) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Count"
                },
                {
                  "key": "date",
                  "label": "Date",
                  "format": "date"
                },
                {
                  "key": "product",
                  "label": "Product"
                },
                {
                  "key": "warehouse",
                  "label": "Warehouse"
                },
                {
                  "key": "location",
                  "label": "Location"
                },
                {
                  "key": "counted",
                  "label": "Counted",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status",
                  "format": "badge"
                }
              ],
              "emptyText": "No counts yet.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
