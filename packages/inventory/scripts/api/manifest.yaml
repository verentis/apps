api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: inventory-api
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The operations other apps call through the platform (api.yaml); moves are written create-only.
file-access:
  - path: "/stock-moves"
    mode: write
    reason: "Record production other apps report as done stock moves"
  - path: "/settings/inventory.json"
    mode: read
    reason: "Move production through the default warehouse"
