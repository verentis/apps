api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: inventory-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Posting validates against products and warehouses and writes moves and adjustments conditionally.
file-access:
  - path: "/products"
    mode: read
    reason: "Check that the moved or counted product exists and is active (Products)"
  - path: "/warehouses"
    mode: read
    reason: "Check warehouses and their locations"
  - path: "/stock-moves"
    mode: write
    reason: "Mark moves done and write corrective moves for applied adjustments"
  - path: "/inventory-adjustments"
    mode: write
    reason: "Mark adjustments applied"
