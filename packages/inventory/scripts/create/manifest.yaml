api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: inventory-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Inventory containers.
file-access:
  - path: "/warehouses"
    mode: write
    reason: "Create warehouses with the next code"
  - path: "/stock-moves"
    mode: write
    reason: "Create moves with the next code"
  - path: "/inventory-adjustments"
    mode: write
    reason: "Create adjustments with the next code"
  - path: "/settings/inventory.json"
    mode: read
    reason: "Default new adjustments to the default warehouse"
