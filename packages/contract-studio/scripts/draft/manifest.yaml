api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: contract-studio-draft
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Scoped draft operation.
file-access:
  - path: "/legal-contracts"
    mode: write
    reason: "Create and conditionally edit, submit and approve agreements"
  - path: "/legal-precedents"
    mode: read
    reason: "Pin approved clause revisions"
  - path: "/applications/legal-research/catalog/authorities.json"
    mode: read
    reason: "Pin citation metadata only"
  - path: "/legal-authority-packs"
    mode: read
    reason: "Pin citation metadata from a selected additional jurisdiction pack"
