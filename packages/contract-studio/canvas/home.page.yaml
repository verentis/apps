{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "contract-studio-home",
    "name": "Contract Studio",
    "icon": "file-pen-line"
  },
  "spec": {
    "access": [
      {
        "path": "/legal-contracts",
        "reason": "List workspace agreements"
      },
      {
        "path": "/applications/contract-studio/scripts/draft",
        "reason": "Run the draft operation"
      },
      {
        "path": "/applications/contract-studio/scripts/library",
        "reason": "Run the library operation"
      }
    ],
    "data": {
      "agreements": {
        "kind": "folder",
        "path": "/legal-contracts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.contract-studio.contract+json"
      }
    },
    "state": {
      "code": "",
      "title": "",
      "matter": "",
      "clauseCode": "",
      "clauseTitle": "",
      "wording": "",
      "jurisdiction": "",
      "intendedUse": "",
      "approvedBy": "",
      "revision": 1,
      "confirmed": false,
      "result": {}
    },
    "actions": {
      "create": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "run-script": {
              "file": "/applications/contract-studio/scripts/draft",
              "parameters": {
                "operation": "create",
                "code": "{{ state.code }}",
                "title": "{{ state.title }}",
                "matter": "{{ state.matter }}"
              },
              "timeout": 120,
              "assign": "result"
            }
          },
          {
            "refresh-source": {
              "source": "agreements"
            }
          },
          {
            "open-file": {
              "path": "{{ state.result.path }}",
              "mode": "edit"
            }
          },
          {
            "toast": {
              "message": "{{ state.result.message || 'Saved' }}",
              "variant": "success"
            }
          }
        ]
      },
      "publish": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Confirm",
              "message": "Publish this firm-approved revision? Revisions cannot be edited here."
            }
          },
          {
            "run-script": {
              "file": "/applications/contract-studio/scripts/library",
              "parameters": {
                "code": "{{ state.clauseCode }}",
                "title": "{{ state.clauseTitle }}",
                "revision": "{{ state.revision }}",
                "wording": "{{ state.wording }}",
                "jurisdiction": "{{ state.jurisdiction }}",
                "intendedUse": "{{ state.intendedUse }}",
                "approvedBy": "{{ state.approvedBy }}",
                "confirmed": "{{ state.confirmed }}"
              },
              "timeout": 120,
              "assign": "result"
            }
          },
          {
            "set-state": {
              "key": "confirmed",
              "value": false
            }
          },
          {
            "toast": {
              "message": "{{ state.result.message || 'Saved' }}",
              "variant": "success"
            }
          }
        ]
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Contract Studio",
          "icon": "file-pen-line",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Agreements",
              "icon": "file-signature"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/contract-studio/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.heading",
            "props": {
              "level": 2,
              "text": "Contract Studio"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Draft ordered points, review their sources, then issue a clean agreement.",
              "tone": "muted"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Agreements by stage"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Open an agreement to edit, review or issue it.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.board",
                "props": {
                  "rows": "{{ (data.agreements || []).filter(e => e.kind === 'file' && e.data) }}",
                  "groupBy": "data.stage",
                  "columns": [
                    {
                      "value": "draft",
                      "label": "Draft"
                    },
                    {
                      "value": "in-review",
                      "label": "In review"
                    },
                    {
                      "value": "approved",
                      "label": "Approved"
                    },
                    {
                      "value": "issued",
                      "label": "Issued"
                    }
                  ],
                  "card": {
                    "title": "data.title",
                    "code": "data.code",
                    "meta": [
                      "data.jurisdiction"
                    ]
                  },
                  "readOnly": false,
                  "rowKey": "path",
                  "emptyText": "No agreements yet",
                  "lockedWhen": "[\"issued\"].includes(row.data.stage)"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ],
                  "move": [
                    {
                      "confirm": {
                        "if": "event.to === 'issued'",
                        "title": "Move to Issued?",
                        "message": "{{ event.row.data.code }} moves to Issued. The approved snapshot becomes separate client and internal files.",
                        "confirm-label": "Move to Issued"
                      }
                    },
                    {
                      "run-script": {
                        "if": "event.to === 'in-review'",
                        "file": "/applications/contract-studio/scripts/draft",
                        "timeout": 120,
                        "parameters": {
                          "operation": "submit",
                          "path": "{{ event.path }}",
                          "version": "{{ event.row.data.version }}"
                        },
                        "assign": "lastmove"
                      }
                    },
                    {
                      "run-script": {
                        "if": "event.to === 'draft'",
                        "file": "/applications/contract-studio/scripts/draft",
                        "timeout": 120,
                        "parameters": {
                          "operation": "return",
                          "path": "{{ event.path }}",
                          "version": "{{ event.row.data.version }}"
                        },
                        "assign": "lastmove"
                      }
                    },
                    {
                      "confirm": {
                        "if": "event.to === 'approved'",
                        "title": "Move to Approved",
                        "message": "{{ event.row.data.code }} moves to Approved.",
                        "confirm-label": "Move to Approved",
                        "fields": [
                          {
                            "key": "reviewer",
                            "label": "Reviewed by",
                            "type": "text",
                            "required": true
                          }
                        ],
                        "assign": "moveanswer"
                      }
                    },
                    {
                      "run-script": {
                        "if": "event.to === 'approved'",
                        "file": "/applications/contract-studio/scripts/draft",
                        "timeout": 120,
                        "parameters": {
                          "operation": "approve",
                          "path": "{{ event.path }}",
                          "version": "{{ event.row.data.version }}",
                          "reviewer": "{{ state.moveanswer.reviewer }}"
                        },
                        "assign": "lastmove"
                      }
                    },
                    {
                      "run-script": {
                        "if": "event.to === 'issued'",
                        "file": "/applications/contract-studio/scripts/issue",
                        "timeout": 120,
                        "parameters": {
                          "operation": "issue",
                          "path": "{{ event.path }}",
                          "version": "{{ event.row.data.version }}"
                        },
                        "assign": "lastmove"
                      }
                    },
                    {
                      "refresh-source": {
                        "source": "agreements"
                      }
                    },
                    {
                      "toast": {
                        "message": "{{ [\"in-review\",\"draft\",\"approved\",\"issued\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"in-review\":\"In review\",\"approved\":\"Approved\",\"issued\":\"Issued\"}[event.to] || event.to) }}",
                        "variant": "success"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Start an agreement"
            },
            "children": [
              {
                "type": "canvas.grid",
                "layout": {
                  "base": {
                    "columns": 1,
                    "gap": 4
                  },
                  "tablet": {
                    "columns": 2
                  }
                },
                "children": [
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Unique agreement code",
                      "value": "{{ state.code }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Client-facing title",
                      "value": "{{ state.title }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Optional matter path",
                      "value": "{{ state.matter }}",
                      "placeholder": "/legal-matters/MAT-0001 (not opened or verified)"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Create and open draft",
                  "size": "sm"
                },
                "on": {
                  "click": "create"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Agreements"
            },
            "children": [
              {
                "type": "canvas.empty-state",
                "props": {
                  "for": "agreements",
                  "compact": true
                }
              },
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.agreements || []).filter(e => e.data).map(e => ({path:e.path, code:e.data.code, title:e.data.title, stage:e.data.stage})) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Code"
                    },
                    {
                      "key": "title",
                      "label": "Title"
                    },
                    {
                      "key": "stage",
                      "label": "Stage"
                    }
                  ],
                  "emptyText": "No agreements yet.",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Publish a firm precedent revision"
            },
            "children": [
              {
                "type": "canvas.text",
                "props": {
                  "text": "For authorised library editors. Publish original firm wording only. Use double braces around a variable name, for example two opening braces, client, and two closing braces."
                }
              },
              {
                "type": "canvas.grid",
                "layout": {
                  "base": {
                    "columns": 1,
                    "gap": 4
                  },
                  "tablet": {
                    "columns": 2
                  }
                },
                "children": [
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Stable clause code",
                      "value": "{{ state.clauseCode }}"
                    }
                  },
                  {
                    "type": "canvas.form.number",
                    "props": {
                      "label": "Revision number",
                      "value": "{{ state.revision }}",
                      "min": 1,
                      "step": 1
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Clause title",
                      "value": "{{ state.clauseTitle }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Jurisdiction",
                      "value": "{{ state.jurisdiction }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Intended use",
                      "value": "{{ state.intendedUse }}"
                    }
                  },
                  {
                    "type": "canvas.form.input",
                    "props": {
                      "label": "Approved by",
                      "value": "{{ state.approvedBy }}"
                    }
                  }
                ]
              },
              {
                "type": "canvas.form.textarea",
                "props": {
                  "label": "Approved template",
                  "value": "{{ state.wording }}"
                }
              },
              {
                "type": "canvas.form.switch",
                "props": {
                  "label": "I confirm clearance for reuse and removal of all client details",
                  "value": "{{ state.confirmed }}"
                }
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Publish immutable revision",
                  "size": "sm"
                },
                "on": {
                  "click": "publish"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
