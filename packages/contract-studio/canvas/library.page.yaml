{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "contract-studio-library",
    "name": "Clause library",
    "description": "Published firm precedent revisions: jurisdiction, intended use and approver.",
    "icon": "library"
  },
  "spec": {
    "access": [
      {
        "path": "/legal-precedents",
        "reason": "List clause library"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/legal-precedents",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.contract-studio.precedent+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Contract Studio",
          "icon": "file-pen-line",
          "active": "library.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Agreements",
              "icon": "file-signature"
            },
            {
              "id": "library.page.yaml",
              "label": "Clause library",
              "icon": "library"
            },
            {
              "id": "issued.page.yaml",
              "label": "Issued",
              "icon": "file-check-2"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/contract-studio/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Clause library",
              "note": "Published firm precedent revisions: jurisdiction, intended use and approver."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', revision: e.data.revision, jurisdiction: e.data.jurisdiction || '', use: e.data.intendedUse || '', approver: e.data.approvedBy || '', approved: e.data.approvedAt || '' })).sort((a, b) => (a.code + String(b.revision).padStart(6, '0')) < (b.code + String(a.revision).padStart(6, '0')) ? -1 : 1) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Clause"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "revision",
                  "label": "Revision",
                  "align": "end"
                },
                {
                  "key": "jurisdiction",
                  "label": "Jurisdiction"
                },
                {
                  "key": "use",
                  "label": "Intended use"
                },
                {
                  "key": "approver",
                  "label": "Approved by"
                },
                {
                  "key": "approved",
                  "label": "Approved",
                  "format": "date"
                }
              ],
              "emptyText": "No precedent has been published yet. Publish one from the home page.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
