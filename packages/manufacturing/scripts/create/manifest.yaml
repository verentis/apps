api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: manufacturing-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Manufacturing containers.
file-access:
  - path: "/bills-of-materials"
    mode: write
    reason: "Create bills of materials with the next code"
  - path: "/manufacturing-orders"
    mode: write
    reason: "Create manufacturing orders with the next code"
