{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "manufacturing-order",
    "name": "Manufacturing manufacturing order",
    "description": "View and edit a Manufacturing manufacturing order.",
    "icon": "factory"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.manufacturing.order+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/manufacturing/v1/order.schema.json",
          "source": "/applications/manufacturing/schemas/order.schema.json",
          "title": "Manufacturing manufacturing order",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fmanufacturing%2Fcanvas%2Forder.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.manufacturing.order+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/manufacturing/v1/order.schema.json",
          "source": "/applications/manufacturing/schemas/order.schema.json",
          "title": "Manufacturing manufacturing order",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/bills-of-materials",
        "mode": "read",
        "reason": "Choose the bill of materials to build"
      },
      {
        "path": "/stock-moves",
        "mode": "read",
        "reason": "Show what is in stock for the components (when Inventory is installed)"
      },
      {
        "path": "/products",
        "mode": "read",
        "reason": "Name the components (when Products is installed)"
      },
      {
        "path": "/applications/manufacturing/",
        "mode": "read",
        "reason": "Read the Manufacturing schemas and run the production script"
      }
    ],
    "access": [
      {
        "path": "/bills-of-materials",
        "reason": "Choose the bill of materials to build"
      },
      {
        "path": "/stock-moves",
        "reason": "Show what is in stock for the components (when Inventory is installed)"
      },
      {
        "path": "/products",
        "reason": "Name the components (when Products is installed)"
      },
      {
        "path": "/applications/manufacturing/",
        "reason": "Read the Manufacturing schemas and run the production script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "boms": {
        "kind": "folder",
        "path": "/bills-of-materials",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.bom+json"
      },
      "bomoptions": {
        "kind": "computed",
        "expr": "(data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.productName || ''), value: e.path }))"
      },
      "appops": {
        "kind": "app-operations"
      },
      "stockmoves": {
        "kind": "folder",
        "path": "/stock-moves",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.inventory.move+json"
      },
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "preview": {
        "kind": "computed",
        "expr": "((((data.boms || []).find(b => b.path === form.values.bom) || {}).data || {}).components || []).filter(c => !!c.product).map(c => ({ product: c.product, name: c.name || ((((data.products || []).find(p => p.path === c.product) || {}).data || {}).name || c.product), needed: Number(c.quantity || 0) * Number(form.values.quantity || 0), onhand: (data.stockmoves || []).filter(m => m.kind === 'file' && m.data && m.data.status === 'done').reduce((s, m) => s + (m.data.product === c.product ? (m.data.toWarehouse ? Number(m.data.quantity || 0) : 0) - (m.data.fromWarehouse ? Number(m.data.quantity || 0) : 0) : 0), 0) })).map(r => ({ product: r.product, name: r.name, needed: r.needed, onhand: r.onhand, short: r.needed - r.onhand }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.productName || 'New manufacturing order' }}",
              "note": "Manufacturing order {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"done\"].includes(form.values.status) ? 'success' : [\"draft\",\"confirmed\",\"in-progress\"].includes(form.values.status) ? 'warning' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Confirm",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "confirm"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Start",
                  "icon": "play",
                  "size": "sm"
                },
                "on": {
                  "click": "start"
                },
                "rules": {
                  "visible": "form.values.status === 'confirmed'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Complete",
                  "icon": "check-check",
                  "size": "sm"
                },
                "on": {
                  "click": "complete"
                },
                "rules": {
                  "visible": "form.values.status === 'in-progress'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel order",
                  "variant": "ghost",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel"
                },
                "rules": {
                  "visible": "((!form.values.status || form.values.status === 'draft') || form.values.status === 'confirmed') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Record stock moves",
                  "variant": "outline",
                  "icon": "arrow-left-right",
                  "size": "sm"
                },
                "on": {
                  "click": "record-production"
                },
                "rules": {
                  "visible": "form.values.status === 'done' && !(form.values.moves && form.values.moves.length) && (data.appops || []).some(o => o.app === 'inventory' && o.operation === 'record-production' && o.available)",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This manufacturing order is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Bill of materials",
                  "variant": "ghost",
                  "icon": "list-tree",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.bom }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.bom)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Produces",
                  "value": "{{ form.values.productName || '—' }}",
                  "icon": "package"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Quantity",
                  "value": "{{ form.values.quantity || '0' }}",
                  "icon": "hash"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Scheduled",
                  "value": "{{ form.values.scheduledDate || '—' }}",
                  "icon": "calendar"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Order"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Bill of materials",
                          "value": "{{ form.values.bom }}",
                          "required": true,
                          "description": "Confirming snapshots the BoM product and computes the component demand.",
                          "options": "{{ data.bomoptions }}",
                          "searchable": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Quantity to produce",
                          "value": "{{ form.values.quantity }}",
                          "required": true,
                          "placeholder": "0"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Scheduled date",
                          "value": "{{ form.values.scheduledDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Shop floor",
                  "description": "The operations of the bill of materials, in order. Time each one while it runs."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.checklist",
                        "props": {
                          "label": "Operations",
                          "value": "{{ form.values.operations || [] }}",
                          "items": "{{ ((((data.boms || []).find(e => e.path === form.values.bom) || {}).data || {}).routing || []).map((step, index) => ({ id: 'op-' + (index + 1), label: [step.operation, step.workcenter].filter(part => part).join(' · '), note: step.minutes ? step.minutes + ' min expected' : '' })) }}",
                          "timers": true,
                          "size": "touch"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "visible": "['confirmed', 'in-progress', 'done'].includes(form.values.status)",
                          "disabled": "!(form.values.status === 'in-progress')"
                        },
                        "on": {
                          "update": [
                            {
                              "patch-record": {
                                "path": "{{ ctx.file.path }}",
                                "values": {
                                  "operations": {
                                    "$expr": "event"
                                  },
                                  "updatedAt": "{{ Date() }}"
                                }
                              }
                            },
                            {
                              "refresh-source": {
                                "source": "record"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Will it build?"
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "The BoM components × the quantity to make, against what Inventory has on hand. Confirming computes the demand for real.",
                      "tone": "muted"
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.preview || []).map(r => ({ path: r.product, product: r.name, needed: r.needed.toFixed(2), onhand: r.onhand.toFixed(2), short: r.short > 0 ? r.short.toFixed(2) : '' })) }}",
                      "columns": [
                        {
                          "key": "product",
                          "label": "Component"
                        },
                        {
                          "key": "needed",
                          "label": "Needed",
                          "align": "end"
                        },
                        {
                          "key": "onhand",
                          "label": "On hand",
                          "align": "end"
                        },
                        {
                          "key": "short",
                          "label": "Short",
                          "align": "end"
                        }
                      ],
                      "emptyText": "Choose a bill of materials and a quantity",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list"
                    }
                  },
                  {
                    "type": "canvas.alert",
                    "props": {
                      "tone": "warning",
                      "title": "Not enough stock",
                      "text": "{{ (data.preview || []).filter(r => r.short > 0).length + ' component(s) short. The order can still be confirmed; production waits for stock.' }}"
                    },
                    "rules": {
                      "visible": "(data.preview || []).some(r => r.short > 0)"
                    }
                  }
                ],
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft')"
                }
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Component demand"
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Computed from the BoM components × the quantity to produce when the order is confirmed.",
                      "tone": "muted"
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (form.values.demand || []).map((d, i) => ({ product: d.product, name: d.name, quantity: d.quantity })) }}",
                      "columns": [
                        {
                          "key": "product",
                          "label": "Product"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "quantity",
                          "label": "Quantity",
                          "align": "end"
                        }
                      ],
                      "emptyText": "Not confirmed yet",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list"
                    }
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Stock moves"
                },
                "children": [
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Inventory records the consumption and production moves when the order completes, when Inventory is installed.",
                      "tone": "muted"
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (form.values.moves || []).map(m => ({ path: m.path, move: m.path.split('/').pop() })) }}",
                      "columns": [
                        {
                          "key": "move",
                          "label": "Move"
                        },
                        {
                          "key": "path",
                          "label": "Path"
                        }
                      ],
                      "emptyText": "No stock moves emitted",
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "confirm": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Confirm order",
              "message": "Confirm this manufacturing order? Its component demand is computed from the bill of materials and the order is locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/manufacturing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "confirm-mo",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "start": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Start production",
              "message": "Start production of this manufacturing order?"
            }
          },
          {
            "run-script": {
              "file": "/applications/manufacturing/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "start-mo",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "complete": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "set-state": {
              "key": "lastresult",
              "value": null
            }
          },
          {
            "set-state": {
              "key": "appcall",
              "value": null
            }
          },
          {
