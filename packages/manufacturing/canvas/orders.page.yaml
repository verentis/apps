{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "manufacturing-orders",
    "name": "Manufacturing orders",
    "description": "Manufacturing orders by status.",
    "icon": "factory"
  },
  "spec": {
    "access": [
      {
        "path": "/manufacturing-orders",
        "reason": "List manufacturing orders"
      }
    ],
    "data": {
      "orders": {
        "kind": "folder",
        "path": "/manufacturing-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.order+json"
      },
      "orderrows": {
        "kind": "computed",
        "expr": "(data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, productName: e.data.productName || '', quantity: e.data.quantity || '', scheduledDate: e.data.scheduledDate || '', status: e.data.status || 'draft', components: (e.data.demand || []).length, units: Math.round(Number(e.data.quantity || 0) * 10000) }))"
      }
    },
    "state": {
      "showclosed": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Manufacturing",
          "icon": "factory",
          "active": "orders.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "boms.page.yaml",
              "label": "Bills of materials",
              "icon": "list-tree"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban",
              "count": "{{ (data.orderrows || []).filter(o => o.status === 'in-progress').length }}"
            },
            {
              "id": "queue.page.yaml",
              "label": "Operation queue",
              "icon": "factory"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/manufacturing/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Manufacturing orders",
              "note": "Orders move draft → confirmed → in progress → done. Confirmed orders are locked; done orders emitted their stock moves."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /manufacturing-orders",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/manufacturing-orders"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.orderrows || []).filter(o => o.status !== 'cancelled') }}",
              "groupBy": "status",
              "columns": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "locked": true
                },
                {
                  "value": "confirmed",
                  "label": "Confirmed"
                },
                {
                  "value": "in-progress",
                  "label": "In progress"
                },
                {
                  "value": "done",
                  "label": "Done"
                }
              ],
              "card": {
                "title": "productName",
                "code": "code",
                "meta": [
                  "quantity",
                  "scheduledDate"
                ]
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"done\"].includes(row.status)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'done'",
                    "title": "Move to Done?",
                    "message": "{{ event.row.code }} moves to Done. Completing creates the stock moves in Inventory.",
                    "confirm-label": "Move to Done"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'confirmed'",
                    "file": "/applications/manufacturing/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "confirm-mo",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'in-progress'",
                    "file": "/applications/manufacturing/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "start-mo",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'done'",
                    "file": "/applications/manufacturing/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "complete-mo",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "orders"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"confirmed\",\"in-progress\",\"done\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"confirmed\":\"Confirmed\",\"in-progress\":\"In progress\",\"done\":\"Done\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In progress",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'in-progress')).length }}",
                  "icon": "play",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'done')).length }}",
                  "icon": "check-check",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show done and cancelled orders",
              "value": "{{ state.showclosed }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.orderrows || []).filter(r => state.showclosed || (r.status !== 'done' && r.status !== 'cancelled')) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Order"
                },
                {
                  "key": "productName",
                  "label": "Product"
                },
                {
                  "key": "quantity",
                  "label": "Quantity",
                  "align": "end"
                },
                {
                  "key": "scheduledDate",
                  "label": "Scheduled"
                },
                {
                  "key": "components",
                  "label": "Demand lines",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                }
              ],
              "emptyText": "No open manufacturing orders",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
