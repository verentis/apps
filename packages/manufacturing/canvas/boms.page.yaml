{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "manufacturing-boms",
    "name": "Bills of materials",
    "description": "The bills of materials production builds from.",
    "icon": "list-tree"
  },
  "spec": {
    "access": [
      {
        "path": "/bills-of-materials",
        "reason": "List bills of materials"
      }
    ],
    "data": {
      "boms": {
        "kind": "folder",
        "path": "/bills-of-materials",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.bom+json"
      },
      "bomoptions": {
        "kind": "computed",
        "expr": "(data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.productName || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Bills of materials"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "What each product is built from. Archived BoMs cannot be confirmed against.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Open /bills-of-materials",
                      "variant": "outline",
                      "icon": "folder-open",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/bills-of-materials"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Manufacturing",
                      "variant": "ghost",
                      "icon": "factory",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/manufacturing/canvas/home.page.yaml"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$boms.error }}"
            },
            "rules": {
              "visible": "data.$boms.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$boms.status === 'loading'"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, productName: e.data.productName || '', outputQty: e.data.outputQty || '', components: (e.data.components || []).length, operations: (e.data.routing || []).length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "BoM"
                },
                {
                  "key": "productName",
                  "label": "Product"
                },
                {
                  "key": "outputQty",
                  "label": "Output",
                  "align": "end"
                },
                {
                  "key": "components",
                  "label": "Components",
                  "align": "end"
                },
                {
                  "key": "operations",
                  "label": "Operations",
                  "align": "end"
                }
              ],
              "emptyText": "No bills of materials yet. Use New in /bills-of-materials.",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
