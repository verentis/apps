{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "manufacturing-boms",
    "name": "Bills of materials",
    "description": "The bills of materials production builds from.",
    "icon": "list-tree"
  },
  "spec": {
    "access": [
      {
        "path": "/bills-of-materials",
        "reason": "List bills of materials"
      }
    ],
    "data": {
      "boms": {
        "kind": "folder",
        "path": "/bills-of-materials",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.bom+json"
      },
      "bomoptions": {
        "kind": "computed",
        "expr": "(data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.productName || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Manufacturing",
          "icon": "factory",
          "active": "boms.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "boms.page.yaml",
              "label": "Bills of materials",
              "icon": "list-tree"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/manufacturing/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Bills of materials",
              "note": "What each product is built from. Archived BoMs cannot be confirmed against."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /bills-of-materials",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/bills-of-materials"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "boms",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, productName: e.data.productName || '', outputQty: e.data.outputQty || '', components: (e.data.components || []).length, operations: (e.data.routing || []).length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "BoM"
                },
                {
                  "key": "productName",
                  "label": "Product"
                },
                {
                  "key": "outputQty",
                  "label": "Output",
                  "align": "end"
                },
                {
                  "key": "components",
                  "label": "Components",
                  "align": "end"
                },
                {
                  "key": "operations",
                  "label": "Operations",
                  "align": "end"
                }
              ],
              "emptyText": "No bills of materials yet. Use New in /bills-of-materials.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
