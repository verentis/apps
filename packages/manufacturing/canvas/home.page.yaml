{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "manufacturing-home",
    "name": "Manufacturing",
    "description": "Production summary.",
    "icon": "factory"
  },
  "spec": {
    "access": [
      {
        "path": "/bills-of-materials",
        "reason": "List bills of materials"
      },
      {
        "path": "/manufacturing-orders",
        "reason": "List manufacturing orders"
      }
    ],
    "data": {
      "boms": {
        "kind": "folder",
        "path": "/bills-of-materials",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.bom+json"
      },
      "bomoptions": {
        "kind": "computed",
        "expr": "(data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.productName || ''), value: e.path }))"
      },
      "orders": {
        "kind": "folder",
        "path": "/manufacturing-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.order+json"
      },
      "orderrows": {
        "kind": "computed",
        "expr": "(data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, productName: e.data.productName || '', quantity: e.data.quantity || '', scheduledDate: e.data.scheduledDate || '', status: e.data.status || 'draft', components: (e.data.demand || []).length, units: Math.round(Number(e.data.quantity || 0) * 10000) }))"
      },
      "listmanufacturingorders": {
        "kind": "folder",
        "path": "/manufacturing-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.order+json"
      },
      "listbillsofmaterials": {
        "kind": "folder",
        "path": "/bills-of-materials",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.manufacturing.bom+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Manufacturing",
          "icon": "factory",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "boms.page.yaml",
              "label": "Bills of materials",
              "icon": "list-tree"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban",
              "count": "{{ (data.orderrows || []).filter(o => o.status === 'in-progress').length }}"
            },
            {
              "id": "queue.page.yaml",
              "label": "Operation queue",
              "icon": "factory"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/manufacturing/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Manufacturing",
              "note": "Bills of materials and manufacturing orders are files in your workspace. Draft an order in its folder, then confirm, start and complete it from its form."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Schedule"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Manufacturing orders by scheduled date.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.calendar",
                "props": {
                  "rows": "{{ (data.orderrows || []).filter(o => !!o.scheduledDate && o.status !== 'cancelled').map(o => ({ path: o.path, title: [o.code, o.productName].filter(part => part).join(' · '), status: o.status, at: o.scheduledDate })) }}",
                  "views": [
                    "month",
                    "week",
                    "agenda"
                  ],
                  "showLegend": true,
                  "emptyText": "Nothing scheduled",
                  "start": "at",
                  "title": "title",
                  "colorBy": "status",
                  "view": "month"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Bills of materials",
                  "value": "{{ (data.boms || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "list-tree",
                  "loading": "{{ data.$boms.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft orders",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In production",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed' || e.data.status === 'in-progress')).length }}",
                  "icon": "factory",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Units in production",
                  "value": "{{ ((data.orderrows || []).filter(r => r.status === 'confirmed' || r.status === 'in-progress').reduce((s, r) => s + r.units, 0) / 10000) }}",
                  "icon": "package",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "boms",
              "compact": true,
              "description": "The /bills-of-materials folder could not be read. Reinstall Manufacturing to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true,
              "description": "The /manufacturing-orders folder could not be read. Reinstall Manufacturing to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "orders",
                  "label": "Manufacturing orders",
                  "icon": "factory"
                },
                {
                  "value": "boms",
                  "label": "Bills of materials",
                  "icon": "list-tree"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /manufacturing-orders",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/manufacturing-orders"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listmanufacturingorders",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listmanufacturingorders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.productName",
                          "label": "Product"
                        },
                        {
                          "key": "data.quantity",
                          "label": "Quantity"
                        },
                        {
                          "key": "data.scheduledDate",
                          "label": "Scheduled",
                          "format": "date"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No manufacturing orders yet. Use New in /manufacturing-orders."
                    },
                    "rules": {
                      "visible": "data.$listmanufacturingorders.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "orders"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /bills-of-materials",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/bills-of-materials"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listbillsofmaterials",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listbillsofmaterials || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.productName",
                          "label": "Product"
                        },
                        {
                          "key": "data.outputQty",
                          "label": "Output"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No bills of materials yet. Use New in /bills-of-materials."
                    },
                    "rules": {
                      "visible": "data.$listbillsofmaterials.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "boms"
              }
            ]
          }
        ]
      }
    ]
  }
}
