{
  "api-version": "verentis.io/v1",
  "kind": "Application",
  "metadata": {
    "id": "fleet",
    "name": "Fleet",
    "description": "Keep vehicle records, contracts and service history together.",
    "icon": "./icons/app.svg",
    "version": "0.1.0",
    "author": "Verentis"
  },
  "marketplace": {
    "logo": "./icons/app.svg",
      "hero": {"source": "./marketplace/hero.svg", "alt": "Fleet cover"},
      "images": [{"source": "./marketplace/overview.png", "alt": "Fleet overview in Canvas", "caption": "Fleet overview"}, {"source": "./marketplace/detail.png", "alt": "Contracts in Canvas", "caption": "Contracts"}],
      "readme": "./marketplace/README.md",
    "keywords": [
      "fleet",
      "vehicles",
      "contracts",
      "lease",
      "insurance",
      "service logs",
      "odometer",
      "maintenance"
    ]
  },
  "spec": {
    "install-root": "/applications/fleet",
    "entry": "https://canvas.apps.localtest.me",
    "scope": "global",
    "entry-points": [
      {
        "id": "home",
        "display-name": "Fleet",
        "route": "/render?document=.%2Fcanvas%2Fhome.page.yaml",
        "order": 10
      },
      {
        "id": "contracts",
        "display-name": "Contracts",
        "route": "/render?document=.%2Fcanvas%2Fcontracts.page.yaml",
        "order": 20
      },
      {
        "id": "costs",
        "display-name": "Costs",
        "route": "/render?document=.%2Fcanvas%2Fcosts.page.yaml",
        "order": 30
      }
    ],
    "launch": {
      "enabled": true,
      "entry-point": "home",
      "pinnable": true
    },
    "permissions": [
      "file.read",
      "file.write",
      "execution.run"
    ],
    "scopes": [
      "fleet.default"
    ],
    "settings": [
      {
        "key": "vehicle-code-prefix",
        "display-name": "Vehicle code prefix",
        "type": "string",
        "default": "VEH-",
        "description": "Prefix of generated vehicle codes, e.g. VEH-0001."
      },
      {
        "key": "contract-code-prefix",
        "display-name": "Fleet contract code prefix",
        "type": "string",
        "default": "FCON-",
        "description": "Prefix of generated contract codes, e.g. FCON-0001."
      },
      {
        "key": "service-code-prefix",
        "display-name": "Service log code prefix",
        "type": "string",
        "default": "FSRV-",
        "description": "Prefix of generated service log codes, e.g. FSRV-0001."
      },
      {
        "key": "code-digits",
        "display-name": "Code digits",
        "type": "number",
        "default": 4,
        "description": "Minimum number of digits in generated codes (zero-padded)."
      }
    ],
    "dependencies": [
      {
        "package": "verentis/canvas",
        "version": "latest"
      },
      {
        "package": "verentis/nodejs",
        "version": "latest"
      }
    ],
    "engine": "verentis/nodejs",
    "scripts": [
      "scripts/create",
      "scripts/post"
    ],
    "install": [
      {
        "from": "canvas/*.form.yaml",
        "to": "/applications/fleet/canvas/",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.form+yaml"
      },
      {
        "from": "canvas/*.page.yaml",
        "to": "/applications/fleet/canvas/",
        "mode": "managed",
        "mime": "application/vnd.verentis.canvas.page+yaml"
      },
      {
        "from": "schemas/*.schema.json",
        "to": "/applications/fleet/schemas/",
        "mode": "managed",
        "mime": "application/schema+json"
      },
      {
        "from": "templates/*.json",
        "to": "/applications/fleet/templates/",
        "mode": "managed",
        "mime": "application/json"
      },
      {
        "from": "seed/vehicles",
        "to": "/vehicles",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.vehicles"
      },
      {
        "from": "seed/contracts",
        "to": "/fleet-contracts",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.contracts"
      },
      {
        "from": "seed/services",
        "to": "/service-logs",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.services"
      },
      {
        "from": "seed/starter/VEH-0001.json",
        "to": "/vehicles/VEH-0001",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.vehicle+json"
      },
      {
        "from": "seed/starter/VEH-0002.json",
        "to": "/vehicles/VEH-0002",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.vehicle+json"
      },
      {
        "from": "seed/starter/FCON-0001.json",
        "to": "/fleet-contracts/FCON-0001",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.contract+json"
      },
      {
        "from": "seed/starter/FSRV-0001.json",
        "to": "/service-logs/FSRV-0001",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.service+json"
      },
      {
        "from": "seed/starter/FSRV-0002.json",
        "to": "/service-logs/FSRV-0002",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.service+json"
      },
      {
        "from": "seed/settings.json",
        "to": "/settings/fleet.json",
        "mode": "seed",
        "mime": "application/vnd.verentis.fleet.settings+json"
      }
    ],
    "creatables": [
      {
        "id": "vehicle",
        "display-name": "Vehicle",
        "description": "A new vehicle",
        "icon": "lucide:car",
        "mime": "application/vnd.verentis.fleet.vehicle+json",
        "parents": [
          "application/vnd.verentis.fleet.vehicles"
        ],
        "folder-names": [
          "vehicles",
          "fleet"
        ],
        "script": "./scripts/create",
        "template": "./templates/vehicle.json"
      },
      {
        "id": "contract",
        "display-name": "Contract",
        "description": "A new contract",
        "icon": "lucide:file-signature",
        "mime": "application/vnd.verentis.fleet.contract+json",
        "parents": [
          "application/vnd.verentis.fleet.contracts"
        ],
        "folder-names": [
          "fleet-contracts",
          "contracts",
          "fleet"
        ],
        "script": "./scripts/create",
        "template": "./templates/contract.json"
      },
      {
        "id": "service",
        "display-name": "Service log",
        "description": "A new service log",
        "icon": "lucide:wrench",
        "mime": "application/vnd.verentis.fleet.service+json",
        "parents": [
          "application/vnd.verentis.fleet.services"
        ],
        "folder-names": [
          "service-logs",
          "services",
          "fleet"
        ],
        "script": "./scripts/create",
        "template": "./templates/service.json"
      }
    ],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-forms": true,
      "allow-popups": false
    },
    "file-access": [
      {
        "path": "/vehicles",
        "mode": "read",
        "reason": "List the vehicles",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/fleet-contracts",
        "mode": "read",
        "reason": "List the fleet contracts",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/service-logs",
        "mode": "read",
        "reason": "List the service logs",
        "origin": {
          "kind": "document",
          "id": "canvas/home.page.yaml"
        }
      },
      {
        "path": "/fleet-contracts",
        "mode": "read",
        "reason": "List the fleet contracts and their end dates",
        "origin": {
          "kind": "document",
          "id": "canvas/contracts.page.yaml"
        }
      },
      {
        "path": "/settings/fleet.json",
        "mode": "read",
        "reason": "Read how soon an ending contract counts as expiring",
        "origin": {
          "kind": "document",
          "id": "canvas/contracts.page.yaml"
        }
      },
      {
        "path": "/vehicles",
        "mode": "read",
        "reason": "Report costs per vehicle",
        "origin": {
          "kind": "document",
          "id": "canvas/costs.page.yaml"
        }
      },
      {
        "path": "/fleet-contracts",
        "mode": "read",
        "reason": "Sum the active contracts’ monthly cost",
        "origin": {
          "kind": "document",
          "id": "canvas/costs.page.yaml"
        }
      },
      {
        "path": "/service-logs",
        "mode": "read",
        "reason": "Sum the done service logs’ cost",
        "origin": {
          "kind": "document",
          "id": "canvas/costs.page.yaml"
        }
      },
      {
        "path": "/service-logs",
        "mode": "read",
        "reason": "Show the service history of this vehicle",
        "origin": {
          "kind": "document",
          "id": "fleet-vehicle"
        }
      },
      {
        "path": "/applications/fleet/",
        "mode": "read",
        "reason": "Read the Fleet schemas and run the posting script",
        "origin": {
          "kind": "document",
          "id": "fleet-vehicle"
        }
      },
      {
        "path": "/vehicles",
        "mode": "read",
        "reason": "Choose the vehicle under contract",
        "origin": {
          "kind": "document",
          "id": "fleet-contract"
        }
      },
      {
        "path": "/applications/fleet/",
        "mode": "read",
        "reason": "Read the Fleet schemas and run the posting script",
        "origin": {
          "kind": "document",
          "id": "fleet-contract"
        }
      },
      {
        "path": "/vehicles",
        "mode": "read",
        "reason": "Choose the vehicle that was serviced",
        "origin": {
          "kind": "document",
          "id": "fleet-service"
        }
      },
      {
        "path": "/applications/fleet/",
        "mode": "read",
        "reason": "Read the Fleet schemas and run the posting script",
        "origin": {
          "kind": "document",
          "id": "fleet-service"
        }
      },
      {
        "path": "/applications/fleet/",
        "mode": "read",
        "reason": "Read the Fleet schemas and run the posting script",
        "origin": {
          "kind": "document",
          "id": "fleet-settings"
        }
      },
      {
        "path": "/vehicles",
        "mode": "write",
        "reason": "Create vehicles with the next code",
        "origin": {
          "kind": "script",
          "id": "fleet-create"
        }
      },
      {
        "path": "/fleet-contracts",
        "mode": "write",
        "reason": "Create contracts with the next code",
        "origin": {
          "kind": "script",
          "id": "fleet-create"
        }
      },
      {
        "path": "/service-logs",
        "mode": "write",
        "reason": "Create services with the next code",
        "origin": {
          "kind": "script",
          "id": "fleet-create"
        }
      },
      {
        "path": "/vehicles",
        "mode": "write",
        "reason": "Retire vehicles and update their odometer when a service is logged",
        "origin": {
          "kind": "script",
          "id": "fleet-post"
        }
      },
      {
        "path": "/service-logs",
        "mode": "write",
        "reason": "Mark service logs done",
        "origin": {
          "kind": "script",
          "id": "fleet-post"
        }
      }
    ]
  },
  "packaging": {
    "publisher": "verentis",
    "files": [
      "canvas/**",
      "schemas/**",
      "templates/**",
      "seed/**",
      "scripts/**",
      "README.md"
    ],
    "templates": [
      "canvas/*.yaml"
    ],
    "variables": {
      "canvas-origin": "https://canvas.apps.localtest.me"
    },
    "encryption": "none"
  }
}
