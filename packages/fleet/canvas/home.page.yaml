{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "fleet-home",
    "name": "Fleet",
    "description": "Fleet overview.",
    "icon": "car"
  },
  "spec": {
    "access": [
      {
        "path": "/vehicles",
        "reason": "List the vehicles"
      },
      {
        "path": "/fleet-contracts",
        "reason": "List the fleet contracts"
      },
      {
        "path": "/service-logs",
        "reason": "List the service logs"
      }
    ],
    "data": {
      "vehicles": {
        "kind": "folder",
        "path": "/vehicles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.vehicle+json"
      },
      "contracts": {
        "kind": "folder",
        "path": "/fleet-contracts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.contract+json"
      },
      "services": {
        "kind": "folder",
        "path": "/service-logs",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.service+json"
      },
      "listvehicles": {
        "kind": "folder",
        "path": "/vehicles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.vehicle+json"
      },
      "listfleetcontracts": {
        "kind": "folder",
        "path": "/fleet-contracts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.contract+json"
      },
      "listservicelogs": {
        "kind": "folder",
        "path": "/service-logs",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.service+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Fleet",
          "icon": "car",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Vehicles",
              "icon": "car"
            },
            {
              "id": "contracts.page.yaml",
              "label": "Contracts",
              "icon": "file-signature"
            },
            {
              "id": "costs.page.yaml",
              "label": "Costs",
              "icon": "chart-column"
            },
            {
              "id": "services.page.yaml",
              "label": "Services",
              "icon": "wrench"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/fleet/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/fleet.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Fleet",
              "note": "Vehicles, fleet contracts and service logs as files in your workspace. Draft service logs in their folder, then log them from their forms; retire vehicles from theirs."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Vehicles in service",
                  "value": "{{ (data.vehicles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'retired')).length }}",
                  "icon": "car",
                  "loading": "{{ data.$vehicles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In maintenance",
                  "value": "{{ (data.vehicles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'in-maintenance')).length }}",
                  "icon": "wrench",
                  "loading": "{{ data.$vehicles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active contracts",
                  "value": "{{ (data.contracts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'active')).length }}",
                  "icon": "file-signature",
                  "loading": "{{ data.$contracts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft service logs",
                  "value": "{{ (data.services || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$services.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "vehicles",
              "compact": true,
              "description": "The /vehicles folder could not be read. Reinstall Fleet to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "contracts",
              "compact": true,
              "description": "The /fleet-contracts folder could not be read. Reinstall Fleet to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "services",
              "compact": true,
              "description": "The /service-logs folder could not be read. Reinstall Fleet to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "vehicles",
                  "label": "Vehicles",
                  "icon": "car"
                },
                {
                  "value": "contracts",
                  "label": "Contracts",
                  "icon": "file-signature"
                },
                {
                  "value": "services",
                  "label": "Service logs",
                  "icon": "wrench"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /vehicles",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/vehicles"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listvehicles",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listvehicles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.make",
                          "label": "Make"
                        },
                        {
                          "key": "data.model",
                          "label": "Model"
                        },
                        {
                          "key": "data.licensePlate",
                          "label": "Plate"
                        },
                        {
                          "key": "data.driverName",
                          "label": "Driver"
                        },
                        {
                          "key": "data.odometerKm",
                          "label": "Odometer (km)"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No vehicles yet. Use New in /vehicles."
                    },
                    "rules": {
                      "visible": "data.$listvehicles.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "vehicles"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /fleet-contracts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/fleet-contracts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listfleetcontracts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listfleetcontracts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.vendor",
                          "label": "Vendor"
                        },
                        {
                          "key": "data.type",
                          "label": "Type"
                        },
                        {
                          "key": "data.endDate",
                          "label": "Ends",
                          "format": "date"
                        },
                        {
                          "key": "data.monthlyCost",
                          "label": "Monthly cost"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No contracts yet. Use New in /fleet-contracts."
                    },
                    "rules": {
                      "visible": "data.$listfleetcontracts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "contracts"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /service-logs",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/service-logs"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listservicelogs",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listservicelogs || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.type",
                          "label": "Type"
                        },
                        {
                          "key": "data.odometerKm",
                          "label": "Odometer (km)"
                        },
                        {
                          "key": "data.cost",
                          "label": "Cost"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No service logs yet. Use New in /service-logs."
                    },
                    "rules": {
                      "visible": "data.$listservicelogs.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "services"
              }
            ]
          }
        ]
      }
    ]
  }
}
