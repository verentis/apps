{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "fleet-service",
    "name": "Fleet service log",
    "description": "View and edit a Fleet service log.",
    "icon": "wrench"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.fleet.service+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/fleet/v1/service.schema.json",
          "source": "/applications/fleet/schemas/service.schema.json",
          "title": "Fleet service log",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Ffleet%2Fcanvas%2Fservice.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.fleet.service+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/fleet/v1/service.schema.json",
          "source": "/applications/fleet/schemas/service.schema.json",
          "title": "Fleet service log",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/vehicles",
        "mode": "read",
        "reason": "Choose the vehicle that was serviced"
      },
      {
        "path": "/applications/fleet/",
        "mode": "read",
        "reason": "Read the Fleet schemas and run the posting script"
      }
    ],
    "access": [
      {
        "path": "/vehicles",
        "reason": "Choose the vehicle that was serviced"
      },
      {
        "path": "/applications/fleet/",
        "reason": "Read the Fleet schemas and run the posting script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "vehicles": {
        "kind": "folder",
        "path": "/vehicles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.fleet.vehicle+json"
      },
      "vehicleoptions": {
        "kind": "computed",
        "expr": "(data.vehicles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'retired')).map(e => ({ label: (e.data.code || e.name) + ' · ' + (((e.data.make || '') + ' ' + (e.data.model || '')).trim()), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.heading",
                        "props": {
                          "level": 2,
                          "text": "{{ form.values.description || 'New service log' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                          "tone": "{{ [\"active\",\"done\"].includes(form.values.status) ? 'success' : [\"in-maintenance\",\"draft\",\"expired\"].includes(form.values.status) ? 'warning' : 'neutral' }}"
                        },
                        "rules": {
                          "visible": "!!form.values.status"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "Archived",
                          "tone": "warning",
                          "icon": "archive"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Service log {{ form.values.code || '' }} · {{ ctx.file.path }}",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Log service",
                      "icon": "check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "log"
                    },
                    "rules": {
                      "visible": "(!form.values.status || form.values.status === 'draft') && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty || form.invalid"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Archive",
                          "variant": "ghost",
                          "icon": "archive",
                          "size": "sm"
                        },
                        "on": {
                          "click": "archive"
                        },
                        "rules": {
                          "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft'))",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Restore",
                          "variant": "outline",
                          "icon": "archive-restore",
                          "size": "sm"
                        },
                        "on": {
                          "click": "restore"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Reset",
                          "variant": "ghost",
                          "size": "sm"
                        },
                        "on": {
                          "click": "reset"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Save",
                          "icon": "save",
                          "size": "sm"
                        },
                        "on": {
                          "click": "save"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$record.error }}"
            },
            "rules": {
              "visible": "data.$record.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$record.status === 'loading'"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This service log is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Service"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Vehicle",
                          "value": "{{ form.values.vehicle }}",
                          "required": true,
                          "options": "{{ data.vehicleoptions }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Type",
                          "value": "{{ form.values.type }}",
                          "options": [
                            {
                              "label": "Maintenance",
                              "value": "maintenance"
                            },
                            {
                              "label": "Repair",
                              "value": "repair"
                            },
                            {
                              "label": "Inspection",
                              "value": "inspection"
                            },
                            {
                              "label": "Other",
                              "value": "other"
                            }
                          ]
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Odometer reading (km)",
                          "value": "{{ form.values.odometerKm }}",
                          "required": true,
                          "description": "Must be at least the vehicle’s current odometer.",
                          "placeholder": "0"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Cost",
                          "value": "{{ form.values.cost }}",
                          "placeholder": "0.00"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Description",
                          "value": "{{ form.values.description }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "log": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Log service",
              "message": "Mark this service done? The vehicle’s odometer is updated to the reading, and done service logs cannot be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/fleet/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "log-service",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
