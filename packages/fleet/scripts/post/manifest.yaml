api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: fleet-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Logging a service validates the vehicle and its odometer; retiring enforces the active-to-retired transition. Records are written conditionally.
file-access:
  - path: "/vehicles"
    mode: write
    reason: "Retire vehicles and update their odometer when a service is logged"
  - path: "/service-logs"
    mode: write
    reason: "Mark service logs done"
