api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: fleet-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Fleet containers.
file-access:
  - path: "/vehicles"
    mode: write
    reason: "Create vehicles with the next code"
  - path: "/fleet-contracts"
    mode: write
    reason: "Create contracts with the next code"
  - path: "/service-logs"
    mode: write
    reason: "Create services with the next code"
