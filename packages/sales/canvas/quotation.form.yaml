                "path": "{{ ctx.file.path }}",
                "invoice": "{{ state.appcall.path }}"
              },
              "assign": "recorded"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.recorded && state.recorded.message) || (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
