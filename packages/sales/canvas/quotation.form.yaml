                "title": "{{ 'Quotation ' + (form.values.code || '') }}",
                "subtitle": "{{ form.values.reference || form.values.quotation || \"\" }}",
                "parties": {
                  "$expr": "[{ label: 'Quotation for', lines: ([form.values.customer && form.values.customer.name, form.values.customer && form.values.customer.legalName !== form.values.customer.name ? form.values.customer.legalName : ''].concat((form.values.customer && form.values.customer.address && form.values.customer.address.lines) || []).concat([form.values.customer && form.values.customer.address ? [form.values.customer.address.city, form.values.customer.address.postalCode].filter(part => part).join(' ') : '', form.values.customer && form.values.customer.address && form.values.customer.address.country, form.values.customer && form.values.customer.taxIdentifier ? 'Tax number ' + form.values.customer.taxIdentifier : '']).filter(line => line)).filter(line => line) }]"
                },
                "meta": {
                  "$expr": "[{ label: 'Date', value: format(form.values.date, 'date') }, { label: 'Currency', value: form.values.currency }]"
                },
                "lines": {
                  "$expr": "(form.values.lines || []).map(l => ({ item: l.description || ((data.productoptions || []).find(o => o.value === l.product) || {}).label || '', quantity: l.quantity, price: Number(l.unitPrice || 0).toFixed(2), discount: l.discount ? l.discount + '%' : '', amount: (Number(l.quantity || 0) * Number(l.unitPrice || 0) * (1 - Number(l.discount || 0) / 100)).toFixed(2) }))"
                },
                "columns": [
                  {
                    "key": "item",
                    "label": "Item"
                  },
                  {
                    "key": "quantity",
                    "label": "Qty",
                    "align": "right"
                  },
                  {
                    "key": "price",
                    "label": "Price",
                    "align": "right"
                  },
                  {
                    "key": "discount",
                    "label": "Discount",
                    "align": "right"
                  },
                  {
                    "key": "amount",
                    "label": "Amount",
                    "align": "right"
                  }
                ],
                "totals": {
                  "$expr": "[{ label: 'Subtotal', value: form.values.totals ? form.values.totals.subtotal : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0), 0).toFixed(2) }, { label: 'Discount', value: form.values.totals ? form.values.totals.discount : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0) * Number(l.discount || 0) / 100, 0).toFixed(2) }, { label: 'Total ' + (form.values.currency || ''), value: form.values.totals ? form.values.totals.total : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0) * (1 - Number(l.discount || 0) / 100), 0).toFixed(2), strong: true }]"
                },
                "footer": "{{ form.values.notes }}",
                "stamp": "{{ ['draft', 'cancelled'].includes(form.values.status) ? (form.values.status === 'draft' ? 'Draft' : 'Cancelled') : '' }}",
                "page": {
                  "size": "A4",
                  "margin": 18,
                  "footer": "Page {page} of {pages}"
