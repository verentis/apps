      },
      "confirm": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "set-state": {
              "key": "lastresult",
              "value": null
            }
          },
          {
            "set-state": {
              "key": "appcall",
              "value": null
            }
          },
          {
            "set-state": {
              "key": "recorded",
              "value": null
            }
          },
          {
            "confirm": {
              "title": "Confirm quotation",
              "message": "Confirm this quotation and create its sales order? Confirmed quotations cannot be edited. When Invoicing is installed, it drafts the invoice.",
              "fields": [
                {
                  "key": "prices",
                  "label": "Prices and discounts are agreed with the customer",
                  "type": "checkbox",
                  "required": true
                },
                {
                  "key": "delivery",
                  "label": "The delivery date is agreed",
                  "type": "checkbox",
                  "required": true
                },
                {
                  "key": "po",
                  "label": "The customer’s order number is on the quotation (when they use one)",
                  "type": "checkbox"
                }
              ]
            }
          },
          {
            "run-script": {
              "file": "/applications/sales/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "confirm-quotation",
