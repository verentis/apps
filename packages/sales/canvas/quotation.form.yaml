{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "sales-quotation",
    "name": "Sales quotation",
    "description": "View and edit a sales quotation.",
    "icon": "file-text"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.sales.quotation+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/sales/v1/quotation.schema.json",
          "source": "/applications/sales/schemas/quotation.schema.json",
          "title": "Sales quotation",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fsales%2Fcanvas%2Fquotation.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.sales.quotation+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/sales/v1/quotation.schema.json",
          "source": "/applications/sales/schemas/quotation.schema.json",
          "title": "Sales quotation",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/customers",
        "mode": "read",
        "reason": "Offer CRM customers to quote (when CRM is installed)"
      },
      {
        "path": "/products",
        "mode": "read",
        "reason": "Offer Products' products on quotation lines"
      },
      {
        "path": "/applications/sales/",
        "mode": "read",
        "reason": "Read the Sales schemas and run the confirm script"
      }
    ],
    "access": [
      {
        "path": "/customers",
        "reason": "Offer CRM customers to quote (when CRM is installed)"
      },
      {
        "path": "/products",
        "reason": "Offer Products' products on quotation lines"
      },
      {
        "path": "/applications/sales/",
        "reason": "Read the Sales schemas and run the confirm script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "companies": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.company+json"
      },
      "contacts": {
        "kind": "folder",
        "path": "/customers",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.crm.contact+json"
      },
      "customeroptions": {
        "kind": "computed",
        "expr": "(data.companies || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path })).concat((data.contacts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + ([e.data.givenName, e.data.familyName].filter(Boolean).join(' ')), value: e.path })))"
      },
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "productoptions": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "appops": {
        "kind": "app-operations"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.customer.name || 'New quotation' }}",
              "note": "Quotation {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\",\"delivered\"].includes(form.values.status) ? 'success' : [\"draft\",\"pending\"].includes(form.values.status) ? 'warning' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Copy details",
                  "variant": "outline",
                  "icon": "copy",
                  "size": "sm"
                },
                "on": {
                  "click": "copy-customer"
                },
                "rules": {
                  "visible": "(form.values.status === 'draft' || form.values.status === 'sent') && !!form.values.customerRef",
                  "disabled": "form.saving || form.values.state === 'archived'"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Mark sent",
                  "variant": "outline",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "mark-sent"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Save PDF",
                  "variant": "outline",
                  "icon": "file-down",
                  "size": "sm"
                },
                "on": {
                  "click": "savepdf"
                },
                "rules": {
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Confirm",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "confirm"
                },
                "rules": {
                  "visible": "(form.values.status === 'draft' || form.values.status === 'sent') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel",
                  "variant": "ghost",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel"
                },
                "rules": {
                  "visible": "(form.values.status === 'draft' || form.values.status === 'sent') && !(form.values.state === 'archived')",
                  "disabled": "form.saving"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Draft invoice",
                  "variant": "outline",
                  "icon": "file-text",
                  "size": "sm"
                },
                "on": {
                  "click": "draft-invoice"
                },
                "rules": {
                  "visible": "form.values.status === 'confirmed' && !(form.values.invoice && form.values.invoice.path) && (data.appops || []).some(o => o.app === 'invoicing' && o.operation === 'create-draft-invoice' && o.available)",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Reopen",
                  "variant": "outline",
                  "icon": "rotate-ccw",
                  "size": "sm"
                },
                "on": {
                  "click": "reopen"
                },
                "rules": {
                  "visible": "form.values.status === 'cancelled' && !(form.values.state === 'archived')",
                  "disabled": "form.saving"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.status === 'confirmed')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'confirmed')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This quotation is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Sales order",
                  "variant": "ghost",
                  "icon": "package-check",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.order && form.values.order.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.order && form.values.order.path)"
                }
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Invoice",
                  "variant": "ghost",
                  "icon": "file-text",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.invoice && form.values.invoice.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.invoice && form.values.invoice.path)"
                }
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "CRM customer",
                  "variant": "ghost",
                  "icon": "building-2",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.customerRef }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.customerRef)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Subtotal",
                  "value": "{{ form.values.totals ? form.values.totals.subtotal : ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }}",
                  "icon": "sigma"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Discount",
                  "value": "{{ form.values.totals ? form.values.totals.discount : ((form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.discount || 0) / 100), 0) / 100).toFixed(2) }}",
                  "icon": "percent"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Total {{ form.values.currency }}",
                  "value": "{{ form.values.totals ? form.values.totals.total : (((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) - (form.values.lines || []).reduce((s, l) => s + Math.round(Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)) * Number(l.discount || 0) / 100), 0)) / 100).toFixed(2) }}",
                  "icon": "receipt"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Estimated while drafting; confirming computes the exact totals.",
              "tone": "muted"
            },
            "rules": {
              "visible": "!form.values.totals"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Install Invoicing to draft an invoice from a confirmed quotation.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'confirmed' && !(form.values.invoice && form.values.invoice.path) && !((data.appops || []).some(o => o.app === 'invoicing' && o.operation === 'create-draft-invoice' && o.available))"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Customer"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "CRM customer",
                          "value": "{{ form.values.customerRef }}",
                          "description": "Optional. Choose a CRM customer, then Copy details.",
                          "options": "{{ data.customeroptions }}",
                          "searchable": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Name",
                          "value": "{{ form.values.customer.name }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Legal name",
                          "value": "{{ form.values.customer.legalName }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Email",
                          "value": "{{ form.values.customer.email }}",
                          "inputType": "email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.phone",
                        "props": {
                          "label": "Phone",
                          "value": "{{ form.values.customer.phone }}",
                          "defaultCode": "{{ ({ ZA: '+27', NA: '+264', BW: '+267', ZW: '+263', MZ: '+258', LS: '+266', SZ: '+268', KE: '+254', NG: '+234', GB: '+44', IE: '+353', NL: '+31', DE: '+49', FR: '+33', US: '+1', CA: '+1', AU: '+61', NZ: '+64' })[form.values.customer && form.values.customer.address && form.values.customer.address.country] || '' }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Tax number",
                          "value": "{{ form.values.customer.taxIdentifier }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.address",
                        "props": {
                          "label": "Address",
                          "value": "{{ form.values.customer.address }}"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Quotation"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Currency",
                          "value": "{{ form.values.currency }}",
                          "required": true,
                          "placeholder": "ZAR"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Customer reference",
                          "value": "{{ form.values.reference }}",
                          "placeholder": "PO number"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Lines",
                  "description": "Exact decimals. Each line is rounded to the cent; the discount is a percentage off the line."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.line-items",
                        "props": {
                          "label": "Lines",
                          "value": "{{ form.values.lines }}",
                          "columns": [
                            {
                              "key": "product",
                              "label": "Product",
                              "type": "select",
                              "options": "{{ data.productoptions }}"
                            },
                            {
                              "key": "description",
                              "label": "Description",
                              "type": "text"
                            },
                            {
                              "key": "quantity",
                              "label": "Quantity",
                              "type": "text",
                              "align": "right",
                              "sum": true
                            },
                            {
                              "key": "unitPrice",
                              "label": "Unit price",
                              "type": "text",
                              "align": "right"
                            },
                            {
                              "key": "discount",
                              "label": "Discount %",
                              "type": "text"
                            },
                            {
                              "key": "lineTotal",
                              "label": "Line total",
                              "type": "computed",
                              "expr": "Number(row.quantity || 0) * Number(row.unitPrice || 0) * (1 - Number(row.discount || 0) / 100)",
                              "decimals": 2,
                              "sum": true,
                              "align": "right"
                            }
                          ],
                          "defaultRow": {
                            "product": "",
                            "description": "",
                            "quantity": "1",
                            "unitPrice": "",
                            "discount": ""
                          },
                          "storeComputed": false,
                          "minimum": 1,
                          "maximum": 500,
                          "addLabel": "Add line"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'confirmed'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Preview",
              "description": "How this looks printed or saved as PDF.",
              "collapsible": true,
              "defaultOpen": false
            },
            "children": [
              {
                "type": "canvas.document",
                "props": {
                  "title": "{{ 'Quotation ' + (form.values.code || '') }}",
                  "subtitle": "{{ form.values.reference || form.values.quotation || \"\" }}",
                  "parties": {
                    "$expr": "[{ label: 'Quotation for', lines: ([form.values.customer && form.values.customer.name, form.values.customer && form.values.customer.legalName !== form.values.customer.name ? form.values.customer.legalName : ''].concat((form.values.customer && form.values.customer.address && form.values.customer.address.lines) || []).concat([form.values.customer && form.values.customer.address ? [form.values.customer.address.city, form.values.customer.address.postalCode].filter(part => part).join(' ') : '', form.values.customer && form.values.customer.address && form.values.customer.address.country, form.values.customer && form.values.customer.taxIdentifier ? 'Tax number ' + form.values.customer.taxIdentifier : '']).filter(line => line)).filter(line => line) }]"
