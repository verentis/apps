{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "sales-quotations",
    "name": "Quotations",
    "description": "Quotations by status.",
    "icon": "file-text"
  },
  "spec": {
    "access": [
      {
        "path": "/quotations",
        "reason": "List quotations by status"
      }
    ],
    "data": {
      "quotations": {
        "kind": "folder",
        "path": "/quotations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.quotation+json"
      }
    },
    "state": {
      "showcancelled": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Sales",
          "icon": "package",
          "active": "quotations.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "quotations.page.yaml",
              "label": "Quotations",
              "icon": "file-text"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "package"
            },
            {
              "id": "summary.page.yaml",
              "label": "Summary",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/sales/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/sales.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Quotations",
              "note": "Draft, sent and confirmed quotations. Confirming a quotation creates its sales order."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "quotations",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Sent",
                  "value": "{{ (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'sent')).length }}",
                  "icon": "send",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed",
                  "value": "{{ (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed value",
                  "value": "{{ ((data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status === 'confirmed' && e.data.totals).reduce((s, e) => s + Math.round(Number(e.data.totals.total || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show cancelled quotations",
              "value": "{{ state.showcancelled }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (state.showcancelled || e.data.status !== 'cancelled')).map(e => ({ path: e.path, code: e.data.code || e.name, customer: (e.data.customer && e.data.customer.name) || '', date: e.data.date, status: e.data.status, total: (e.data.totals && e.data.totals.total) || '' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Quotation"
                },
                {
                  "key": "customer",
                  "label": "Customer"
                },
                {
                  "key": "date",
                  "label": "Date"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                }
              ],
              "emptyText": "No quotations yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
