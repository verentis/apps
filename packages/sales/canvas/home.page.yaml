{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "sales-home",
    "name": "Sales",
    "description": "Sales overview.",
    "icon": "package"
  },
  "spec": {
    "access": [
      {
        "path": "/quotations",
        "reason": "List quotations"
      },
      {
        "path": "/sales-orders",
        "reason": "List sales orders"
      },
      {
        "path": "/products",
        "reason": "List the products Sales quotes"
      }
    ],
    "data": {
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "quotations": {
        "kind": "folder",
        "path": "/quotations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.quotation+json"
      },
      "orders": {
        "kind": "folder",
        "path": "/sales-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.order+json"
      },
      "appops": {
        "kind": "app-operations"
      },
      "listproducts": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "listquotations": {
        "kind": "folder",
        "path": "/quotations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.quotation+json"
      },
      "listsalesorders": {
        "kind": "folder",
        "path": "/sales-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.order+json"
      }
    },
    "state": {
      "productname": "",
      "productunit": "ea",
      "productprice": ""
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Sales",
          "icon": "package",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "quotations.page.yaml",
              "label": "Quotations",
              "icon": "file-text"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "package"
            },
            {
              "id": "summary.page.yaml",
              "label": "Summary",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/sales/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/sales.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Sales",
              "note": "Quotations and sales orders are files in your workspace; the products they quote come from Products. Draft quotations in their folder, then confirm them from their forms into sales orders."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "From quotation to order"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ [{ label: 'Quotations', value: (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.status !== 'cancelled').length }, { label: 'Sent', value: (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => ['sent', 'confirmed'].includes(e.data.status)).length }, { label: 'Confirmed', value: (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.status === 'confirmed').length }, { label: 'Delivered', value: (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.deliveryStatus === 'delivered').length }] }}",
                  "showLegend": true,
                  "emptyText": "No quotations yet",
                  "kind": "funnel",
                  "x": "label",
                  "y": "value",
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Products",
                  "value": "{{ (data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "package",
                  "loading": "{{ data.$products.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open quotations",
                  "value": "{{ (data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'draft' || e.data.status === 'sent')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Confirmed value",
                  "value": "{{ ((data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status === 'confirmed' && e.data.totals).reduce((s, e) => s + Math.round(Number(e.data.totals.total || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$quotations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Undelivered orders",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus !== 'delivered')).length }}",
                  "icon": "truck",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "quotations",
              "compact": true,
              "description": "The /quotations folder could not be read. Reinstall Sales to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true,
              "description": "The /sales-orders folder could not be read. Reinstall Sales to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "products",
                  "label": "Products",
                  "icon": "package"
                },
                {
                  "value": "quotations",
                  "label": "Quotations",
                  "icon": "file-text"
                },
                {
                  "value": "orders",
                  "label": "Sales orders",
                  "icon": "package-check"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.card",
                    "props": {
                      "title": "Add a product"
                    },
                    "children": [
                      {
                        "type": "canvas.text",
                        "props": {
                          "text": "Products keeps the catalogue; Sales adds to it through Products.",
                          "tone": "muted"
                        }
                      },
                      {
                        "type": "canvas.grid",
                        "layout": {
                          "base": {
                            "columns": 1,
                            "gap": 4
                          },
                          "tablet": {
                            "columns": 2
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.form.input",
                            "props": {
                              "label": "Name",
                              "placeholder": "Standing desk",
                              "value": "{{ state.productname }}"
                            }
                          },
                          {
                            "type": "canvas.form.input",
                            "props": {
                              "label": "Unit",
                              "placeholder": "ea",
                              "value": "{{ state.productunit }}"
                            }
                          },
                          {
                            "type": "canvas.form.input",
                            "props": {
                              "label": "List price",
                              "placeholder": "0.00",
                              "value": "{{ state.productprice }}"
                            }
                          }
                        ]
                      },
                      {
                        "type": "canvas.stack",
                        "layout": {
                          "base": {
                            "direction": "row",
                            "wrap": true,
                            "gap": 2,
                            "align": "center",
                            "justify": "end"
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.button",
                            "props": {
                              "label": "Add product",
                              "icon": "plus",
                              "size": "sm"
                            },
                            "on": {
                              "click": [
                                {
                                  "call-app": {
                                    "app": "products",
                                    "operation": "create-product",
                                    "assign": "added",
                                    "idempotency-key": "{{ ('product-' + state.productname.trim().toLowerCase()) + '-' + Date.now() }}",
                                    "input": {
                                      "$expr": "({ name: state.productname.trim(), unit: state.productunit.trim(), listPrice: state.productprice.trim() })"
                                    }
                                  }
                                },
                                {
                                  "refresh-source": {
                                    "source": "products"
                                  }
                                },
                                {
                                  "set-state": {
                                    "key": "productname",
                                    "value": ""
                                  }
                                },
                                {
                                  "set-state": {
                                    "key": "productprice",
                                    "value": ""
                                  }
                                },
                                {
                                  "toast": {
                                    "message": "{{ 'Added ' + state.added.code + ' to Products' }}",
                                    "variant": "success"
                                  }
                                },
                                {
                                  "open-file": {
                                    "path": "{{ state.added.path }}"
                                  }
                                }
                              ]
                            },
                            "rules": {
                              "disabled": "!state.productname.trim() || !/^((0|[1-9][0-9]{0,14})(\\.[0-9]{1,4})?)?$/.test(state.productprice.trim()) || !((data.appops || []).some(o => o.app === 'products' && o.operation === 'create-product' && o.available))"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /products",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/products"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listproducts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listproducts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Code"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.unit",
                          "label": "Unit"
                        },
                        {
                          "key": "data.listPrice",
                          "label": "List price"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No products yet. Add one above or in Products."
                    },
                    "rules": {
                      "visible": "data.$listproducts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "products"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quotations",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quotations"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listquotations",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listquotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.customer.name",
                          "label": "Customer"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.totals.total",
                          "label": "Total"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No quotations yet. Use New in /quotations."
                    },
                    "rules": {
                      "visible": "data.$listquotations.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "quotations"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /sales-orders",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/sales-orders"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listsalesorders",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listsalesorders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.customer.name",
                          "label": "Customer"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.totals.total",
                          "label": "Total"
                        },
                        {
                          "key": "data.deliveryStatus",
                          "label": "Delivery"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No sales orders yet. Use New in /sales-orders."
                    },
                    "rules": {
                      "visible": "data.$listsalesorders.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "orders"
              }
            ]
          }
        ]
      }
    ]
  }
}
