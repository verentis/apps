{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "sales-order",
    "name": "Sales order",
    "description": "View and edit a sales order.",
    "icon": "package-check"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.sales.order+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/sales/v1/order.schema.json",
          "source": "/applications/sales/schemas/order.schema.json",
          "title": "Sales order",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fsales%2Fcanvas%2Forder.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.sales.order+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/sales/v1/order.schema.json",
          "source": "/applications/sales/schemas/order.schema.json",
          "title": "Sales order",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/quotations",
        "mode": "read",
        "reason": "Link back to the quotation this order came from"
      },
      {
        "path": "/products",
        "mode": "read",
        "reason": "Name the product on each order line"
      },
      {
        "path": "/applications/sales/",
        "mode": "read",
        "reason": "Read the Sales schemas and run the confirm script"
      }
    ],
    "access": [
      {
        "path": "/quotations",
        "reason": "Link back to the quotation this order came from"
      },
      {
        "path": "/products",
        "reason": "Name the product on each order line"
      },
      {
        "path": "/applications/sales/",
        "reason": "Read the Sales schemas and run the confirm script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "quotations": {
        "kind": "folder",
        "path": "/quotations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.quotation+json"
      },
      "quotationoptions": {
        "kind": "computed",
        "expr": "(data.quotations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (((e.data.customer && e.data.customer.name) || '') + ' · ' + (e.data.date || '')), value: e.path }))"
      },
      "products": {
        "kind": "folder",
        "path": "/products",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.products.product+json"
      },
      "productoptions": {
        "kind": "computed",
        "expr": "(data.products || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.customer.name || 'New sales order' }}",
              "note": "Sales order {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.deliveryStatus || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\",\"delivered\"].includes(form.values.deliveryStatus) ? 'success' : [\"draft\",\"pending\"].includes(form.values.deliveryStatus) ? 'warning' : [\"cancelled\"].includes(form.values.deliveryStatus) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.deliveryStatus"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(false)",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (false)"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.deliveryStatus }}",
              "steps": [
                {
                  "value": "pending",
                  "label": "Pending"
                },
                {
                  "value": "partial",
                  "label": "Partial"
                },
                {
                  "value": "delivered",
                  "label": "Delivered"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.deliveryStatus"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This sales order is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Quotation",
                  "variant": "ghost",
                  "icon": "file-text",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.quotation }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.quotation)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Subtotal",
                  "value": "{{ form.values.totals && form.values.totals.subtotal }}",
                  "icon": "sigma"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Discount",
                  "value": "{{ form.values.totals && form.values.totals.discount }}",
                  "icon": "percent"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Total {{ form.values.currency }}",
                  "value": "{{ form.values.totals && form.values.totals.total }}",
                  "icon": "receipt"
                }
              }
            ],
            "rules": {
              "visible": "!!form.values.totals"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Order"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Date",
                          "value": "{{ form.values.date }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Currency",
                          "value": "{{ form.values.currency }}",
                          "required": true,
                          "placeholder": "ZAR"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Delivery",
                          "value": "{{ form.values.deliveryStatus }}",
                          "options": [
                            {
                              "value": "pending",
                              "label": "Pending"
                            },
                            {
                              "value": "partial",
                              "label": "Partial"
                            },
                            {
                              "value": "delivered",
                              "label": "Delivered"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Quotation",
                          "value": "{{ form.values.quotation }}",
                          "options": "{{ data.quotationoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Customer"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Name",
                          "value": "{{ form.values.customer.name }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Legal name",
                          "value": "{{ form.values.customer.legalName }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Email",
                          "value": "{{ form.values.customer.email }}",
                          "inputType": "email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.phone",
                        "props": {
                          "label": "Phone",
                          "value": "{{ form.values.customer.phone }}",
                          "defaultCode": "{{ ({ ZA: '+27', NA: '+264', BW: '+267', ZW: '+263', MZ: '+258', LS: '+266', SZ: '+268', KE: '+254', NG: '+234', GB: '+44', IE: '+353', NL: '+31', DE: '+49', FR: '+33', US: '+1', CA: '+1', AU: '+61', NZ: '+64' })[form.values.customer && form.values.customer.address && form.values.customer.address.country] || '' }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Tax number",
                          "value": "{{ form.values.customer.taxIdentifier }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      },
                      {
                        "type": "canvas.form.address",
                        "props": {
                          "label": "Address",
                          "value": "{{ form.values.customer.address }}"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Lines",
                  "description": "Exact decimals. Each line is rounded to the cent; the discount is a percentage off the line."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.line-items",
                        "props": {
                          "label": "Lines",
                          "value": "{{ form.values.lines }}",
                          "columns": [
                            {
                              "key": "product",
                              "label": "Product",
                              "type": "select",
                              "options": "{{ data.productoptions }}"
                            },
                            {
                              "key": "description",
                              "label": "Description",
                              "type": "text"
                            },
                            {
                              "key": "quantity",
                              "label": "Quantity",
                              "type": "text",
                              "align": "right",
                              "sum": true
                            },
                            {
                              "key": "unitPrice",
                              "label": "Unit price",
                              "type": "text",
                              "align": "right"
                            },
                            {
                              "key": "discount",
                              "label": "Discount %",
                              "type": "text"
                            },
                            {
                              "key": "lineTotal",
                              "label": "Line total",
                              "type": "computed",
                              "expr": "Number(row.quantity || 0) * Number(row.unitPrice || 0) * (1 - Number(row.discount || 0) / 100)",
                              "decimals": 2,
                              "sum": true,
                              "align": "right"
                            }
                          ],
                          "defaultRow": {
                            "product": "",
                            "description": "",
                            "quantity": "1",
                            "unitPrice": "",
                            "discount": ""
                          },
                          "storeComputed": false,
                          "minimum": 1,
                          "maximum": 500,
                          "addLabel": "Add line"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (false))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Preview",
              "description": "How this looks printed or saved as PDF.",
              "collapsible": true,
              "defaultOpen": false
            },
            "children": [
              {
                "type": "canvas.document",
                "props": {
                  "title": "{{ 'Sales order ' + (form.values.code || '') }}",
                  "subtitle": "{{ form.values.reference || form.values.quotation || \"\" }}",
                  "parties": {
                    "$expr": "[{ label: 'Order for', lines: ([form.values.customer && form.values.customer.name, form.values.customer && form.values.customer.legalName !== form.values.customer.name ? form.values.customer.legalName : ''].concat((form.values.customer && form.values.customer.address && form.values.customer.address.lines) || []).concat([form.values.customer && form.values.customer.address ? [form.values.customer.address.city, form.values.customer.address.postalCode].filter(part => part).join(' ') : '', form.values.customer && form.values.customer.address && form.values.customer.address.country, form.values.customer && form.values.customer.taxIdentifier ? 'Tax number ' + form.values.customer.taxIdentifier : '']).filter(line => line)).filter(line => line) }]"
                  },
                  "meta": {
                    "$expr": "[{ label: 'Date', value: format(form.values.date, 'date') }, { label: 'Currency', value: form.values.currency }, { label: 'Delivery', value: humanize(form.values.deliveryStatus || \"pending\") }]"
                  },
                  "lines": {
                    "$expr": "(form.values.lines || []).map(l => ({ item: l.description || ((data.productoptions || []).find(o => o.value === l.product) || {}).label || '', quantity: l.quantity, price: Number(l.unitPrice || 0).toFixed(2), discount: l.discount ? l.discount + '%' : '', amount: (Number(l.quantity || 0) * Number(l.unitPrice || 0) * (1 - Number(l.discount || 0) / 100)).toFixed(2) }))"
                  },
                  "columns": [
                    {
                      "key": "item",
                      "label": "Item"
                    },
                    {
                      "key": "quantity",
                      "label": "Qty",
                      "align": "right"
                    },
                    {
                      "key": "price",
                      "label": "Price",
                      "align": "right"
                    },
                    {
                      "key": "discount",
                      "label": "Discount",
                      "align": "right"
                    },
                    {
                      "key": "amount",
                      "label": "Amount",
                      "align": "right"
                    }
                  ],
                  "totals": {
                    "$expr": "[{ label: 'Subtotal', value: form.values.totals ? form.values.totals.subtotal : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0), 0).toFixed(2) }, { label: 'Discount', value: form.values.totals ? form.values.totals.discount : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0) * Number(l.discount || 0) / 100, 0).toFixed(2) }, { label: 'Total ' + (form.values.currency || ''), value: form.values.totals ? form.values.totals.total : (form.values.lines || []).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0) * (1 - Number(l.discount || 0) / 100), 0).toFixed(2), strong: true }]"
                  },
                  "footer": "{{ form.values.notes }}",
                  "stamp": "{{ ['draft', 'cancelled'].includes(\"confirmed\") ? (\"confirmed\" === 'draft' ? 'Draft' : 'Cancelled') : '' }}"
                }
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
