{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "sales-orders",
    "name": "Sales orders",
    "description": "Sales orders by delivery status.",
    "icon": "package-check"
  },
  "spec": {
    "access": [
      {
        "path": "/sales-orders",
        "reason": "List sales orders by delivery status; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "orders": {
        "kind": "folder",
        "path": "/sales-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.order+json"
      }
    },
    "state": {
      "showdelivered": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Sales",
          "icon": "package",
          "active": "orders.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "quotations.page.yaml",
              "label": "Quotations",
              "icon": "file-text"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "package"
            },
            {
              "id": "summary.page.yaml",
              "label": "Summary",
              "icon": "chart-column"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/sales/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/sales.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Sales orders",
              "note": "What confirmed quotations became, tracked by delivery status."
            },
            "children": []
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "groupBy": "data.deliveryStatus",
              "columns": [
                {
                  "value": "pending",
                  "label": "Pending"
                },
                {
                  "value": "partial",
                  "label": "Partial"
                },
                {
                  "value": "delivered",
                  "label": "Delivered"
                }
              ],
              "card": {
                "title": "data.customer.name",
                "code": "data.code",
                "meta": [
                  "data.date",
                  "data.quotation"
                ]
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "patch-record": {
                    "if": "![].includes(event.to)",
                    "path": "{{ event.path }}",
                    "values": {
                      "deliveryStatus": "{{ event.to }}",
                      "updatedAt": "{{ Date() }}"
                    }
                  }
                },
                {
                  "refresh-source": {
                    "source": "orders"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"pending\":\"Pending\",\"partial\":\"Partial\",\"delivered\":\"Delivered\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'pending')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Partial",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'partial')).length }}",
                  "icon": "truck",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Delivered",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'delivered')).length }}",
                  "icon": "package-check",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Order book",
                  "value": "{{ ((data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.totals).reduce((s, e) => s + Math.round(Number(e.data.totals.total || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show delivered orders",
              "value": "{{ state.showdelivered }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (state.showdelivered || e.data.deliveryStatus !== 'delivered')).map(e => ({ path: e.path, code: e.data.code || e.name, customer: (e.data.customer && e.data.customer.name) || '', date: e.data.date, delivery: e.data.deliveryStatus, total: (e.data.totals && e.data.totals.total) || '' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Order"
                },
                {
                  "key": "customer",
                  "label": "Customer"
                },
                {
                  "key": "date",
                  "label": "Date"
                },
                {
                  "key": "delivery",
                  "label": "Delivery"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                }
              ],
              "emptyText": "No sales orders yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
