{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "sales-orders",
    "name": "Sales orders",
    "description": "Sales orders by delivery status.",
    "icon": "package-check"
  },
  "spec": {
    "access": [
      {
        "path": "/sales-orders",
        "reason": "List sales orders by delivery status"
      }
    ],
    "data": {
      "orders": {
        "kind": "folder",
        "path": "/sales-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.sales.order+json"
      }
    },
    "state": {
      "showdelivered": false
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Sales orders"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "What confirmed quotations became, tracked by delivery status.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Sales",
                  "variant": "ghost",
                  "icon": "package",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/sales/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$orders.error }}"
            },
            "rules": {
              "visible": "data.$orders.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$orders.status === 'loading'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'pending')).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Partial",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'partial')).length }}",
                  "icon": "truck",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Delivered",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.deliveryStatus === 'delivered')).length }}",
                  "icon": "package-check",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Order book",
                  "value": "{{ ((data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.totals).reduce((s, e) => s + Math.round(Number(e.data.totals.total || 0) * 10000), 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show delivered orders",
              "value": "{{ state.showdelivered }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (state.showdelivered || e.data.deliveryStatus !== 'delivered')).map(e => ({ path: e.path, code: e.data.code || e.name, customer: (e.data.customer && e.data.customer.name) || '', date: e.data.date, delivery: e.data.deliveryStatus, total: (e.data.totals && e.data.totals.total) || '' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Order"
                },
                {
                  "key": "customer",
                  "label": "Customer"
                },
                {
                  "key": "date",
                  "label": "Date"
                },
                {
                  "key": "delivery",
                  "label": "Delivery"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                }
              ],
              "emptyText": "No sales orders yet",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
