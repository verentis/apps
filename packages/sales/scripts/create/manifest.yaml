api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: sales-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Sales containers.
file-access:
  - path: "/quotations"
    mode: write
    reason: "Create quotations with the next number"
  - path: "/sales-orders"
    mode: write
    reason: "Create sales orders with the next number"
  - path: "/settings/sales.json"
    mode: read
    reason: "Default new quotations' currency and notes"
