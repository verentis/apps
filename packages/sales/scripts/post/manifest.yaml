api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: sales-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Confirming validates a quotation, computes its totals and writes its sales order (and optional draft invoice) conditionally.
file-access:
  - path: "/settings/sales.json"
    mode: read
    reason: "Default the currency when a quotation leaves it empty"
  - path: "/products"
    mode: read
    reason: "Check that quoted products exist and are active (Products)"
  - path: "/quotations"
    mode: write
    reason: "Mark quotations confirmed with their computed totals"
  - path: "/sales-orders"
    mode: write
    reason: "Create the sales order a confirmed quotation becomes"
