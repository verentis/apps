{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "legal-matters-home",
    "name": "Legal Matters",
    "icon": "briefcase-business"
  },
  "spec": {
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Legal Matters",
          "icon": "briefcase-business",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Matters",
              "icon": "briefcase-business"
            },
            {
              "id": "intake.page.yaml",
              "label": "Intake",
              "icon": "inbox"
            },
            {
              "id": "billing.page.yaml",
              "label": "Billing",
              "icon": "receipt-text"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/legal-matters/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.heading",
            "props": {
              "level": 2,
              "text": "Legal Matters"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Matter files are visible to everyone who can read /legal-matters. Keep matters for different teams apart with workspace or folder permissions."
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Matters"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Every matter from intake to open. A matter opens beside this list.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.board",
                "props": {
                  "rows": "{{ (data.matters || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                  "groupBy": "data.status",
                  "columns": [
                    {
                      "value": "intake",
                      "label": "Intake"
                    },
                    {
                      "value": "screened",
                      "label": "Screened"
                    },
                    {
                      "value": "open",
                      "label": "Open"
                    },
                    {
                      "value": "declined",
                      "label": "Declined"
                    }
                  ],
                  "card": {
                    "title": "data.title",
                    "code": "data.code",
                    "meta": [
                      "data.disposition",
                      "data.currency"
                    ]
                  },
                  "readOnly": true,
                  "rowKey": "path",
                  "emptyText": "No matters yet"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              },
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.matters || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                  "rowKey": "path",
                  "clickable": true,
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "emptyText": "No matters yet",
                  "facets": [
                    "data.status"
                  ],
                  "columns": [
                    {
                      "key": "data.code",
                      "label": "Matter"
                    },
                    {
                      "key": "data.title",
                      "label": "Title"
                    },
                    {
                      "key": "data.status",
                      "label": "Status",
                      "format": "badge",
                      "labels": {
                        "intake": "Intake",
                        "screened": "Screened",
                        "open": "Open",
                        "declined": "Declined"
                      }
                    },
                    {
                      "key": "data.disposition",
                      "label": "Conflict decision",
                      "format": "badge",
                      "labels": {
                        "undecided": "Undecided",
                        "clear": "Clear",
                        "waiver-reviewed": "Waiver reviewed",
                        "decline": "Decline"
                      }
                    },
                    {
                      "key": "data.reviewBy",
                      "label": "Reviewed by"
                    },
                    {
                      "key": "data.updatedAt",
                      "label": "Updated",
                      "format": "relative"
                    }
                  ]
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Start an instruction"
            },
            "children": [
              {
                "type": "canvas.text",
                "props": {
                  "text": "In Files choose New → Legal matter inside /legal-matters. The new matter opens for intake and conflict screening."
                }
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open intake folder in Files",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/legal-matters"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "From instruction to invoice"
            },
            "children": [
              {
                "type": "canvas.text",
                "props": {
                  "text": "Link CRM parties, screen, record a human conflict disposition and agree terms. Prepare a pre-bill from validated time and explicitly recoverable expenses; review before creating an Invoicing draft. No trust money."
                }
              }
            ]
          }
        ]
      }
    ],
    "access": [
      {
        "path": "/legal-matters",
        "reason": "List the matters and where each one stands"
      }
    ],
    "data": {
      "matters": {
        "kind": "folder",
        "path": "/legal-matters",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.legal-matters.matter+json"
      }
    }
  }
}
