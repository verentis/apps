{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "legal-matters-billing",
    "name": "Billing",
    "description": "Unbilled work per open matter, its pre-bill and the invoice drafts made so far.",
    "icon": "receipt-text"
  },
  "spec": {
    "access": [
      {
        "path": "/legal-matters",
        "reason": "List billing"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/legal-matters",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.legal-matters.matter+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Legal Matters",
          "icon": "briefcase-business",
          "active": "billing.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Matters",
              "icon": "briefcase-business"
            },
            {
              "id": "intake.page.yaml",
              "label": "Intake",
              "icon": "inbox"
            },
            {
              "id": "billing.page.yaml",
              "label": "Billing",
              "icon": "receipt-text"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/legal-matters/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Billing",
              "note": "Unbilled work per open matter, its pre-bill and the invoice drafts made so far."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.status === 'open').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', sources: (e.data.charges || []).length, prebill: (e.data.prebill && e.data.prebill.stage) || 'Not prepared', drafts: (e.data.invoices || []).length, reviewer: e.data.billingReviewer || '' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Matter"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "sources",
                  "label": "Unbilled sources",
                  "align": "end"
                },
                {
                  "key": "prebill",
                  "label": "Pre-bill",
                  "format": "badge"
                },
                {
                  "key": "drafts",
                  "label": "Invoice drafts",
                  "align": "end"
                },
                {
                  "key": "reviewer",
                  "label": "Billing reviewer"
                }
              ],
              "emptyText": "No open matters.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
