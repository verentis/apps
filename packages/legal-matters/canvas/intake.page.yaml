{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "legal-matters-intake",
    "name": "Intake",
    "description": "New matters before screening and the conflict decision.",
    "icon": "inbox"
  },
  "spec": {
    "access": [
      {
        "path": "/legal-matters",
        "reason": "List intake"
      }
    ],
    "data": {
      "records": {
        "kind": "folder",
        "path": "/legal-matters",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.legal-matters.matter+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Legal Matters",
          "icon": "briefcase-business",
          "active": "intake.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Matters",
              "icon": "briefcase-business"
            },
            {
              "id": "intake.page.yaml",
              "label": "Intake",
              "icon": "inbox"
            },
            {
              "id": "billing.page.yaml",
              "label": "Billing",
              "icon": "receipt-text"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/legal-matters/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Intake",
              "note": "New matters before screening and the conflict decision."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "records",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.records || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').filter(e => e.data.status === 'intake' || e.data.status === 'screened').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', parties: (e.data.parties || []).length, screened: e.data.screen && e.data.screen.at ? e.data.screen.count + ' possible conflicts' : 'Not screened', status: e.data.status })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Matter"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "parties",
                  "label": "Parties",
                  "align": "end"
                },
                {
                  "key": "screened",
                  "label": "Screen"
                },
                {
                  "key": "status",
                  "label": "Status",
                  "format": "badge"
                }
              ],
              "emptyText": "No matter is waiting for intake or a conflict decision.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
