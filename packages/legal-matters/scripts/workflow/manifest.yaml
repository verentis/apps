api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: legal-matters-workflow
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Legal Matters workflow.
file-access:
  - path: "/legal-matters"
    mode: write
    reason: "Create, screen and update matters"
  - path: "/legal-billing-register"
    mode: write
    reason: "Conditionally reserve sources and track invoice delivery"
  - path: "/customers"
    mode: read
    reason: "Validate named CRM party links"
  - path: "/projects"
    mode: read
    reason: "Validate the linked project"
  - path: "/timesheets"
    mode: read
    reason: "Read selected validated time"
  - path: "/expense-reports"
    mode: read
    reason: "Read selected approved disbursements"
  - path: "/settings/accounting.json"
    mode: read
    reason: "Check currency and precision"
  - path: "/settings/invoicing.json"
    mode: read
    reason: "Read payment terms and tax defaults"
