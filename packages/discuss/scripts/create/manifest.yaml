api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: discuss-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Discuss containers; threads default to the default channel.
file-access:
  - path: "/channels"
    mode: write
    reason: "Create channels with the next code"
  - path: "/threads"
    mode: write
    reason: "Create threads with the next code"
  - path: "/settings/discuss.json"
    mode: read
    reason: "Default new threads to the default channel"
