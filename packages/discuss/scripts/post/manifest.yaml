api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: discuss-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Posting appends to the thread trail idempotently; transitions and archiving update records conditionally.
file-access:
  - path: "/threads"
    mode: write
    reason: "Post messages and resolve, lock or reopen threads"
  - path: "/channels"
    mode: write
    reason: "Archive channels and refuse posts into archived ones"
