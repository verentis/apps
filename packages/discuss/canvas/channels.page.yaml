{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "discuss-channels",
    "name": "Channels",
    "description": "Every discussion channel with its open threads and last activity.",
    "icon": "hash"
  },
  "spec": {
    "access": [
      {
        "path": "/channels",
        "reason": "List channels with their open threads and last activity"
      },
      {
        "path": "/threads",
        "reason": "List channels with their open threads and last activity"
      }
    ],
    "data": {
      "threads": {
        "kind": "folder",
        "path": "/threads",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.discuss.thread+json"
      },
      "channels": {
        "kind": "folder",
        "path": "/channels",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.discuss.channel+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.threads || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, subject: e.data.subject || '', channelPath: e.data.channel || '', channel: ((((data.channels || []).find(c => c.kind === 'file' && c.data && c.path === e.data.channel) || {}).data || {}).name) || '', status: e.data.status || '', startedBy: e.data.startedBy || '', messages: (e.data.messages || []).length, lastActivityAt: e.data.lastActivityAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Channels"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active channel. Click a row to open the channel; its threads live in /threads and reference it.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Discuss",
                  "variant": "ghost",
                  "icon": "messages-square",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/discuss/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /channels folder could not be read. Reinstall Discuss to recreate it."
            },
            "rules": {
              "visible": "data.$channels.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /threads folder could not be read. Reinstall Discuss to recreate it."
            },
            "rules": {
              "visible": "data.$threads.status === 'error'"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.channels || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(c => ({ path: c.path, code: c.data.code || c.name, name: c.data.name || '', visibility: c.data.visibility || '', topic: c.data.topic || '', members: (c.data.members || []).length, status: c.data.status || '', open: (data.rows || []).filter(r => r.channelPath === c.path && r.status === 'open').length, lastActivityAt: (data.rows || []).filter(r => r.channelPath === c.path).map(r => r.lastActivityAt).sort().reverse()[0] || '' })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Channel"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "visibility",
                  "label": "Kind"
                },
                {
                  "key": "topic",
                  "label": "Topic"
                },
                {
                  "key": "members",
                  "label": "Members",
                  "align": "end"
                },
                {
                  "key": "open",
                  "label": "Open threads",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "lastActivityAt",
                  "label": "Last activity"
                }
              ],
              "emptyText": "No channels yet",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
