{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "discuss-thread",
    "name": "Discuss thread",
    "description": "View and edit a Discuss thread.",
    "icon": "messages-square"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.discuss.thread+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/discuss/v1/thread.schema.json",
          "source": "/applications/discuss/schemas/thread.schema.json",
          "title": "Discuss thread",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fdiscuss%2Fcanvas%2Fthread.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.discuss.thread+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/discuss/v1/thread.schema.json",
          "source": "/applications/discuss/schemas/thread.schema.json",
          "title": "Discuss thread",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/channels",
        "mode": "read",
        "reason": "Choose the channel a thread belongs to"
      },
      {
        "path": "/applications/discuss/",
        "mode": "read",
        "reason": "Read the Discuss schemas and run the discussion action script"
      }
    ],
    "access": [
      {
        "path": "/channels",
        "reason": "Choose the channel a thread belongs to"
      },
      {
        "path": "/applications/discuss/",
        "reason": "Read the Discuss schemas and run the discussion action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "channels": {
        "kind": "folder",
        "path": "/channels",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.discuss.channel+json"
      },
      "channeloptions": {
        "kind": "computed",
        "expr": "(data.channels || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'archived')).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.heading",
                        "props": {
                          "level": 2,
                          "text": "{{ form.values.subject || 'New thread' }}"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                          "tone": "{{ [\"resolved\",\"active\"].includes(form.values.status) ? 'success' : [\"archived\"].includes(form.values.status) ? 'warning' : [\"locked\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                        },
                        "rules": {
                          "visible": "!!form.values.status"
                        }
                      },
                      {
                        "type": "canvas.dashboard.badge",
                        "props": {
                          "text": "Archived",
                          "tone": "warning",
                          "icon": "archive"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'"
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Thread {{ form.values.code || '' }} · {{ ctx.file.path }}",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Post message",
                      "icon": "send",
                      "size": "sm"
                    },
                    "on": {
                      "click": "post-message"
                    },
                    "rules": {
                      "visible": "form.values.status === 'open' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty || !String(form.values.draft || '').trim()"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Resolve",
                      "variant": "outline",
                      "icon": "check",
                      "size": "sm"
                    },
                    "on": {
                      "click": "resolve-thread"
                    },
                    "rules": {
                      "visible": "form.values.status === 'open' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reopen",
                      "variant": "outline",
                      "icon": "rotate-ccw",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reopen-thread"
                    },
                    "rules": {
                      "visible": "form.values.status === 'resolved' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Lock",
                      "variant": "outline",
                      "icon": "lock",
                      "size": "sm"
                    },
                    "on": {
                      "click": "lock-thread"
                    },
                    "rules": {
                      "visible": "form.values.status === 'resolved' && !(form.values.state === 'archived')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Archive",
                          "variant": "ghost",
                          "icon": "archive",
                          "size": "sm"
                        },
                        "on": {
                          "click": "archive"
                        },
                        "rules": {
                          "visible": "!(form.values.state === 'archived') && !(form.values.status === 'locked')",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Restore",
                          "variant": "outline",
                          "icon": "archive-restore",
                          "size": "sm"
                        },
                        "on": {
                          "click": "restore"
                        },
                        "rules": {
                          "visible": "form.values.state === 'archived'",
                          "disabled": "form.saving || form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Reset",
                          "variant": "ghost",
                          "size": "sm"
                        },
                        "on": {
                          "click": "reset"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty"
                        }
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Save",
                          "icon": "save",
                          "size": "sm"
                        },
                        "on": {
                          "click": "save"
                        },
                        "rules": {
                          "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'locked')"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$record.error }}"
            },
            "rules": {
              "visible": "data.$record.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$record.status === 'loading'"
            }
          },
          {
            "type": "canvas.dashboard.badge",
            "props": {
              "text": "This thread is archived. Restore it to edit.",
              "tone": "warning",
              "icon": "archive"
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This thread is resolved. Reopen it to post again.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'resolved'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This thread is locked and can no longer be edited.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'locked'"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Messages",
              "description": "The durable trail. Messages are appended by the Post message action and never silently rewritten."
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ form.values.messages || [] }}",
                  "columns": [
                    {
                      "key": "sequence",
                      "label": "#"
                    },
                    {
                      "key": "author",
                      "label": "Author"
                    },
                    {
                      "key": "date",
                      "label": "Date"
                    },
                    {
                      "key": "body",
                      "label": "Message"
                    }
                  ],
                  "emptyText": "No messages yet. Compose one below and Post message."
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Thread"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Subject",
                          "value": "{{ form.values.subject }}",
                          "required": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Channel",
                          "value": "{{ form.values.channel }}",
                          "options": "{{ data.channeloptions }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Started by",
                          "value": "{{ form.values.startedBy }}",
                          "placeholder": "Name or email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Resolved and locked are set by the Resolve and Lock actions.",
                          "options": [
                            {
                              "value": "open",
                              "label": "Open"
                            },
                            {
                              "value": "resolved",
                              "label": "Resolved"
                            },
                            {
                              "value": "locked",
                              "label": "Locked"
                            }
                          ]
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Last activity",
                          "value": "{{ form.values.lastActivityAt }}",
                          "description": "Stamped when a message is posted."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked')) || (true)"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Compose"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Post as",
                          "value": "{{ form.values.postAs }}",
                          "placeholder": "Name or email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Message (Markdown)",
                          "value": "{{ form.values.draft }}",
                          "description": "Save the thread, then Post message appends this to the trail and clears it.",
                          "rows": 5
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'locked'))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "post-message": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "run-script": {
              "file": "/applications/discuss/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "post-message",
                "path": "{{ ctx.file.path }}",
                "body": "{{ form.values.draft }}",
                "author": "{{ form.values.postAs }}",
                "key": "{{ Date() }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "resolve-thread": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Resolve thread",
              "message": "Mark this thread resolved? Resolved threads can be reopened or locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/discuss/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "resolve-thread",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "lock-thread": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Lock thread",
              "message": "Lock this resolved thread? Locked threads are read-only and cannot be reopened."
            }
          },
          {
            "run-script": {
              "file": "/applications/discuss/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "lock-thread",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "reopen-thread": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Reopen thread",
              "message": "Reopen this resolved thread so it accepts messages again?"
            }
          },
          {
            "run-script": {
              "file": "/applications/discuss/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "reopen-thread",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
