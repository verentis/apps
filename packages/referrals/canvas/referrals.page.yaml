{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "referrals-list",
    "name": "Referrals by status",
    "description": "Every referral, listed by status.",
    "icon": "list"
  },
  "spec": {
    "access": [
      {
        "path": "/referrals",
        "reason": "List referrals by status; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "referrals": {
        "kind": "folder",
        "path": "/referrals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.referrals.referral+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.referrals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, referrer: e.data.referrerName || '', candidate: e.data.candidateName || '', status: e.data.status || '', points: Number(e.data.points) || 0, decidedAt: e.data.decidedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Referrals",
          "icon": "gift",
          "active": "referrals.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My referrals",
              "icon": "layout-dashboard"
            },
            {
              "id": "referrals.page.yaml",
              "label": "All referrals",
              "icon": "kanban"
            },
            {
              "id": "leaderboard.page.yaml",
              "label": "Leaderboard",
              "icon": "trophy"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/referrals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/referrals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Referrals by status",
              "note": "Every active referral, grouped by its status. Click a row to open the referral."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "referrals",
              "compact": true,
              "description": "The /referrals folder could not be read. Reinstall Referrals to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Submitted",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In Process",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-process').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'hired').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Not Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'not-hired').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "status",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "submitted",
                          "label": "Submitted"
                        },
                        {
                          "value": "in-process",
                          "label": "In Process"
                        },
                        {
                          "value": "hired",
                          "label": "Hired"
                        },
                        {
                          "value": "not-hired",
                          "label": "Not Hired"
                        }
                      ],
                      "card": {
                        "title": "referrer",
                        "code": "code",
                        "meta": [
                          "candidate",
                          "decidedAt",
                          "points"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"hired\",\"not-hired\"].includes(row.status)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'hired'",
                            "title": "Move to Hired?",
                            "message": "{{ event.row.code }} moves to Hired. The referrer is awarded their points.",
                            "confirm-label": "Move to Hired"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'not-hired'",
                            "title": "Move to Not Hired?",
                            "message": "{{ event.row.code }} moves to Not Hired. It cannot be moved back from the board.",
                            "confirm-label": "Move to Not Hired"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'hired'",
                            "file": "/applications/referrals/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "mark-hired",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'not-hired'",
                            "file": "/applications/referrals/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "mark-not-hired",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"hired\",\"not-hired\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "status": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "referrals"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"hired\",\"not-hired\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"submitted\":\"Submitted\",\"in-process\":\"In Process\",\"hired\":\"Hired\",\"not-hired\":\"Not Hired\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Referral"
                        },
                        {
                          "key": "referrer",
                          "label": "Referrer"
                        },
                        {
                          "key": "candidate",
                          "label": "Candidate"
                        },
                        {
                          "key": "decidedAt",
                          "label": "Decided"
                        },
                        {
                          "key": "points",
                          "label": "Points",
                          "align": "end"
                        },
                        {
                          "key": "status",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "submitted": "Submitted",
                            "in-process": "In Process",
                            "hired": "Hired",
                            "not-hired": "Not Hired"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "submitted",
                          "label": "Submitted",
                          "where": "row.status === 'submitted'"
                        },
                        {
                          "value": "in-process",
                          "label": "In Process",
                          "where": "row.status === 'in-process'"
                        },
                        {
                          "value": "hired",
                          "label": "Hired",
                          "where": "row.status === 'hired'"
                        },
                        {
                          "value": "not-hired",
                          "label": "Not Hired",
                          "where": "row.status === 'not-hired'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
