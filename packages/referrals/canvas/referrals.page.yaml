{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "referrals-list",
    "name": "Referrals by status",
    "description": "Every referral, listed by status.",
    "icon": "list"
  },
  "spec": {
    "access": [
      {
        "path": "/referrals",
        "reason": "List referrals by status"
      }
    ],
    "data": {
      "referrals": {
        "kind": "folder",
        "path": "/referrals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.referrals.referral+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.referrals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, referrer: e.data.referrerName || '', candidate: e.data.candidateName || '', status: e.data.status || '', points: Number(e.data.points) || 0, decidedAt: e.data.decidedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Referrals by status"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active referral, grouped by its status. Click a row to open the referral.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Referrals",
                  "variant": "ghost",
                  "icon": "gift",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/referrals/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /referrals folder could not be read. Reinstall Referrals to recreate it."
            },
            "rules": {
              "visible": "data.$referrals.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Submitted",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'submitted').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "In Process",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'in-process').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'hired').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Not Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'not-hired').length }}",
                  "icon": "gift",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "submitted",
                  "label": "Submitted",
                  "icon": "gift"
                },
                {
                  "value": "in-process",
                  "label": "In Process",
                  "icon": "gift"
                },
                {
                  "value": "hired",
                  "label": "Hired",
                  "icon": "gift"
                },
                {
                  "value": "not-hired",
                  "label": "Not Hired",
                  "icon": "gift"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'submitted') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Referral"
                        },
                        {
                          "key": "referrer",
                          "label": "Referrer"
                        },
                        {
                          "key": "candidate",
                          "label": "Candidate"
                        },
                        {
                          "key": "decidedAt",
                          "label": "Decided"
                        },
                        {
                          "key": "points",
                          "label": "Points",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No submitted referrals",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "submitted"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'in-process') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Referral"
                        },
                        {
                          "key": "referrer",
                          "label": "Referrer"
                        },
                        {
                          "key": "candidate",
                          "label": "Candidate"
                        },
                        {
                          "key": "decidedAt",
                          "label": "Decided"
                        },
                        {
                          "key": "points",
                          "label": "Points",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No in process referrals",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "in-process"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'hired') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Referral"
                        },
                        {
                          "key": "referrer",
                          "label": "Referrer"
                        },
                        {
                          "key": "candidate",
                          "label": "Candidate"
                        },
                        {
                          "key": "decidedAt",
                          "label": "Decided"
                        },
                        {
                          "key": "points",
                          "label": "Points",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No hired referrals",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "hired"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'not-hired') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Referral"
                        },
                        {
                          "key": "referrer",
                          "label": "Referrer"
                        },
                        {
                          "key": "candidate",
                          "label": "Candidate"
                        },
                        {
                          "key": "decidedAt",
                          "label": "Decided"
                        },
                        {
                          "key": "points",
                          "label": "Points",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No not hired referrals",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "not-hired"
              }
            ]
          }
        ]
      }
    ]
  }
}
