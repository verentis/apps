{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "referrals-home",
    "name": "Referrals",
    "description": "Referrals overview.",
    "icon": "gift"
  },
  "spec": {
    "access": [
      {
        "path": "/referrals",
        "reason": "Count referrals and show them"
      }
    ],
    "data": {
      "referrals": {
        "kind": "folder",
        "path": "/referrals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.referrals.referral+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.referrals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, referrer: e.data.referrerName || '', candidate: e.data.candidateName || '', status: e.data.status || '', points: Number(e.data.points) || 0, decidedAt: e.data.decidedAt || '' }))"
      },
      "listreferrals": {
        "kind": "folder",
        "path": "/referrals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.referrals.referral+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Referrals",
          "icon": "gift",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My referrals",
              "icon": "layout-dashboard"
            },
            {
              "id": "referrals.page.yaml",
              "label": "All referrals",
              "icon": "kanban"
            },
            {
              "id": "leaderboard.page.yaml",
              "label": "Leaderboard",
              "icon": "trophy"
            },
            {
              "id": "mine.page.yaml",
              "label": "My referrals",
              "icon": "user"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/referrals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/referrals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Referrals",
              "note": "Employee referrals are files in your workspace. Submit them in /referrals, track them, then decide them from their forms. Hires award points from the settings."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open",
                  "value": "{{ (data.rows || []).filter(r => ['submitted','in-process'].includes(r.status)).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'hired').length }}",
                  "icon": "check",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Not hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'not-hired').length }}",
                  "icon": "x",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Points awarded",
                  "value": "{{ (data.rows || []).map(r => r.points).reduce((sum, v) => sum + v, 0) }}",
                  "icon": "trophy",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "referrals",
              "compact": true,
              "description": "The /referrals folder could not be read. Reinstall Referrals to recreate it."
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /referrals",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/referrals"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "listreferrals",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.listreferrals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
              "columns": [
                {
                  "key": "data.code",
                  "label": "Referral"
                },
                {
                  "key": "data.referrerName",
                  "label": "Referrer"
                },
                {
                  "key": "data.candidateName",
                  "label": "Candidate"
                },
                {
                  "key": "data.status",
                  "label": "Status",
                  "format": "badge"
                },
                {
                  "key": "data.points",
                  "label": "Points"
                }
              ],
              "facets": [
                "data.status"
              ],
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true,
              "rowKey": "path",
              "emptyText": "No referrals yet. Use New in /referrals."
            },
            "rules": {
              "visible": "data.$listreferrals.status === 'ready'"
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
