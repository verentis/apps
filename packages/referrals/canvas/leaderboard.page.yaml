{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "referrals-leaderboard",
    "name": "Leaderboard",
    "description": "Referral points per referrer.",
    "icon": "trophy"
  },
  "spec": {
    "access": [
      {
        "path": "/referrals",
        "reason": "Sum referral points per referrer"
      }
    ],
    "data": {
      "referrals": {
        "kind": "folder",
        "path": "/referrals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.referrals.referral+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.referrals || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, referrer: e.data.referrerName || '', candidate: e.data.candidateName || '', status: e.data.status || '', points: Number(e.data.points) || 0, decidedAt: e.data.decidedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Referrals",
          "icon": "gift",
          "active": "leaderboard.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "My referrals",
              "icon": "layout-dashboard"
            },
            {
              "id": "referrals.page.yaml",
              "label": "All referrals",
              "icon": "kanban"
            },
            {
              "id": "leaderboard.page.yaml",
              "label": "Leaderboard",
              "icon": "trophy"
            },
            {
              "id": "mine.page.yaml",
              "label": "My referrals",
              "icon": "user"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/referrals/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/referrals.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Leaderboard",
              "note": "Referrers ranked by awarded points. Points are awarded when a referral is marked hired."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Points earned"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => r.referrer || 'Unknown').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, value: (data.rows || []).filter(r => (r.referrer || 'Unknown') === name).reduce((sum, r) => sum + (Number(r.points) || 0), 0) })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "hbar",
                  "x": "label",
                  "y": "value",
                  "format": "integer",
                  "sort": "-value"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "referrals",
              "compact": true,
              "description": "The /referrals folder could not be read. Reinstall Referrals to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Referrers",
                  "value": "{{ (data.rows || []).map(r => r.referrer || 'No referrer').filter((v, i, a) => a.indexOf(v) === i).length }}",
                  "icon": "users",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Hired",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'hired').length }}",
                  "icon": "check",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Points awarded",
                  "value": "{{ (data.rows || []).map(r => r.points).reduce((sum, v) => sum + v, 0) }}",
                  "icon": "trophy",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open",
                  "value": "{{ (data.rows || []).filter(r => ['submitted','in-process'].includes(r.status)).length }}",
                  "icon": "hourglass",
                  "loading": "{{ data.$referrals.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "By referrer"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => r.referrer || 'No referrer').filter((v, i, a) => a.indexOf(v) === i).map(name => ({ referrer: name, referrals: (data.rows || []).filter(r => (r.referrer || 'No referrer') === name).length, hired: (data.rows || []).filter(r => r.status === 'hired').filter(r => (r.referrer || 'No referrer') === name).length, points: (data.rows || []).filter(r => (r.referrer || 'No referrer') === name).map(r => r.points).reduce((sum, v) => sum + v, 0) })).sort((a, b) => b.points - a.points || a.referrer.localeCompare(b.referrer)) }}",
                  "columns": [
                    {
                      "key": "referrer",
                      "label": "Referrer"
                    },
                    {
                      "key": "referrals",
                      "label": "Referrals",
                      "align": "end"
                    },
                    {
                      "key": "hired",
                      "label": "Hired",
                      "align": "end"
                    },
                    {
                      "key": "points",
                      "label": "Points",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No referrals yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
