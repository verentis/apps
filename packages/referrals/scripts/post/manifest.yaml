api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: referrals-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Hire decisions enforce the status transitions, award points from the Referrals settings and update referrals conditionally.
file-access:
  - path: "/referrals"
    mode: write
    reason: "Mark referrals hired or not hired"
  - path: "/settings/referrals.json"
    mode: read
    reason: "Read the points a hire awards"
