{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "events-registrations",
    "name": "Registrations",
    "description": "Registrations per event, against capacity.",
    "icon": "user-check"
  },
  "spec": {
    "access": [
      {
        "path": "/events",
        "reason": "Sum confirmed and attended seats per event against its capacity"
      },
      {
        "path": "/event-registrations",
        "reason": "Sum confirmed and attended seats per event against its capacity"
      }
    ],
    "data": {
      "events": {
        "kind": "folder",
        "path": "/events",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.event+json"
      },
      "registrations": {
        "kind": "folder",
        "path": "/event-registrations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.registration+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', venue: e.data.venue || '', startsAt: e.data.startsAt || '', status: e.data.status || '', capacity: Number(e.data.capacity) || 0, taken: (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0), remaining: Math.max((Number(e.data.capacity) || 0) - ((data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0)), 0) }))"
      },
      "registrationrows": {
        "kind": "computed",
        "expr": "(data.registrations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, attendee: e.data.attendeeName || '', event: ((((data.events || []).find(v => v.kind === 'file' && v.data && v.path === e.data.event) || {}).data || {}).name) || '', eventPath: e.data.event || '', qty: Number(e.data.qty) || 0, status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Events",
          "icon": "calendar",
          "active": "registrations.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "events.page.yaml",
              "label": "Events",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['published', 'ongoing'].includes(r.status)).length }}"
            },
            {
              "id": "registrations.page.yaml",
              "label": "Registrations",
              "icon": "ticket"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/events/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/events.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Registrations",
              "note": "Confirmed and attended seats per event, against its capacity. Click a row to open the record."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Check-in"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Search for a confirmed attendee and check them in. The box clears for the next person.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.form.input",
                "props": {
                  "label": "Find an attendee",
                  "value": "{{ state.door }}",
                  "placeholder": "Name or registration number"
                }
              },
              {
                "type": "canvas.repeat",
                "props": {
                  "items": "{{ String(state.door || '').trim().length < 2 ? [] : (data.registrationrows || []).filter(r => r.status === 'confirmed' && [r.attendee, r.code].join(' ').toLowerCase().includes(String(state.door).trim().toLowerCase())).slice(0, 8) }}",
                  "layout": "list",
                  "emptyText": "{{ String(state.door || '').trim().length < 2 ? 'Type at least two letters' : 'No confirmed registration matches' }}"
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "align": "center",
                        "justify": "space-between",
                        "gap": 3,
                        "padding": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.stack",
                        "layout": {
                          "base": {
                            "gap": 0
                          }
                        },
                        "children": [
                          {
                            "type": "canvas.heading",
                            "props": {
                              "level": 3,
                              "text": "{{ item.attendee }}"
                            }
                          },
                          {
                            "type": "canvas.text",
                            "props": {
                              "tone": "muted",
                              "text": "{{ [item.event, item.code, item.qty > 1 ? item.qty + ' places' : ''].filter(part => part).join(' · ') }}"
                            }
                          }
                        ]
                      },
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Check in",
                          "icon": "check",
                          "size": "lg"
                        },
                        "on": {
                          "click": [
                            {
                              "run-script": {
                                "file": "/applications/events/scripts/post",
                                "timeout": 60,
                                "parameters": {
                                  "operation": "check-in",
                                  "path": "{{ item.path }}"
                                },
                                "assign": "checkedin"
                              }
                            },
                            {
                              "refresh-source": {
                                "source": "registrations"
                              }
                            },
                            {
                              "set-state": {
                                "key": "door",
                                "value": ""
                              }
                            },
                            {
                              "toast": {
                                "message": "{{ (state.checkedin && state.checkedin.message) || 'Checked in' }}",
                                "variant": "success"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "events",
              "compact": true,
              "description": "The /events folder could not be read. Reinstall Events to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "registrations",
              "compact": true,
              "description": "The /event-registrations folder could not be read. Reinstall Events to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Registrations",
                  "value": "{{ (data.registrationrows || []).length }}",
                  "icon": "user-check",
                  "loading": "{{ data.$registrations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Seats confirmed",
                  "value": "{{ (data.registrationrows || []).filter(r => [\"confirmed\",\"attended\"].includes(r.status)).reduce((total, r) => total + r.qty, 0) }}",
                  "icon": "check",
                  "loading": "{{ data.$registrations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Attended",
                  "value": "{{ (data.registrationrows || []).filter(r => r.status === 'attended').reduce((total, r) => total + r.qty, 0) }}",
                  "icon": "badge-check",
                  "loading": "{{ data.$registrations.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.registrationrows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "x",
                  "loading": "{{ data.$registrations.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Capacity per event"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', venue: e.data.venue || '', startsAt: e.data.startsAt || '', status: e.data.status || '', capacity: Number(e.data.capacity) || 0, taken: (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0), remaining: Math.max((Number(e.data.capacity) || 0) - ((data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0)), 0) })).map(r => ({ path: r.path, code: r.code, name: r.name, status: r.status, capacity: r.capacity, taken: r.taken, remaining: r.remaining, fill: r.capacity > 0 ? Math.round(r.taken * 100 / r.capacity) + '%' : '' })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Event"
                    },
                    {
                      "key": "name",
                      "label": "Name"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    },
                    {
                      "key": "taken",
                      "label": "Seats taken",
                      "align": "end"
                    },
                    {
                      "key": "capacity",
                      "label": "Capacity",
                      "align": "end"
                    },
                    {
                      "key": "remaining",
                      "label": "Remaining",
                      "align": "end"
                    },
                    {
                      "key": "fill",
                      "label": "Fill",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No events yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Registrations"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.registrationrows || []).map(r => ({ path: r.path, code: r.code, attendee: r.attendee, event: r.event, qty: r.qty, status: r.status })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Registration"
                    },
                    {
                      "key": "attendee",
                      "label": "Attendee"
                    },
                    {
                      "key": "event",
                      "label": "Event"
                    },
                    {
                      "key": "qty",
                      "label": "Seats",
                      "align": "end"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    }
                  ],
                  "emptyText": "No registrations yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Registrations by status"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ ['draft', 'confirmed', 'attended', 'cancelled'].map(status => ({ label: status, value: (data.registrationrows || []).filter(r => r.status === status).length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "strip",
                  "x": "label",
                  "y": "value",
                  "labels": {
                    "draft": "Draft",
                    "confirmed": "Confirmed",
                    "attended": "Attended",
                    "cancelled": "Cancelled"
                  },
                  "palette": {
                    "draft": "muted",
                    "confirmed": "chart-1",
                    "attended": "success",
                    "cancelled": "danger"
                  },
                  "format": "integer"
                }
              }
            ]
          }
        ]
      }
    ],
    "state": {
      "door": ""
    }
  }
}
