{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "events-registration",
    "name": "Events registration",
    "description": "View and edit an Events registration.",
    "icon": "user-check"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.events.registration+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/events/v1/registration.schema.json",
          "source": "/applications/events/schemas/registration.schema.json",
          "title": "Events registration",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fevents%2Fcanvas%2Fregistration.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.events.registration+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/events/v1/registration.schema.json",
          "source": "/applications/events/schemas/registration.schema.json",
          "title": "Events registration",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/events",
        "mode": "read",
        "reason": "Choose the event a registration belongs to"
      },
      {
        "path": "/event-registrations",
        "mode": "read",
        "reason": "Show how many seats are already taken on the chosen event"
      },
      {
        "path": "/applications/events/",
        "mode": "read",
        "reason": "Read the Events schemas and run the action script"
      }
    ],
    "access": [
      {
        "path": "/events",
        "reason": "Choose the event a registration belongs to"
      },
      {
        "path": "/event-registrations",
        "reason": "Show how many seats are already taken on the chosen event"
      },
      {
        "path": "/applications/events/",
        "reason": "Read the Events schemas and run the action script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "events": {
        "kind": "folder",
        "path": "/events",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.event+json"
      },
      "eventoptions": {
        "kind": "computed",
        "expr": "(data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "registrations": {
        "kind": "folder",
        "path": "/event-registrations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.registration+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.attendeeName || 'New registration' }}",
              "note": "Registration {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\",\"attended\"].includes(form.values.status) ? 'success' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Confirm",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "confirm"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || !form.values.event"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Check in",
                  "variant": "outline",
                  "icon": "user-check",
                  "size": "sm"
                },
                "on": {
                  "click": "check-in"
                },
                "rules": {
                  "visible": "form.values.status === 'confirmed' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel registration",
                  "variant": "ghost",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel-registration"
                },
                "rules": {
                  "visible": "[\"draft\",\"confirmed\"].includes(form.values.status) && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !([\"attended\",\"cancelled\"].includes(form.values.status))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "draft",
                  "label": "Draft"
                },
                {
                  "value": "confirmed",
                  "label": "Confirmed"
                },
                {
                  "value": "attended",
                  "label": "Attended"
                }
              ],
              "branches": [
                {
                  "value": "cancelled",
                  "label": "Cancelled"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This registration is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Seats taken on this event: {{ (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === form.values.event).reduce((total, r) => total + (Number(r.data.qty) || 0), 0) }}.",
              "tone": "muted"
            },
            "rules": {
              "visible": "!!form.values.event"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This registration is cancelled and can no longer be edited.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'cancelled'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This attendee has checked in; the registration is locked.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'attended'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Registration"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Event",
                          "value": "{{ form.values.event }}",
                          "description": "The event this registration belongs to.",
                          "options": "{{ data.eventoptions }}",
                          "searchable": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Attendee name",
                          "value": "{{ form.values.attendeeName }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Attendee email",
                          "value": "{{ form.values.attendeeEmail }}",
                          "inputType": "email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Seats",
                          "value": "{{ form.values.qty }}",
                          "required": true,
                          "min": 1,
                          "max": 1000,
                          "step": 1
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Confirmed, attended and cancelled are set by Confirm, Check in and Cancel.",
                          "options": [
                            {
                              "value": "draft",
                              "label": "Draft"
                            },
                            {
                              "value": "confirmed",
                              "label": "Confirmed"
                            },
                            {
                              "value": "attended",
                              "label": "Attended"
                            },
                            {
                              "value": "cancelled",
                              "label": "Cancelled"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status)))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Confirmed at",
                          "value": "{{ form.values.confirmedAt }}",
                          "description": "Stamped by Confirm."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || ([\"attended\",\"cancelled\"].includes(form.values.status))) || (true)"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "confirm": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Confirm registration",
              "message": "Confirm this registration? The event must be published or ongoing and have enough remaining capacity."
            }
          },
          {
            "run-script": {
              "file": "/applications/events/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "confirm",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "check-in": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Check in",
              "message": "Mark this attendee as attended? Attended registrations are locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/events/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "check-in",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "cancel-registration": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Cancel registration",
              "message": "Cancel this registration? Its seats are released and the record is locked."
            }
          },
          {
            "run-script": {
              "file": "/applications/events/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "cancel-registration",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
