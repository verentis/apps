{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "events-events",
    "name": "All events",
    "description": "Every event, listed by status.",
    "icon": "calendar"
  },
  "spec": {
    "access": [
      {
        "path": "/events",
        "reason": "List events by status with their seats taken"
      },
      {
        "path": "/event-registrations",
        "reason": "List events by status with their seats taken"
      }
    ],
    "data": {
      "events": {
        "kind": "folder",
        "path": "/events",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.event+json"
      },
      "registrations": {
        "kind": "folder",
        "path": "/event-registrations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.registration+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', venue: e.data.venue || '', startsAt: e.data.startsAt || '', status: e.data.status || '', capacity: Number(e.data.capacity) || 0, taken: (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0), remaining: Math.max((Number(e.data.capacity) || 0) - ((data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0)), 0) }))"
      },
      "registrationrows": {
        "kind": "computed",
        "expr": "(data.registrations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, attendee: e.data.attendeeName || '', event: ((((data.events || []).find(v => v.kind === 'file' && v.data && v.path === e.data.event) || {}).data || {}).name) || '', eventPath: e.data.event || '', qty: Number(e.data.qty) || 0, status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Events by status"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active event, grouped by its status. Click a row to open the event.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Events",
                  "variant": "ghost",
                  "icon": "calendar",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/events/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /events folder could not be read. Reinstall Events to recreate it."
            },
            "rules": {
              "visible": "data.$events.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /event-registrations folder could not be read. Reinstall Events to recreate it."
            },
            "rules": {
              "visible": "data.$registrations.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 5
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Ongoing",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'ongoing').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "icon": "calendar"
                },
                {
                  "value": "published",
                  "label": "Published",
                  "icon": "calendar"
                },
                {
                  "value": "ongoing",
                  "label": "Ongoing",
                  "icon": "calendar"
                },
                {
                  "value": "done",
                  "label": "Done",
                  "icon": "calendar"
                },
                {
                  "value": "cancelled",
                  "label": "Cancelled",
                  "icon": "calendar"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'draft') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No draft events",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "draft"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'published') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No published events",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "published"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'ongoing') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No ongoing events",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "ongoing"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'done') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No done events",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "done"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []).filter(r => r.status === 'cancelled') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No cancelled events",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "cancelled"
              }
            ]
          }
        ]
      }
    ]
  }
}
