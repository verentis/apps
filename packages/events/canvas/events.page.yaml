{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "events-events",
    "name": "All events",
    "description": "Every event, listed by status.",
    "icon": "calendar"
  },
  "spec": {
    "access": [
      {
        "path": "/events",
        "reason": "List events by status with their seats taken; move records between columns",
        "mode": "write"
      },
      {
        "path": "/event-registrations",
        "reason": "List events by status with their seats taken"
      }
    ],
    "data": {
      "events": {
        "kind": "folder",
        "path": "/events",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.event+json"
      },
      "registrations": {
        "kind": "folder",
        "path": "/event-registrations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.registration+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', venue: e.data.venue || '', startsAt: e.data.startsAt || '', status: e.data.status || '', capacity: Number(e.data.capacity) || 0, taken: (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0), remaining: Math.max((Number(e.data.capacity) || 0) - ((data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0)), 0) }))"
      },
      "registrationrows": {
        "kind": "computed",
        "expr": "(data.registrations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, attendee: e.data.attendeeName || '', event: ((((data.events || []).find(v => v.kind === 'file' && v.data && v.path === e.data.event) || {}).data || {}).name) || '', eventPath: e.data.event || '', qty: Number(e.data.qty) || 0, status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Events",
          "icon": "calendar",
          "active": "events.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "events.page.yaml",
              "label": "Events",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['published', 'ongoing'].includes(r.status)).length }}"
            },
            {
              "id": "registrations.page.yaml",
              "label": "Registrations",
              "icon": "ticket"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/events/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/events.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Events by status",
              "note": "Every active event, grouped by its status. Click a row to open the event."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "events",
              "compact": true,
              "description": "The /events folder could not be read. Reinstall Events to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "registrations",
              "compact": true,
              "description": "The /event-registrations folder could not be read. Reinstall Events to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 5
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Ongoing",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'ongoing').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'cancelled').length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "groupBy": "status",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "draft",
                          "label": "Draft"
                        },
                        {
                          "value": "published",
                          "label": "Published"
                        },
                        {
                          "value": "ongoing",
                          "label": "Ongoing"
                        },
                        {
                          "value": "done",
                          "label": "Done"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled"
                        }
                      ],
                      "card": {
                        "title": "name",
                        "code": "code",
                        "meta": [
                          "venue",
                          "startsAt",
                          "taken"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"done\",\"cancelled\"].includes(row.status)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'done'",
                            "title": "Move to Done?",
                            "message": "{{ event.row.code }} moves to Done. It cannot be moved back from the board.",
                            "confirm-label": "Move to Done"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'cancelled'",
                            "title": "Move to Cancelled?",
                            "message": "{{ event.row.code }} moves to Cancelled. It cannot be moved back from the board.",
                            "confirm-label": "Move to Cancelled"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'published'",
                            "file": "/applications/events/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "publish",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'done'",
                            "file": "/applications/events/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "complete",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'cancelled'",
                            "file": "/applications/events/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "cancel",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"published\",\"done\",\"cancelled\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "status": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "events"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "registrations"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"published\",\"done\",\"cancelled\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"published\":\"Published\",\"ongoing\":\"Ongoing\",\"done\":\"Done\",\"cancelled\":\"Cancelled\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.rows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Event"
                        },
                        {
                          "key": "name",
                          "label": "Name"
                        },
                        {
                          "key": "venue",
                          "label": "Venue"
                        },
                        {
                          "key": "startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "taken",
                          "label": "Seats taken",
                          "align": "end"
                        },
                        {
                          "key": "capacity",
                          "label": "Capacity",
                          "align": "end"
                        },
                        {
                          "key": "remaining",
                          "label": "Remaining",
                          "align": "end"
                        },
                        {
                          "key": "status",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "draft": "Draft",
                            "published": "Published",
                            "ongoing": "Ongoing",
                            "done": "Done",
                            "cancelled": "Cancelled"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "draft",
                          "label": "Draft",
                          "where": "row.status === 'draft'"
                        },
                        {
                          "value": "published",
                          "label": "Published",
                          "where": "row.status === 'published'"
                        },
                        {
                          "value": "ongoing",
                          "label": "Ongoing",
                          "where": "row.status === 'ongoing'"
                        },
                        {
                          "value": "done",
                          "label": "Done",
                          "where": "row.status === 'done'"
                        },
                        {
                          "value": "cancelled",
                          "label": "Cancelled",
                          "where": "row.status === 'cancelled'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
