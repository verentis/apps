{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "events-home",
    "name": "Events",
    "description": "Events overview.",
    "icon": "calendar"
  },
  "spec": {
    "access": [
      {
        "path": "/events",
        "reason": "Count events and registrations and show them"
      },
      {
        "path": "/event-registrations",
        "reason": "Count events and registrations and show them"
      }
    ],
    "data": {
      "events": {
        "kind": "folder",
        "path": "/events",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.event+json"
      },
      "registrations": {
        "kind": "folder",
        "path": "/event-registrations",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.events.registration+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.events || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', venue: e.data.venue || '', startsAt: e.data.startsAt || '', status: e.data.status || '', capacity: Number(e.data.capacity) || 0, taken: (data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0), remaining: Math.max((Number(e.data.capacity) || 0) - ((data.registrations || []).filter(r => r.kind === 'file' && r.data && r.data.state !== 'archived' && [\"confirmed\",\"attended\"].includes(r.data.status) && r.data.event === e.path).reduce((total, r) => total + (Number(r.data.qty) || 0), 0)), 0) }))"
      },
      "registrationrows": {
        "kind": "computed",
        "expr": "(data.registrations || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, attendee: e.data.attendeeName || '', event: ((((data.events || []).find(v => v.kind === 'file' && v.data && v.path === e.data.event) || {}).data || {}).name) || '', eventPath: e.data.event || '', qty: Number(e.data.qty) || 0, status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Events"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Events and registrations are files in your workspace. Draft events in /events, publish them, then confirm and check in registrations from their forms.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "All events",
                      "variant": "outline",
                      "icon": "calendar",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/events/canvas/events.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Registrations",
                      "variant": "outline",
                      "icon": "user-check",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/events/canvas/registrations.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/events.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "megaphone",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Ongoing",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'ongoing').length }}",
                  "icon": "play",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$events.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Seats confirmed",
                  "value": "{{ (data.rows || []).reduce((total, r) => total + r.taken, 0) }}",
                  "icon": "user-check",
                  "loading": "{{ data.$registrations.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /events folder could not be read. Reinstall Events to recreate it."
            },
            "rules": {
              "visible": "data.$events.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /event-registrations folder could not be read. Reinstall Events to recreate it."
            },
            "rules": {
              "visible": "data.$registrations.status === 'error'"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "events",
                  "label": "Events",
                  "icon": "calendar"
                },
                {
                  "value": "registrations",
                  "label": "Registrations",
                  "icon": "user-check"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /events",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/events"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/events/",
                      "mimeTypes": [
                        "application/vnd.verentis.events.event+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Event"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.status",
                          "label": "Status"
                        },
                        {
                          "key": "data.startsAt",
                          "label": "Starts at"
                        },
                        {
                          "key": "data.capacity",
                          "label": "Capacity"
                        }
                      ],
                      "emptyText": "No events yet. Use New in /events."
                    }
                  }
                ],
                "slot": "events"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /event-registrations",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/event-registrations"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/event-registrations/",
                      "mimeTypes": [
                        "application/vnd.verentis.events.registration+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Registration"
                        },
                        {
                          "key": "data.attendeeName",
                          "label": "Attendee"
                        },
                        {
                          "key": "data.qty",
                          "label": "Seats"
                        },
                        {
                          "key": "data.status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No registrations yet. Use New in /event-registrations."
                    }
                  }
                ],
                "slot": "registrations"
              }
            ]
          }
        ]
      }
    ]
  }
}
