api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: events-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Events containers.
file-access:
  - path: "/events"
    mode: write
    reason: "Create events with the next code"
  - path: "/event-registrations"
    mode: write
    reason: "Create registrations with the next code"
  - path: "/settings/events.json"
    mode: read
    reason: "Default new events to the default venue"
