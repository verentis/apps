api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: events-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Publishing, completing, cancelling, confirming and checking in enforce the transitions and capacity, and update records conditionally.
file-access:
  - path: "/events"
    mode: write
    reason: "Publish, complete and cancel events, and read capacity when confirming"
  - path: "/event-registrations"
    mode: write
    reason: "Confirm, check in and cancel registrations, and sum confirmed quantities"
