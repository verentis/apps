api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: field-service-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Stage transitions are enforced, the materials total is exact and invoices are drafted create-only.
file-access:
  - path: "/field-tasks"
    mode: write
    reason: "Schedule, start, complete and cancel field tasks"
