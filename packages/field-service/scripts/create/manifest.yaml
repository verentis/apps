api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: field-service-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Field Service container.
file-access:
  - path: "/field-tasks"
    mode: write
    reason: "Create field tasks with the next number"
  - path: "/settings/field-service.json"
    mode: read
    reason: "Default new tasks' technician"
