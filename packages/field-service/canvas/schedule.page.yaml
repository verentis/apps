{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "field-service-schedule",
    "name": "Day schedule",
    "description": "Today's tasks per technician.",
    "icon": "calendar"
  },
  "spec": {
    "access": [
      {
        "path": "/field-tasks",
        "reason": "List today's tasks per technician"
      }
    ],
    "data": {
      "tasks": {
        "kind": "folder",
        "path": "/field-tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.field-service.task+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, customer: e.data.customerName || '', address: e.data.address || '', latitude: e.data.latitude || '', longitude: e.data.longitude || '', type: e.data.type || '', stage: e.data.stage || '', technician: e.data.technician || '', date: e.data.scheduledDate || '', window: [e.data.windowStart, e.data.windowEnd].filter(Boolean).join('–'), windowStart: e.data.windowStart || '', hours: e.data.hours || '', today: !!e.data.scheduledDate && e.data.scheduledDate === Date().slice(0, 10) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Field Service",
          "icon": "wrench",
          "active": "schedule.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Today",
              "icon": "layout-dashboard"
            },
            {
              "id": "tasks.page.yaml",
              "label": "All tasks",
              "icon": "kanban",
              "count": "{{ (data.rows || []).filter(r => ['new', 'scheduled', 'on-site'].includes(r.stage)).length }}"
            },
            {
              "id": "schedule.page.yaml",
              "label": "Technicians",
              "icon": "hard-hat"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/field-service/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/field-service.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Day schedule",
              "note": "Today's open tasks, ordered by technician and time window. Click a row to open the task."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "tasks",
              "compact": true,
              "description": "The /field-tasks folder could not be read. Reinstall Field Service to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Tasks today",
                  "value": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On site",
                  "value": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).filter(r => r.stage === 'on-site').length }}",
                  "icon": "map-pin",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Unassigned",
                  "value": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).filter(r => !r.technician).length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Technicians",
                  "value": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).map(r => r.technician || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).length }}",
                  "icon": "users",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Technicians"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).map(r => r.technician || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).sort().map(t => ({ technician: t, tasks: (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).filter(r => (r.technician || 'Unassigned') === t).length, onsite: (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).filter(r => (r.technician || 'Unassigned') === t && r.stage === 'on-site').length })) }}",
                  "columns": [
                    {
                      "key": "technician",
                      "label": "Technician"
                    },
                    {
                      "key": "tasks",
                      "label": "Tasks",
                      "align": "end"
                    },
                    {
                      "key": "onsite",
                      "label": "On site",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No tasks today",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Day list"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.today && ['new', 'scheduled', 'on-site'].includes(r.stage)).sort((a, b) => ((a.technician || '~') + (a.windowStart || '~')) < ((b.technician || '~') + (b.windowStart || '~')) ? -1 : 1).map(r => ({ path: r.path, technician: r.technician || 'Unassigned', window: r.window, code: r.code, customer: r.customer, address: r.address, type: r.type, stage: r.stage })) }}",
                  "columns": [
                    {
                      "key": "technician",
                      "label": "Technician"
                    },
                    {
                      "key": "window",
                      "label": "Window"
                    },
                    {
                      "key": "code",
                      "label": "Task"
                    },
                    {
                      "key": "customer",
                      "label": "Customer"
                    },
                    {
                      "key": "address",
                      "label": "Address"
                    },
                    {
                      "key": "type",
                      "label": "Type"
                    },
                    {
                      "key": "stage",
                      "label": "Stage"
                    }
                  ],
                  "emptyText": "No tasks today",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Open tasks per technician"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => ['new', 'scheduled', 'on-site'].includes(r.stage)).map(r => r.technician || 'Unassigned').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, value: (data.rows || []).filter(r => ['new', 'scheduled', 'on-site'].includes(r.stage)).filter(r => (r.technician || 'Unassigned') === name).length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "hbar",
                  "x": "label",
                  "y": "value",
                  "format": "integer",
                  "sort": "-value"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
