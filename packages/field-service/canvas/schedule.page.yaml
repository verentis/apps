{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "field-service-schedule",
    "name": "Day schedule",
    "description": "Today's tasks per technician.",
    "icon": "calendar"
  },
  "spec": {
    "access": [
      {
        "path": "/field-tasks",
        "reason": "List today's tasks per technician"
      }
    ],
    "data": {
      "tasks": {
        "kind": "folder",
        "path": "/field-tasks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.field-service.task+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.tasks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, customer: e.data.customerName || '', address: e.data.address || '', type: e.data.type || '', stage: e.data.stage || '', technician: e.data.technician || '', date: e.data.scheduledDate || '', window: [e.data.windowStart, e.data.windowEnd].filter(Boolean).join('–'), windowStart: e.data.windowStart || '', hours: e.data.hours || '', today: !!e.data.scheduledDate && e.data.scheduledDate === Date().slice(0, 10) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Day schedule"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Today's open tasks, ordered by technician and time window. Click a row to open the task.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Field Service",
                  "variant": "ghost",
                  "icon": "wrench",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/field-service/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /field-tasks folder could not be read. Reinstall Field Service to recreate it."
            },
            "rules": {
              "visible": "data.$tasks.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$tasks.status === 'loading'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Tasks today",
                  "value": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).length }}",
                  "icon": "calendar",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On site",
                  "value": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).filter(r => r.stage === 'on-site').length }}",
                  "icon": "map-pin",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Unassigned",
                  "value": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).filter(r => !r.technician).length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Technicians",
                  "value": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).map(r => r.technician || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).length }}",
                  "icon": "users",
                  "loading": "{{ data.$tasks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Technicians"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).map(r => r.technician || 'Unassigned').filter((v, i, a) => a.indexOf(v) === i).sort().map(t => ({ technician: t, tasks: (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).filter(r => (r.technician || 'Unassigned') === t).length, onsite: (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).filter(r => (r.technician || 'Unassigned') === t && r.stage === 'on-site').length })) }}",
                  "columns": [
                    {
                      "key": "technician",
                      "label": "Technician"
                    },
                    {
                      "key": "tasks",
                      "label": "Tasks",
                      "align": "end"
                    },
                    {
                      "key": "onsite",
                      "label": "On site",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No tasks today"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Day list"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.today && [\"new\",\"scheduled\",\"on-site\"].includes(r.stage)).sort((a, b) => ((a.technician || '~') + (a.windowStart || '~')) < ((b.technician || '~') + (b.windowStart || '~')) ? -1 : 1).map(r => ({ path: r.path, technician: r.technician || 'Unassigned', window: r.window, code: r.code, customer: r.customer, address: r.address, type: r.type, stage: r.stage })) }}",
                  "columns": [
                    {
                      "key": "technician",
                      "label": "Technician"
                    },
                    {
                      "key": "window",
                      "label": "Window"
                    },
                    {
                      "key": "code",
                      "label": "Task"
                    },
                    {
                      "key": "customer",
                      "label": "Customer"
                    },
                    {
                      "key": "address",
                      "label": "Address"
                    },
                    {
                      "key": "type",
                      "label": "Type"
                    },
                    {
                      "key": "stage",
                      "label": "Stage"
                    }
                  ],
                  "emptyText": "No tasks today",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
