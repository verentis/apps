{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-checks",
    "name": "Quality checks",
    "description": "Every quality check, listed by result.",
    "icon": "clipboard-check"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "List checks by result with their control point titles"
      },
      {
        "path": "/quality-checks",
        "reason": "List checks by result with their control point titles"
      },
      {
        "path": "/quality-alerts",
        "reason": "List checks by result with their control point titles"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Checks by result"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every active quality check, grouped by its result. Click a row to open the check.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Quality",
                  "variant": "ghost",
                  "icon": "badge-check",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/quality/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$points.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$checks.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$alerts.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pending').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pass",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pass').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Fail",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'fail').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "pending",
                  "label": "Pending",
                  "icon": "clipboard-check"
                },
                {
                  "value": "pass",
                  "label": "Pass",
                  "icon": "clipboard-check"
                },
                {
                  "value": "fail",
                  "label": "Fail",
                  "icon": "clipboard-check"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.checkrows || []).filter(r => r.result === 'pending') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Check"
                        },
                        {
                          "key": "point",
                          "label": "Control point"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "reference",
                          "label": "Reference"
                        },
                        {
                          "key": "measuredValue",
                          "label": "Measured",
                          "align": "end"
                        },
                        {
                          "key": "result",
                          "label": "Result"
                        }
                      ],
                      "emptyText": "No pending checks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "pending"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.checkrows || []).filter(r => r.result === 'pass') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Check"
                        },
                        {
                          "key": "point",
                          "label": "Control point"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "reference",
                          "label": "Reference"
                        },
                        {
                          "key": "measuredValue",
                          "label": "Measured",
                          "align": "end"
                        },
                        {
                          "key": "result",
                          "label": "Result"
                        }
                      ],
                      "emptyText": "No pass checks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "pass"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.checkrows || []).filter(r => r.result === 'fail') }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Check"
                        },
                        {
                          "key": "point",
                          "label": "Control point"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "reference",
                          "label": "Reference"
                        },
                        {
                          "key": "measuredValue",
                          "label": "Measured",
                          "align": "end"
                        },
                        {
                          "key": "result",
                          "label": "Result"
                        }
                      ],
                      "emptyText": "No fail checks",
                      "clickable": true
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "fail"
              }
            ]
          }
        ]
      }
    ]
  }
}
