{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-checks",
    "name": "Quality checks",
    "description": "Every quality check, listed by result.",
    "icon": "clipboard-check"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "List checks by result with their control point titles"
      },
      {
        "path": "/quality-checks",
        "reason": "List checks by result with their control point titles"
      },
      {
        "path": "/quality-alerts",
        "reason": "List checks by result with their control point titles"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Quality",
          "icon": "badge-check",
          "active": "checks.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "checks.page.yaml",
              "label": "Checks",
              "icon": "clipboard-check",
              "count": "{{ (data.checkrows || []).filter(c => c.result === 'pending').length }}"
            },
            {
              "id": "alerts.page.yaml",
              "label": "Alerts",
              "icon": "triangle-alert",
              "count": "{{ (data.alertrows || []).filter(a => a.stage !== 'resolved').length }}",
              "tone": "danger"
            },
            {
              "id": "points.page.yaml",
              "label": "Control points",
              "icon": "crosshair"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/quality/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Checks by result",
              "note": "Every active quality check, grouped by its result. Click a row to open the check."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "points",
              "compact": true,
              "description": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "checks",
              "compact": true,
              "description": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "alerts",
              "compact": true,
              "description": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pending').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pass",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pass').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Fail",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'fail').length }}",
                  "icon": "clipboard-check",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.checkrows || []) }}",
                      "groupBy": "result",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "pending",
                          "label": "Pending",
                          "locked": true
                        },
                        {
                          "value": "pass",
                          "label": "Pass"
                        },
                        {
                          "value": "fail",
                          "label": "Fail"
                        }
                      ],
                      "card": {
                        "title": "point",
                        "code": "code",
                        "meta": [
                          "date",
                          "reference",
                          "measuredValue"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"pass\",\"fail\"].includes(row.result)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'pass'",
                            "title": "Move to Pass?",
                            "message": "{{ event.row.code }} moves to Pass. It cannot be moved back from the board.",
                            "confirm-label": "Move to Pass"
                          }
                        },
                        {
                          "confirm": {
                            "if": "event.to === 'fail'",
                            "title": "Move to Fail?",
                            "message": "{{ event.row.code }} moves to Fail. A failed check raises a quality alert.",
                            "confirm-label": "Move to Fail"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'pass'",
                            "file": "/applications/quality/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "record-check",
                              "path": "{{ event.path }}",
                              "result": "pass"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'fail'",
                            "file": "/applications/quality/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "record-check",
                              "path": "{{ event.path }}",
                              "result": "fail"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "points"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "checks"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "alerts"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"pass\",\"fail\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"pending\":\"Pending\",\"pass\":\"Pass\",\"fail\":\"Fail\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.checkrows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Check"
                        },
                        {
                          "key": "point",
                          "label": "Control point"
                        },
                        {
                          "key": "date",
                          "label": "Date"
                        },
                        {
                          "key": "reference",
                          "label": "Reference"
                        },
                        {
                          "key": "measuredValue",
                          "label": "Measured",
                          "align": "end"
                        },
                        {
                          "key": "result",
                          "label": "Result"
                        },
                        {
                          "key": "result",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "pending": "Pending",
                            "pass": "Pass",
                            "fail": "Fail"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "pending",
                          "label": "Pending",
                          "where": "row.result === 'pending'"
                        },
                        {
                          "value": "pass",
                          "label": "Pass",
                          "where": "row.result === 'pass'"
                        },
                        {
                          "value": "fail",
                          "label": "Fail",
                          "where": "row.result === 'fail'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
