{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-alerts",
    "name": "Quality alerts",
    "description": "Every quality alert, boarded by stage.",
    "icon": "siren"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "Board alerts by stage"
      },
      {
        "path": "/quality-checks",
        "reason": "Board alerts by stage"
      },
      {
        "path": "/quality-alerts",
        "reason": "Board alerts by stage; move records between columns",
        "mode": "write"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Quality",
          "icon": "badge-check",
          "active": "alerts.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "checks.page.yaml",
              "label": "Checks",
              "icon": "clipboard-check",
              "count": "{{ (data.checkrows || []).filter(c => c.result === 'pending').length }}"
            },
            {
              "id": "alerts.page.yaml",
              "label": "Alerts",
              "icon": "triangle-alert",
              "count": "{{ (data.alertrows || []).filter(a => a.stage !== 'resolved').length }}",
              "tone": "danger"
            },
            {
              "id": "points.page.yaml",
              "label": "Control points",
              "icon": "crosshair"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/quality/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Alerts by stage",
              "note": "Every active quality alert, grouped by its stage. Click a row to open the alert."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "points",
              "compact": true,
              "description": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "checks",
              "compact": true,
              "description": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "alerts",
              "compact": true,
              "description": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "New",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage === 'new').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Investigation",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage === 'investigation').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Action",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage === 'action').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Resolved",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage === 'resolved').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.tabs",
            "props": {
              "variant": "pill",
              "persist": true,
              "items": [
                {
                  "value": "board",
                  "label": "Board",
                  "icon": "kanban"
                },
                {
                  "value": "list",
                  "label": "List",
                  "icon": "list"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.board",
                    "props": {
                      "rows": "{{ (data.alertrows || []) }}",
                      "groupBy": "stage",
                      "readOnly": false,
                      "rowKey": "path",
                      "columns": [
                        {
                          "value": "new",
                          "label": "New"
                        },
                        {
                          "value": "investigation",
                          "label": "Investigation"
                        },
                        {
                          "value": "action",
                          "label": "Action"
                        },
                        {
                          "value": "resolved",
                          "label": "Resolved"
                        }
                      ],
                      "card": {
                        "title": "title",
                        "code": "code",
                        "meta": [
                          "severity",
                          "stage"
                        ]
                      },
                      "emptyText": "Nothing here",
                      "lockedWhen": "[\"resolved\"].includes(row.stage)"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "move": [
                        {
                          "confirm": {
                            "if": "event.to === 'resolved'",
                            "title": "Move to Resolved?",
                            "message": "{{ event.row.code }} moves to Resolved. It cannot be moved back from the board.",
                            "confirm-label": "Move to Resolved"
                          }
                        },
                        {
                          "run-script": {
                            "if": "event.to === 'resolved'",
                            "file": "/applications/quality/scripts/post",
                            "timeout": 120,
                            "parameters": {
                              "operation": "resolve-alert",
                              "path": "{{ event.path }}"
                            },
                            "assign": "lastmove"
                          }
                        },
                        {
                          "patch-record": {
                            "if": "![\"resolved\"].includes(event.to)",
                            "path": "{{ event.path }}",
                            "values": {
                              "stage": "{{ event.to }}",
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "points"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "checks"
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "alerts"
                          }
                        },
                        {
                          "toast": {
                            "message": "{{ [\"resolved\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"new\":\"New\",\"investigation\":\"Investigation\",\"action\":\"Action\",\"resolved\":\"Resolved\"}[event.to] || event.to) }}",
                            "variant": "success"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "board"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.alertrows || []) }}",
                      "columns": [
                        {
                          "key": "code",
                          "label": "Alert"
                        },
                        {
                          "key": "title",
                          "label": "Title"
                        },
                        {
                          "key": "severity",
                          "label": "Severity"
                        },
                        {
                          "key": "stage",
                          "label": "Stage"
                        },
                        {
                          "key": "stage",
                          "label": "Stage",
                          "format": "badge",
                          "labels": {
                            "new": "New",
                            "investigation": "Investigation",
                            "action": "Action",
                            "resolved": "Resolved"
                          }
                        }
                      ],
                      "views": [
                        {
                          "value": "all",
                          "label": "All"
                        },
                        {
                          "value": "new",
                          "label": "New",
                          "where": "row.stage === 'new'"
                        },
                        {
                          "value": "investigation",
                          "label": "Investigation",
                          "where": "row.stage === 'investigation'"
                        },
                        {
                          "value": "action",
                          "label": "Action",
                          "where": "row.stage === 'action'"
                        },
                        {
                          "value": "resolved",
                          "label": "Resolved",
                          "where": "row.stage === 'resolved'"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "Nothing here"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "list"
              }
            ]
          }
        ]
      }
    ]
  }
}
