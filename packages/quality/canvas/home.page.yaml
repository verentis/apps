{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-home",
    "name": "Quality",
    "description": "Quality overview.",
    "icon": "badge-check"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "Count checks and alerts and show the quality containers"
      },
      {
        "path": "/quality-checks",
        "reason": "Count checks and alerts and show the quality containers"
      },
      {
        "path": "/quality-alerts",
        "reason": "Count checks and alerts and show the quality containers"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      },
      "listqualitychecks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "listqualityalerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "listqualitycontrolpoints": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Quality",
          "icon": "badge-check",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "checks.page.yaml",
              "label": "Checks",
              "icon": "clipboard-check",
              "count": "{{ (data.checkrows || []).filter(c => c.result === 'pending').length }}"
            },
            {
              "id": "alerts.page.yaml",
              "label": "Alerts",
              "icon": "triangle-alert",
              "count": "{{ (data.alertrows || []).filter(a => a.stage !== 'resolved').length }}",
              "tone": "danger"
            },
            {
              "id": "points.page.yaml",
              "label": "Control points",
              "icon": "crosshair"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/quality/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Quality",
              "note": "Control points, checks and alerts are files in your workspace. Draft a check in /quality-checks, record it from its form; failed checks raise alerts."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Checks by result"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ ['pending', 'pass', 'fail'].map(result => ({ label: result, value: (data.checkrows || []).filter(c => c.result === result).length })) }}",
                  "showLegend": true,
                  "emptyText": "No checks yet",
                  "kind": "strip",
                  "x": "label",
                  "y": "value",
                  "labels": {
                    "pending": "Pending",
                    "pass": "Passed",
                    "fail": "Failed"
                  },
                  "palette": {
                    "pending": "muted",
                    "pass": "success",
                    "fail": "danger"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending checks",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pending').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Failed checks",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'fail').length }}",
                  "icon": "x",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open alerts",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage !== 'resolved').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "High severity",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage !== 'resolved' && r.severity === 'high').length }}",
                  "icon": "alert-triangle",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "points",
              "compact": true,
              "description": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "checks",
              "compact": true,
              "description": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "alerts",
              "compact": true,
              "description": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "checks",
                  "label": "Checks",
                  "icon": "clipboard-check"
                },
                {
                  "value": "alerts",
                  "label": "Alerts",
                  "icon": "siren"
                },
                {
                  "value": "points",
                  "label": "Control points",
                  "icon": "crosshair"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-checks",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-checks"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listqualitychecks",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listqualitychecks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Check"
                        },
                        {
                          "key": "data.reference",
                          "label": "Reference"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.result",
                          "label": "Result"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No checks yet. Use New in /quality-checks."
                    },
                    "rules": {
                      "visible": "data.$listqualitychecks.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "checks"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-alerts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-alerts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listqualityalerts",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listqualityalerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Alert"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.severity",
                          "label": "Severity"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.stage"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No alerts yet. Use New in /quality-alerts."
                    },
                    "rules": {
                      "visible": "data.$listqualityalerts.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "alerts"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-control-points",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-control-points"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listqualitycontrolpoints",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listqualitycontrolpoints || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Point"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.checkType",
                          "label": "Type"
                        },
                        {
                          "key": "data.frequency",
                          "label": "Frequency"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No control points yet. Use New in /quality-control-points."
                    },
                    "rules": {
                      "visible": "data.$listqualitycontrolpoints.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "points"
              }
            ]
          }
        ]
      }
    ]
  }
}
