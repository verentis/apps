{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-home",
    "name": "Quality",
    "description": "Quality overview.",
    "icon": "badge-check"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "Count checks and alerts and show the quality containers"
      },
      {
        "path": "/quality-checks",
        "reason": "Count checks and alerts and show the quality containers"
      },
      {
        "path": "/quality-alerts",
        "reason": "Count checks and alerts and show the quality containers"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Quality"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Control points, checks and alerts are files in your workspace. Draft a check in /quality-checks, record it from its form; failed checks raise alerts.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Quality checks",
                      "variant": "outline",
                      "icon": "clipboard-check",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/quality/canvas/checks.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Quality alerts",
                      "variant": "outline",
                      "icon": "siren",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/quality/canvas/alerts.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Control points",
                      "variant": "outline",
                      "icon": "crosshair",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/quality/canvas/points.page.yaml"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pending checks",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'pending').length }}",
                  "icon": "clipboard-list",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Failed checks",
                  "value": "{{ (data.checkrows || []).filter(r => r.result === 'fail').length }}",
                  "icon": "x",
                  "loading": "{{ data.$checks.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Open alerts",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage !== 'resolved').length }}",
                  "icon": "siren",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "High severity",
                  "value": "{{ (data.alertrows || []).filter(r => r.stage !== 'resolved' && r.severity === 'high').length }}",
                  "icon": "alert-triangle",
                  "loading": "{{ data.$alerts.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$points.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$checks.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$alerts.status === 'error'"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "checks",
                  "label": "Checks",
                  "icon": "clipboard-check"
                },
                {
                  "value": "alerts",
                  "label": "Alerts",
                  "icon": "siren"
                },
                {
                  "value": "points",
                  "label": "Control points",
                  "icon": "crosshair"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-checks",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-checks"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/quality-checks/",
                      "mimeTypes": [
                        "application/vnd.verentis.quality.check+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Check"
                        },
                        {
                          "key": "data.reference",
                          "label": "Reference"
                        },
                        {
                          "key": "data.date",
                          "label": "Date"
                        },
                        {
                          "key": "data.result",
                          "label": "Result"
                        }
                      ],
                      "emptyText": "No checks yet. Use New in /quality-checks."
                    }
                  }
                ],
                "slot": "checks"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-alerts",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-alerts"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/quality-alerts/",
                      "mimeTypes": [
                        "application/vnd.verentis.quality.alert+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Alert"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.severity",
                          "label": "Severity"
                        },
                        {
                          "key": "data.stage",
                          "label": "Stage"
                        }
                      ],
                      "emptyText": "No alerts yet. Use New in /quality-alerts."
                    }
                  }
                ],
                "slot": "alerts"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /quality-control-points",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/quality-control-points"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/quality-control-points/",
                      "mimeTypes": [
                        "application/vnd.verentis.quality.point+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Point"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.checkType",
                          "label": "Type"
                        },
                        {
                          "key": "data.frequency",
                          "label": "Frequency"
                        }
                      ],
                      "emptyText": "No control points yet. Use New in /quality-control-points."
                    }
                  }
                ],
                "slot": "points"
              }
            ]
          }
        ]
      }
    ]
  }
}
