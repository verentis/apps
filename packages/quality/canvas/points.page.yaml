{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-points",
    "name": "Control points",
    "description": "The control points checks verify.",
    "icon": "crosshair"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "List control points with their check counts"
      },
      {
        "path": "/quality-checks",
        "reason": "List control points with their check counts"
      },
      {
        "path": "/quality-alerts",
        "reason": "List control points with their check counts"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Control points"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "What is checked, how and how often. Inactive points cannot record checks.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Open /quality-control-points",
                      "variant": "outline",
                      "icon": "folder-open",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/quality-control-points"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Quality",
                      "variant": "ghost",
                      "icon": "badge-check",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/quality/canvas/home.page.yaml"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$points.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$checks.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            },
            "rules": {
              "visible": "data.$alerts.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Control points",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pass Fail",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.checkType === 'pass-fail').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Measure",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.checkType === 'measure').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', reference: e.data.reference || '', checkType: e.data.checkType || '', frequency: e.data.frequency || '', target: e.data.measureTarget || '', active: e.data.active === false ? 'No' : 'Yes', checks: (data.checks || []).filter(c => c.kind === 'file' && c.data && c.data.point === e.path).length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Point"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "reference",
                  "label": "Product / operation"
                },
                {
                  "key": "checkType",
                  "label": "Type"
                },
                {
                  "key": "frequency",
                  "label": "Frequency"
                },
                {
                  "key": "target",
                  "label": "Target",
                  "align": "end"
                },
                {
                  "key": "active",
                  "label": "Active"
                },
                {
                  "key": "checks",
                  "label": "Checks",
                  "align": "end"
                }
              ],
              "emptyText": "No control points yet. Use New in /quality-control-points.",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
