{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "quality-points",
    "name": "Control points",
    "description": "The control points checks verify.",
    "icon": "crosshair"
  },
  "spec": {
    "access": [
      {
        "path": "/quality-control-points",
        "reason": "List control points with their check counts"
      },
      {
        "path": "/quality-checks",
        "reason": "List control points with their check counts"
      },
      {
        "path": "/quality-alerts",
        "reason": "List control points with their check counts"
      }
    ],
    "data": {
      "points": {
        "kind": "folder",
        "path": "/quality-control-points",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.point+json"
      },
      "checks": {
        "kind": "folder",
        "path": "/quality-checks",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.check+json"
      },
      "alerts": {
        "kind": "folder",
        "path": "/quality-alerts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.quality.alert+json"
      },
      "checkrows": {
        "kind": "computed",
        "expr": "(data.checks || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, point: ((((data.points || []).find(p => p.kind === 'file' && p.data && p.path === e.data.point) || {}).data || {}).title) || '', date: e.data.date || '', reference: e.data.reference || '', result: e.data.result || 'pending', measuredValue: e.data.measuredValue || '' }))"
      },
      "alertrows": {
        "kind": "computed",
        "expr": "(data.alerts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', severity: e.data.severity || '', stage: e.data.stage || 'new' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Quality",
          "icon": "badge-check",
          "active": "points.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "checks.page.yaml",
              "label": "Checks",
              "icon": "clipboard-check",
              "count": "{{ (data.checkrows || []).filter(c => c.result === 'pending').length }}"
            },
            {
              "id": "alerts.page.yaml",
              "label": "Alerts",
              "icon": "triangle-alert",
              "count": "{{ (data.alertrows || []).filter(a => a.stage !== 'resolved').length }}",
              "tone": "danger"
            },
            {
              "id": "points.page.yaml",
              "label": "Control points",
              "icon": "crosshair"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/quality/canvas/{{ event.id }}",
                "open": "replace"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Control points",
              "note": "What is checked, how and how often. Inactive points cannot record checks."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /quality-control-points",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/quality-control-points"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Pass rate per control point"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.checkrows || []).filter(c => c.result === 'pass' || c.result === 'fail').map(c => c.point || 'No point').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, pass: (data.checkrows || []).filter(c => c.result === 'pass' || c.result === 'fail').filter(c => (c.point || 'No point') === name && c.result === 'pass').length, fail: (data.checkrows || []).filter(c => c.result === 'pass' || c.result === 'fail').filter(c => (c.point || 'No point') === name && c.result === 'fail').length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "pass",
                    "fail"
                  ],
                  "labels": {
                    "pass": "Passed",
                    "fail": "Failed"
                  },
                  "palette": {
                    "pass": "success",
                    "fail": "danger"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "points",
              "compact": true,
              "description": "The /quality-control-points folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "checks",
              "compact": true,
              "description": "The /quality-checks folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "alerts",
              "compact": true,
              "description": "The /quality-alerts folder could not be read. Reinstall Quality to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Control points",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Pass Fail",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.checkType === 'pass-fail').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Measure",
                  "value": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.checkType === 'measure').length }}",
                  "icon": "crosshair",
                  "loading": "{{ data.$points.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.points || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', reference: e.data.reference || '', checkType: e.data.checkType || '', frequency: e.data.frequency || '', target: e.data.measureTarget || '', active: e.data.active === false ? 'No' : 'Yes', checks: (data.checks || []).filter(c => c.kind === 'file' && c.data && c.data.point === e.path).length })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Point"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "reference",
                  "label": "Product / operation"
                },
                {
                  "key": "checkType",
                  "label": "Type"
                },
                {
                  "key": "frequency",
                  "label": "Frequency"
                },
                {
                  "key": "target",
                  "label": "Target",
                  "align": "end"
                },
                {
                  "key": "active",
                  "label": "Active"
                },
                {
                  "key": "checks",
                  "label": "Checks",
                  "align": "end"
                }
              ],
              "emptyText": "No control points yet. Use New in /quality-control-points.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
