api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: quality-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Quality containers.
file-access:
  - path: "/quality-control-points"
    mode: write
    reason: "Create quality control points with the next code"
  - path: "/quality-checks"
    mode: write
    reason: "Create quality checks with the next code"
  - path: "/quality-alerts"
    mode: write
    reason: "Create quality alerts with the next code"
