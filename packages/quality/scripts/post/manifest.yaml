api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: quality-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Recording validates checks against their control point tolerance and writes checks and alerts conditionally.
file-access:
  - path: "/quality-control-points"
    mode: read
    reason: "Check a recorded result against its control point and tolerance"
  - path: "/quality-checks"
    mode: write
    reason: "Record quality check results"
  - path: "/quality-alerts"
    mode: write
    reason: "Raise a quality alert for a failed check and resolve alerts"
