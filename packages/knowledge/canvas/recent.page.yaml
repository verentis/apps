{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-recent",
    "name": "Recently updated",
    "description": "The most recently updated articles.",
    "icon": "clock"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "List articles by their last update"
      },
      {
        "path": "/articles",
        "reason": "List articles by their last update"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Knowledge",
          "icon": "book-open",
          "active": "recent.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Spaces",
              "icon": "layout-dashboard"
            },
            {
              "id": "spaces.page.yaml",
              "label": "Space tree",
              "icon": "folder-tree"
            },
            {
              "id": "recent.page.yaml",
              "label": "Recent",
              "icon": "history"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/knowledge/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/knowledge.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Recently updated",
              "note": "The 50 most recently updated active articles. Click a row to open the article."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "spaces",
              "compact": true,
              "description": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "articles",
              "compact": true,
              "description": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).sort((a, b) => a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0).slice(0, 50) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Article"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "space",
                  "label": "Space"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "owner",
                  "label": "Owner"
                },
                {
                  "key": "updatedAt",
                  "label": "Updated"
                }
              ],
              "emptyText": "No articles yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
