{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-recent",
    "name": "Recently updated",
    "description": "The most recently updated articles.",
    "icon": "clock"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "List articles by their last update"
      },
      {
        "path": "/articles",
        "reason": "List articles by their last update"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Recently updated"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "The 50 most recently updated active articles. Click a row to open the article.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Knowledge",
                  "variant": "ghost",
                  "icon": "book-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/knowledge/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            },
            "rules": {
              "visible": "data.$spaces.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            },
            "rules": {
              "visible": "data.$articles.status === 'error'"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).sort((a, b) => a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0).slice(0, 50) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Article"
                },
                {
                  "key": "title",
                  "label": "Title"
                },
                {
                  "key": "space",
                  "label": "Space"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "owner",
                  "label": "Owner"
                },
                {
                  "key": "updatedAt",
                  "label": "Updated"
                }
              ],
              "emptyText": "No articles yet",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
