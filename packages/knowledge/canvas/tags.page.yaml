{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-tags",
    "name": "Tags",
    "description": "Articles summarised per tag.",
    "icon": "tags"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "Sum articles per tag"
      },
      {
        "path": "/articles",
        "reason": "Sum articles per tag"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Knowledge",
          "icon": "book-open",
          "active": "tags.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Spaces",
              "icon": "layout-dashboard"
            },
            {
              "id": "spaces.page.yaml",
              "label": "Space tree",
              "icon": "folder-tree"
            },
            {
              "id": "recent.page.yaml",
              "label": "Recent",
              "icon": "history"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/knowledge/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/knowledge.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Tags",
              "note": "Every tag across the active articles, with how many articles carry it by status."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "spaces",
              "compact": true,
              "description": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "articles",
              "compact": true,
              "description": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Tags",
                  "value": "{{ (data.rows || []).reduce((a, r) => a.concat(r.tags), []).filter((v, i, arr) => arr.indexOf(v) === i).length }}",
                  "icon": "tags",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Tagged articles",
                  "value": "{{ (data.rows || []).filter(r => r.tags.length > 0).length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Untagged articles",
                  "value": "{{ (data.rows || []).filter(r => r.tags.length === 0).length }}",
                  "icon": "file-question",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "send",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Articles per tag"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).reduce((a, r) => a.concat(r.tags), []).filter((v, i, arr) => arr.indexOf(v) === i).sort().map(t => ({ tag: t, articles: (data.rows || []).filter(r => r.tags.indexOf(t) >= 0).length, published: (data.rows || []).filter(r => r.tags.indexOf(t) >= 0 && r.status === 'published').length, drafts: (data.rows || []).filter(r => r.tags.indexOf(t) >= 0 && r.status === 'draft').length, archived: (data.rows || []).filter(r => r.tags.indexOf(t) >= 0 && r.status === 'archived').length })) }}",
                  "columns": [
                    {
                      "key": "tag",
                      "label": "Tag"
                    },
                    {
                      "key": "articles",
                      "label": "Articles",
                      "align": "end"
                    },
                    {
                      "key": "published",
                      "label": "Published",
                      "align": "end"
                    },
                    {
                      "key": "drafts",
                      "label": "Drafts",
                      "align": "end"
                    },
                    {
                      "key": "archived",
                      "label": "Archived",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No tags yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
