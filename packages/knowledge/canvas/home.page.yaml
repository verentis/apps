{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-home",
    "name": "Knowledge",
    "description": "Knowledge overview.",
    "icon": "book-open"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "Count articles and show the spaces and articles"
      },
      {
        "path": "/articles",
        "reason": "Count articles and show the spaces and articles"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Knowledge"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Spaces and Markdown articles are files in your workspace. Draft articles in /articles, nest them beneath a parent, then publish, archive and restore them from their forms.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Spaces",
                      "variant": "outline",
                      "icon": "library",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/knowledge/canvas/spaces.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Recently updated",
                      "variant": "outline",
                      "icon": "clock",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/knowledge/canvas/recent.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Tags",
                      "variant": "outline",
                      "icon": "tags",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/knowledge/canvas/tags.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/knowledge.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Articles",
                  "value": "{{ (data.rows || []).filter(r => true).length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "send",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Drafts",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Spaces",
                  "value": "{{ (data.spaces || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "library",
                  "loading": "{{ data.$spaces.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            },
            "rules": {
              "visible": "data.$spaces.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            },
            "rules": {
              "visible": "data.$articles.status === 'error'"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "articles",
                  "label": "Articles",
                  "icon": "file-text"
                },
                {
                  "value": "spaces",
                  "label": "Spaces",
                  "icon": "library"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /articles",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/articles"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/articles/",
                      "mimeTypes": [
                        "application/vnd.verentis.knowledge.article+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Article"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status"
                        },
                        {
                          "key": "data.owner",
                          "label": "Owner"
                        },
                        {
                          "key": "data.updatedAt",
                          "label": "Updated"
                        }
                      ],
                      "emptyText": "No articles yet. Use New in /articles."
                    }
                  }
                ],
                "slot": "articles"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /knowledge-spaces",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/knowledge-spaces"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/knowledge-spaces/",
                      "mimeTypes": [
                        "application/vnd.verentis.knowledge.space+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Space"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.description",
                          "label": "Description"
                        }
                      ],
                      "emptyText": "No spaces yet. Use New in /knowledge-spaces."
                    }
                  }
                ],
                "slot": "spaces"
              }
            ]
          }
        ]
      }
    ]
  }
}
