{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-home",
    "name": "Knowledge",
    "description": "Knowledge overview.",
    "icon": "book-open"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "Count articles and show the spaces and articles"
      },
      {
        "path": "/articles",
        "reason": "Count articles and show the spaces and articles"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      },
      "listarticles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "listknowledgespaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Knowledge",
          "icon": "book-open",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Spaces",
              "icon": "layout-dashboard"
            },
            {
              "id": "spaces.page.yaml",
              "label": "Space tree",
              "icon": "folder-tree"
            },
            {
              "id": "recent.page.yaml",
              "label": "Recent",
              "icon": "history"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/knowledge/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/knowledge.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Knowledge",
              "note": "Spaces and Markdown articles are files in your workspace. Draft articles in /articles, nest them beneath a parent, then publish, archive and restore them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Articles",
                  "value": "{{ (data.rows || []).filter(r => true).length }}",
                  "icon": "file-text",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Published",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'published').length }}",
                  "icon": "send",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Drafts",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'draft').length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$articles.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Spaces",
                  "value": "{{ (data.spaces || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "library",
                  "loading": "{{ data.$spaces.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "spaces",
              "compact": true,
              "description": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "articles",
              "compact": true,
              "description": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "articles",
                  "label": "Articles",
                  "icon": "file-text"
                },
                {
                  "value": "spaces",
                  "label": "Spaces",
                  "icon": "library"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /articles",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/articles"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listarticles",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listarticles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Article"
                        },
                        {
                          "key": "data.title",
                          "label": "Title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        },
                        {
                          "key": "data.owner",
                          "label": "Owner"
                        },
                        {
                          "key": "data.updatedAt",
                          "label": "Updated",
                          "format": "date"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No articles yet. Use New in /articles."
                    },
                    "rules": {
                      "visible": "data.$listarticles.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "articles"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /knowledge-spaces",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/knowledge-spaces"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listknowledgespaces",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listknowledgespaces || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Space"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.description",
                          "label": "Description"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No spaces yet. Use New in /knowledge-spaces."
                    },
                    "rules": {
                      "visible": "data.$listknowledgespaces.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "spaces"
              }
            ]
          }
        ]
      }
    ]
  }
}
