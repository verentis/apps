{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "knowledge-spaces",
    "name": "Spaces",
    "description": "Articles grouped by space, with their hierarchy.",
    "icon": "library"
  },
  "spec": {
    "access": [
      {
        "path": "/knowledge-spaces",
        "reason": "Group articles by space with their parent hierarchy"
      },
      {
        "path": "/articles",
        "reason": "Group articles by space with their parent hierarchy"
      }
    ],
    "data": {
      "articles": {
        "kind": "folder",
        "path": "/articles",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.article+json"
      },
      "spaces": {
        "kind": "folder",
        "path": "/knowledge-spaces",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.knowledge.space+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, title: e.data.title || '', spacePath: e.data.space || '', space: ((((data.spaces || []).find(s => s.kind === 'file' && s.data && s.path === e.data.space) || {}).data || {}).name) || '', parent: e.data.parent || '', parentCode: ((((data.articles || []).find(p => p.kind === 'file' && p.data && p.path === e.data.parent) || {}).data || {}).code) || '', status: e.data.status || '', tags: e.data.tags || [], tagList: (e.data.tags || []).join(', '), owner: e.data.owner || '', updatedAt: e.data.updatedAt || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Knowledge",
          "icon": "book-open",
          "active": "spaces.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Spaces",
              "icon": "layout-dashboard"
            },
            {
              "id": "spaces.page.yaml",
              "label": "Space tree",
              "icon": "folder-tree"
            },
            {
              "id": "recent.page.yaml",
              "label": "Recent",
              "icon": "history"
            },
            {
              "id": "tags.page.yaml",
              "label": "Tags",
              "icon": "tags"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/knowledge/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/knowledge.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Spaces",
              "note": "Every active article grouped by its space. Nested articles are indented beneath their parent. Click a row to open it."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Articles"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Articles nested under their parent article, per space.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.tree",
                "props": {
                  "rows": "{{ (data.articles || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, title: e.data.title || e.data.code, parent: e.data.parent || '', status: e.data.status, space: ((((data.spaces || []).find(s => s.path === e.data.space) || {}).data || {}).name) || 'No space' })) }}",
                  "idKey": "path",
                  "parentKey": "parent",
                  "label": "title",
                  "groupBy": "space",
                  "depth": 1,
                  "badge": {
                    "key": "status",
                    "labels": {
                      "published": "Published",
                      "draft": "Draft",
                      "archived": "Archived"
                    },
                    "tones": {
                      "published": "success",
                      "draft": "neutral",
                      "archived": "warning"
                    }
                  }
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "spaces",
              "compact": true,
              "description": "The /knowledge-spaces folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "articles",
              "compact": true,
              "description": "The /articles folder could not be read. Reinstall Knowledge to recreate it."
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Spaces"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.spaces || []).filter(s => s.kind === 'file' && s.data && s.data.state !== 'archived').map(s => ({ path: s.path, space: s.data.name || s.name, icon: s.data.icon || '', description: s.data.description || '', articles: (data.rows || []).filter(r => r.spacePath === s.path).length, published: (data.rows || []).filter(r => r.spacePath === s.path && r.status === 'published').length, drafts: (data.rows || []).filter(r => r.spacePath === s.path && r.status === 'draft').length })) }}",
                  "columns": [
                    {
                      "key": "space",
                      "label": "Space"
                    },
                    {
                      "key": "icon",
                      "label": "Icon"
                    },
                    {
                      "key": "description",
                      "label": "Description"
                    },
                    {
                      "key": "articles",
                      "label": "Articles",
                      "align": "end"
                    },
                    {
                      "key": "published",
                      "label": "Published",
                      "align": "end"
                    },
                    {
                      "key": "drafts",
                      "label": "Drafts",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No spaces yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Articles by space"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => ({ path: r.path, space: r.space || 'No space', article: (r.parentCode ? '↳ ' : '') + (r.title || r.code), code: r.code, parent: r.parentCode, status: r.status, updatedAt: r.updatedAt, sort: (r.space || '~') + '|' + (r.parentCode ? r.parentCode + '|1|' : '') + r.code })).sort((a, b) => a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0) }}",
                  "columns": [
                    {
                      "key": "space",
                      "label": "Space"
                    },
                    {
                      "key": "article",
                      "label": "Article"
                    },
                    {
                      "key": "code",
                      "label": "Code"
                    },
                    {
                      "key": "parent",
                      "label": "Parent"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    },
                    {
                      "key": "updatedAt",
                      "label": "Updated"
                    }
                  ],
                  "emptyText": "No articles yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Articles per space"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).map(r => r.space || 'No space').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, published: (data.rows || []).filter(r => (r.space || 'No space') === name && r.status === 'published').length, draft: (data.rows || []).filter(r => (r.space || 'No space') === name && r.status === 'draft').length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "published",
                    "draft"
                  ],
                  "labels": {
                    "published": "Published",
                    "draft": "Draft"
                  },
                  "palette": {
                    "published": "success",
                    "draft": "muted"
                  },
                  "format": "integer"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
