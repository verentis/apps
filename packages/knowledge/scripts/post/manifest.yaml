api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: knowledge-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Publishing, archiving and restoring enforce the status transitions and update articles conditionally.
file-access:
  - path: "/articles"
    mode: write
    reason: "Mark articles published, archived or back in draft"
