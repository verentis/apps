api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: knowledge-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Knowledge containers; articles default to the default space.
file-access:
  - path: "/knowledge-spaces"
    mode: write
    reason: "Create spaces with the next code"
  - path: "/articles"
    mode: write
    reason: "Create articles with the next code"
  - path: "/settings/knowledge.json"
    mode: read
    reason: "Default new articles to the default space"
