api-version: verentis.io/v1
kind: Application

metadata:
  id: smart-editor
  name: Smart Editor
  description: Edit and save workspace code and structured text with
    language-aware syntax highlighting.
  icon: ./icons/app.svg
  version: 0.1.50
  author: Verentis
  labels:
    category: editor
    builtin: "true"

marketplace:
  logo: ./marketplace/logo.svg
  hero:
    source: ./marketplace/smart-editor-hero.svg
    alt: "Subdued fine angled linework on a tonal background, with a quiet centre
      for the marketplace title, details and install controls."
  images:
    - source: ./marketplace/smart-editor.svg
      alt: "Workflow illustration: edit a synthetic YAML plan and save it to the
        workspace; running code is a separate action requiring an engine."
      caption: "Workflow illustration: edit a synthetic YAML plan and save it to the
        workspace; running code is a separate action requiring an engine."
  readme: ./marketplace/README.md
  changelog: ./CHANGELOG.md

spec:
  # `entry` (the iframe URL) is per-environment — see environments/{local,production}.yaml,
  # merged onto this base by `verentis pack . --env <env>`.
  scope: global

  mime-types:
    # Exact matches (higher priority)
    - pattern: application/json
      mode: edit
      priority: 200
    - pattern: application/jsonl
      mode: edit
      priority: 200
    - pattern: application/x-ndjson
      mode: edit
      priority: 200
    - pattern: application/x-jsonlines
      mode: edit
      priority: 200
    - pattern: application/xml
      mode: edit
      priority: 200
    - pattern: application/yaml
      mode: edit
      priority: 200
    - pattern: application/javascript
      mode: edit
      priority: 200
    - pattern: application/typescript
      mode: edit
      priority: 200

    # Wildcard for all text types (lower priority)
    - pattern: "text/*"
      mode: edit
      priority: 100

  capabilities:
    - file:read
    - file:write

  permissions:
    - file.read
    - file.write

  sandbox:
    allow-scripts: true
    allow-same-origin: true
    allow-popups: false
    allow-forms: true

  oauth:
    client-type: public
    # `redirect-uris` are per-environment — see environments/{local,production}.yaml.

  scopes:
    - smart-editor.document.export
    - smart-editor.settings.manage

# Marketplace packaging (`verentis pack`): a hosted iframe app keyed on intrinsic MIME types
# (application/json, text/*, ...) installs only its manifest node — no companion files to bundle.
packaging:
  publisher: verentis
  encryption: none
