api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: purchase-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Purchase containers.
file-access:
  - path: "/vendors"
    mode: write
    reason: "Create vendors with the next number"
  - path: "/purchase-orders"
    mode: write
    reason: "Create purchase orders with the next number"
  - path: "/settings/purchase.json"
    mode: read
    reason: "Default new purchase orders' dates, currency and notes"
