api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: purchase-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Confirming validates lines and the vendor and computes the total; receiving marks receipt and drafts a vendor bill create-only when Invoicing is installed.
file-access:
  - path: "/vendors"
    mode: read
    reason: "Check the vendor a confirmed order buys from"
  - path: "/purchase-orders"
    mode: write
    reason: "Mark purchase orders confirmed or received"
  - path: "/invoices"
    mode: write
    reason: "Draft a vendor bill for a received order when Invoicing is installed"
