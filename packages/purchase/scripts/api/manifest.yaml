api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: purchase-api
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. The operations other apps call through the platform (api.yaml); drafts are written create-only.
file-access:
  - path: "/purchase-orders"
    mode: write
    reason: "Draft purchase orders other apps ask for (a reorder), with the next number"
