{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "purchase-vendors",
    "name": "Vendors",
    "description": "The vendors you buy from.",
    "icon": "building-2"
  },
  "spec": {
    "access": [
      {
        "path": "/vendors",
        "reason": "List vendors"
      }
    ],
    "data": {
      "vendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      },
      "vendoroptions": {
        "kind": "computed",
        "expr": "(data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Purchase",
          "icon": "shopping-cart",
          "active": "vendors.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "vendors.page.yaml",
              "label": "Vendors",
              "icon": "store"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/purchase/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/purchase.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Vendors",
              "note": "Who you buy from, with their contact details and payment terms."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /vendors",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/vendors"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "vendors",
              "compact": true
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', contact: e.data.contactName || '', email: e.data.email || '', phone: e.data.phone || '', terms: e.data.paymentTermsDays })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Vendor"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "contact",
                  "label": "Contact"
                },
                {
                  "key": "email",
                  "label": "Email"
                },
                {
                  "key": "phone",
                  "label": "Phone"
                },
                {
                  "key": "terms",
                  "label": "Terms (days)",
                  "align": "end"
                }
              ],
              "emptyText": "No vendors yet. Use New in /vendors.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
