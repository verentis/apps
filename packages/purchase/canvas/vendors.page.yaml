{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "purchase-vendors",
    "name": "Vendors",
    "description": "The vendors you buy from.",
    "icon": "building-2"
  },
  "spec": {
    "access": [
      {
        "path": "/vendors",
        "reason": "List vendors"
      }
    ],
    "data": {
      "vendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      },
      "vendoroptions": {
        "kind": "computed",
        "expr": "(data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Vendors"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Who you buy from, with their contact details and payment terms.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Open /vendors",
                      "variant": "outline",
                      "icon": "folder-open",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/vendors"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Purchase",
                      "variant": "ghost",
                      "icon": "shopping-cart",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/purchase/canvas/home.page.yaml"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "{{ data.$vendors.error }}"
            },
            "rules": {
              "visible": "data.$vendors.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Loading…",
              "tone": "muted"
            },
            "rules": {
              "visible": "data.$vendors.status === 'loading'"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', contact: e.data.contactName || '', email: e.data.email || '', phone: e.data.phone || '', terms: e.data.paymentTermsDays })) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Vendor"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "contact",
                  "label": "Contact"
                },
                {
                  "key": "email",
                  "label": "Email"
                },
                {
                  "key": "phone",
                  "label": "Phone"
                },
                {
                  "key": "terms",
                  "label": "Terms (days)",
                  "align": "end"
                }
              ],
              "emptyText": "No vendors yet. Use New in /vendors.",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
