{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "purchase-orders",
    "name": "Purchase orders",
    "description": "Purchase orders by status.",
    "icon": "shopping-cart"
  },
  "spec": {
    "access": [
      {
        "path": "/purchase-orders",
        "reason": "List purchase orders"
      }
    ],
    "data": {
      "orders": {
        "kind": "folder",
        "path": "/purchase-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.order+json"
      },
      "orderrows": {
        "kind": "computed",
        "expr": "(data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, vendorName: e.data.vendorName || '', reference: e.data.reference || '', orderDate: e.data.orderDate || '', expectedDate: e.data.expectedDate || '', status: e.data.status || 'draft', total: e.data.total ? [e.data.currency, e.data.total].filter(Boolean).join(' ') : '', open: e.data.status === 'confirmed', units: Math.round(Number(e.data.total || 0) * 10000) }))"
      }
    },
    "state": {
      "showclosed": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Purchase",
          "icon": "shopping-cart",
          "active": "orders.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "vendors.page.yaml",
              "label": "Vendors",
              "icon": "store"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban",
              "count": "{{ (data.orderrows || []).filter(o => o.status === 'confirmed').length }}"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/purchase/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/purchase.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Purchase orders",
              "note": "RFQs and purchase orders. Confirmed orders are locked until they are received."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /purchase-orders",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/purchase-orders"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.board",
            "props": {
              "rows": "{{ (data.orderrows || []).filter(o => o.status !== 'cancelled') }}",
              "groupBy": "status",
              "columns": [
                {
                  "value": "draft",
                  "label": "Draft",
                  "locked": true
                },
                {
                  "value": "sent",
                  "label": "Sent",
                  "locked": true
                },
                {
                  "value": "confirmed",
                  "label": "Confirmed"
                },
                {
                  "value": "received",
                  "label": "Received"
                }
              ],
              "card": {
                "title": "vendorName",
                "code": "code",
                "meta": [
                  "reference",
                  "expectedDate"
                ],
                "trailing": "total"
              },
              "readOnly": false,
              "rowKey": "path",
              "emptyText": "Nothing here",
              "lockedWhen": "[\"received\"].includes(row.status)"
            },
            "on": {
              "open": [
                {
                  "open-file": {
                    "path": "{{ event.row.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ],
              "move": [
                {
                  "confirm": {
                    "if": "event.to === 'received'",
                    "title": "Move to Received?",
                    "message": "{{ event.row.code }} moves to Received. Every line is received in full.",
                    "confirm-label": "Move to Received"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'confirmed'",
                    "file": "/applications/purchase/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "confirm-order",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "run-script": {
                    "if": "event.to === 'received'",
                    "file": "/applications/purchase/scripts/post",
                    "timeout": 120,
                    "parameters": {
                      "operation": "receive-order",
                      "path": "{{ event.path }}"
                    },
                    "assign": "lastmove"
                  }
                },
                {
                  "refresh-source": {
                    "source": "orders"
                  }
                },
                {
                  "toast": {
                    "message": "{{ [\"confirmed\",\"received\"].includes(event.to) ? ((state.lastmove && state.lastmove.message) || 'Done') : 'Moved to ' + ({\"draft\":\"Draft\",\"sent\":\"Sent\",\"confirmed\":\"Confirmed\",\"received\":\"Received\"}[event.to] || event.to) }}",
                    "variant": "success"
                  }
                }
              ]
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Sent",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'sent')).length }}",
                  "icon": "send",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting receipt",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "package",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On order",
                  "value": "{{ ((data.orderrows || []).filter(r => r.open).reduce((s, r) => s + r.units, 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show received and cancelled orders",
              "value": "{{ state.showclosed }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.orderrows || []).filter(r => state.showclosed || (r.status !== 'received' && r.status !== 'cancelled')) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Order"
                },
                {
                  "key": "vendorName",
                  "label": "Vendor"
                },
                {
                  "key": "reference",
                  "label": "Reference"
                },
                {
                  "key": "orderDate",
                  "label": "Ordered"
                },
                {
                  "key": "expectedDate",
                  "label": "Expected"
                },
                {
                  "key": "total",
                  "label": "Total",
                  "align": "end"
                },
                {
                  "key": "status",
                  "label": "Status"
                }
              ],
              "emptyText": "No open purchase orders",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
