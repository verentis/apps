{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "purchase-settings",
    "name": "Purchase settings",
    "description": "Edit the Purchase settings file.",
    "icon": "settings"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.purchase.settings+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/purchase/v1/settings.schema.json",
          "source": "/applications/purchase/schemas/settings.schema.json",
          "title": "Purchase settings",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fpurchase%2Fcanvas%2Fsettings.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.purchase.settings+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/purchase/v1/settings.schema.json",
          "source": "/applications/purchase/schemas/settings.schema.json",
          "title": "Purchase settings",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/applications/purchase/",
        "mode": "read",
        "reason": "Read the Purchase schemas and run the order script"
      }
    ],
    "access": [
      {
        "path": "/applications/purchase/",
        "reason": "Read the Purchase schemas and run the order script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Purchase settings",
              "note": "Defaults new purchase orders start with. Number prefixes are app settings, managed with the installed app."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Reset",
                  "variant": "ghost",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "reset-form": {}
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Save",
                  "icon": "save",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "save": {}
                    },
                    {
                      "toast": {
                        "message": "Saved",
                        "variant": "success"
                      }
                    }
                  ]
                },
                "rules": {
                  "disabled": "form.saving || !form.dirty || form.invalid"
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 1
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Defaults",
                  "description": "Values new purchase orders start with. Number prefixes are app settings, managed with the installed app."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Default currency",
                          "value": "{{ form.values.defaultCurrency }}",
                          "placeholder": "ZAR"
                        }
                      },
                      {
                        "type": "canvas.form.number",
                        "props": {
                          "label": "Expected lead time (days)",
                          "value": "{{ form.values.defaultLeadDays }}",
                          "required": true,
                          "min": 0,
                          "max": 365,
                          "step": 1
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Order notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {}
  }
}
