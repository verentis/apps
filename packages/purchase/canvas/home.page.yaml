{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "purchase-home",
    "name": "Purchase",
    "description": "Purchases summary.",
    "icon": "shopping-cart"
  },
  "spec": {
    "access": [
      {
        "path": "/vendors",
        "reason": "List vendors"
      },
      {
        "path": "/purchase-orders",
        "reason": "List purchase orders"
      }
    ],
    "data": {
      "vendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      },
      "vendoroptions": {
        "kind": "computed",
        "expr": "(data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "orders": {
        "kind": "folder",
        "path": "/purchase-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.order+json"
      },
      "orderrows": {
        "kind": "computed",
        "expr": "(data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, vendorName: e.data.vendorName || '', reference: e.data.reference || '', orderDate: e.data.orderDate || '', expectedDate: e.data.expectedDate || '', status: e.data.status || 'draft', total: e.data.total ? [e.data.currency, e.data.total].filter(Boolean).join(' ') : '', open: e.data.status === 'confirmed', units: Math.round(Number(e.data.total || 0) * 10000) }))"
      },
      "listpurchaseorders": {
        "kind": "folder",
        "path": "/purchase-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.order+json"
      },
      "listvendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Purchase",
          "icon": "shopping-cart",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "vendors.page.yaml",
              "label": "Vendors",
              "icon": "store"
            },
            {
              "id": "orders.page.yaml",
              "label": "Orders",
              "icon": "kanban",
              "count": "{{ (data.orderrows || []).filter(o => o.status === 'confirmed').length }}"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/purchase/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/purchase.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Purchase",
              "note": "Vendors and purchase orders are files in your workspace. Draft an order in its folder, send it to the vendor, then confirm and receive it from its form."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Expected deliveries"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Sent and confirmed orders by the date they are expected.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.time-strip",
                "props": {
                  "rows": "{{ (data.orderrows || []).filter(o => ['sent', 'confirmed'].includes(o.status) && !!o.expectedDate).map(o => ({ path: o.path, title: [o.code, o.vendorName].filter(part => part).join(' · '), at: o.expectedDate })) }}",
                  "emptyText": "Nothing due",
                  "at": "at",
                  "title": "title",
                  "window": {
                    "from": "-7d",
                    "to": "21d"
                  },
                  "soon": "3d"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Vendors",
                  "value": "{{ (data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "building-2",
                  "loading": "{{ data.$vendors.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft orders",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting receipt",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "package",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On order",
                  "value": "{{ ((data.orderrows || []).filter(r => r.open).reduce((s, r) => s + r.units, 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "vendors",
              "compact": true,
              "description": "The /vendors folder could not be read. Reinstall Purchase to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "orders",
              "compact": true,
              "description": "The /purchase-orders folder could not be read. Reinstall Purchase to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "orders",
                  "label": "Purchase orders",
                  "icon": "shopping-cart"
                },
                {
                  "value": "vendors",
                  "label": "Vendors",
                  "icon": "building-2"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /purchase-orders",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/purchase-orders"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listpurchaseorders",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listpurchaseorders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.vendorName",
                          "label": "Vendor"
                        },
                        {
                          "key": "data.orderDate",
                          "label": "Ordered",
                          "format": "date"
                        },
                        {
                          "key": "data.expectedDate",
                          "label": "Expected",
                          "format": "date"
                        },
                        {
                          "key": "data.total",
                          "label": "Total"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No purchase orders yet. Use New in /purchase-orders."
                    },
                    "rules": {
                      "visible": "data.$listpurchaseorders.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "orders"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /vendors",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/vendors"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listvendors",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listvendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Number"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.contactName",
                          "label": "Contact"
                        },
                        {
                          "key": "data.email",
                          "label": "Email"
                        },
                        {
                          "key": "data.paymentTermsDays",
                          "label": "Terms (days)"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No vendors yet. Use New in /vendors."
                    },
                    "rules": {
                      "visible": "data.$listvendors.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "vendors"
              }
            ]
          }
        ]
      }
    ]
  }
}
