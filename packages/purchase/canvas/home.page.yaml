{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "purchase-home",
    "name": "Purchase",
    "description": "Purchases summary.",
    "icon": "shopping-cart"
  },
  "spec": {
    "access": [
      {
        "path": "/vendors",
        "reason": "List vendors"
      },
      {
        "path": "/purchase-orders",
        "reason": "List purchase orders"
      }
    ],
    "data": {
      "vendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      },
      "vendoroptions": {
        "kind": "computed",
        "expr": "(data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "orders": {
        "kind": "folder",
        "path": "/purchase-orders",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.order+json"
      },
      "orderrows": {
        "kind": "computed",
        "expr": "(data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, vendorName: e.data.vendorName || '', reference: e.data.reference || '', orderDate: e.data.orderDate || '', expectedDate: e.data.expectedDate || '', status: e.data.status || 'draft', total: e.data.total ? [e.data.currency, e.data.total].filter(Boolean).join(' ') : '', open: e.data.status === 'confirmed', units: Math.round(Number(e.data.total || 0) * 10000) }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Purchase"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Vendors and purchase orders are files in your workspace. Draft an order in its folder, send it to the vendor, then confirm and receive it from its form.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Vendors",
                      "variant": "outline",
                      "icon": "building-2",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/purchase/canvas/vendors.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Purchase orders",
                      "variant": "outline",
                      "icon": "shopping-cart",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/purchase/canvas/orders.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/purchase.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Vendors",
                  "value": "{{ (data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "building-2",
                  "loading": "{{ data.$vendors.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Draft orders",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && ((e.data.status || 'draft') === 'draft')).length }}",
                  "icon": "file-pen",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting receipt",
                  "value": "{{ (data.orders || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'confirmed')).length }}",
                  "icon": "package",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On order",
                  "value": "{{ ((data.orderrows || []).filter(r => r.open).reduce((s, r) => s + r.units, 0) / 10000).toFixed(2) }}",
                  "icon": "receipt",
                  "loading": "{{ data.$orders.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /vendors folder could not be read. Reinstall Purchase to recreate it."
            },
            "rules": {
              "visible": "data.$vendors.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /purchase-orders folder could not be read. Reinstall Purchase to recreate it."
            },
            "rules": {
              "visible": "data.$orders.status === 'error'"
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "orders",
                  "label": "Purchase orders",
                  "icon": "shopping-cart"
                },
                {
                  "value": "vendors",
                  "label": "Vendors",
                  "icon": "building-2"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /purchase-orders",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/purchase-orders"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/purchase-orders/",
                      "mimeTypes": [
                        "application/vnd.verentis.purchase.order+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Number"
                        },
                        {
                          "key": "data.vendorName",
                          "label": "Vendor"
                        },
                        {
                          "key": "data.orderDate",
                          "label": "Ordered"
                        },
                        {
                          "key": "data.expectedDate",
                          "label": "Expected"
                        },
                        {
                          "key": "data.total",
                          "label": "Total",
                          "align": "end"
                        },
                        {
                          "key": "data.status",
                          "label": "Status"
                        }
                      ],
                      "emptyText": "No purchase orders yet. Use New in /purchase-orders."
                    }
                  }
                ],
                "slot": "orders"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /vendors",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/vendors"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.files",
                    "props": {
                      "path": "/vendors/",
                      "mimeTypes": [
                        "application/vnd.verentis.purchase.vendor+json"
                      ],
                      "showFolders": false,
                      "navigable": false,
                      "columns": [
                        {
                          "key": "name",
                          "label": "Number"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.contactName",
                          "label": "Contact"
                        },
                        {
                          "key": "data.email",
                          "label": "Email"
                        },
                        {
                          "key": "data.paymentTermsDays",
                          "label": "Terms (days)",
                          "align": "end"
                        }
                      ],
                      "emptyText": "No vendors yet. Use New in /vendors."
                    }
                  }
                ],
                "slot": "vendors"
              }
            ]
          }
        ]
      }
    ]
  }
}
