{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "purchase-order",
    "name": "Purchase purchase order",
    "description": "View and edit a Purchase purchase order.",
    "icon": "shopping-cart"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.purchase.order+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/purchase/v1/order.schema.json",
          "source": "/applications/purchase/schemas/order.schema.json",
          "title": "Purchase purchase order",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Fpurchase%2Fcanvas%2Forder.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.purchase.order+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/purchase/v1/order.schema.json",
          "source": "/applications/purchase/schemas/order.schema.json",
          "title": "Purchase purchase order",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/vendors",
        "mode": "read",
        "reason": "Choose the vendor to buy from"
      },
      {
        "path": "/applications/purchase/",
        "mode": "read",
        "reason": "Read the Purchase schemas and run the order script"
      }
    ],
    "access": [
      {
        "path": "/vendors",
        "reason": "Choose the vendor to buy from"
      },
      {
        "path": "/applications/purchase/",
        "reason": "Read the Purchase schemas and run the order script"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "vendors": {
        "kind": "folder",
        "path": "/vendors",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.purchase.vendor+json"
      },
      "vendoroptions": {
        "kind": "computed",
        "expr": "(data.vendors || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "appops": {
        "kind": "app-operations"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.vendorName || 'New purchase order' }}",
              "note": "Purchase order {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"confirmed\",\"received\"].includes(form.values.status) ? 'success' : [\"draft\",\"sent\"].includes(form.values.status) ? 'warning' : [\"cancelled\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Mark sent",
                  "variant": "outline",
                  "icon": "send",
                  "size": "sm"
                },
                "on": {
                  "click": "mark-sent"
                },
                "rules": {
                  "visible": "form.values.status === 'draft' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Confirm",
                  "icon": "check",
                  "size": "sm"
                },
                "on": {
                  "click": "confirm"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty || form.invalid"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Receive",
                  "icon": "package-check",
                  "size": "sm"
                },
                "on": {
                  "click": "receive"
                },
                "rules": {
                  "visible": "form.values.status === 'confirmed'",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Cancel order",
                  "variant": "ghost",
                  "icon": "x",
                  "size": "sm"
                },
                "on": {
                  "click": "cancel"
                },
                "rules": {
                  "visible": "(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent') && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Draft vendor bill",
                  "variant": "outline",
                  "icon": "file-text",
                  "size": "sm"
                },
                "on": {
                  "click": "draft-bill"
                },
                "rules": {
                  "visible": "form.values.status === 'received' && !(form.values.bill && form.values.bill.path) && (data.appops || []).some(o => o.app === 'invoicing' && o.operation === 'create-draft-invoice' && o.available)",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent'))",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent'))"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This purchase order is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center"
              }
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Vendor",
                  "variant": "ghost",
                  "icon": "building-2",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.vendor }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.vendor)"
                }
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Vendor bill",
                  "variant": "ghost",
                  "icon": "file-text",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ form.values.bill && form.values.bill.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                },
                "rules": {
                  "visible": "!!(form.values.bill && form.values.bill.path)"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Lines",
                  "value": "{{ (form.values.lines || []).length }}",
                  "icon": "list"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Expected",
                  "value": "{{ form.values.expectedDate || '—' }}",
                  "icon": "calendar"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Total {{ form.values.currency }}",
                  "value": "{{ form.values.total || ((form.values.lines || []).reduce((s, l) => s + Math.round(Number(l.quantity || 0) * Math.round(Number(l.unitPrice || 0) * 100)), 0) / 100).toFixed(2) }}",
                  "icon": "receipt"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "Estimated while drafting; confirming computes the exact total.",
              "tone": "muted"
            },
            "rules": {
              "visible": "!form.values.total"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Receive goods",
              "description": "Count what arrived against what was ordered. Lines left uncounted are taken as received in full."
            },
            "children": [
              {
                "type": "canvas.repeat",
                "props": {
                  "items": "{{ form.values.lines || [] }}",
                  "layout": "list",
                  "emptyText": "No lines"
                },
                "children": [
                  {
                    "type": "canvas.form.counter",
                    "props": {
                      "label": "{{ item.description || 'Line ' + (index + 1) }}",
                      "value": "{{ Number(item.received || 0) }}",
                      "target": "{{ Number(item.quantity || 0) }}",
                      "min": 0
                    },
                    "on": {
                      "update": [
                        {
                          "patch-record": {
                            "path": "{{ ctx.file.path }}",
                            "values": {
                              "lines": {
                                "$expr": "(form.values.lines || []).map((line, position) => position === index ? withPath(line, 'received', String(event)) : line)"
                              },
                              "updatedAt": "{{ Date() }}"
                            }
                          }
                        },
                        {
                          "refresh-source": {
                            "source": "record"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ],
            "rules": {
              "visible": "form.values.status === 'confirmed' && !form.dirty"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Vendor"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Vendor",
                          "value": "{{ form.values.vendor }}",
                          "required": true,
                          "description": "Confirming snapshots the vendor's name onto the order.",
                          "options": "{{ data.vendoroptions }}",
                          "searchable": true
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Vendor reference",
                          "value": "{{ form.values.reference }}",
                          "placeholder": "Quote number"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Order"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Order date",
                          "value": "{{ form.values.orderDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Expected date",
                          "value": "{{ form.values.expectedDate }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Currency",
                          "value": "{{ form.values.currency }}",
                          "required": true,
                          "placeholder": "ZAR"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      },
                      {
                        "type": "canvas.form.textarea",
                        "props": {
                          "label": "Notes",
                          "value": "{{ form.values.notes }}",
                          "rows": 4
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Lines",
                  "description": "Exact decimals. Confirming rounds each line to the cent and computes the total."
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.line-items",
                        "props": {
                          "label": "Lines",
                          "value": "{{ form.values.lines }}",
                          "columns": [
                            {
                              "key": "description",
                              "label": "Description",
                              "type": "text"
                            },
                            {
                              "key": "quantity",
                              "label": "Quantity",
                              "type": "text",
                              "align": "right",
                              "sum": true
                            },
                            {
                              "key": "unitPrice",
                              "label": "Unit price",
                              "type": "text",
                              "align": "right"
                            },
                            {
                              "key": "lineTotal",
                              "label": "Line total",
                              "type": "computed",
                              "expr": "Number(row.quantity || 0) * Number(row.unitPrice || 0)",
                              "decimals": 2,
                              "sum": true,
                              "align": "right"
                            }
                          ],
                          "defaultRow": {
                            "description": "",
                            "quantity": "1",
                            "unitPrice": ""
                          },
                          "storeComputed": false,
                          "minimum": 1,
                          "maximum": 500,
                          "addLabel": "Add line"
                        },
                        "layout": {
                          "tablet": {
                            "colSpan": 2
                          }
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (!(!form.values.status || form.values.status === 'draft' || form.values.status === 'sent')))"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "mark-sent": {
        "steps": [
          {
            "confirm": {
              "title": "Mark sent",
              "message": "Mark this purchase order as sent to the vendor? It stays editable until it is confirmed."
            }
          },
          {
            "patch-form": {
              "values": {
                "status": "sent",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Marked sent",
              "variant": "success"
            }
          }
        ]
      },
      "confirm": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Confirm order",
              "message": "Confirm this purchase order with its vendor? Confirmed orders cannot be edited, only received or archived."
            }
          },
          {
            "run-script": {
              "file": "/applications/purchase/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "confirm-order",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "receive": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Receive order",
              "message": "Mark this purchase order as received? When Invoicing is installed, it drafts the vendor bill."
            }
          },
          {
            "run-script": {
              "file": "/applications/purchase/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "receive-order",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "draft-bill": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "run-script": {
              "file": "/applications/purchase/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "receive-order",
                "path": "{{ ctx.file.path }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      },
      "cancel": {
        "steps": [
          {
            "confirm": {
              "title": "Cancel order",
              "message": "Cancel this purchase order? Cancelled orders cannot be confirmed or received."
            }
          },
          {
            "patch-form": {
              "values": {
                "status": "cancelled",
                "cancelledAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Cancelled",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
