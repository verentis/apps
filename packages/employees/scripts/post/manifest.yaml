api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: employees-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Terminating enforces the status transition and updates employees conditionally.
file-access:
  - path: "/employees"
    mode: write
    reason: "Mark active employees terminated with their termination date"
