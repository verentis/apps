api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: employees-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Employees containers.
file-access:
  - path: "/departments"
    mode: write
    reason: "Create departments with the next code"
  - path: "/employees"
    mode: write
    reason: "Create employees with the next code"
  - path: "/settings/employees.json"
    mode: read
    reason: "Default new employees to the default department"
