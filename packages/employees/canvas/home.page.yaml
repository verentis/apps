{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "employees-home",
    "name": "Employees",
    "description": "Employees overview.",
    "icon": "user-round"
  },
  "spec": {
    "access": [
      {
        "path": "/departments",
        "reason": "Count employees and show the departments and the directory"
      },
      {
        "path": "/employees",
        "reason": "Count employees and show the departments and the directory"
      }
    ],
    "data": {
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobTitle: e.data.jobTitle || '', departmentPath: e.data.department || '', department: ((((data.departments || []).find(d => d.kind === 'file' && d.data && d.path === e.data.department) || {}).data || {}).name) || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === e.data.manager) || {}).data || {}).name) || '', startDate: e.data.startDate || '', status: e.data.status || 'active', terminationDate: e.data.terminationDate || '' }))"
      },
      "listemployees": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "listdepartments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Employees",
          "icon": "user-round",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "directory.page.yaml",
              "label": "Directory",
              "icon": "users"
            },
            {
              "id": "departments.page.yaml",
              "label": "Departments",
              "icon": "network"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/employees/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/employees.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Employees",
              "note": "Departments and employees are files in your workspace. Keep the directory in /employees, organize it by department, and terminate employees from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Headcount by department"
                }
              },
              {
                "type": "canvas.chart",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => r.status !== 'terminated').map(r => r.department || 'No department').filter((name, index, all) => all.indexOf(name) === index).map(name => ({ label: name, active: (data.rows || []).filter(r => r.status !== 'terminated').filter(r => (r.department || 'No department') === name && r.status === 'active').length, leave: (data.rows || []).filter(r => r.status !== 'terminated').filter(r => (r.department || 'No department') === name && r.status === 'on-leave').length })) }}",
                  "showLegend": true,
                  "emptyText": "Nothing to chart yet",
                  "kind": "stacked-hbar",
                  "x": "label",
                  "y": [
                    "active",
                    "leave"
                  ],
                  "labels": {
                    "active": "Active",
                    "leave": "On leave"
                  },
                  "palette": {
                    "active": "chart-1",
                    "leave": "warning"
                  },
                  "format": "integer"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'active').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On leave",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'on-leave').length }}",
                  "icon": "plane",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Terminated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'terminated').length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Departments",
                  "value": "{{ (data.departments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "building-2",
                  "loading": "{{ data.$departments.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "departments",
              "compact": true,
              "description": "The /departments folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "staff",
              "compact": true,
              "description": "The /employees folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "employees",
                  "label": "Employees",
                  "icon": "user-round"
                },
                {
                  "value": "departments",
                  "label": "Departments",
                  "icon": "building-2"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /employees",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/employees"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listemployees",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listemployees || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Employee"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.jobTitle",
                          "label": "Job title"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        },
                        {
                          "key": "data.startDate",
                          "label": "Start date",
                          "format": "date"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No employees yet. Use New in /employees."
                    },
                    "rules": {
                      "visible": "data.$listemployees.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "employees"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /departments",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/departments"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listdepartments",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listdepartments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Department"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No departments yet. Use New in /departments."
                    },
                    "rules": {
                      "visible": "data.$listdepartments.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "departments"
              }
            ]
          }
        ]
      }
    ]
  }
}
