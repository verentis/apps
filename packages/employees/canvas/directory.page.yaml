{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "employees-directory",
    "name": "Directory",
    "description": "The employee directory.",
    "icon": "users"
  },
  "spec": {
    "access": [
      {
        "path": "/departments",
        "reason": "List employees with their departments and managers"
      },
      {
        "path": "/employees",
        "reason": "List employees with their departments and managers"
      }
    ],
    "data": {
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobTitle: e.data.jobTitle || '', departmentPath: e.data.department || '', department: ((((data.departments || []).find(d => d.kind === 'file' && d.data && d.path === e.data.department) || {}).data || {}).name) || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === e.data.manager) || {}).data || {}).name) || '', startDate: e.data.startDate || '', status: e.data.status || 'active', terminationDate: e.data.terminationDate || '' }))"
      }
    },
    "state": {
      "showterminated": false
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Employees",
          "icon": "user-round",
          "active": "directory.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "directory.page.yaml",
              "label": "Directory",
              "icon": "users"
            },
            {
              "id": "departments.page.yaml",
              "label": "Departments",
              "icon": "network"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/employees/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/employees.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Employee directory",
              "note": "Every employee with their department, manager and status. Click a row to open the employee."
            },
            "children": []
          },
          {
            "type": "canvas.repeat",
            "props": {
              "items": "{{ (data.rows || []).filter(r => r.status !== 'terminated') }}",
              "layout": "grid",
              "columns": 3,
              "emptyText": "No employees yet",
              "groupBy": "department"
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "{{ item.name || item.code }}",
                  "description": "{{ [item.jobTitle, item.manager ? 'Reports to ' + item.manager : ''].filter(part => part).join(' · ') }}",
                  "clickable": true
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "{{ item.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "value": "{{ item.status }}",
                      "labels": {
                        "active": "Active",
                        "on-leave": "On leave"
                      },
                      "tones": {
                        "active": "success",
                        "on-leave": "warning"
                      }
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "departments",
              "compact": true,
              "description": "The /departments folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "staff",
              "compact": true,
              "description": "The /employees folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'active').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On leave",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'on-leave').length }}",
                  "icon": "plane",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Terminated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'terminated').length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show terminated employees",
              "value": "{{ state.showterminated }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => state.showterminated || r.status !== 'terminated').sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Employee"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "jobTitle",
                  "label": "Job title"
                },
                {
                  "key": "department",
                  "label": "Department"
                },
                {
                  "key": "manager",
                  "label": "Manager"
                },
                {
                  "key": "startDate",
                  "label": "Start date"
                },
                {
                  "key": "status",
                  "label": "Status"
                }
              ],
              "emptyText": "No employees yet",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
