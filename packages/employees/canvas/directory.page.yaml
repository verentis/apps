{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "employees-directory",
    "name": "Directory",
    "description": "The employee directory.",
    "icon": "users"
  },
  "spec": {
    "access": [
      {
        "path": "/departments",
        "reason": "List employees with their departments and managers"
      },
      {
        "path": "/employees",
        "reason": "List employees with their departments and managers"
      }
    ],
    "data": {
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobTitle: e.data.jobTitle || '', departmentPath: e.data.department || '', department: ((((data.departments || []).find(d => d.kind === 'file' && d.data && d.path === e.data.department) || {}).data || {}).name) || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === e.data.manager) || {}).data || {}).name) || '', startDate: e.data.startDate || '', status: e.data.status || 'active', terminationDate: e.data.terminationDate || '' }))"
      }
    },
    "state": {
      "showterminated": false
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Employee directory"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Every employee with their department, manager and status. Click a row to open the employee.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Employees",
                  "variant": "ghost",
                  "icon": "user-round",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/employees/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /departments folder could not be read. Reinstall Employees to recreate it."
            },
            "rules": {
              "visible": "data.$departments.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /employees folder could not be read. Reinstall Employees to recreate it."
            },
            "rules": {
              "visible": "data.$staff.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Active",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'active').length }}",
                  "icon": "user-round",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "On leave",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'on-leave').length }}",
                  "icon": "plane",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Terminated",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'terminated').length }}",
                  "icon": "user-x",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.form.switch",
            "props": {
              "label": "Show terminated employees",
              "value": "{{ state.showterminated }}"
            }
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.rows || []).filter(r => state.showterminated || r.status !== 'terminated').sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Employee"
                },
                {
                  "key": "name",
                  "label": "Name"
                },
                {
                  "key": "jobTitle",
                  "label": "Job title"
                },
                {
                  "key": "department",
                  "label": "Department"
                },
                {
                  "key": "manager",
                  "label": "Manager"
                },
                {
                  "key": "startDate",
                  "label": "Start date"
                },
                {
                  "key": "status",
                  "label": "Status"
                }
              ],
              "emptyText": "No employees yet",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
