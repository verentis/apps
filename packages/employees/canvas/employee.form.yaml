{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Form",
  "metadata": {
    "id": "employees-employee",
    "name": "Employees employee",
    "description": "View and edit an Employees employee.",
    "icon": "user-round"
  },
  "spec": {
    "binds": [
      {
        "pattern": "application/vnd.verentis.employees.employee+json",
        "mode": "edit",
        "priority": 200,
        "scope": "global",
        "json-schema": {
          "id": "https://schemas.verentis.io/employees/v1/employee.schema.json",
          "source": "/applications/employees/schemas/employee.schema.json",
          "title": "Employees employee",
          "version": "1"
        }
      }
    ],
    "entry": "${var:canvas-origin}/render?document=%2Fapplications%2Femployees%2Fcanvas%2Femployee.form.yaml",
    "scope": "global",
    "mime-types": [
      {
        "pattern": "application/vnd.verentis.employees.employee+json",
        "mode": "edit",
        "priority": 200,
        "json-schema": {
          "id": "https://schemas.verentis.io/employees/v1/employee.schema.json",
          "source": "/applications/employees/schemas/employee.schema.json",
          "title": "Employees employee",
          "version": "1"
        }
      }
    ],
    "permissions": [
      "file.read",
      "file.write",
      "execution.run",
      "execution.read"
    ],
    "capabilities": [],
    "sandbox": {
      "allow-scripts": true,
      "allow-same-origin": true,
      "allow-popups": false,
      "allow-forms": true
    },
    "file-access": [
      {
        "path": "/departments",
        "mode": "read",
        "reason": "Choose the department an employee belongs to"
      },
      {
        "path": "/employees",
        "mode": "read",
        "reason": "Choose an employee's manager"
      },
      {
        "path": "/applications/employees/",
        "mode": "read",
        "reason": "Read the Employees schemas and run the employee action script"
      },
      {
        "path": "/leave-requests",
        "mode": "read",
        "reason": "Show this person's time off (when that app is installed)"
      },
      {
        "path": "/timesheets",
        "mode": "read",
        "reason": "Show this person's timesheets (when that app is installed)"
      },
      {
        "path": "/appraisals",
        "mode": "read",
        "reason": "Show this person's appraisals (when that app is installed)"
      },
      {
        "path": "/shifts",
        "mode": "read",
        "reason": "Show this person's shifts (when that app is installed)"
      },
      {
        "path": "/tickets",
        "mode": "read",
        "reason": "Show this person's tickets (when that app is installed)"
      }
    ],
    "access": [
      {
        "path": "/departments",
        "reason": "Choose the department an employee belongs to"
      },
      {
        "path": "/employees",
        "reason": "Choose an employee's manager"
      },
      {
        "path": "/applications/employees/",
        "reason": "Read the Employees schemas and run the employee action script"
      },
      {
        "path": "/leave-requests",
        "reason": "Show this person's time off (when that app is installed)"
      },
      {
        "path": "/timesheets",
        "reason": "Show this person's timesheets (when that app is installed)"
      },
      {
        "path": "/appraisals",
        "reason": "Show this person's appraisals (when that app is installed)"
      },
      {
        "path": "/shifts",
        "reason": "Show this person's shifts (when that app is installed)"
      },
      {
        "path": "/tickets",
        "reason": "Show this person's tickets (when that app is installed)"
      }
    ],
    "data": {
      "record": {
        "kind": "document",
        "consistency": "conditional"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "departmentoptions": {
        "kind": "computed",
        "expr": "(data.departments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "employeeoptions": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'terminated')).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      },
      "leave": {
        "kind": "folder",
        "path": "/leave-requests",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.time-off.request+json"
      },
      "hours": {
        "kind": "folder",
        "path": "/timesheets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.timesheets.entry+json"
      },
      "reviews": {
        "kind": "folder",
        "path": "/appraisals",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appraisals.appraisal+json"
      },
      "shifts": {
        "kind": "folder",
        "path": "/shifts",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.planning.shift+json"
      },
      "tickets": {
        "kind": "folder",
        "path": "/tickets",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.helpdesk.ticket+json"
      },
      "manageroptions": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'terminated')).map(e => ({ label: (e.data.code || e.name) + ' · ' + (e.data.name || ''), value: e.path }))"
      }
    },
    "state": {
      "terminationdate": ""
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.validation-summary",
            "props": {
              "title": "Fix these before saving"
            }
          },
          {
            "type": "canvas.record-header",
            "props": {
              "title": "{{ form.values.name || 'New employee' }}",
              "note": "Employee {{ form.values.code || '' }}"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "{{ String(form.values.status || '').split('-').join(' ') }}",
                      "tone": "{{ [\"active\"].includes(form.values.status) ? 'success' : [\"on-leave\"].includes(form.values.status) ? 'warning' : [\"terminated\"].includes(form.values.status) ? 'danger' : 'neutral' }}"
                    },
                    "rules": {
                      "visible": "!!form.values.status"
                    }
                  },
                  {
                    "type": "canvas.dashboard.badge",
                    "props": {
                      "text": "Archived",
                      "tone": "warning",
                      "icon": "archive"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Terminate",
                  "variant": "outline",
                  "icon": "user-x",
                  "size": "sm"
                },
                "on": {
                  "click": "terminate"
                },
                "rules": {
                  "visible": "form.values.status === 'active' && !(form.values.state === 'archived')",
                  "disabled": "form.saving || form.dirty"
                },
                "slot": "actions"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Archive",
                      "variant": "ghost",
                      "icon": "archive",
                      "size": "sm"
                    },
                    "on": {
                      "click": "archive"
                    },
                    "rules": {
                      "visible": "!(form.values.state === 'archived') && !(form.values.status === 'terminated')",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Restore",
                      "variant": "outline",
                      "icon": "archive-restore",
                      "size": "sm"
                    },
                    "on": {
                      "click": "restore"
                    },
                    "rules": {
                      "visible": "form.values.state === 'archived'",
                      "disabled": "form.saving || form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Reset",
                      "variant": "ghost",
                      "size": "sm"
                    },
                    "on": {
                      "click": "reset"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty"
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Save",
                      "icon": "save",
                      "size": "sm"
                    },
                    "on": {
                      "click": "save"
                    },
                    "rules": {
                      "disabled": "form.saving || !form.dirty || form.invalid || form.values.state === 'archived' || (form.values.status === 'terminated')"
                    }
                  }
                ],
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "record",
              "compact": true
            }
          },
          {
            "type": "canvas.status-steps",
            "props": {
              "value": "{{ form.values.status }}",
              "steps": [
                {
                  "value": "active",
                  "label": "Active"
                },
                {
                  "value": "on-leave",
                  "label": "On Leave"
                }
              ],
              "branches": [
                {
                  "value": "terminated",
                  "label": "Terminated"
                }
              ]
            },
            "rules": {
              "visible": "!!form.values.status"
            }
          },
          {
            "type": "canvas.alert",
            "props": {
              "tone": "warning",
              "title": "This employee is archived",
              "text": "Restore it to edit.",
              "icon": "archive",
              "action": {
                "label": "Restore",
                "id": "restore"
              }
            },
            "rules": {
              "visible": "form.values.state === 'archived'"
            },
            "on": {
              "action": "restore"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "This employee was terminated on {{ form.values.terminationDate }} and can no longer be edited.",
              "tone": "muted"
            },
            "rules": {
              "visible": "form.values.status === 'terminated'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.form.date",
                "props": {
                  "label": "Termination date",
                  "value": "{{ state.terminationdate }}",
                  "description": "Used by Terminate; left empty it defaults to today."
                },
                "rules": {
                  "visible": "form.values.status === 'active'"
                }
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Person"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Name",
                          "value": "{{ form.values.name }}",
                          "required": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Job title",
                          "value": "{{ form.values.jobTitle }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Organization"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Department",
                          "value": "{{ form.values.department }}",
                          "options": "{{ data.departmentoptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Manager",
                          "value": "{{ form.values.manager }}",
                          "options": "{{ data.manageroptions }}",
                          "searchable": true
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Contact"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Work email",
                          "value": "{{ form.values.workEmail }}",
                          "inputType": "email"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      },
                      {
                        "type": "canvas.form.input",
                        "props": {
                          "label": "Work phone",
                          "value": "{{ form.values.workPhone }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Employment"
                },
                "children": [
                  {
                    "type": "canvas.grid",
                    "layout": {
                      "base": {
                        "columns": 1,
                        "gap": 4
                      },
                      "tablet": {
                        "columns": 2
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Start date",
                          "value": "{{ form.values.startDate }}"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      },
                      {
                        "type": "canvas.form.select",
                        "props": {
                          "label": "Status",
                          "value": "{{ form.values.status }}",
                          "description": "Terminated is set by the Terminate action.",
                          "options": [
                            {
                              "value": "active",
                              "label": "Active"
                            },
                            {
                              "value": "on-leave",
                              "label": "On Leave"
                            },
                            {
                              "value": "terminated",
                              "label": "Terminated"
                            }
                          ],
                          "display": "segmented"
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated'))"
                        }
                      },
                      {
                        "type": "canvas.form.date",
                        "props": {
                          "label": "Termination date",
                          "value": "{{ form.values.terminationDate }}",
                          "description": "Set by the Terminate action."
                        },
                        "rules": {
                          "disabled": "(form.values.state === 'archived' || (form.values.status === 'terminated')) || (true)"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 1,
                "gap": 4
              },
              "tablet": {
                "columns": 2
              }
            },
            "children": [
              {
                "type": "canvas.card",
                "props": {
                  "title": "Time off"
                },
                "children": [
                  {
                    "type": "canvas.related",
                    "props": {
                      "rows": "{{ (data.leave || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && String(e.data.employee || '').trim().toLowerCase() === String(form.values.name || '').trim().toLowerCase()).map(e => ({ path: e.path, type: e.data.type || 'Leave', startDate: e.data.startDate, endDate: e.data.endDate, status: e.data.status })).sort((a, b) => String(b.date || b.startDate || '') < String(a.date || a.startDate || '') ? -1 : 1) }}",
                      "item": {
                        "title": "type",
                        "subtitle": [
                          "startDate",
                          "endDate"
                        ],
                        "badge": "status"
                      },
                      "limit": 5,
                      "emptyText": "Nothing in Time off for this person"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "more": [
                        {
                          "open-file": {
                            "path": "/leave-requests"
                          }
                        }
                      ]
                    }
                  }
                ],
                "rules": {
                  "visible": "data.$leave.status === 'ready'"
                }
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Timesheets"
                },
                "children": [
                  {
                    "type": "canvas.related",
                    "props": {
                      "rows": "{{ (data.hours || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && String(e.data.employee || '').trim().toLowerCase() === String(form.values.name || '').trim().toLowerCase()).map(e => ({ path: e.path, date: e.data.date, hours: (e.data.hours || '0') + ' h', status: e.data.status })).sort((a, b) => String(b.date || b.startDate || '') < String(a.date || a.startDate || '') ? -1 : 1) }}",
                      "item": {
                        "title": "date",
                        "subtitle": [
                          "hours"
                        ],
                        "badge": "status"
                      },
                      "limit": 5,
                      "emptyText": "Nothing in Timesheets for this person"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "more": [
                        {
                          "open-file": {
                            "path": "/timesheets"
                          }
                        }
                      ]
                    }
                  }
                ],
                "rules": {
                  "visible": "data.$hours.status === 'ready'"
                }
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Appraisals"
                },
                "children": [
                  {
                    "type": "canvas.related",
                    "props": {
                      "rows": "{{ (data.reviews || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && String(e.data.employee || '').trim().toLowerCase() === String(form.values.name || '').trim().toLowerCase()).map(e => ({ path: e.path, period: e.data.period || e.data.code, score: e.data.overallScore ? 'Score ' + e.data.overallScore : '', status: e.data.status })).sort((a, b) => String(b.date || b.startDate || '') < String(a.date || a.startDate || '') ? -1 : 1) }}",
                      "item": {
                        "title": "period",
                        "subtitle": [
                          "score"
                        ],
                        "badge": "status"
                      },
                      "limit": 5,
                      "emptyText": "Nothing in Appraisals for this person"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "more": [
                        {
                          "open-file": {
                            "path": "/appraisals"
                          }
                        }
                      ]
                    }
                  }
                ],
                "rules": {
                  "visible": "data.$reviews.status === 'ready'"
                }
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Shifts"
                },
                "children": [
                  {
                    "type": "canvas.related",
                    "props": {
                      "rows": "{{ (data.shifts || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && String(e.data.employee || '').trim().toLowerCase() === String(form.values.name || '').trim().toLowerCase()).map(e => ({ path: e.path, date: e.data.date, time: [e.data.startTime, e.data.endTime].filter(t => t).join(' to '), status: e.data.status })).sort((a, b) => String(b.date || b.startDate || '') < String(a.date || a.startDate || '') ? -1 : 1) }}",
                      "item": {
                        "title": "date",
                        "subtitle": [
                          "time"
                        ],
                        "badge": "status"
                      },
                      "limit": 5,
                      "emptyText": "Nothing in Shifts for this person"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "more": [
                        {
                          "open-file": {
                            "path": "/shifts"
                          }
                        }
                      ]
                    }
                  }
                ],
                "rules": {
                  "visible": "data.$shifts.status === 'ready'"
                }
              },
              {
                "type": "canvas.card",
                "props": {
                  "title": "Tickets"
                },
                "children": [
                  {
                    "type": "canvas.related",
                    "props": {
                      "rows": "{{ (data.tickets || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && String(e.data.assignee || '').trim().toLowerCase() === String(form.values.name || '').trim().toLowerCase()).map(e => ({ path: e.path, subject: e.data.subject || e.data.code, code: e.data.code, stage: e.data.stage })).sort((a, b) => String(b.date || b.startDate || '') < String(a.date || a.startDate || '') ? -1 : 1) }}",
                      "item": {
                        "title": "subject",
                        "subtitle": [
                          "code"
                        ],
                        "badge": "stage"
                      },
                      "limit": 5,
                      "emptyText": "Nothing in Tickets for this person"
                    },
                    "on": {
                      "open": [
                        {
                          "open-file": {
                            "path": "{{ event.row.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ],
                      "more": [
                        {
                          "open-file": {
                            "path": "/tickets"
                          }
                        }
                      ]
                    }
                  }
                ],
                "rules": {
                  "visible": "data.$tickets.status === 'ready'"
                }
              }
            ]
          }
        ]
      }
    ],
    "actions": {
      "save": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
      "terminate": {
        "permissions": [
          "execution.run",
          "execution.read"
        ],
        "steps": [
          {
            "confirm": {
              "title": "Terminate employee",
              "message": "Terminate this employee as of the termination date? Terminated employees are locked and can no longer be edited."
            }
          },
          {
            "run-script": {
              "file": "/applications/employees/scripts/post",
              "timeout": 120,
              "parameters": {
                "operation": "terminate",
                "path": "{{ ctx.file.path }}",
                "date": "{{ state.terminationdate }}"
              },
              "assign": "lastresult"
            }
          },
          {
            "refresh-source": {
              "source": "record"
            }
          },
          {
            "toast": {
              "message": "{{ (state.lastresult && state.lastresult.message) || 'Done' }}",
              "variant": "success"
            }
          }
        ]
      }
    }
  }
}
