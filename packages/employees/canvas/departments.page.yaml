{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "employees-departments",
    "name": "Departments",
    "description": "Headcount per department.",
    "icon": "building-2"
  },
  "spec": {
    "access": [
      {
        "path": "/departments",
        "reason": "Sum employees per department with their managers"
      },
      {
        "path": "/employees",
        "reason": "Sum employees per department with their managers"
      }
    ],
    "data": {
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobTitle: e.data.jobTitle || '', departmentPath: e.data.department || '', department: ((((data.departments || []).find(d => d.kind === 'file' && d.data && d.path === e.data.department) || {}).data || {}).name) || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === e.data.manager) || {}).data || {}).name) || '', startDate: e.data.startDate || '', status: e.data.status || 'active', terminationDate: e.data.terminationDate || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Employees",
          "icon": "user-round",
          "active": "departments.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "directory.page.yaml",
              "label": "Directory",
              "icon": "users"
            },
            {
              "id": "departments.page.yaml",
              "label": "Departments",
              "icon": "network"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/employees/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/employees.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Departments",
              "note": "Headcount per department: active and on-leave employees, with the department manager. Click a department to open it."
            },
            "children": []
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "departments",
              "compact": true,
              "description": "The /departments folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "staff",
              "compact": true,
              "description": "The /employees folder could not be read. Reinstall Employees to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Departments",
                  "value": "{{ (data.departments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "building-2",
                  "loading": "{{ data.$departments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Employed",
                  "value": "{{ (data.rows || []).filter(r => r.status !== 'terminated').length }}",
                  "icon": "users",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Without department",
                  "value": "{{ (data.rows || []).filter(r => !r.departmentPath && r.status !== 'terminated').length }}",
                  "icon": "user-round-search",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Departments"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.departments || []).filter(d => d.kind === 'file' && d.data && d.data.state !== 'archived').map(d => ({ path: d.path, code: d.data.code || d.name, name: d.data.name || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === d.data.manager) || {}).data || {}).name) || '', active: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'active').length, onLeave: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'on-leave').length, terminated: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'terminated').length })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Department"
                    },
                    {
                      "key": "name",
                      "label": "Name"
                    },
                    {
                      "key": "manager",
                      "label": "Manager"
                    },
                    {
                      "key": "active",
                      "label": "Active",
                      "align": "end"
                    },
                    {
                      "key": "onLeave",
                      "label": "On leave",
                      "align": "end"
                    },
                    {
                      "key": "terminated",
                      "label": "Terminated",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No departments yet",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Org chart"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Who reports to whom, from each employee’s manager. Open a person to edit them.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.org-chart",
                "props": {
                  "rows": "{{ (data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && e.data.status !== 'terminated').map(e => ({ path: e.path, name: e.data.name || e.data.code, title: e.data.jobTitle, manager: e.data.manager, status: e.data.status })) }}",
                  "idKey": "path",
                  "managerKey": "manager",
                  "title": "name",
                  "subtitle": "title",
                  "depth": 3,
                  "badge": {
                    "key": "status",
                    "labels": {
                      "active": "Active",
                      "on-leave": "On leave"
                    },
                    "tones": {
                      "active": "success",
                      "on-leave": "warning"
                    }
                  }
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
