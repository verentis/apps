{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "employees-departments",
    "name": "Departments",
    "description": "Headcount per department.",
    "icon": "building-2"
  },
  "spec": {
    "access": [
      {
        "path": "/departments",
        "reason": "Sum employees per department with their managers"
      },
      {
        "path": "/employees",
        "reason": "Sum employees per department with their managers"
      }
    ],
    "data": {
      "staff": {
        "kind": "folder",
        "path": "/employees",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.employee+json"
      },
      "departments": {
        "kind": "folder",
        "path": "/departments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.employees.department+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.staff || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', jobTitle: e.data.jobTitle || '', departmentPath: e.data.department || '', department: ((((data.departments || []).find(d => d.kind === 'file' && d.data && d.path === e.data.department) || {}).data || {}).name) || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === e.data.manager) || {}).data || {}).name) || '', startDate: e.data.startDate || '', status: e.data.status || 'active', terminationDate: e.data.terminationDate || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Departments"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Headcount per department: active and on-leave employees, with the department manager. Click a department to open it.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.button",
                "props": {
                  "label": "Employees",
                  "variant": "ghost",
                  "icon": "user-round",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/applications/employees/canvas/home.page.yaml"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /departments folder could not be read. Reinstall Employees to recreate it."
            },
            "rules": {
              "visible": "data.$departments.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /employees folder could not be read. Reinstall Employees to recreate it."
            },
            "rules": {
              "visible": "data.$staff.status === 'error'"
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Departments",
                  "value": "{{ (data.departments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').length }}",
                  "icon": "building-2",
                  "loading": "{{ data.$departments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Employed",
                  "value": "{{ (data.rows || []).filter(r => r.status !== 'terminated').length }}",
                  "icon": "users",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Without department",
                  "value": "{{ (data.rows || []).filter(r => !r.departmentPath && r.status !== 'terminated').length }}",
                  "icon": "user-round-search",
                  "loading": "{{ data.$staff.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Departments"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.departments || []).filter(d => d.kind === 'file' && d.data && d.data.state !== 'archived').map(d => ({ path: d.path, code: d.data.code || d.name, name: d.data.name || '', manager: ((((data.staff || []).find(m => m.kind === 'file' && m.data && m.path === d.data.manager) || {}).data || {}).name) || '', active: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'active').length, onLeave: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'on-leave').length, terminated: (data.rows || []).filter(r => r.departmentPath === d.path && r.status === 'terminated').length })) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Department"
                    },
                    {
                      "key": "name",
                      "label": "Name"
                    },
                    {
                      "key": "manager",
                      "label": "Manager"
                    },
                    {
                      "key": "active",
                      "label": "Active",
                      "align": "end"
                    },
                    {
                      "key": "onLeave",
                      "label": "On leave",
                      "align": "end"
                    },
                    {
                      "key": "terminated",
                      "label": "Terminated",
                      "align": "end"
                    }
                  ],
                  "emptyText": "No departments yet",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
