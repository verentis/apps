        "steps": [
          {
            "set-state": {
              "key": "draft",
              "value": {
                "source": "",
                "kind": "count",
                "valueField": "",
                "groupByField": "",
                "title": "",
                "filterField": "",
                "filterEquals": ""
              }
            }
          },
          {
            "set-state": {
              "key": "step",
              "value": "source"
            }
          },
          {
            "set-state": {
              "key": "builder",
              "value": true
            }
          }
        ]
      }
    }
