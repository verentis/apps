        "steps": [
          {
            "patch-form": {
              "values": {
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Saved",
              "variant": "success"
            }
          }
        ]
      },
      "reset": {
        "steps": [
          {
            "reset-form": {}
          }
        ]
      },
      "archive": {
        "steps": [
          {
            "confirm": {
              "title": "Archive",
              "message": "Archive this record? It stays in the workspace and can be restored."
            }
          },
          {
            "patch-form": {
              "values": {
                "state": "archived",
                "archivedAt": "{{ Date() }}",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Archived",
              "variant": "success"
            }
          }
        ]
      },
      "restore": {
        "steps": [
          {
            "patch-form": {
              "values": {
                "state": "active",
                "updatedAt": "{{ Date() }}"
              }
            }
          },
          {
            "save": {}
          },
          {
            "toast": {
              "message": "Restored",
              "variant": "success"
            }
          }
        ]
      },
