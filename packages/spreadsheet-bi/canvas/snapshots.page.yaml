{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "spreadsheet-bi-snapshots",
    "name": "Snapshots",
    "description": "Frozen dashboard computations.",
    "icon": "camera"
  },
  "spec": {
    "access": [
      {
        "path": "/bi-snapshots",
        "reason": "List the snapshots"
      },
      {
        "path": "/bi-dashboards",
        "reason": "Show each snapshot's dashboard name"
      }
    ],
    "data": {
      "snapshots": {
        "kind": "folder",
        "path": "/bi-snapshots",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.spreadsheet-bi.snapshot+json"
      },
      "dashboards": {
        "kind": "folder",
        "path": "/bi-dashboards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.spreadsheet-bi.dashboard+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Spreadsheet BI",
          "icon": "layout-dashboard",
          "active": "snapshots.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "viewer.page.yaml",
              "label": "Dashboard",
              "icon": "layout-dashboard"
            },
            {
              "id": "snapshots.page.yaml",
              "label": "Snapshots",
              "icon": "camera"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/spreadsheet-bi/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/spreadsheet-bi.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Snapshots",
              "note": "Each snapshot freezes one dashboard computation: the take-snapshot script computes every tile with exact decimal math, stamps the time and locks the record."
            },
            "children": [
              {
                "type": "canvas.button",
                "props": {
                  "label": "Open /bi-snapshots",
                  "variant": "outline",
                  "icon": "folder-open",
                  "size": "sm"
                },
                "on": {
                  "click": [
                    {
                      "open-file": {
                        "path": "/bi-snapshots"
                      }
                    }
                  ]
                },
                "slot": "actions"
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "dashboards",
              "compact": true,
              "description": "The /bi-dashboards folder could not be read. Reinstall Spreadsheet BI to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "snapshots",
              "compact": true,
              "description": "The /bi-snapshots folder could not be read. Reinstall Spreadsheet BI to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Snapshots",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "camera",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Taken",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'taken')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Drafts",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'taken')).length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.table",
            "props": {
              "rows": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, dashboard: ((((data.dashboards || []).find(d => d.kind === 'file' && d.data && d.path === e.data.dashboard) || {}).data || {}).name) || (e.data.dashboard || ''), status: e.data.status || '', takenAt: e.data.takenAt || '', results: (e.data.results || []).length })).sort((a, b) => (a.code < b.code ? -1 : 1)) }}",
              "columns": [
                {
                  "key": "code",
                  "label": "Code"
                },
                {
                  "key": "dashboard",
                  "label": "Dashboard"
                },
                {
                  "key": "status",
                  "label": "Status"
                },
                {
                  "key": "takenAt",
                  "label": "Taken at"
                },
                {
                  "key": "results",
                  "label": "Results",
                  "align": "end"
                }
              ],
              "emptyText": "No snapshots yet. Use New in /bi-snapshots.",
              "search": true,
              "sortable": true,
              "pageSize": 25,
              "narrow": "list",
              "clickable": true
            },
            "on": {
              "row-click": [
                {
                  "open-file": {
                    "path": "{{ event.path }}",
                    "mode": "edit",
                    "open": "side"
                  }
                }
              ]
            }
          }
        ]
      }
    ]
  }
}
