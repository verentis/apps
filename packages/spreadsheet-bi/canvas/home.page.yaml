{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "spreadsheet-bi-home",
    "name": "Spreadsheet BI",
    "description": "Saved BI dashboards over your workspace record files.",
    "icon": "layout-dashboard"
  },
  "spec": {
    "access": [
      {
        "path": "/bi-dashboards",
        "reason": "List the saved dashboards"
      },
      {
        "path": "/bi-snapshots",
        "reason": "Count the snapshots"
      }
    ],
    "data": {
      "dashboards": {
        "kind": "folder",
        "path": "/bi-dashboards",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.spreadsheet-bi.dashboard+json"
      },
      "snapshots": {
        "kind": "folder",
        "path": "/bi-snapshots",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.spreadsheet-bi.snapshot+json"
      }
    },
    "tree": [
      {
        "type": "canvas.stack",
        "layout": {
          "base": {
            "padding": 6,
            "gap": 4,
            "maxWidth": "72rem",
            "margin": {
              "x": "auto"
            }
          }
        },
        "children": [
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "direction": "row",
                "wrap": true,
                "gap": 2,
                "align": "center",
                "justify": "between"
              }
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 1
                  }
                },
                "children": [
                  {
                    "type": "canvas.heading",
                    "props": {
                      "level": 2,
                      "text": "Spreadsheet BI"
                    }
                  },
                  {
                    "type": "canvas.text",
                    "props": {
                      "text": "Dashboards are saved tile definitions computed live from sibling apps' record files. Edit spreadsheets themselves with the Office integration; this app only computes and freezes values.",
                      "tone": "muted"
                    }
                  }
                ]
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Viewer",
                      "variant": "outline",
                      "icon": "monitor",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/spreadsheet-bi/canvas/viewer.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Snapshots",
                      "variant": "outline",
                      "icon": "camera",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/applications/spreadsheet-bi/canvas/snapshots.page.yaml"
                          }
                        }
                      ]
                    }
                  },
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Settings",
                      "variant": "ghost",
                      "icon": "settings",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/settings/spreadsheet-bi.json",
                            "mode": "edit"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Dashboards",
                  "value": "{{ (data.dashboards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "layout-dashboard",
                  "loading": "{{ data.$dashboards.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Snapshots",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (true)).length }}",
                  "icon": "camera",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Taken",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status === 'taken')).length }}",
                  "icon": "check",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Drafts",
                  "value": "{{ (data.snapshots || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived' && (e.data.status !== 'taken')).length }}",
                  "icon": "pencil",
                  "loading": "{{ data.$snapshots.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /bi-dashboards folder could not be read. Reinstall Spreadsheet BI to recreate it."
            },
            "rules": {
              "visible": "data.$dashboards.status === 'error'"
            }
          },
          {
            "type": "canvas.text",
            "props": {
              "text": "The /bi-snapshots folder could not be read. Reinstall Spreadsheet BI to recreate it."
            },
            "rules": {
              "visible": "data.$snapshots.status === 'error'"
            }
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Dashboards"
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "direction": "row",
                    "wrap": true,
                    "gap": 2,
                    "align": "center"
                  }
                },
                "children": [
                  {
                    "type": "canvas.button",
                    "props": {
                      "label": "Open /bi-dashboards",
                      "variant": "outline",
                      "icon": "folder-open",
                      "size": "sm"
                    },
                    "on": {
                      "click": [
                        {
                          "open-file": {
                            "path": "/bi-dashboards"
                          }
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.dashboards || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, name: e.data.name || '', tiles: (e.data.tiles || []).length, description: e.data.description || '' })).sort((a, b) => (a.code < b.code ? -1 : 1)) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Code"
                    },
                    {
                      "key": "name",
                      "label": "Name"
                    },
                    {
                      "key": "tiles",
                      "label": "Tiles",
                      "align": "end"
                    },
                    {
                      "key": "description",
                      "label": "Description"
                    }
                  ],
                  "emptyText": "No dashboards yet. Use New in /bi-dashboards.",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
