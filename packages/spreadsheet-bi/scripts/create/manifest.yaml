api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: spreadsheet-bi-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Spreadsheet BI containers.
file-access:
  - path: "/bi-dashboards"
    mode: write
    reason: "Create dashboards with the next code"
  - path: "/bi-snapshots"
    mode: write
    reason: "Create snapshots with the next code"
  - path: "/settings/spreadsheet-bi.json"
    mode: read
    reason: "Default new snapshots to the default dashboard"
