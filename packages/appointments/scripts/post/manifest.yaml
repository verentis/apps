api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: appointments-post
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. Confirming completes the schedule from the type and rejects conflicting appointments; finished appointments lock conditionally.
file-access:
  - path: "/appointments"
    mode: write
    reason: "Confirm, complete, cancel and mark appointments as no-show"
  - path: "/appointment-types"
    mode: read
    reason: "Read the appointment type's duration and buffer for the schedule and conflict check"
