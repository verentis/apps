api-version: verentis.io/v1
kind: ScriptRun
metadata:
  id: appointments-create
engine: nodejs
runtime: server
node-version: lts
entry-point: main.mjs
resources:
  size: small
# Generated by src/build.mjs. New records are written create-only into the Appointments containers; appointments get their end time and host from their type.
file-access:
  - path: "/appointment-types"
    mode: write
    reason: "Create appointment types with the next code"
  - path: "/appointments"
    mode: write
    reason: "Create appointments with the next code"
  - path: "/settings/appointments.json"
    mode: read
    reason: "Default new appointments to the default type"
