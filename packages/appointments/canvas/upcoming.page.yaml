{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appointments-upcoming",
    "name": "Upcoming",
    "description": "Booked and confirmed appointments from today on.",
    "icon": "calendar-days"
  },
  "spec": {
    "access": [
      {
        "path": "/appointment-types",
        "reason": "List the upcoming booked and confirmed appointments"
      },
      {
        "path": "/appointments",
        "reason": "List the upcoming booked and confirmed appointments"
      }
    ],
    "data": {
      "appointments": {
        "kind": "folder",
        "path": "/appointments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.appointment+json"
      },
      "types": {
        "kind": "folder",
        "path": "/appointment-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appointments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, guest: e.data.guestName || '', typePath: e.data.type || '', type: ((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === e.data.type) || {}).data || {}).name) || '', host: e.data.host || '', date: e.data.date || '', start: e.data.startTime || '', time: [e.data.startTime, e.data.endTime].filter(Boolean).join('–'), status: e.data.status || '' }))"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Appointments",
          "icon": "calendar-check",
          "active": "upcoming.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "upcoming.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            },
            {
              "id": "types.page.yaml",
              "label": "Types",
              "icon": "shapes"
            },
            {
              "id": "all.page.yaml",
              "label": "All appointments",
              "icon": "list"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/appointments/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/appointments.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Upcoming appointments",
              "note": "Booked and confirmed appointments from today on, in schedule order. Click an appointment to open it."
            },
            "children": []
          },
          {
            "type": "canvas.stack",
            "layout": {
              "base": {
                "gap": 2
              }
            },
            "children": [
              {
                "type": "canvas.heading",
                "props": {
                  "level": 3,
                  "text": "Calendar"
                }
              },
              {
                "type": "canvas.text",
                "props": {
                  "text": "Appointments by host.",
                  "tone": "muted"
                }
              },
              {
                "type": "canvas.calendar",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => !!r.date).map(r => ({ path: r.path, title: [r.time, r.guest].filter(part => part).join(' · '), host: r.host || 'No host', status: r.status, at: r.date + (r.start ? 'T' + r.start : '') })) }}",
                  "views": [
                    "week",
                    "month",
                    "agenda"
                  ],
                  "showLegend": true,
                  "emptyText": "Nothing scheduled",
                  "start": "at",
                  "title": "title",
                  "colorBy": "host",
                  "view": "week"
                },
                "on": {
                  "open": [
                    {
                      "open-file": {
                        "path": "{{ event.row.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "appointments",
              "compact": true,
              "description": "The /appointments folder could not be read. Reinstall Appointments to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "types",
              "compact": true,
              "description": "The /appointment-types folder could not be read. Reinstall Appointments to recreate it."
            }
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 3
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Upcoming",
                  "value": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Today",
                  "value": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).filter(r => r.date === Date().slice(0, 10)).length }}",
                  "icon": "clock",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Awaiting confirmation",
                  "value": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).filter(r => r.status === 'booked').length }}",
                  "icon": "circle-dashed",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Today"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).filter(r => r.date === Date().slice(0, 10)).sort((a, b) => ((a.start || '~') < (b.start || '~') ? -1 : 1)) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Appointment"
                    },
                    {
                      "key": "guest",
                      "label": "Guest"
                    },
                    {
                      "key": "type",
                      "label": "Type"
                    },
                    {
                      "key": "host",
                      "label": "Host"
                    },
                    {
                      "key": "date",
                      "label": "Date"
                    },
                    {
                      "key": "time",
                      "label": "Time"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    }
                  ],
                  "emptyText": "No appointments today",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "canvas.card",
            "props": {
              "title": "Upcoming"
            },
            "children": [
              {
                "type": "canvas.table",
                "props": {
                  "rows": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).sort((a, b) => ((a.date + (a.start || '~')) < (b.date + (b.start || '~')) ? -1 : 1)) }}",
                  "columns": [
                    {
                      "key": "code",
                      "label": "Appointment"
                    },
                    {
                      "key": "guest",
                      "label": "Guest"
                    },
                    {
                      "key": "type",
                      "label": "Type"
                    },
                    {
                      "key": "host",
                      "label": "Host"
                    },
                    {
                      "key": "date",
                      "label": "Date"
                    },
                    {
                      "key": "time",
                      "label": "Time"
                    },
                    {
                      "key": "status",
                      "label": "Status"
                    }
                  ],
                  "emptyText": "No upcoming appointments",
                  "search": true,
                  "sortable": true,
                  "pageSize": 25,
                  "narrow": "list",
                  "clickable": true
                },
                "on": {
                  "row-click": [
                    {
                      "open-file": {
                        "path": "{{ event.path }}",
                        "mode": "edit",
                        "open": "side"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ]
  }
}
