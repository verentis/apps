{
  "api-version": "canvas.verentis.io/v1",
  "kind": "Page",
  "metadata": {
    "id": "appointments-home",
    "name": "Appointments",
    "description": "Appointments overview.",
    "icon": "calendar-check"
  },
  "spec": {
    "access": [
      {
        "path": "/appointment-types",
        "reason": "Count appointments and show the types and appointments"
      },
      {
        "path": "/appointments",
        "reason": "Count appointments and show the types and appointments"
      }
    ],
    "data": {
      "appointments": {
        "kind": "folder",
        "path": "/appointments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.appointment+json"
      },
      "types": {
        "kind": "folder",
        "path": "/appointment-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.type+json"
      },
      "rows": {
        "kind": "computed",
        "expr": "(data.appointments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived').map(e => ({ path: e.path, code: e.data.code || e.name, guest: e.data.guestName || '', typePath: e.data.type || '', type: ((((data.types || []).find(t => t.kind === 'file' && t.data && t.path === e.data.type) || {}).data || {}).name) || '', host: e.data.host || '', date: e.data.date || '', start: e.data.startTime || '', time: [e.data.startTime, e.data.endTime].filter(Boolean).join('–'), status: e.data.status || '' }))"
      },
      "listappointments": {
        "kind": "folder",
        "path": "/appointments",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.appointment+json"
      },
      "listappointmenttypes": {
        "kind": "folder",
        "path": "/appointment-types",
        "contents": true,
        "mime-pattern": "application/vnd.verentis.appointments.type+json"
      }
    },
    "tree": [
      {
        "type": "canvas.app-shell",
        "props": {
          "title": "Appointments",
          "icon": "calendar-check",
          "active": "home.page.yaml",
          "nav": [
            {
              "id": "home.page.yaml",
              "label": "Overview",
              "icon": "layout-dashboard"
            },
            {
              "id": "upcoming.page.yaml",
              "label": "Calendar",
              "icon": "calendar"
            },
            {
              "id": "types.page.yaml",
              "label": "Types",
              "icon": "shapes"
            },
            {
              "id": "all.page.yaml",
              "label": "All appointments",
              "icon": "list"
            },
            {
              "id": "settings",
              "label": "Settings",
              "icon": "settings"
            }
          ],
          "page": true
        },
        "on": {
          "navigate": [
            {
              "open-view": {
                "if": "event.id != 'settings'",
                "document": "/applications/appointments/canvas/{{ event.id }}",
                "open": "replace"
              }
            },
            {
              "open-file": {
                "path": "/settings/appointments.json",
                "mode": "edit",
                "if": "event.id == 'settings'",
                "open": "side"
              }
            }
          ]
        },
        "children": [
          {
            "type": "canvas.record-header",
            "props": {
              "title": "Appointments",
              "note": "Appointment types and bookings are files in your workspace. Book appointments in /appointments, confirm them conflict-checked, then complete them from their forms."
            },
            "children": []
          },
          {
            "type": "canvas.grid",
            "layout": {
              "base": {
                "columns": 2,
                "gap": 4
              },
              "desktop": {
                "columns": 4
              }
            },
            "children": [
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Appointments",
                  "value": "{{ (data.rows || []).filter(r => true).length }}",
                  "icon": "calendar-check",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Upcoming",
                  "value": "{{ (data.rows || []).filter(r => ['booked', 'confirmed'].includes(r.status) && !!r.date && r.date >= Date().slice(0, 10)).length }}",
                  "icon": "calendar-days",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Done",
                  "value": "{{ (data.rows || []).filter(r => r.status === 'done').length }}",
                  "icon": "check-check",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              },
              {
                "type": "canvas.dashboard.stat",
                "props": {
                  "label": "Cancelled or no-show",
                  "value": "{{ (data.rows || []).filter(r => ['cancelled', 'no-show'].includes(r.status)).length }}",
                  "icon": "x",
                  "loading": "{{ data.$appointments.status === 'loading' }}"
                }
              }
            ]
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "appointments",
              "compact": true,
              "description": "The /appointments folder could not be read. Reinstall Appointments to recreate it."
            }
          },
          {
            "type": "canvas.empty-state",
            "props": {
              "for": "types",
              "compact": true,
              "description": "The /appointment-types folder could not be read. Reinstall Appointments to recreate it."
            }
          },
          {
            "type": "canvas.tabs",
            "props": {
              "items": [
                {
                  "value": "appointments",
                  "label": "Appointments",
                  "icon": "calendar-check"
                },
                {
                  "value": "types",
                  "label": "Types",
                  "icon": "calendar-clock"
                }
              ]
            },
            "children": [
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /appointments",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/appointments"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listappointments",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listappointments || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Appointment"
                        },
                        {
                          "key": "data.guestName",
                          "label": "Guest"
                        },
                        {
                          "key": "data.date",
                          "label": "Date",
                          "format": "date"
                        },
                        {
                          "key": "data.startTime",
                          "label": "Start"
                        },
                        {
                          "key": "data.host",
                          "label": "Host"
                        },
                        {
                          "key": "data.status",
                          "label": "Status",
                          "format": "badge"
                        }
                      ],
                      "facets": [
                        "data.status"
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No appointments yet. Use New in /appointments."
                    },
                    "rules": {
                      "visible": "data.$listappointments.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "appointments"
              },
              {
                "type": "canvas.stack",
                "layout": {
                  "base": {
                    "gap": 4
                  }
                },
                "children": [
                  {
                    "type": "canvas.stack",
                    "layout": {
                      "base": {
                        "direction": "row",
                        "wrap": true,
                        "gap": 2,
                        "align": "center"
                      }
                    },
                    "children": [
                      {
                        "type": "canvas.button",
                        "props": {
                          "label": "Open /appointment-types",
                          "variant": "outline",
                          "icon": "folder-open",
                          "size": "sm"
                        },
                        "on": {
                          "click": [
                            {
                              "open-file": {
                                "path": "/appointment-types"
                              }
                            }
                          ]
                        }
                      }
                    ]
                  },
                  {
                    "type": "canvas.empty-state",
                    "props": {
                      "for": "listappointmenttypes",
                      "compact": true
                    }
                  },
                  {
                    "type": "canvas.table",
                    "props": {
                      "rows": "{{ (data.listappointmenttypes || []).filter(e => e.kind === 'file' && e.data && e.data.state !== 'archived') }}",
                      "columns": [
                        {
                          "key": "data.code",
                          "label": "Type"
                        },
                        {
                          "key": "data.name",
                          "label": "Name"
                        },
                        {
                          "key": "data.durationMinutes",
                          "label": "Minutes"
                        },
                        {
                          "key": "data.host",
                          "label": "Host"
                        }
                      ],
                      "search": true,
                      "sortable": true,
                      "pageSize": 25,
                      "narrow": "list",
                      "clickable": true,
                      "rowKey": "path",
                      "emptyText": "No types yet. Use New in /appointment-types."
                    },
                    "rules": {
                      "visible": "data.$listappointmenttypes.status === 'ready'"
                    },
                    "on": {
                      "row-click": [
                        {
                          "open-file": {
                            "path": "{{ event.path }}",
                            "mode": "edit",
                            "open": "side"
                          }
                        }
                      ]
                    }
                  }
                ],
                "slot": "types"
              }
            ]
          }
        ]
      }
    ]
  }
}
